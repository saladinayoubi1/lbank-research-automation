name: Build NEXUS Mobile APK

on:
  pull_request:
    paths:
      - "android/lbank-mobile/**"
      - ".github/workflows/build_lbank_mobile_apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build signed release APK
        working-directory: android/lbank-mobile
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Validate and package NEXUS APK
        env:
          APK_SOURCE: android/lbank-mobile/app/build/outputs/apk/release/app-release.apk
          APK_FINAL: android/lbank-mobile/app/build/outputs/apk/release/NEXUS_PERSONAL_PRO_2_2_0.apk
        run: |
          set -euo pipefail
          test -s "$APK_SOURCE"
          cp "$APK_SOURCE" "$APK_FINAL"
          size=$(stat -c%s "$APK_FINAL")
          test "$size" -ge 10000
          unzip -t "$APK_FINAL"
          unzip -l "$APK_FINAL" | tee /tmp/apk-contents.txt
          grep -q "AndroidManifest.xml" /tmp/apk-contents.txt
          grep -q "classes.dex" /tmp/apk-contents.txt
          grep -q "assets/index.html" /tmp/apk-contents.txt
          grep -q "assets/delivery.css" /tmp/apk-contents.txt
          grep -q "assets/mobile-runtime.js" /tmp/apk-contents.txt
          grep -q "assets/data.json" /tmp/apk-contents.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK_FINAL" | tee /tmp/apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK_FINAL" | tee /tmp/aapt-badging.txt
          grep -q "package: name='com.saladinayoubi.lbankmobile' versionCode='4' versionName='2.2.0'" /tmp/aapt-badging.txt
          grep -q "launchable-activity:" /tmp/aapt-badging.txt
          sha256sum "$APK_FINAL" > "${APK_FINAL}.sha256"
          digest=$(cut -d' ' -f1 "${APK_FINAL}.sha256")
          size_kb=$(awk "BEGIN {printf \"%.1f\", $size/1024}")
          {
            echo "## NEXUS Personal Pro Android"
            echo ""
            echo "- Release build: successful"
            echo "- Signature validation: successful"
            echo "- Package: \`com.saladinayoubi.lbankmobile\`"
            echo "- Version: \`2.2.0 (4)\`"
            echo "- File: \`NEXUS_PERSONAL_PRO_2_2_0.apk\`"
            echo "- Size: ${size} bytes (${size_kb} KB)"
            echo "- SHA-256: \`${digest}\`"
            echo "- Surface: result-first Phase 6 status + read-only public Bybit closed candles"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS_PERSONAL_PRO_2_2_0_APK
          path: |
            android/lbank-mobile/app/build/outputs/apk/release/NEXUS_PERSONAL_PRO_2_2_0.apk
            android/lbank-mobile/app/build/outputs/apk/release/NEXUS_PERSONAL_PRO_2_2_0.apk.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
