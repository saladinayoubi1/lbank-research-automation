name: Build NEXUS Mobile APK

on:
  pull_request:
    paths:
      - "android/lbank-mobile/**"
      - "tests/test_mobile_delivery_surface.py"
      - ".github/workflows/build_lbank_mobile_apk.yml"
  push:
    branches: [main]
    paths:
      - "android/lbank-mobile/**"
      - "tests/test_mobile_delivery_surface.py"
      - ".github/workflows/build_lbank_mobile_apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Run mobile product regression tests
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pytest -q tests/test_mobile_delivery_surface.py
      - name: Build installable release APK
        working-directory: android/lbank-mobile
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Validate and package NEXUS Android parity APK
        env:
          APK_SOURCE: android/lbank-mobile/app/build/outputs/apk/release/app-release.apk
          APK_FINAL: android/lbank-mobile/app/build/outputs/apk/release/NEXUS_PERSONAL_PRO_3_1_0.apk
        run: |
          set -euo pipefail
          test -s "$APK_SOURCE"
          cp "$APK_SOURCE" "$APK_FINAL"
          size=$(stat -c%s "$APK_FINAL")
          test "$size" -ge 10000
          unzip -t "$APK_FINAL"
          unzip -l "$APK_FINAL" | tee /tmp/apk-contents.txt
          for asset in AndroidManifest.xml classes.dex assets/index.html assets/delivery.css assets/mobile-core.js assets/mobile-runtime.js assets/mobile-canonical-client.js assets/data.json; do
            grep -q "$asset" /tmp/apk-contents.txt
          done
          unzip -p "$APK_FINAL" assets/index.html | grep -q "اتاق هوش مصنوعی"
          unzip -p "$APK_FINAL" assets/index.html | grep -q "ترید دمو"
          unzip -p "$APK_FINAL" assets/index.html | grep -q "ترید اصلی قفل است"
          unzip -p "$APK_FINAL" assets/mobile-canonical-client.js > /tmp/mobile-canonical-client.js
          grep -q "CANONICAL BACKEND" /tmp/mobile-canonical-client.js
          grep -q "LOCAL FALLBACK" /tmp/mobile-canonical-client.js
          grep -q "/api/product/research/run" /tmp/mobile-canonical-client.js
          grep -q "/api/product/paper/order" /tmp/mobile-canonical-client.js
          grep -q "/api/product/risk" /tmp/mobile-canonical-client.js
          grep -q "/api/product/recovery" /tmp/mobile-canonical-client.js
          grep -q "/api/product/data/registry" /tmp/mobile-canonical-client.js
          { unzip -p "$APK_FINAL" assets/mobile-core.js; unzip -p "$APK_FINAL" assets/mobile-runtime.js; unzip -p "$APK_FINAL" assets/mobile-canonical-client.js; } > /tmp/mobile-product.js
          grep -q "risk_allowed" /tmp/mobile-product.js
          grep -q "paper_trading_only" /tmp/mobile-product.js
          grep -q "NexusProductResult" /tmp/mobile-product.js
          if grep -Eqi '/v5/order|apiSecret|secretKey|private_key|/api/product/live/order|/withdraw' /tmp/mobile-product.js; then
            echo "Forbidden live/private authority material found in mobile runtime" >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK_FINAL" | tee /tmp/apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK_FINAL" | tee /tmp/aapt-badging.txt
          grep -q "package: name='com.saladinayoubi.lbankmobile' versionCode='6' versionName='3.1.0'" /tmp/aapt-badging.txt
          grep -q "launchable-activity:" /tmp/aapt-badging.txt
          sha256sum "$APK_FINAL" > "${APK_FINAL}.sha256"
          digest=$(cut -d' ' -f1 "${APK_FINAL}.sha256")
          size_kb=$(awk "BEGIN {printf \"%.1f\", $size/1024}")
          {
            echo "## NEXUS Personal Pro Android 3.1.0"
            echo ""
            echo "- Release APK build: successful"
            echo "- APK signature verification: successful (repository release build uses configured debug signing; not a store-signing claim)"
            echo "- Package: \`com.saladinayoubi.lbankmobile\`"
            echo "- Version: \`3.1.0 (6)\`"
            echo "- File: \`NEXUS_PERSONAL_PRO_3_1_0.apk\`"
            echo "- Size: ${size} bytes (${size_kb} KB)"
            echo "- SHA-256: \`${digest}\`"
            echo "- Mode: canonical Python product backend first via bounded HTTPS bridge; explicit local deterministic Paper fallback when unavailable"
            echo "- Live: locked; no exchange order/private credential/withdrawal/signing path"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS_PERSONAL_PRO_3_1_0_APK
          path: |
            android/lbank-mobile/app/build/outputs/apk/release/NEXUS_PERSONAL_PRO_3_1_0.apk
            android/lbank-mobile/app/build/outputs/apk/release/NEXUS_PERSONAL_PRO_3_1_0.apk.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
