name: Build NEXUS Mobile APK

on:
  pull_request:
    paths:
      - "android/lbank-mobile/**"
      - "scripts/build_release_evidence.py"
      - "scripts/release_gate.py"
      - "tests/test_mobile_delivery_surface.py"
      - ".github/workflows/build_lbank_mobile_apk.yml"
  push:
    branches: [main]
    paths:
      - "android/lbank-mobile/**"
      - "scripts/build_release_evidence.py"
      - "scripts/release_gate.py"
      - "tests/test_mobile_delivery_surface.py"
      - ".github/workflows/build_lbank_mobile_apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: "8.10.2"
      - name: Run mobile product and redesign regression tests
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pytest -q tests/test_mobile_delivery_surface.py
      - name: Build installable release APK
        working-directory: android/lbank-mobile
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Validate and package NEXUS Android 4 APK
        env:
          APK_SOURCE: android/lbank-mobile/app/build/outputs/apk/release/app-release.apk
          APK_FINAL: android/lbank-mobile/app/build/outputs/apk/release/NEXUS_PERSONAL_PRO_4_0_0.apk
        run: |
          set -euo pipefail
          test -s "$APK_SOURCE"
          cp "$APK_SOURCE" "$APK_FINAL"
          size=$(stat -c%s "$APK_FINAL")
          test "$size" -ge 10000
          unzip -t "$APK_FINAL"
          unzip -l "$APK_FINAL" | tee /tmp/apk-contents.txt
          for asset in AndroidManifest.xml classes.dex assets/index.html assets/delivery.css assets/mobile-redesign.css assets/mobile-core.js assets/mobile-runtime.js assets/mobile-redesign.js assets/mobile-canonical-client.js assets/data.json; do
            grep -q "$asset" /tmp/apk-contents.txt
          done
          unzip -p "$APK_FINAL" assets/index.html > /tmp/mobile-index.html
          grep -q 'data-nexus-mobile="4"' /tmp/mobile-index.html
          grep -q "همه‌چیز مهم، در یک نگاه" /tmp/mobile-index.html
          grep -q "Paper Portfolio" /tmp/mobile-index.html
          grep -q "NEXUS AI" /tmp/mobile-index.html
          grep -q "ترید اصلی قفل است" /tmp/mobile-index.html
          test "$(grep -c 'class="bottom-nav v4-nav"' /tmp/mobile-index.html)" -eq 1
          test "$(grep -o 'data-go="home"\|data-go="paper"\|data-go="mission"\|data-go="ai"\|data-go="more"' /tmp/mobile-index.html | wc -l)" -ge 5
          unzip -p "$APK_FINAL" assets/mobile-redesign.js > /tmp/mobile-redesign.js
          for marker in "chartSvg" "systemPulseScore" "history.pushState" "popstate" "NexusMobileBack"; do
            grep -q "$marker" /tmp/mobile-redesign.js
          done
          unzip -p "$APK_FINAL" assets/mobile-canonical-client.js > /tmp/mobile-canonical-client.js
          for marker in \
            "CANONICAL BACKEND" \
            "LOCAL FALLBACK" \
            "/api/product/research/run" \
            "/api/product/paper/order" \
            "/api/product/risk" \
            "/api/product/recovery" \
            "/api/product/data/registry" \
            "/api/product/mission/full" \
            "MISSION UNSYNCED" \
            "OWNER ACTION" \
            "LEADING STRATEGY" \
            "CI / EXACT HEAD" \
            "owner_actions" \
            "strategy_center" \
            "ci_health"; do
            grep -q "$marker" /tmp/mobile-canonical-client.js
          done
          if grep -q "/api/product/mission/import" /tmp/mobile-canonical-client.js; then
            echo "Android Mission Control must remain read-only" >&2
            exit 1
          fi
          { unzip -p "$APK_FINAL" assets/mobile-core.js; unzip -p "$APK_FINAL" assets/mobile-runtime.js; unzip -p "$APK_FINAL" assets/mobile-canonical-client.js; } > /tmp/mobile-product.js
          grep -q "risk_allowed" /tmp/mobile-product.js
          grep -q "paper_trading_only" /tmp/mobile-product.js
          grep -q "NexusProductResult" /tmp/mobile-product.js
          if grep -Eqi '/v5/order|apiSecret|secretKey|private_key|/api/product/live/order|/withdraw' /tmp/mobile-product.js; then
            echo "Forbidden live/private authority material found in mobile runtime" >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK_FINAL" | tee /tmp/apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK_FINAL" | tee /tmp/aapt-badging.txt
          grep -q "package: name='com.saladinayoubi.lbankmobile' versionCode='8' versionName='4.0.0'" /tmp/aapt-badging.txt
          grep -q "launchable-activity:" /tmp/aapt-badging.txt
          sha256sum "$APK_FINAL" > "${APK_FINAL}.sha256"
          digest=$(cut -d' ' -f1 "${APK_FINAL}.sha256")
          size_kb=$(awk "BEGIN {printf \"%.1f\", $size/1024}")
          {
            echo "## NEXUS Personal Pro Android 4.0.0"
            echo ""
            echo "- Release APK build: successful"
            echo "- Mobile-first cockpit contract: verified"
            echo "- Market chart + system pulse + portfolio surface: verified"
            echo "- Android back navigation history contract: verified"
            echo "- APK signature verification: successful (repository release build uses configured debug signing; not a store-signing claim)"
            echo "- Package: \`com.saladinayoubi.lbankmobile\`"
            echo "- Version: \`4.0.0 (8)\`"
            echo "- File: \`NEXUS_PERSONAL_PRO_4_0_0.apk\`"
            echo "- Size: ${size} bytes (${size_kb} KB)"
            echo "- SHA-256: \`${digest}\`"
            echo "- Mission: real /api/product/mission/full evidence when approved HTTPS Gateway is available; truthful MISSION UNSYNCED otherwise"
            echo "- Paper/Research: canonical Python backend first via bounded HTTPS bridge; explicit local deterministic Paper fallback when unavailable"
            echo "- Live: locked; no exchange order/private credential/withdrawal/signing path"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build unsigned final APK release evidence
        run: >-
          python scripts/build_release_evidence.py
          --bundle-dir release-evidence/android-v4
          --artifact-glob 'android/lbank-mobile/app/build/outputs/apk/release/NEXUS_PERSONAL_PRO_4_0_0.apk'
          --artifact-glob 'android/lbank-mobile/app/build/outputs/apk/release/NEXUS_PERSONAL_PRO_4_0_0.apk.sha256'
          --source-commit '${{ github.sha }}'
          --builder 'github-actions/build-nexus-mobile-apk/release-v4'
      - name: Fail-closed verify final APK release evidence
        run: >-
          python scripts/release_gate.py release-evidence/android-v4
          --allow-unsigned
          --expected-source-commit '${{ github.sha }}'
          --expected-builder 'github-actions/build-nexus-mobile-apk/release-v4'
      - name: Assert final APK evidence cannot claim production approval
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('release-evidence/android-v4')
          manifest = json.loads((root / 'artifact-manifest.json').read_text(encoding='utf-8'))
          provenance = json.loads((root / 'provenance.json').read_text(encoding='utf-8'))
          assert manifest['production_approval'] is False
          assert provenance['production_approval'] is False
          assert manifest['purpose'] == 'ci-build-evidence'
          assert provenance['purpose'] == 'ci-build-evidence'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NEXUS_PERSONAL_PRO_4_0_0_APK
          path: |
            android/lbank-mobile/app/build/outputs/apk/release/NEXUS_PERSONAL_PRO_4_0_0.apk
            android/lbank-mobile/app/build/outputs/apk/release/NEXUS_PERSONAL_PRO_4_0_0.apk.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NEXUS_PERSONAL_PRO_4_0_0_RELEASE_EVIDENCE
          path: release-evidence/android-v4
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
