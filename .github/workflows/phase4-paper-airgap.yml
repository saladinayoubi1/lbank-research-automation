name: Phase 4 Paper Live Air Gap

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-paper-airgap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify independent Phase 4 paper/live air gap
        run: python scripts/independent_phase4_airgap_gate.py
      - name: Run Gate 18 adversarial tests
        run: python -m pytest -q tests/test_paper_live_airgap.py
