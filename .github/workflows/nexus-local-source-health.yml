name: NEXUS Exact Source Local Health

# Owner/main-only executable source health, without eager third-party Actions.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-local-source-health
  cancel-in-progress: false

jobs:
  exact-source-health:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: [self-hosted, Windows, X64, nexus-local]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - name: Verify canonical worker and fetch immutable source into isolated workspace
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'NEXUS-LOCAL-RUNNER') {
            throw 'Unexpected worker identity for owner source health.'
          }
          $root = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\')
          $repoName = ($env:GITHUB_REPOSITORY -split '/')[-1]
          if ((Split-Path -Leaf $root) -ine $repoName -or
              (Split-Path -Leaf (Split-Path -Parent $root)) -ine $repoName -or
              (Split-Path -Leaf (Split-Path -Parent (Split-Path -Parent $root))) -ine '_work') {
            throw 'Owner source health requires isolated GitHub Actions workspace.'
          }
          if ($env:GITHUB_SHA -notmatch '^[0-9a-fA-F]{40}
            Remove-Item -Recurse -Force -ErrorAction Stop
          $archive = Join-Path $env:RUNNER_TEMP "nexus-source-health-$env:GITHUB_RUN_ID.zip"
          $url = "https://codeload.github.com/$($env:GITHUB_REPOSITORY)/zip/$($env:GITHUB_SHA)"
          & curl.exe --ipv4 --http1.1 --fail --silent --show-error `
            --connect-timeout 15 --max-time 150 --retry 2 --retry-delay 3 `
            --speed-time 20 --speed-limit 1024 --output $archive $url
          if ($LASTEXITCODE -ne 0) { throw 'Bounded exact-source codeload failed.' }
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf) -or
              (Get-Item -LiteralPath $archive).Length -lt 100000) {
            throw 'Exact-source archive missing or unexpectedly small.'
          }
          & tar.exe -xf $archive -C $root --strip-components=1
          if ($LASTEXITCODE -ne 0) { throw 'Exact-source extraction failed.' }
          Remove-Item -LiteralPath $archive -Force
          $marker = Join-Path $root '.nexus-trigger-source'
          [IO.File]::WriteAllText($marker, $env:GITHUB_SHA, (New-Object Text.UTF8Encoding($false)))
          if ((Get-Content -LiteralPath $marker -Raw).Trim().ToLowerInvariant() -ne
              $env:GITHUB_SHA.ToLowerInvariant()) { throw 'Exact source binding mismatch.' }
          Write-Output 'NEXUS_OWNER_HEALTH_SOURCE_BOUND=1'

      - name: Bootstrap existing locked portable Python
        shell: cmd
        timeout-minutes: 9
        run: call scripts\bootstrap_portable_python.cmd

      - name: Verify source isolation and run original architecture and dashboard health
        shell: cmd
        timeout-minutes: 5
        run: |
          python -c "import os,pathlib; p=pathlib.Path.cwd().resolve(); r=os.environ['GITHUB_REPOSITORY'].split('/')[-1]; assert p.name.casefold()==r.casefold() and p.parent.name.casefold()==r.casefold() and p.parent.parent.name.casefold()=='_work'; assert (p/'.nexus-trigger-source').read_text(encoding='utf-8').strip().lower()==os.environ['GITHUB_SHA'].lower(); print('NEXUS_HEALTH_PRIVACY_AND_SHA_PASS=1')"
          python -m pytest -q tests/test_nexus_architecture_validator.py tests/test_web_dashboard.py
) { throw 'Missing exact 40-hex source SHA.' }
          # Reject NTFS junctions/symlinks before clearing any checkout contents.
          $candidates = @($root, (Split-Path -Parent $root), (Split-Path -Parent (Split-Path -Parent $root)))
          foreach ($candidate in $candidates) {
            $entry = Get-Item -LiteralPath $candidate -Force -ErrorAction Stop
            if (($entry.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw 'Owner health workspace contains an untrusted reparse point.'
            }
          }
          Get-ChildItem -LiteralPath $root -Force -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force -ErrorAction Stop
          $archive = Join-Path $env:RUNNER_TEMP "nexus-source-health-$env:GITHUB_RUN_ID.zip"
          $url = "https://codeload.github.com/$($env:GITHUB_REPOSITORY)/zip/$($env:GITHUB_SHA)"
          & curl.exe --ipv4 --http1.1 --fail --silent --show-error `
            --connect-timeout 15 --max-time 150 --retry 2 --retry-delay 3 `
            --speed-time 20 --speed-limit 1024 --output $archive $url
          if ($LASTEXITCODE -ne 0) { throw 'Bounded exact-source codeload failed.' }
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf) -or
              (Get-Item -LiteralPath $archive).Length -lt 100000) {
            throw 'Exact-source archive missing or unexpectedly small.'
          }
          & tar.exe -xf $archive -C $root --strip-components=1
          if ($LASTEXITCODE -ne 0) { throw 'Exact-source extraction failed.' }
          Remove-Item -LiteralPath $archive -Force
          $marker = Join-Path $root '.nexus-trigger-source'
          [IO.File]::WriteAllText($marker, $env:GITHUB_SHA, (New-Object Text.UTF8Encoding($false)))
          if ((Get-Content -LiteralPath $marker -Raw).Trim().ToLowerInvariant() -ne
              $env:GITHUB_SHA.ToLowerInvariant()) { throw 'Exact source binding mismatch.' }
          Write-Output 'NEXUS_OWNER_HEALTH_SOURCE_BOUND=1'

      - name: Bootstrap existing locked portable Python
        shell: cmd
        timeout-minutes: 9
        run: call scripts\bootstrap_portable_python.cmd

      - name: Verify source isolation and run original architecture and dashboard health
        shell: cmd
        timeout-minutes: 5
        run: |
          python -c "import os,pathlib; p=pathlib.Path.cwd().resolve(); r=os.environ['GITHUB_REPOSITORY'].split('/')[-1]; assert p.name.casefold()==r.casefold() and p.parent.name.casefold()==r.casefold() and p.parent.parent.name.casefold()=='_work'; assert (p/'.nexus-trigger-source').read_text(encoding='utf-8').strip().lower()==os.environ['GITHUB_SHA'].lower(); print('NEXUS_HEALTH_PRIVACY_AND_SHA_PASS=1')"
          python -m pytest -q tests/test_nexus_architecture_validator.py tests/test_web_dashboard.py
