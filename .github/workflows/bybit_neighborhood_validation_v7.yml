name: Bybit neighborhood validation v7

on:
  pull_request:
    paths:
      - ".github/workflows/bybit_neighborhood_validation_v7.yml"
      - "bybit_neighborhood_validation_v7.py"
      - "experiments/bybit_neighborhood_validation_v7.json"
      - "tests/test_bybit_neighborhood_validation_v7.py"
  workflow_dispatch:
    inputs:
      artifact_id:
        description: "Final immutable Bybit delivery artifact"
        required: false
        default: "8867026863"

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_ARTIFACT_ID: "8867026863"
      EXPECTED_SHA256: "5f1173467c2296201940c3b7786b7cc3e5442244e07289769ab4867ace41d668"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip check
      - run: python -m pytest -q
      - name: Download immutable Bybit dataset
        run: |
          set -euo pipefail
          artifact_id="${{ github.event.inputs.artifact_id }}"
          if [ -z "$artifact_id" ]; then artifact_id="$DEFAULT_ARTIFACT_ID"; fi
          rm -rf build/final_delivery build/bybit_dataset
          mkdir -p build/final_delivery build/bybit_dataset
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > build/final_delivery.zip
          unzip -q build/final_delivery.zip -d build/final_delivery
          archive="build/final_delivery/BYBIT_full_history_2022-12-01_to_2026-07-31.zip"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -q "$archive" -d build/bybit_dataset
      - name: Validate frozen strategy neighborhood
        run: |
          python bybit_neighborhood_validation_v7.py \
            --manifest experiments/bybit_neighborhood_validation_v7.json \
            --output build/bybit_neighborhood_validation_v7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bybit-neighborhood-validation-v7-${{ github.run_attempt }}
          path: build/bybit_neighborhood_validation_v7
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
      - name: Enforce frozen strategy and plateau gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('build/bybit_neighborhood_validation_v7/neighborhood_validation_v7.json').read_text())
          print(json.dumps(report['summary'], indent=2, sort_keys=True))
          print(json.dumps(report['frozen_strategy'], indent=2, sort_keys=True))
          assert report['summary']['qualifies_for_derivatives_validation_and_prospective_paper_forward'] is True
          assert report['summary']['automatic_paper_forward_started'] is False
          assert report['summary']['live_trading_enabled'] is False
          PY
