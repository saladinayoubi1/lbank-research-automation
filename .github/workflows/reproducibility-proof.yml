name: Reproducibility Proof

on:
  pull_request:
    paths:
      - 'scripts/build_reproducible_control_bundle.py'
      - 'scripts/nonproduction_rollback_drill.py'
      - 'scripts/release_recovery_gate.py'
      - 'docs/adr/0014-bind-reproducibility-and-rollback-evidence.md'
      - 'tests/test_reproducibility_proof.py'
      - '.github/workflows/reproducibility-proof.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-build:
    strategy:
      matrix:
        attempt: [a, b]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build deterministic recovery-control artifact
        run: >-
          python scripts/build_reproducible_control_bundle.py
          --output proof/control-bundle.zip
          --manifest proof/manifest.json
          --source-commit '${{ github.sha }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clean-build-${{ matrix.attempt }}
          path: proof
          if-no-files-found: error

  compare-and-drill:
    needs: clean-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned test runner
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: clean-build-*
          path: downloaded
      - name: Verify independent artifact identity
        run: |
          cmp downloaded/clean-build-a/control-bundle.zip downloaded/clean-build-b/control-bundle.zip
          cmp downloaded/clean-build-a/manifest.json downloaded/clean-build-b/manifest.json
      - name: Run quarantined non-production rollback drill
        run: >-
          python scripts/nonproduction_rollback_drill.py
          --valid downloaded/clean-build-a/control-bundle.zip
          --workspace rollback-work
          --evidence rollback-evidence.json
      - name: Run proof regression tests
        run: python -m pytest -q tests/test_reproducibility_proof.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nonproduction-reproducibility-and-rollback-evidence
          path: |
            downloaded/clean-build-a/control-bundle.zip
            downloaded/clean-build-a/manifest.json
            downloaded/clean-build-b/control-bundle.zip
            downloaded/clean-build-b/manifest.json
            rollback-evidence.json
          if-no-files-found: error

  keyless-attestation:
    if: github.event_name != 'pull_request'
    needs: compare-and-drill
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nonproduction-reproducibility-and-rollback-evidence
          path: reproducibility-evidence
      - name: Generate GitHub OIDC keyless attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: reproducibility-evidence/**
