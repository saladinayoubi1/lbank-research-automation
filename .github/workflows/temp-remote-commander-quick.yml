name: TEMP Remote Commander Quick Discovery

on:
  push:
    branches: [codex/nexus-warp-disconnect-recovery-20260908]
    paths:
      - .github/workflows/temp-remote-commander-quick.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    if: github.ref == 'refs/heads/codex/nexus-warp-disconnect-recovery-20260908'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 2
    steps:
      - name: Compare Windows runner identity and user paths
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Continue'
          Write-Host ("whoami={0}" -f (& whoami.exe))
          Write-Host ("username={0}" -f $env:USERNAME)
          Write-Host ("userprofile={0}" -f $env:USERPROFILE)
          Write-Host ("localappdata={0}" -f $env:LOCALAPPDATA)
          Write-Host ("sessionname={0}" -f $env:SESSIONNAME)
          $envRoot=Join-Path $env:LOCALAPPDATA 'NEXUS\RemoteCommander'
          $afaqRoot='C:\Users\afaq\AppData\Local\NEXUS\RemoteCommander'
          Write-Host ("env_remote_exists={0};path={1}" -f (Test-Path -LiteralPath $envRoot -PathType Container),$envRoot)
          Write-Host ("afaq_remote_exists={0};path={1}" -f (Test-Path -LiteralPath $afaqRoot -PathType Container),$afaqRoot)
          Write-Host ("afaq_nexus_exists={0}" -f (Test-Path -LiteralPath 'C:\Users\afaq\AppData\Local\NEXUS' -PathType Container))
          if(Test-Path -LiteralPath 'C:\Users\afaq\AppData\Local\NEXUS' -PathType Container){
            Get-ChildItem -LiteralPath 'C:\Users\afaq\AppData\Local\NEXUS' -Directory -Force -ErrorAction SilentlyContinue | Sort-Object Name | ForEach-Object { Write-Host ("afaq_nexus_dir={0}" -f $_.Name) }
          }
          Write-Host 'mutation_performed=false'
          Write-Host 'file_contents_read=false'
          Write-Host 'live_trading_authority_changed=false'
