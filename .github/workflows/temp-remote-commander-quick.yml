name: TEMP Remote Commander Quick Discovery

on:
  push:
    branches: [codex/nexus-warp-disconnect-recovery-20260908]
    paths:
      - .github/workflows/temp-remote-commander-quick.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    if: github.ref == 'refs/heads/codex/nexus-warp-disconnect-recovery-20260908'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 2
    steps:
      - name: Quick read-only Remote Commander discovery
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Continue'
          $warp='C:\Program Files\Cloudflare\Cloudflare WARP\warp-cli.exe'
          if(Test-Path -LiteralPath $warp -PathType Leaf){ & $warp disconnect | Out-Null }
          Write-Host "user=$env:USERNAME"
          Write-Host "session=$env:SESSIONNAME"
          Write-Host 'processes_begin'
          Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -match '(?i)remote|commander|desktop|electron' } | ForEach-Object {
            $p=''; try{$p=$_.Path}catch{}; Write-Host ("proc={0};pid={1};path={2}" -f $_.ProcessName,$_.Id,$p)
          }
          Write-Host 'processes_end'
          Write-Host 'uninstall_begin'
          foreach($root in @('HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*')){
            Get-ItemProperty $root -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -match '(?i)remote|commander|desktop commander' } | ForEach-Object { Write-Host ("app={0};loc={1};icon={2}" -f $_.DisplayName,$_.InstallLocation,$_.DisplayIcon) }
          }
          Write-Host 'uninstall_end'
          Write-Host 'startup_begin'
          $ws=New-Object -ComObject WScript.Shell
          foreach($folder in @("$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup","$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Startup","$env:USERPROFILE\Desktop")){
            if(Test-Path -LiteralPath $folder){
              Get-ChildItem -LiteralPath $folder -Filter '*.lnk' -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '(?i)remote|commander|desktop' } | ForEach-Object {
                try{$s=$ws.CreateShortcut($_.FullName); Write-Host ("shortcut={0};target={1};workdir={2}" -f $_.FullName,$s.TargetPath,$s.WorkingDirectory)}catch{}
              }
            }
          }
          Write-Host 'startup_end'
          Write-Host 'known_dirs_begin'
          foreach($d in @("$env:LOCALAPPDATA\NEXUS","$env:LOCALAPPDATA\Programs","$env:APPDATA\npm","$env:USERPROFILE\.desktop-commander","$env:USERPROFILE\.remote-desktop-commander")){
            Write-Host ("dir={0};exists={1}" -f $d,(Test-Path -LiteralPath $d))
            if(Test-Path -LiteralPath $d){Get-ChildItem -LiteralPath $d -Force -ErrorAction SilentlyContinue | Select-Object -First 60 | ForEach-Object { Write-Host ("item={0}" -f $_.FullName) }}
          }
          Write-Host 'known_dirs_end'
          Write-Host 'mutation_performed=false'
          Write-Host 'live_trading_authority_changed=false'
