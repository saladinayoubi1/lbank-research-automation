name: TEMP Remote Commander Quick Discovery

on:
  push:
    branches: [codex/nexus-warp-disconnect-recovery-20260908]
    paths:
      - .github/workflows/temp-remote-commander-quick.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    if: github.ref == 'refs/heads/codex/nexus-warp-disconnect-recovery-20260908'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 2
    steps:
      - name: List RemoteCommander launcher candidates only
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\Users\afaq\AppData\Local\NEXUS\RemoteCommander'
          if(-not (Test-Path -LiteralPath $root -PathType Container)){ throw 'RemoteCommander directory missing.' }
          Write-Host 'root_entries_begin'
          Get-ChildItem -LiteralPath $root -Force -ErrorAction Stop | Sort-Object Name | ForEach-Object {
            $type=if($_.PSIsContainer){'dir'}else{'file'}
            Write-Host ("entry={0};type={1};bytes={2};modified={3:o}" -f $_.FullName,$type,$_.Length,$_.LastWriteTimeUtc)
          }
          Write-Host 'root_entries_end'
          Write-Host 'launcher_candidates_begin'
          Get-ChildItem -LiteralPath $root -File -Recurse -Force -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension.ToLowerInvariant() -in @('.ps1','.cmd','.bat','.exe','.lnk') } |
            Select-Object -First 40 |
            ForEach-Object { Write-Host ("candidate={0};bytes={1};modified={2:o}" -f $_.FullName,$_.Length,$_.LastWriteTimeUtc) }
          Write-Host 'launcher_candidates_end'
          Write-Host 'file_contents_read=false'
          Write-Host 'mutation_performed=false'
          Write-Host 'live_trading_authority_changed=false'
