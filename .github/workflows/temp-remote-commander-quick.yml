name: TEMP Remote Commander Quick Discovery

on:
  push:
    branches: [codex/nexus-warp-disconnect-recovery-20260908]
    paths:
      - .github/workflows/temp-remote-commander-quick.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    if: github.ref == 'refs/heads/codex/nexus-warp-disconnect-recovery-20260908'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 2
    steps:
      - name: Read-only Remote Commander ACL diagnostics
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Continue'
          $root='C:\Users\afaq\AppData\Local\NEXUS\RemoteCommander'
          $file=Join-Path $root 'nexus-remote-commander-watchdog.ps1'
          Write-Host ("whoami={0}" -f (& whoami.exe))
          Write-Host 'attrib_begin'
          & attrib.exe $file 2>&1 | ForEach-Object { Write-Host $_ }
          Write-Host ("attrib_exit={0}" -f $LASTEXITCODE)
          Write-Host 'attrib_end'
          Write-Host 'root_icacls_begin'
          & icacls.exe $root 2>&1 | ForEach-Object { Write-Host $_ }
          Write-Host ("root_icacls_exit={0}" -f $LASTEXITCODE)
          Write-Host 'root_icacls_end'
          Write-Host 'file_icacls_begin'
          & icacls.exe $file 2>&1 | ForEach-Object { Write-Host $_ }
          Write-Host ("file_icacls_exit={0}" -f $LASTEXITCODE)
          Write-Host 'file_icacls_end'
          Write-Host 'cipher_begin'
          & cipher.exe /c $file 2>&1 | Select-Object -First 25 | ForEach-Object { Write-Host $_ }
          Write-Host ("cipher_exit={0}" -f $LASTEXITCODE)
          Write-Host 'cipher_end'
          Write-Host 'acl_modified=false'
          Write-Host 'file_contents_read=false'
          Write-Host 'mutation_performed=false'
          Write-Host 'live_trading_authority_changed=false'
