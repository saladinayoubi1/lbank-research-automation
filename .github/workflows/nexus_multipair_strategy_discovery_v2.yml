name: NEXUS Multi-Pair Discovery v2 physical proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nexus_multipair_trusted_surface.py"
      - "nexus_multipair_discovery_snapshot.py"
      - "nexus_multipair_archive_snapshot.py"
      - "nexus_multipair_strategy_discovery.py"
      - "nexus_multipair_training_refinement.py"
      - "nexus_multipair_search_exhaustion.py"
      - "nexus_multipair_strategy_proposal_requalification.py"
      - "nexus_multipair_runtime_requalification_snapshot.py"
      - "nexus_multipair_demo_strategy_matrix.py"
      - "config/nexus-demo-strategy-matrix-v2.json"
      - "experiments/nexus_multipair_strategy_discovery_v2.json"
      - "docs/architecture/market-data-source-registry.yaml"
      - "market_data_source_validator.py"
      - "phase5_data_binding.py"
      - "phase6_research_pipeline.py"
      - "product_research_runtime.py"
      - "bybit_public_klines.py"
      - "bybit_spot_archive_audit.py"
      - "bybit_spot_archive_collector.py"
      - "bybit_spot_backfill.py"
      - "scripts/nexus_runtime_wheelhouse.py"
      - "scripts/nexus_snapshot_artifact.py"
      - "scripts/nexus_runtime_snapshot_artifact.py"
      - "requirements.lock"
      - "tests/test_nexus_multipair_strategy_discovery.py"
      - "tests/test_nexus_multipair_training_refinement.py"
      - "tests/test_nexus_multipair_strategy_discovery_archive.py"
      - "tests/test_nexus_multipair_archive_snapshot.py"
      - "tests/test_nexus_snapshot_artifact.py"
      - "tests/test_nexus_multipair_runtime_requalification_snapshot.py"
      - "tests/test_nexus_multipair_runtime_requalification_snapshot_contract.py"
      - "tests/test_nexus_runtime_snapshot_artifact.py"
      - "tests/test_nexus_multipair_trusted_surface.py"
      - "tests/test_nexus_multipair_strategy_discovery_workflow.py"
      - "tests/test_nexus_multipair_search_exhaustion.py"
      - ".github/workflows/nexus_multipair_strategy_discovery_v2.yml"
  pull_request:
    branches: [main]
    paths:
      - "nexus_multipair_trusted_surface.py"
      - "nexus_multipair_discovery_snapshot.py"
      - "nexus_multipair_archive_snapshot.py"
      - "nexus_multipair_strategy_discovery.py"
      - "nexus_multipair_training_refinement.py"
      - "nexus_multipair_search_exhaustion.py"
      - "nexus_multipair_strategy_proposal_requalification.py"
      - "nexus_multipair_runtime_requalification_snapshot.py"
      - "nexus_multipair_demo_strategy_matrix.py"
      - "config/nexus-demo-strategy-matrix-v2.json"
      - "experiments/nexus_multipair_strategy_discovery_v2.json"
      - "docs/architecture/market-data-source-registry.yaml"
      - "market_data_source_validator.py"
      - "phase5_data_binding.py"
      - "phase6_research_pipeline.py"
      - "product_research_runtime.py"
      - "bybit_public_klines.py"
      - "bybit_spot_archive_audit.py"
      - "bybit_spot_archive_collector.py"
      - "bybit_spot_backfill.py"
      - "scripts/nexus_runtime_wheelhouse.py"
      - "scripts/nexus_snapshot_artifact.py"
      - "scripts/nexus_runtime_snapshot_artifact.py"
      - "requirements.lock"
      - "tests/test_nexus_multipair_strategy_discovery.py"
      - "tests/test_nexus_multipair_training_refinement.py"
      - "tests/test_nexus_multipair_strategy_discovery_archive.py"
      - "tests/test_nexus_multipair_archive_snapshot.py"
      - "tests/test_nexus_snapshot_artifact.py"
      - "tests/test_nexus_multipair_runtime_requalification_snapshot.py"
      - "tests/test_nexus_multipair_runtime_requalification_snapshot_contract.py"
      - "tests/test_nexus_runtime_snapshot_artifact.py"
      - "tests/test_nexus_multipair_trusted_surface.py"
      - "tests/test_nexus_multipair_strategy_discovery_workflow.py"
      - "tests/test_nexus_multipair_search_exhaustion.py"
      - ".github/workflows/nexus_multipair_strategy_discovery_v2.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: nexus-multipair-discovery-v2-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip check
      - name: Verify Multi-Pair Discovery v2 contracts
        run: >-
          python -m pytest -q
          tests/test_nexus_multipair_strategy_discovery.py
          tests/test_nexus_multipair_training_refinement.py
          tests/test_nexus_multipair_strategy_discovery_archive.py
          tests/test_nexus_multipair_archive_snapshot.py
          tests/test_nexus_snapshot_artifact.py
          tests/test_nexus_multipair_runtime_requalification_snapshot.py
          tests/test_nexus_multipair_runtime_requalification_snapshot_contract.py
          tests/test_nexus_runtime_snapshot_artifact.py
          tests/test_nexus_multipair_trusted_surface.py
          tests/test_nexus_multipair_strategy_discovery_workflow.py
          tests/test_nexus_multipair_search_exhaustion.py

  runtime-wheelhouse:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      EXHAUSTION_ARTIFACT: nexus-multipair-search-exhaustion-${{ github.sha }}
    outputs:
      archive_sha256: ${{ steps.pack.outputs.archive_sha256 }}
      source_archive_sha256: ${{ steps.source.outputs.source_archive_sha256 }}
      snapshot_archive_sha256: ${{ steps.archive.outputs.snapshot_archive_sha256 }}
      snapshot_digest: ${{ steps.search.outputs.snapshot_digest }}
      exhaustion_reuse: ${{ steps.search.outputs.exhaustion_reuse }}
      search_neighborhood_b64: ${{ steps.search.outputs.search_neighborhood_b64 }}
      exhaustion_reuse_b64: ${{ steps.search.outputs.exhaustion_reuse_b64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Pack exact commit source for the Node-free physical jobs
        id: source
        run: |
          set -euo pipefail
          mkdir -p build
          git archive --format=zip \
            --output build/nexus-multipair-exact-source.zip \
            "$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" > build/nexus-multipair-exact-source.commit-sha
          source_archive_sha256="$(sha256sum build/nexus-multipair-exact-source.zip | awk '{print $1}')"
          test -n "$source_archive_sha256"
          echo "source_archive_sha256=$source_archive_sha256" >> "$GITHUB_OUTPUT"
          echo "hosted_exact_source_archive=PASS sha=$GITHUB_SHA archive=$source_archive_sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-multipair-discovery-v2-source-${{ github.sha }}
          path: |
            build/nexus-multipair-exact-source.zip
            build/nexus-multipair-exact-source.commit-sha
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Build locked CPython 3.12 Linux runtime wheelhouse
        run: |
          set -euo pipefail
          wheelhouse="$PWD/build/nexus-multipair-discovery-v2-wheelhouse"
          smoke="$PWD/build/nexus-multipair-discovery-v2-wheelhouse-smoke"
          rm -rf "$wheelhouse" "$smoke" build/nexus-paper-runtime-wheelhouse.zip
          mkdir -p "$wheelhouse" "$smoke"
          python -m pip download \
            --disable-pip-version-check \
            --only-binary=:all: \
            --dest "$wheelhouse" \
            -r requirements.lock
          cp requirements.lock "$wheelhouse/requirements.lock"
          python -m pip install \
            --disable-pip-version-check \
            --no-index \
            --find-links "$wheelhouse" \
            --target "$smoke" \
            -r requirements.lock
          PYTHONPATH="$smoke" python - <<'PY'
          import numpy
          import pandas
          import pyarrow
          import requests
          import tenacity
          import yaml
          print("hosted_multipair_discovery_wheelhouse_smoke=PASS")
          PY
          rm -rf "$smoke"
      - name: Pack deterministic runtime wheelhouse and emit digest
        id: pack
        run: |
          set -euo pipefail
          python scripts/nexus_runtime_wheelhouse.py pack \
            --root build/nexus-multipair-discovery-v2-wheelhouse \
            --output build/nexus-paper-runtime-wheelhouse.zip \
            --digest-output build/nexus-multipair-discovery-v2-wheelhouse-sha.txt
          echo "archive_sha256=$(cat build/nexus-multipair-discovery-v2-wheelhouse-sha.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-multipair-discovery-v2-wheelhouse-${{ github.sha }}
          path: build/nexus-paper-runtime-wheelhouse.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Reuse exact exhausted historical neighborhood when unchanged
        id: exhaustion
        run: |
          set -euo pipefail
          echo "reuse=false" >> "$GITHUB_OUTPUT"
          rm -rf build/exhaustion-cache
          mkdir -p build/exhaustion-cache
          artifact_id="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$EXHAUSTION_ARTIFACT&per_page=100" \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -z "$artifact_id" ]; then
            echo "multipair_search_exhaustion_reuse=MISS reason=no_certificate"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > build/exhaustion-cache/certificate.zip
          unzip -q build/exhaustion-cache/certificate.zip -d build/exhaustion-cache/content
          certificate="$(find build/exhaustion-cache/content -type f -name 'exhaustion-certificate.json' -print -quit)"
          if [ -z "$certificate" ]; then
            echo "multipair_search_exhaustion_reuse=MISS reason=certificate_missing"
            exit 0
          fi
          snapshot_digest="$(CERTIFICATE="$certificate" python - <<'PY'
          import json, os, re
          from pathlib import Path
          value = json.loads(Path(os.environ["CERTIFICATE"]).read_text(encoding="utf-8"))
          if value.get("source_sha") != os.environ["GITHUB_SHA"]:
              raise SystemExit("certificate source SHA mismatch")
          digest = str(value.get("snapshot_digest", ""))
          if not re.fullmatch(r"[0-9a-f]{64}", digest):
              raise SystemExit("certificate snapshot digest invalid")
          print(digest)
          PY
          )"
          python nexus_multipair_search_exhaustion.py fingerprint \
            --manifest experiments/nexus_multipair_strategy_discovery_v2.json \
            --source-sha "$GITHUB_SHA" \
            --snapshot-digest "$snapshot_digest" \
            --root . \
            --output build/exhaustion-cache/search-neighborhood.json
          reusable="$(python nexus_multipair_search_exhaustion.py check \
            --neighborhood build/exhaustion-cache/search-neighborhood.json \
            --certificate "$certificate" \
            | python -c 'import json,sys; print(str(json.load(sys.stdin)["reusable"]).lower())')"
          if [ "$reusable" != "true" ]; then
            echo "multipair_search_exhaustion_reuse=MISS reason=fingerprint_changed"
            exit 0
          fi
          python nexus_multipair_search_exhaustion.py reuse \
            --neighborhood build/exhaustion-cache/search-neighborhood.json \
            --certificate "$certificate" \
            --run-id "$GITHUB_RUN_ID" \
            --output build/exhaustion-cache/reuse-evidence.json >/dev/null
          python nexus_multipair_search_exhaustion.py verify-reuse \
            --evidence build/exhaustion-cache/reuse-evidence.json >/dev/null
          neighborhood_b64="$(base64 -w 0 build/exhaustion-cache/search-neighborhood.json)"
          reuse_b64="$(base64 -w 0 build/exhaustion-cache/reuse-evidence.json)"
          test "${#neighborhood_b64}" -lt 60000
          test "${#reuse_b64}" -lt 60000
          {
            echo "reuse=true"
            echo "snapshot_digest=$snapshot_digest"
            echo "search_neighborhood_b64=$neighborhood_b64"
            echo "exhaustion_reuse_b64=$reuse_b64"
          } >> "$GITHUB_OUTPUT"
          echo "multipair_search_exhaustion_reuse=PASS policy=exact_snapshot_and_implementation_only fresh_runtime_required=true"
      - name: Acquire immutable official Bybit Spot archive snapshot
        if: steps.exhaustion.outputs.reuse != 'true'
        id: archive
        run: |
          set -euo pipefail
          wheelhouse="$PWD/build/nexus-multipair-discovery-v2-wheelhouse"
          acquire_site="$PWD/build/nexus-multipair-discovery-v2-acquire-site"
          state="$PWD/build/nexus-multipair-discovery-v2-archive-state"
          cache="$PWD/build/nexus-multipair-discovery-v2-archive-cache"
          snapshot="$PWD/build/nexus-multipair-discovery-v2-archive-snapshot"
          archive="$PWD/build/nexus-multipair-archive-snapshot.zip"
          digest="$PWD/build/nexus-multipair-archive-snapshot.sha256"
          rm -rf "$acquire_site" "$state" "$cache" "$snapshot" "$archive" "$digest"
          mkdir -p "$acquire_site"
          python -m pip install \
            --disable-pip-version-check \
            --no-index \
            --find-links "$wheelhouse" \
            --no-cache-dir \
            --target "$acquire_site" \
            -r requirements.lock
          PYTHONPATH="$acquire_site" python nexus_multipair_archive_snapshot.py \
            --state-root "$state" \
            --cache-root "$cache" \
            --output-root "$snapshot" \
            --archive-output "$archive" \
            --digest-output "$digest" \
            --source-sha "$GITHUB_SHA"
          snapshot_digest="$(PYTHONPATH="$acquire_site" python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path("build/nexus-multipair-discovery-v2-archive-snapshot/snapshot-manifest.json").read_text(encoding="utf-8"))
          print(value["snapshot_digest"])
          PY
          )"
          snapshot_archive_sha256="$(cat "$digest")"
          test -n "$snapshot_digest"
          test -n "$snapshot_archive_sha256"
          echo "snapshot_digest=$snapshot_digest" >> "$GITHUB_OUTPUT"
          echo "snapshot_archive_sha256=$snapshot_archive_sha256" >> "$GITHUB_OUTPUT"
          rm -rf "$acquire_site" "$state" "$cache" "$snapshot"
          echo "hosted_official_bybit_archive_snapshot=PASS digest=$snapshot_digest archive=$snapshot_archive_sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.exhaustion.outputs.reuse != 'true'
        with:
          name: nexus-multipair-discovery-v2-archive-snapshot-${{ github.sha }}
          path: build/nexus-multipair-archive-snapshot.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Resolve exact search neighborhood for physical handoff
        id: search
        run: |
          set -euo pipefail
          if [ "${{ steps.exhaustion.outputs.reuse }}" = "true" ]; then
            {
              echo "exhaustion_reuse=true"
              echo "snapshot_digest=${{ steps.exhaustion.outputs.snapshot_digest }}"
              echo "search_neighborhood_b64=${{ steps.exhaustion.outputs.search_neighborhood_b64 }}"
              echo "exhaustion_reuse_b64=${{ steps.exhaustion.outputs.exhaustion_reuse_b64 }}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          snapshot_digest="${{ steps.archive.outputs.snapshot_digest }}"
          test -n "$snapshot_digest"
          mkdir -p build/exhaustion-current
          python nexus_multipair_search_exhaustion.py fingerprint \
            --manifest experiments/nexus_multipair_strategy_discovery_v2.json \
            --source-sha "$GITHUB_SHA" \
            --snapshot-digest "$snapshot_digest" \
            --root . \
            --output build/exhaustion-current/search-neighborhood.json >/dev/null
          neighborhood_b64="$(base64 -w 0 build/exhaustion-current/search-neighborhood.json)"
          test "${#neighborhood_b64}" -lt 60000
          {
            echo "exhaustion_reuse=false"
            echo "snapshot_digest=$snapshot_digest"
            echo "search_neighborhood_b64=$neighborhood_b64"
            echo "exhaustion_reuse_b64="
          } >> "$GITHUB_OUTPUT"
          echo "multipair_search_neighborhood=MISS_REQUIRES_FULL_PHYSICAL_DISCOVERY"

  discover-physical:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [contract-test, runtime-wheelhouse]
    runs-on: nexus-bybit-network
    timeout-minutes: 55
    outputs:
      runner_name: ${{ steps.discovery.outputs.runner_name }}
      snapshot_digest: ${{ steps.discovery.outputs.snapshot_digest }}
      proposal_count: ${{ steps.discovery.outputs.proposal_count }}
      exhaustion_reuse: ${{ steps.discovery.outputs.exhaustion_reuse }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_ARTIFACT: nexus-multipair-discovery-v2-source-${{ github.sha }}
      SOURCE_ARCHIVE_SHA256: ${{ needs.runtime-wheelhouse.outputs.source_archive_sha256 }}
      WHEELHOUSE_ARTIFACT: nexus-multipair-discovery-v2-wheelhouse-${{ github.sha }}
      WHEELHOUSE_ARCHIVE_SHA256: ${{ needs.runtime-wheelhouse.outputs.archive_sha256 }}
      SNAPSHOT_ARTIFACT: nexus-multipair-discovery-v2-archive-snapshot-${{ github.sha }}
      SNAPSHOT_ARCHIVE_SHA256: ${{ needs.runtime-wheelhouse.outputs.snapshot_archive_sha256 }}
      EXPECTED_HOSTED_SNAPSHOT_DIGEST: ${{ needs.runtime-wheelhouse.outputs.snapshot_digest }}
      EXHAUSTION_REUSE: ${{ needs.runtime-wheelhouse.outputs.exhaustion_reuse }}
      SEARCH_NEIGHBORHOOD_B64: ${{ needs.runtime-wheelhouse.outputs.search_neighborhood_b64 }}
      EXHAUSTION_REUSE_B64: ${{ needs.runtime-wheelhouse.outputs.exhaustion_reuse_b64 }}
    steps:
      - name: Prepare isolated exact source and ephemeral external Research state
        run: |
          set -euo pipefail
          source_root="$HOME/.local/share/nexus/multipair-discovery-source/$GITHUB_RUN_ID"
          state_root="$HOME/.local/share/nexus/multipair-discovery-v2/$GITHUB_RUN_ID"
          case "$source_root" in
            "$HOME"/.local/share/nexus/multipair-discovery-source/*) ;;
            *) echo "::error::Unsafe Multi-Pair Discovery source root."; exit 1 ;;
          esac
          case "$state_root" in
            "$HOME"/.local/share/nexus/multipair-discovery-v2/*) ;;
            *) echo "::error::Unsafe Multi-Pair Discovery state root."; exit 1 ;;
          esac
          rm -rf "$source_root" "$state_root"
          mkdir -p "$source_root" "$state_root"
          known_python="/opt/nexus-bybit-runner/_work/_tool/Python/3.12.14/x64/bin/python"
          python_bin=""
          if [ -x "$known_python" ]; then python_bin="$known_python"; fi
          if [ -z "$python_bin" ]; then
            tool_root="${RUNNER_TOOL_CACHE:-/opt/nexus-bybit-runner/_work/_tool}"
            if [ "$(basename "$tool_root")" = "Python" ]; then python_root="$tool_root"; else python_root="$tool_root/Python"; fi
            python_bin="$(find "$python_root" -type f -path '*/3.12.*/x64/bin/python' 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          test -n "$python_bin"
          "$python_bin" -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
          python_prefix="$("$python_bin" -c 'import sys; print(sys.prefix)')"
          python_lib="$python_prefix/lib"
          test -d "$python_lib"
          effective_ld_library_path="$python_lib"
          if [ -n "${LD_LIBRARY_PATH:-}" ]; then effective_ld_library_path="$python_lib:$LD_LIBRARY_PATH"; fi
          LD_LIBRARY_PATH="$effective_ld_library_path" "$python_bin" -c "import ctypes; print('multipair_discovery_physical_python=PASS')"

          github_api() {
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --connect-timeout 20 --max-time 900 \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$1"
          }
          run_metadata="$state_root/source-run-metadata.json"
          artifact_metadata="$state_root/source-artifact-metadata.json"
          outer_archive="$state_root/source-artifact.zip"
          inner_archive="$state_root/nexus-multipair-exact-source.zip"
          github_api "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$run_metadata"
          github_api "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$artifact_metadata"
          read -r artifact_id artifact_size artifact_digest <<EOF
          $(RUN_METADATA="$run_metadata" ARTIFACT_METADATA="$artifact_metadata" "$python_bin" - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          run = json.loads(Path(os.environ["RUN_METADATA"]).read_text(encoding="utf-8"))
          if (
              str(run.get("id")) != os.environ["GITHUB_RUN_ID"]
              or run.get("head_sha") != os.environ["GITHUB_SHA"]
              or run.get("head_branch") != "main"
              or run.get("event") not in {"push", "workflow_dispatch"}
          ):
              raise SystemExit("source handoff workflow identity mismatch")
          payload = json.loads(Path(os.environ["ARTIFACT_METADATA"]).read_text(encoding="utf-8"))
          matches = [
              row for row in payload.get("artifacts", [])
              if row.get("name") == os.environ["SOURCE_ARTIFACT"]
              and row.get("expired") is False
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected one exact source artifact, got {len(matches)}")
          row = matches[0]
          digest = str(row.get("digest", ""))
          size = int(row.get("size_in_bytes") or 0)
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("source artifact has no valid GitHub SHA-256 digest")
          if not 0 < size <= 100 * 1024 * 1024:
              raise SystemExit("source artifact size is outside bounds")
          print(int(row["id"]), size, digest.removeprefix("sha256:"))
          PY
          )
          EOF
          github_api "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$outer_archive"
          test "$(stat -c '%s' "$outer_archive")" -eq "$artifact_size"
          test "$(sha256sum "$outer_archive" | awk '{print $1}')" = "$artifact_digest"
          SOURCE_ROOT="$source_root" OUTER_ARCHIVE="$outer_archive" INNER_ARCHIVE="$inner_archive" "$python_bin" - <<'PY'
          import hashlib
          import os
          import shutil
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          outer = Path(os.environ["OUTER_ARCHIVE"])
          inner = Path(os.environ["INNER_ARCHIVE"])
          root = Path(os.environ["SOURCE_ROOT"]).resolve()
          with zipfile.ZipFile(outer) as archive:
              members = archive.infolist()
              expected = {"nexus-multipair-exact-source.zip", "nexus-multipair-exact-source.commit-sha"}
              if {row.filename for row in members} != expected or len(members) != 2:
                  raise SystemExit("source artifact outer surface mismatch")
              for row in members:
                  mode = (row.external_attr >> 16) & 0xFFFF
                  if row.is_dir() or (mode and not stat.S_ISREG(mode)):
                      raise SystemExit("source artifact outer member is not a regular file")
                  target = inner if row.filename.endswith(".zip") else inner.with_suffix(".commit-sha")
                  with archive.open(row) as source, target.open("wb") as output:
                      shutil.copyfileobj(source, output, length=1024 * 1024)
          if inner.with_suffix(".commit-sha").read_text(encoding="utf-8").strip() != os.environ["GITHUB_SHA"]:
              raise SystemExit("source artifact commit identity mismatch")
          digest = hashlib.sha256(inner.read_bytes()).hexdigest()
          if digest != os.environ["SOURCE_ARCHIVE_SHA256"]:
              raise SystemExit("source archive digest mismatch")
          total = 0
          with zipfile.ZipFile(inner) as archive:
              names = [row.filename for row in archive.infolist()]
              if len(names) != len(set(names)):
                  raise SystemExit("duplicate source archive member")
              for row in archive.infolist():
                  pure = PurePosixPath(row.filename)
                  if pure.is_absolute() or ".." in pure.parts or "\\" in row.filename or ".git" in pure.parts:
                      raise SystemExit(f"unsafe source archive path: {row.filename}")
                  mode = (row.external_attr >> 16) & 0xFFFF
                  if row.is_dir():
                      (root / Path(*pure.parts)).mkdir(parents=True, exist_ok=True)
                      continue
                  if mode and not stat.S_ISREG(mode):
                      raise SystemExit(f"source archive member is not regular: {row.filename}")
                  if row.file_size < 0 or row.file_size > 50 * 1024 * 1024:
                      raise SystemExit(f"source archive member size is outside bounds: {row.filename}")
                  total += row.file_size
                  if total > 250 * 1024 * 1024:
                      raise SystemExit("source archive extracted size exceeds bound")
                  target = (root / Path(*pure.parts)).resolve()
                  if root not in target.parents:
                      raise SystemExit(f"unsafe source extraction target: {row.filename}")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with archive.open(row) as source, target.open("wb") as output:
                      shutil.copyfileobj(source, output, length=1024 * 1024)
          (root / ".nexus-exact-source-sha").write_text(os.environ["GITHUB_SHA"] + "\n", encoding="utf-8")
          print(f"physical_exact_source_artifact_restore=PASS files={len(names)} bytes={total}")
          PY
          test "$(cat "$source_root/.nexus-exact-source-sha")" = "$GITHUB_SHA"
          test -f "$source_root/requirements.lock"
          test -f "$source_root/nexus_multipair_runtime_requalification_snapshot.py"
          printf 'PYTHON_BIN=%s\n' "$python_bin" >> "$GITHUB_ENV"
          printf 'LD_LIBRARY_PATH=%s\n' "$effective_ld_library_path" >> "$GITHUB_ENV"
          printf 'SOURCE_ROOT=%s\n' "$source_root" >> "$GITHUB_ENV"
          printf 'STATE_ROOT=%s\n' "$state_root" >> "$GITHUB_ENV"
          echo "multipair_discovery_source_sha=$GITHUB_SHA"
          echo "multipair_discovery_exact_source_artifact=PASS"
          echo "multipair_discovery_state_storage=physical_external_ephemeral_path"

      - name: Enforce eligible physical Bybit Research execution plane
        run: >-
          "$PYTHON_BIN" -c "assert '${{ runner.environment }}' == 'self-hosted'; assert '${{ runner.os }}' == 'Linux'; print('multipair_discovery_execution_plane=self-hosted:nexus-bybit-network')"

      - name: Restore digest-pinned current-run runtime wheelhouse
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          wheelhouse="$STATE_ROOT/wheelhouse"
          cache_root="$HOME/.cache/nexus-paper-runtime-wheelhouse-verified"
          cache_dir="$cache_root/$WHEELHOUSE_ARCHIVE_SHA256"
          cache_probe="$STATE_ROOT/nexus-multipair-wheelhouse-cache-probe.zip"
          rm -rf "$wheelhouse"
          rm -f "$cache_probe"

          cache_hit=false
          if [ -d "$cache_dir" ] && [ ! -L "$cache_dir" ]; then
            if ! find "$cache_dir" -type l -print -quit | grep -q .; then
              if "$PYTHON_BIN" scripts/nexus_runtime_wheelhouse.py pack \
                --root "$cache_dir" \
                --output "$cache_probe" >/dev/null 2>&1; then
                cache_sha="$(sha256sum "$cache_probe" | awk '{print $1}')"
                if [ "$cache_sha" = "$WHEELHOUSE_ARCHIVE_SHA256" ] \
                  && cmp requirements.lock "$cache_dir/requirements.lock" \
                  && find "$cache_dir" -maxdepth 1 -type f -name '*.whl' -print -quit | grep -q .; then
                  cache_hit=true
                fi
              fi
            fi
          fi

          if [ "$cache_hit" = true ]; then
            mkdir -p "$wheelhouse"
            cp -a "$cache_dir/." "$wheelhouse/"
            rm -f "$cache_probe"
            echo "multipair_runtime_wheelhouse_verified_cache=HIT"
          else
            rm -rf "$cache_dir"
            rm -f "$cache_probe"
            "$PYTHON_BIN" scripts/nexus_runtime_wheelhouse.py restore-current-run \
              --repository "$GITHUB_REPOSITORY" \
              --run-id "$GITHUB_RUN_ID" \
              --artifact-name "$WHEELHOUSE_ARTIFACT" \
              --expected-sha256 "$WHEELHOUSE_ARCHIVE_SHA256" \
              --repository-lock requirements.lock \
              --destination "$wheelhouse" \
              --work-root "$STATE_ROOT/wheelhouse-restore"
            mkdir -p "$cache_root"
            staging_dir="$cache_root/.${WHEELHOUSE_ARCHIVE_SHA256}.tmp.$"
            rm -rf "$staging_dir"
            cp -a "$wheelhouse" "$staging_dir"
            rm -rf "$cache_dir"
            mv "$staging_dir" "$cache_dir"
            echo "multipair_runtime_wheelhouse_verified_cache=MISS_POPULATED"
          fi

      - name: Restore digest-pinned official Bybit archive snapshot
        if: env.EXHAUSTION_REUSE != 'true'
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          "$PYTHON_BIN" scripts/nexus_snapshot_artifact.py \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --artifact-name "$SNAPSHOT_ARTIFACT" \
            --expected-sha256 "$SNAPSHOT_ARCHIVE_SHA256" \
            --expected-source-sha "$GITHUB_SHA" \
            --expected-snapshot-digest "$EXPECTED_HOSTED_SNAPSHOT_DIGEST" \
            --destination "$STATE_ROOT/snapshot" \
            --work-root "$STATE_ROOT/snapshot-restore"

      - name: Provision locked external runtime dependencies
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          pip_wheel="$("$PYTHON_BIN" - <<'PY'
          import ensurepip
          from pathlib import Path
          bundled = Path(ensurepip.__file__).resolve().parent / "_bundled"
          wheels = sorted(bundled.glob("pip-*.whl"))
          if not wheels:
              raise SystemExit("bundled pip wheel missing")
          print(wheels[-1].resolve())
          PY
          )"
          wheelhouse="$STATE_ROOT/wheelhouse"
          runtime_site="$STATE_ROOT/runtime-site"
          test -f "$wheelhouse/requirements.lock"
          cmp requirements.lock "$wheelhouse/requirements.lock"
          rm -rf "$runtime_site"
          mkdir -p "$runtime_site"
          PYTHONPATH="$pip_wheel" "$PYTHON_BIN" -m pip install \
            --disable-pip-version-check \
            --no-index \
            --find-links "$wheelhouse" \
            --no-cache-dir \
            --target "$runtime_site" \
            -r requirements.lock
          cp requirements.lock "$STATE_ROOT/requirements.lock"
          printf 'PIP_WHEEL=%s\n' "$pip_wheel" >> "$GITHUB_ENV"
          printf 'PYTHONPATH=%s:%s:%s\n' "$pip_wheel" "$runtime_site" "$SOURCE_ROOT" >> "$GITHUB_ENV"
          echo "multipair_discovery_offline_wheelhouse_bootstrap=PASS"

      - name: Verify isolated runtime dependency consistency
        run: '"$PYTHON_BIN" -m pip check'

      - name: Materialize exact search neighborhood and optional exhaustion reuse
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          test -n "$SEARCH_NEIGHBORHOOD_B64"
          printf '%s' "$SEARCH_NEIGHBORHOOD_B64" | base64 --decode > "$STATE_ROOT/search-neighborhood.json"
          "$PYTHON_BIN" - <<'PY'
          import json, os
          from pathlib import Path
          from nexus_multipair_search_exhaustion import verify_neighborhood
          value = json.loads((Path(os.environ["STATE_ROOT"]) / "search-neighborhood.json").read_text())
          verify_neighborhood(value)
          assert value["source_sha"] == os.environ["GITHUB_SHA"]
          assert value["snapshot_digest"] == os.environ["EXPECTED_HOSTED_SNAPSHOT_DIGEST"]
          print("multipair_search_neighborhood_physical_binding=PASS")
          PY
          if [ "$EXHAUSTION_REUSE" = "true" ]; then
            test -n "$EXHAUSTION_REUSE_B64"
            printf '%s' "$EXHAUSTION_REUSE_B64" | base64 --decode > "$STATE_ROOT/exhaustion-reuse.json"
            "$PYTHON_BIN" nexus_multipair_search_exhaustion.py verify-reuse \
              --evidence "$STATE_ROOT/exhaustion-reuse.json" >/dev/null
            echo "multipair_historical_discovery_reuse_physical_binding=PASS"
          else
            test -z "$EXHAUSTION_REUSE_B64"
          fi

      - name: Verify transported archive and run leakage-resistant Discovery
        id: discovery
        env:
          RUNNER_NAME_EVIDENCE: ${{ runner.name }}
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          if [ "$EXHAUSTION_REUSE" = "true" ]; then
            "$PYTHON_BIN" nexus_multipair_search_exhaustion.py verify-reuse \
              --evidence "$STATE_ROOT/exhaustion-reuse.json" >/dev/null
            snapshot_digest="$("$PYTHON_BIN" -c 'import json,os; print(json.load(open(os.path.join(os.environ["STATE_ROOT"], "exhaustion-reuse.json")))["snapshot_digest"])')"
            {
              echo "runner_name=$RUNNER_NAME_EVIDENCE"
              echo "snapshot_digest=$snapshot_digest"
              echo "proposal_count=0"
              echo "exhaustion_reuse=true"
            } >> "$GITHUB_OUTPUT"
            echo "multipair_archive_discovery_physical=SKIPPED_EXACT_EXHAUSTION snapshot=$snapshot_digest fresh_runtime_required=true"
            exit 0
          fi
          "$PYTHON_BIN" - <<'PY'
          import json
          import os
          from pathlib import Path
          from nexus_multipair_archive_snapshot import verify_snapshot
          from nexus_multipair_search_exhaustion import verify_neighborhood
          from nexus_multipair_strategy_discovery import run as run_discovery, verify_discovery
          from nexus_multipair_training_refinement import run as run_refinement
          from nexus_multipair_trusted_surface import FAMILIES, SYMBOLS, TIMEFRAMES
          state_root = Path(os.environ["STATE_ROOT"])
          source_sha = os.environ["GITHUB_SHA"]
          snapshot_root = state_root / "snapshot"
          snapshot = json.loads((snapshot_root / "snapshot-manifest.json").read_text(encoding="utf-8"))
          neighborhood = json.loads((state_root / "search-neighborhood.json").read_text(encoding="utf-8"))
          verify_neighborhood(neighborhood)
          assert neighborhood["source_sha"] == source_sha
          assert neighborhood["snapshot_digest"] == snapshot["snapshot_digest"]
          snapshot_verification = verify_snapshot(snapshot_root, snapshot)
          assert snapshot_verification["decision"] == "pass", snapshot_verification
          assert snapshot["source_sha"] == source_sha
          assert snapshot["snapshot_digest"] == os.environ["EXPECTED_HOSTED_SNAPSHOT_DIGEST"]
          assert snapshot["cell_count"] == 12
          assert snapshot["symbols"] == list(SYMBOLS)
          assert snapshot["timeframes"] == list(TIMEFRAMES)
          assert snapshot["data_origin"] == "official_public_bybit_spot_trade_archive_aggregated"
          assert snapshot["runtime_freshness_claimed"] is False
          assert snapshot["research_only"] is True
          assert snapshot["paper_execution_started"] is False
          assert snapshot["live_trading_authority"] is False
          assert snapshot["private_credentials_used"] is False
          assert snapshot["real_exchange_orders"] is False
          assert snapshot["automatic_strategy_promotion"] is False
          assert snapshot["silent_exchange_substitution"] is False
          assert snapshot["third_party_proxy_used"] is False
          assert snapshot["issue_984_state_touched"] is False
          source_manifest = Path("experiments/nexus_multipair_strategy_discovery_v2.json")
          manifest = json.loads(source_manifest.read_text(encoding="utf-8"))
          manifest["dataset"]["dataset_root"] = str(snapshot_root)
          manifest_path = state_root / "discovery-manifest.json"
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          base_root = state_root / "base-discovery"
          base = run_discovery(manifest_path, base_root, source_sha=source_sha)
          base_verification = verify_discovery(base)
          assert base_verification["decision"] == "pass", base_verification
          refinement_root = state_root / "refinement"
          plan = run_refinement(manifest_path, base_root / "multipair_strategy_discovery.json", refinement_root)
          assert plan["source_discovery_sha"] == source_sha
          assert plan["source_discovery_digest"] == base["discovery_digest"]
          assert plan["dataset_snapshot_sha256"] == snapshot["snapshot_digest"]
          assert plan["selection_basis"] == "training_only"
          assert plan["locked_holdout_used_for_refinement"] is False
          assert plan["research_only"] is True
          assert plan["paper_only"] is True
          assert plan["live_trading_authority"] is False
          assert plan["private_credentials_used"] is False
          assert plan["automatic_strategy_promotion"] is False
          assert plan["automatic_paper_forward_started"] is False

          output_root = state_root / "discovery"
          if plan["should_refine"]:
              refined_manifest_path = refinement_root / "refinement-manifest.json"
              refined_manifest = json.loads(refined_manifest_path.read_text(encoding="utf-8"))
              assert refined_manifest["dataset"] == manifest["dataset"]
              assert refined_manifest["gates"] == manifest["gates"]
              assert refined_manifest["execution"] == manifest["execution"]
              assert refined_manifest["authority"] == manifest["authority"]
              result = run_discovery(refined_manifest_path, output_root, source_sha=source_sha)
          else:
              output_root.mkdir(parents=True, exist_ok=True)
              for name in ("multipair_strategy_discovery.json", "research_proposals.json", "discovery_verification.json"):
                  source = base_root / name
                  if source.exists():
                      (output_root / name).write_bytes(source.read_bytes())
              result = json.loads((output_root / "multipair_strategy_discovery.json").read_text(encoding="utf-8"))

          verification = verify_discovery(result)
          assert verification["decision"] == "pass", verification
          assert result["source_sha"] == source_sha
          assert result["dataset_snapshot_sha256"] == snapshot["snapshot_digest"]
          assert result["snapshot_schema_version"] == snapshot["schema_version"]
          assert result["snapshot_data_origin"] == snapshot["data_origin"]
          assert result["snapshot_runtime_freshness_claimed"] is False
          assert result["symbols"] == list(SYMBOLS)
          assert result["timeframes"] == list(TIMEFRAMES)
          assert result["families"] == list(FAMILIES)
          assert result["hypothesis_count"] == 9
          assert len(result["cells"]) == 9
          assert all(row["selection_source"] == "training_only" for row in result["cells"])
          assert result["research_only"] is True
          assert result["paper_only"] is True
          assert result["live_trading_authority"] is False
          assert result["private_credentials_used"] is False
          assert result["automatic_strategy_promotion"] is False
          assert result["automatic_paper_forward_started"] is False
          (state_root / "discovery-summary.json").write_text(json.dumps({
              "snapshot_digest": snapshot["snapshot_digest"],
              "base_proposal_count": base["research_proposal_count"],
              "proposal_count": result["research_proposal_count"],
              "discovery_digest": result["discovery_digest"],
              "refinement_started": plan["should_refine"],
              "training_basis_digest": plan["training_basis_digest"],
              "selection_basis": plan["selection_basis"],
              "locked_holdout_used_for_refinement": plan["locked_holdout_used_for_refinement"],
          }, sort_keys=True) + "\n", encoding="utf-8")
          PY
          read -r snapshot_digest proposal_count <<EOF
          $("$PYTHON_BIN" - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads((Path(os.environ["STATE_ROOT"]) / "discovery-summary.json").read_text())
          print(value["snapshot_digest"], value["proposal_count"])
          PY
          )
          EOF
          echo "runner_name=$RUNNER_NAME_EVIDENCE" >> "$GITHUB_OUTPUT"
          echo "snapshot_digest=$snapshot_digest" >> "$GITHUB_OUTPUT"
          echo "proposal_count=$proposal_count" >> "$GITHUB_OUTPUT"
          echo "exhaustion_reuse=false" >> "$GITHUB_OUTPUT"
          echo "multipair_archive_discovery_physical=PASS proposals=$proposal_count snapshot=$snapshot_digest"

      - name: Remove isolated Discovery source after failure
        if: failure()
        run: |
          set -euo pipefail
          source_root="${SOURCE_ROOT:-$HOME/.local/share/nexus/multipair-discovery-source/$GITHUB_RUN_ID}"
          case "$source_root" in
            "$HOME"/.local/share/nexus/multipair-discovery-source/*) rm -rf "$source_root" ;;
            *) echo "::error::Refusing unsafe Discovery source cleanup path."; exit 1 ;;
          esac

  runtime-snapshot:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: discover-physical
    runs-on: nexus-bybit-network
    timeout-minutes: 30
    outputs:
      runtime_snapshot_archive_sha256: ${{ steps.acquire.outputs.runtime_snapshot_archive_sha256 }}
      runtime_snapshot_digest: ${{ steps.acquire.outputs.runtime_snapshot_digest }}
      runtime_snapshot_as_of_ms: ${{ steps.acquire.outputs.runtime_snapshot_as_of_ms }}
      runtime_snapshot_archive_chunk_count: ${{ steps.acquire.outputs.runtime_snapshot_archive_chunk_count }}
      runtime_snapshot_archive_b64_len: ${{ steps.acquire.outputs.runtime_snapshot_archive_b64_len }}
      runtime_snapshot_archive_chunk_0: ${{ steps.acquire.outputs.runtime_snapshot_archive_chunk_0 }}
      runtime_snapshot_archive_chunk_1: ${{ steps.acquire.outputs.runtime_snapshot_archive_chunk_1 }}
      runtime_snapshot_archive_chunk_2: ${{ steps.acquire.outputs.runtime_snapshot_archive_chunk_2 }}
      runtime_snapshot_archive_chunk_3: ${{ steps.acquire.outputs.runtime_snapshot_archive_chunk_3 }}
      runtime_snapshot_archive_chunk_4: ${{ steps.acquire.outputs.runtime_snapshot_archive_chunk_4 }}
      runtime_snapshot_archive_chunk_5: ${{ steps.acquire.outputs.runtime_snapshot_archive_chunk_5 }}
      runtime_snapshot_archive_chunk_6: ${{ steps.acquire.outputs.runtime_snapshot_archive_chunk_6 }}
      runtime_snapshot_archive_chunk_7: ${{ steps.acquire.outputs.runtime_snapshot_archive_chunk_7 }}
    env:
      EXPECTED_DISCOVERY_RUNNER_NAME: ${{ needs.discover-physical.outputs.runner_name }}
      EXHAUSTION_REUSE: ${{ needs.discover-physical.outputs.exhaustion_reuse }}
    steps:
      - name: Initialize same-run physical runtime snapshot roots
        run: |
          set -euo pipefail
          state_root="$HOME/.local/share/nexus/multipair-discovery-v2/$GITHUB_RUN_ID"
          source_root="$HOME/.local/share/nexus/multipair-discovery-source/$GITHUB_RUN_ID"
          case "$state_root" in
            "$HOME"/.local/share/nexus/multipair-discovery-v2/*) ;;
            *) echo "::error::Unsafe Multi-Pair Discovery state root."; exit 1 ;;
          esac
          case "$source_root" in
            "$HOME"/.local/share/nexus/multipair-discovery-source/*) ;;
            *) echo "::error::Unsafe retained Discovery source root."; exit 1 ;;
          esac
          test -d "$state_root/runtime-site"
          test -f "$state_root/requirements.lock"
          test -f "$state_root/search-neighborhood.json"
          if [ "$EXHAUSTION_REUSE" = "true" ]; then
            test -f "$state_root/exhaustion-reuse.json"
          else
            test -f "$state_root/discovery/multipair_strategy_discovery.json"
          fi
          test "$(cat "$source_root/.nexus-exact-source-sha")" = "$GITHUB_SHA"
          test -f "$source_root/requirements.lock"
          test -f "$source_root/nexus_multipair_runtime_requalification_snapshot.py"
          printf 'STATE_ROOT=%s\n' "$state_root" >> "$GITHUB_ENV"
          printf 'SOURCE_ROOT=%s\n' "$source_root" >> "$GITHUB_ENV"
          echo "multipair_runtime_snapshot_external_roots=PASS"
          echo "multipair_runtime_snapshot_retained_exact_source=PASS sha=$GITHUB_SHA"

      - name: Recover exact Python and isolated dependencies
        run: |
          set -euo pipefail
          known_python="/opt/nexus-bybit-runner/_work/_tool/Python/3.12.14/x64/bin/python"
          python_bin=""
          if [ -x "$known_python" ]; then python_bin="$known_python"; fi
          if [ -z "$python_bin" ]; then
            tool_root="${RUNNER_TOOL_CACHE:-/opt/nexus-bybit-runner/_work/_tool}"
            if [ "$(basename "$tool_root")" = "Python" ]; then python_root="$tool_root"; else python_root="$tool_root/Python"; fi
            python_bin="$(find "$python_root" -type f -path '*/3.12.*/x64/bin/python' 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          test -n "$python_bin"
          "$python_bin" -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
          python_prefix="$("$python_bin" -c 'import sys; print(sys.prefix)')"
          python_lib="$python_prefix/lib"
          test -d "$python_lib"
          effective_ld_library_path="$python_lib"
          if [ -n "${LD_LIBRARY_PATH:-}" ]; then effective_ld_library_path="$python_lib:$LD_LIBRARY_PATH"; fi
          cmp "$SOURCE_ROOT/requirements.lock" "$STATE_ROOT/requirements.lock"
          pip_wheel="$("$python_bin" - <<'PY'
          import ensurepip
          from pathlib import Path
          bundled = Path(ensurepip.__file__).resolve().parent / "_bundled"
          wheels = sorted(bundled.glob("pip-*.whl"))
          if not wheels:
              raise SystemExit("bundled pip wheel missing")
          print(wheels[-1].resolve())
          PY
          )"
          test -f "$pip_wheel"
          printf 'PYTHON_BIN=%s\n' "$python_bin" >> "$GITHUB_ENV"
          printf 'LD_LIBRARY_PATH=%s\n' "$effective_ld_library_path" >> "$GITHUB_ENV"
          printf 'PIP_WHEEL=%s\n' "$pip_wheel" >> "$GITHUB_ENV"
          printf 'PYTHONPATH=%s:%s:%s\n' "$pip_wheel" "$STATE_ROOT/runtime-site" "$SOURCE_ROOT" >> "$GITHUB_ENV"
          echo "multipair_runtime_snapshot_runtime_recovered=PASS"

      - name: Enforce same physical Bybit execution plane as Discovery
        env:
          CURRENT_RUNNER_NAME: ${{ runner.name }}
        run: >-
          "$PYTHON_BIN" -c "assert '${{ runner.environment }}' == 'self-hosted'; assert '${{ runner.os }}' == 'Linux'; assert '$CURRENT_RUNNER_NAME' == '$EXPECTED_DISCOVERY_RUNNER_NAME'; print('multipair_runtime_snapshot_execution_plane=self-hosted:nexus-bybit-network')"

      - name: Verify recovered isolated runtime dependency consistency
        run: '"$PYTHON_BIN" -m pip check'

      - name: Acquire fresh canonical public Bybit runtime snapshot on physical plane
        id: acquire
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          root="$STATE_ROOT/runtime-snapshot-acquire"
          archive="$SOURCE_ROOT/build/nexus-multipair-runtime-requalification-snapshot.zip"
          digest="$SOURCE_ROOT/build/nexus-multipair-runtime-requalification-snapshot.sha256"
          rm -rf "$root" "$archive" "$digest"
          mkdir -p "$SOURCE_ROOT/build"
          now_ms="$("$PYTHON_BIN" -c 'import time; print(int(time.time() * 1000))')"
          "$PYTHON_BIN" nexus_multipair_runtime_requalification_snapshot.py acquire \
            --output-root "$root" \
            --archive-output "$archive" \
            --digest-output "$digest" \
            --source-sha "$GITHUB_SHA" \
            --now-ms "$now_ms"
          read -r runtime_snapshot_digest runtime_snapshot_as_of_ms <<EOF
          $("$PYTHON_BIN" - <<'PY'
          import json
          import os
          from pathlib import Path
          value = json.loads((Path(os.environ["STATE_ROOT"]) / "runtime-snapshot-acquire" / "snapshot-manifest.json").read_text(encoding="utf-8"))
          print(value["snapshot_digest"], value["as_of_ms"])
          PY
          )
          EOF
          runtime_snapshot_archive_sha256="$(cat "$digest")"
          test -n "$runtime_snapshot_archive_sha256"
          test -n "$runtime_snapshot_digest"
          test -n "$runtime_snapshot_as_of_ms"
          runtime_snapshot_archive_b64="$(base64 -w 0 "$archive")"
          runtime_snapshot_archive_b64_len="${#runtime_snapshot_archive_b64}"
          chunk_size=60000
          max_chunks=8
          if [ "$runtime_snapshot_archive_b64_len" -gt 480000 ]; then
            echo "::error::Runtime snapshot archive exceeds bounded job-output handoff."
            exit 1
          fi
          runtime_snapshot_archive_chunk_count=$(( (runtime_snapshot_archive_b64_len + chunk_size - 1) / chunk_size ))
          if [ "$runtime_snapshot_archive_chunk_count" -lt 1 ] || [ "$runtime_snapshot_archive_chunk_count" -gt "$max_chunks" ]; then
            echo "::error::Runtime snapshot archive has invalid handoff chunk count: $runtime_snapshot_archive_chunk_count"
            exit 1
          fi
          {
            echo "runtime_snapshot_archive_sha256=$runtime_snapshot_archive_sha256"
            echo "runtime_snapshot_digest=$runtime_snapshot_digest"
            echo "runtime_snapshot_as_of_ms=$runtime_snapshot_as_of_ms"
            echo "runtime_snapshot_archive_chunk_count=$runtime_snapshot_archive_chunk_count"
            echo "runtime_snapshot_archive_b64_len=$runtime_snapshot_archive_b64_len"
            for index in 0 1 2 3 4 5 6 7; do
              if [ "$index" -lt "$runtime_snapshot_archive_chunk_count" ]; then
                offset=$(( index * chunk_size ))
                chunk="${runtime_snapshot_archive_b64:offset:chunk_size}"
              else
                chunk=""
              fi
              printf 'runtime_snapshot_archive_chunk_%s=%s\n' "$index" "$chunk"
            done
          } >> "$GITHUB_OUTPUT"
          rm -rf "$root"
          echo "physical_fresh_multipair_runtime_snapshot=PASS digest=$runtime_snapshot_digest as_of_ms=$runtime_snapshot_as_of_ms archive=$runtime_snapshot_archive_sha256 chunks=$runtime_snapshot_archive_chunk_count"

      - name: Remove isolated runtime snapshot source after failure
        if: failure()
        run: |
          set -euo pipefail
          source_root="${SOURCE_ROOT:-$HOME/.local/share/nexus/multipair-discovery-source/$GITHUB_RUN_ID}"
          case "$source_root" in
            "$HOME"/.local/share/nexus/multipair-discovery-source/*) rm -rf "$source_root" ;;
            *) echo "::error::Refusing unsafe retained Discovery source cleanup path."; exit 1 ;;
          esac

  persist-runtime-snapshot:
    if: ${{ always() && needs.runtime-snapshot.result == 'success' && needs.runtime-snapshot.outputs.runtime_snapshot_archive_chunk_count != '0' }}
    needs: runtime-snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNTIME_SNAPSHOT_ARCHIVE_CHUNK_COUNT: ${{ needs.runtime-snapshot.outputs.runtime_snapshot_archive_chunk_count }}
      RUNTIME_SNAPSHOT_ARCHIVE_B64_LEN: ${{ needs.runtime-snapshot.outputs.runtime_snapshot_archive_b64_len }}
      RUNTIME_SNAPSHOT_ARCHIVE_SHA256: ${{ needs.runtime-snapshot.outputs.runtime_snapshot_archive_sha256 }}
      RUNTIME_SNAPSHOT_ARCHIVE_CHUNK_0: ${{ needs.runtime-snapshot.outputs.runtime_snapshot_archive_chunk_0 }}
      RUNTIME_SNAPSHOT_ARCHIVE_CHUNK_1: ${{ needs.runtime-snapshot.outputs.runtime_snapshot_archive_chunk_1 }}
      RUNTIME_SNAPSHOT_ARCHIVE_CHUNK_2: ${{ needs.runtime-snapshot.outputs.runtime_snapshot_archive_chunk_2 }}
      RUNTIME_SNAPSHOT_ARCHIVE_CHUNK_3: ${{ needs.runtime-snapshot.outputs.runtime_snapshot_archive_chunk_3 }}
      RUNTIME_SNAPSHOT_ARCHIVE_CHUNK_4: ${{ needs.runtime-snapshot.outputs.runtime_snapshot_archive_chunk_4 }}
      RUNTIME_SNAPSHOT_ARCHIVE_CHUNK_5: ${{ needs.runtime-snapshot.outputs.runtime_snapshot_archive_chunk_5 }}
      RUNTIME_SNAPSHOT_ARCHIVE_CHUNK_6: ${{ needs.runtime-snapshot.outputs.runtime_snapshot_archive_chunk_6 }}
      RUNTIME_SNAPSHOT_ARCHIVE_CHUNK_7: ${{ needs.runtime-snapshot.outputs.runtime_snapshot_archive_chunk_7 }}
    steps:
      - name: Rehydrate exact physical runtime snapshot handoff
        run: |
          set -euo pipefail
          archive="build/nexus-multipair-runtime-requalification-snapshot.zip"
          rm -f "$archive"
          mkdir -p build
          case "$RUNTIME_SNAPSHOT_ARCHIVE_CHUNK_COUNT" in
            1|2|3|4|5|6|7|8) ;;
            *) echo "::error::Invalid runtime snapshot handoff chunk count."; exit 1 ;;
          esac
          chunks=(
            "$RUNTIME_SNAPSHOT_ARCHIVE_CHUNK_0"
            "$RUNTIME_SNAPSHOT_ARCHIVE_CHUNK_1"
            "$RUNTIME_SNAPSHOT_ARCHIVE_CHUNK_2"
            "$RUNTIME_SNAPSHOT_ARCHIVE_CHUNK_3"
            "$RUNTIME_SNAPSHOT_ARCHIVE_CHUNK_4"
            "$RUNTIME_SNAPSHOT_ARCHIVE_CHUNK_5"
            "$RUNTIME_SNAPSHOT_ARCHIVE_CHUNK_6"
            "$RUNTIME_SNAPSHOT_ARCHIVE_CHUNK_7"
          )
          runtime_snapshot_archive_b64=""
          for ((index=0; index<RUNTIME_SNAPSHOT_ARCHIVE_CHUNK_COUNT; index++)); do
            if [ "${#chunks[$index]}" -gt 60000 ]; then
              echo "::error::Runtime snapshot handoff chunk exceeds bound."
              exit 1
            fi
            runtime_snapshot_archive_b64+="${chunks[$index]}"
          done
          for ((index=RUNTIME_SNAPSHOT_ARCHIVE_CHUNK_COUNT; index<8; index++)); do
            if [ -n "${chunks[$index]}" ]; then
              echo "::error::Unexpected trailing runtime snapshot handoff chunk."
              exit 1
            fi
          done
          test "${#runtime_snapshot_archive_b64}" -eq "$RUNTIME_SNAPSHOT_ARCHIVE_B64_LEN"
          printf '%s' "$runtime_snapshot_archive_b64" | base64 --decode > "$archive"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$RUNTIME_SNAPSHOT_ARCHIVE_SHA256"
          echo "hosted_runtime_snapshot_handoff_verification=PASS archive=$RUNTIME_SNAPSHOT_ARCHIVE_SHA256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-multipair-runtime-requalification-snapshot-${{ github.sha }}
          path: build/nexus-multipair-runtime-requalification-snapshot.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  requalify-physical:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [discover-physical, runtime-snapshot, persist-runtime-snapshot]
    runs-on: nexus-bybit-network
    timeout-minutes: 55
    outputs:
      proof_b64: ${{ steps.proof.outputs.proof_b64 }}
      proof_sha256: ${{ steps.proof.outputs.proof_sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_DISCOVERY_RUNNER_NAME: ${{ needs.discover-physical.outputs.runner_name }}
      EXPECTED_SNAPSHOT_DIGEST: ${{ needs.discover-physical.outputs.snapshot_digest }}
      EXHAUSTION_REUSE: ${{ needs.discover-physical.outputs.exhaustion_reuse }}
      RUNTIME_SNAPSHOT_ARTIFACT: nexus-multipair-runtime-requalification-snapshot-${{ github.sha }}
      RUNTIME_SNAPSHOT_ARCHIVE_SHA256: ${{ needs.runtime-snapshot.outputs.runtime_snapshot_archive_sha256 }}
      EXPECTED_RUNTIME_SNAPSHOT_DIGEST: ${{ needs.runtime-snapshot.outputs.runtime_snapshot_digest }}
      EXPECTED_RUNTIME_SNAPSHOT_AS_OF_MS: ${{ needs.runtime-snapshot.outputs.runtime_snapshot_as_of_ms }}
    steps:
      - name: Initialize safe external requalification roots
        run: |
          set -euo pipefail
          state_root="$HOME/.local/share/nexus/multipair-discovery-v2/$GITHUB_RUN_ID"
          source_root="$HOME/.local/share/nexus/multipair-discovery-source/$GITHUB_RUN_ID"
          case "$state_root" in
            "$HOME"/.local/share/nexus/multipair-discovery-v2/*) ;;
            *) echo "::error::Unsafe Multi-Pair Discovery state root."; exit 1 ;;
          esac
          case "$source_root" in
            "$HOME"/.local/share/nexus/multipair-discovery-source/*) ;;
            *) echo "::error::Unsafe retained Discovery source root."; exit 1 ;;
          esac
          test -d "$state_root/runtime-site"
          test -f "$state_root/requirements.lock"
          test -f "$state_root/search-neighborhood.json"
          if [ "$EXHAUSTION_REUSE" = "true" ]; then
            test -f "$state_root/exhaustion-reuse.json"
          else
            test -f "$state_root/snapshot/snapshot-manifest.json"
            test -f "$state_root/discovery/multipair_strategy_discovery.json"
            test -f "$state_root/discovery/research_proposals.json"
          fi
          test "$(cat "$source_root/.nexus-exact-source-sha")" = "$GITHUB_SHA"
          test -f "$source_root/requirements.lock"
          test -f "$source_root/nexus_multipair_runtime_requalification_snapshot.py"
          printf 'STATE_ROOT=%s\n' "$state_root" >> "$GITHUB_ENV"
          printf 'SOURCE_ROOT=%s\n' "$source_root" >> "$GITHUB_ENV"
          echo "multipair_requalification_retained_exact_source=PASS sha=$GITHUB_SHA"

      - name: Recover exact Python and isolated dependencies
        run: |
          set -euo pipefail
          state_root="$STATE_ROOT"
          source_root="$SOURCE_ROOT"
          known_python="/opt/nexus-bybit-runner/_work/_tool/Python/3.12.14/x64/bin/python"
          python_bin=""
          if [ -x "$known_python" ]; then python_bin="$known_python"; fi
          if [ -z "$python_bin" ]; then
            tool_root="${RUNNER_TOOL_CACHE:-/opt/nexus-bybit-runner/_work/_tool}"
            if [ "$(basename "$tool_root")" = "Python" ]; then python_root="$tool_root"; else python_root="$tool_root/Python"; fi
            python_bin="$(find "$python_root" -type f -path '*/3.12.*/x64/bin/python' 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          test -n "$python_bin"
          "$python_bin" -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
          python_prefix="$("$python_bin" -c 'import sys; print(sys.prefix)')"
          python_lib="$python_prefix/lib"
          test -d "$python_lib"
          effective_ld_library_path="$python_lib"
          if [ -n "${LD_LIBRARY_PATH:-}" ]; then effective_ld_library_path="$python_lib:$LD_LIBRARY_PATH"; fi
          cmp "$SOURCE_ROOT/requirements.lock" "$state_root/requirements.lock"
          pip_wheel="$("$python_bin" - <<'PY'
          import ensurepip
          from pathlib import Path
          bundled = Path(ensurepip.__file__).resolve().parent / "_bundled"
          wheels = sorted(bundled.glob("pip-*.whl"))
          if not wheels:
              raise SystemExit("bundled pip wheel missing")
          print(wheels[-1].resolve())
          PY
          )"
          test -f "$pip_wheel"
          printf 'PYTHON_BIN=%s\n' "$python_bin" >> "$GITHUB_ENV"
          printf 'LD_LIBRARY_PATH=%s\n' "$effective_ld_library_path" >> "$GITHUB_ENV"
          printf 'PIP_WHEEL=%s\n' "$pip_wheel" >> "$GITHUB_ENV"
          printf 'PYTHONPATH=%s:%s:%s\n' "$pip_wheel" "$state_root/runtime-site" "$source_root" >> "$GITHUB_ENV"
          echo "multipair_discovery_state_recovered_from_external_path=PASS"

      - name: Enforce same physical runner and Bybit execution plane
        env:
          CURRENT_RUNNER_NAME: ${{ runner.name }}
        run: >-
          "$PYTHON_BIN" -c "assert '${{ runner.environment }}' == 'self-hosted'; assert '${{ runner.os }}' == 'Linux'; assert '$CURRENT_RUNNER_NAME' == '$EXPECTED_DISCOVERY_RUNNER_NAME'; print('multipair_requalification_execution_plane=self-hosted:nexus-bybit-network')"

      - name: Verify recovered isolated runtime dependency consistency
        run: '"$PYTHON_BIN" -m pip check'

      - name: Restore and independently verify fresh digest-pinned runtime snapshot
        run: |
          set -euo pipefail
          consume_now_ms="$("$PYTHON_BIN" -c 'import time; print(int(time.time() * 1000))')"
          cd "$SOURCE_ROOT"
          "$PYTHON_BIN" scripts/nexus_runtime_snapshot_artifact.py \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --artifact-name "$RUNTIME_SNAPSHOT_ARTIFACT" \
            --expected-sha256 "$RUNTIME_SNAPSHOT_ARCHIVE_SHA256" \
            --expected-source-sha "$GITHUB_SHA" \
            --expected-snapshot-digest "$EXPECTED_RUNTIME_SNAPSHOT_DIGEST" \
            --expected-as-of-ms "$EXPECTED_RUNTIME_SNAPSHOT_AS_OF_MS" \
            --now-ms "$consume_now_ms" \
            --destination "$STATE_ROOT/runtime-snapshot" \
            --work-root "$STATE_ROOT/runtime-snapshot-restore"
          printf 'RUNTIME_CONSUME_NOW_MS=%s\n' "$consume_now_ms" >> "$GITHUB_ENV"
          echo "multipair_runtime_snapshot_physical_restore=PASS"

      - name: Independently requalify exact Discovery proposals on transported fresh Bybit data
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          mkdir -p "$STATE_ROOT/requalification"
          if [ "$EXHAUSTION_REUSE" = "true" ]; then
            "$PYTHON_BIN" nexus_multipair_search_exhaustion.py bind-runtime \
              --reuse "$STATE_ROOT/exhaustion-reuse.json" \
              --runtime-snapshot "$STATE_ROOT/runtime-snapshot/snapshot-manifest.json" \
              --now-ms "$RUNTIME_CONSUME_NOW_MS" \
              --output "$STATE_ROOT/requalification/runtime-requalification.json" >/dev/null
            "$PYTHON_BIN" nexus_multipair_search_exhaustion.py verify-runtime \
              --evidence "$STATE_ROOT/requalification/runtime-requalification.json" >/dev/null
            "$PYTHON_BIN" - <<'PY'
          import json, os
          from pathlib import Path
          from nexus_multipair_runtime_requalification_snapshot import verify_fresh_runtime_snapshot
          from nexus_multipair_search_exhaustion import verify_fresh_no_work
          root = Path(os.environ["STATE_ROOT"])
          snapshot = json.loads((root / "runtime-snapshot" / "snapshot-manifest.json").read_text())
          result = json.loads((root / "requalification" / "runtime-requalification.json").read_text())
          fresh = verify_fresh_runtime_snapshot(
              root / "runtime-snapshot", snapshot,
              source_sha=os.environ["GITHUB_SHA"],
              now_ms=int(os.environ["RUNTIME_CONSUME_NOW_MS"]),
          )
          assert fresh["decision"] == "pass", fresh
          assert verify_fresh_no_work(result)["decision"] == "pass"
          assert result["runtime_snapshot_digest"] == snapshot["snapshot_digest"]
          assert result["runtime_snapshot_as_of_ms"] == snapshot["as_of_ms"]
          assert result["status"] == "NO_WORK"
          assert result["runtime_snapshot_freshness_verified"] is True
          assert result["live_trading_authority"] is False
          print("multipair_exhaustion_reuse_fresh_runtime_binding=PASS")
          PY
            exit 0
          fi
          "$PYTHON_BIN" nexus_multipair_runtime_requalification_snapshot.py requalify \
            --snapshot-root "$STATE_ROOT/runtime-snapshot" \
            --discovery "$STATE_ROOT/discovery/multipair_strategy_discovery.json" \
            --queue "$STATE_ROOT/discovery/research_proposals.json" \
            --source-sha "$GITHUB_SHA" \
            --state-root "$STATE_ROOT/requalification-state" \
            --output "$STATE_ROOT/requalification/runtime-requalification.json" \
            --now-ms "$RUNTIME_CONSUME_NOW_MS"
          "$PYTHON_BIN" - <<'PY'
          import json
          import os
          from pathlib import Path
          from nexus_multipair_runtime_requalification_snapshot import TRANSPORT_ORIGIN, verify_fresh_runtime_snapshot
          from nexus_multipair_strategy_proposal_requalification import verify_requalification
          root = Path(os.environ["STATE_ROOT"])
          result = json.loads((root / "requalification" / "runtime-requalification.json").read_text())
          runtime_snapshot = json.loads((root / "runtime-snapshot" / "snapshot-manifest.json").read_text())
          discovery = json.loads((root / "discovery" / "multipair_strategy_discovery.json").read_text())
          verification = verify_requalification(result)
          assert verification["decision"] == "pass", verification
          fresh = verify_fresh_runtime_snapshot(
              root / "runtime-snapshot",
              runtime_snapshot,
              source_sha=os.environ["GITHUB_SHA"],
              now_ms=int(os.environ["RUNTIME_CONSUME_NOW_MS"]),
          )
          assert fresh["decision"] == "pass", fresh
          assert runtime_snapshot["snapshot_digest"] == os.environ["EXPECTED_RUNTIME_SNAPSHOT_DIGEST"]
          assert runtime_snapshot["as_of_ms"] == int(os.environ["EXPECTED_RUNTIME_SNAPSHOT_AS_OF_MS"])
          assert runtime_snapshot["snapshot_digest"] != discovery["dataset_snapshot_sha256"]
          assert result["blocked_runtime_data_count"] == 0, result
          assert result["status"] in {"NO_WORK", "EVALUATED"}, result
          if result["status"] == "EVALUATED":
              assert result["qualified_for_review_count"] + result["rejected_count"] == result["proposal_count"]
          assert result["runtime_data_is_fresh_not_snapshot_reuse"] is True
          assert result["runtime_snapshot_distinct_from_discovery"] is True
          assert result["historical_discovery_snapshot_reused"] is False
          assert result["runtime_data_transport"] == TRANSPORT_ORIGIN
          assert result["runtime_snapshot_digest"] == runtime_snapshot["snapshot_digest"]
          assert result["runtime_snapshot_as_of_ms"] == runtime_snapshot["as_of_ms"]
          assert result["runtime_snapshot_history_limit"] == 240
          assert result["candidate_creation_authority"] is False
          assert result["promotion_authority"] is False
          assert result["research_only"] is True
          assert result["paper_only"] is True
          assert result["paper_execution_started"] is False
          assert result["live_trading_authority"] is False
          assert result["private_credentials_used"] is False
          assert result["automatic_strategy_promotion"] is False
          assert result["deterministic_risk_final_authority"] is True
          print(json.dumps({
              "status": result["status"],
              "proposal_count": result["proposal_count"],
              "qualified": result["qualified_for_review_count"],
              "rejected": result["rejected_count"],
              "runtime_snapshot_digest": result["runtime_snapshot_digest"],
              "digest": result["requalification_digest"],
          }, sort_keys=True))
          PY

      - name: Verify complete physical Discovery and fresh requalification path and package compact proof
        id: proof
        env:
          RUNNER_NAME_EVIDENCE: ${{ runner.name }}
          RUNNER_OS_EVIDENCE: ${{ runner.os }}
          RUNNER_ENVIRONMENT_EVIDENCE: ${{ runner.environment }}
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          "$PYTHON_BIN" - <<'PY'
          import json
          import os
          from pathlib import Path
          from nexus_multipair_archive_snapshot import verify_snapshot
          from nexus_multipair_runtime_requalification_snapshot import TRANSPORT_ORIGIN, verify_fresh_runtime_snapshot
          from nexus_multipair_search_exhaustion import verify_fresh_no_work, verify_neighborhood, verify_reuse_evidence
          from nexus_multipair_strategy_discovery import verify_discovery
          from nexus_multipair_strategy_proposal_requalification import verify_requalification
          from nexus_multipair_trusted_surface import FAMILIES, SYMBOLS, TIMEFRAMES

          root = Path(os.environ["STATE_ROOT"])
          source_sha = os.environ["GITHUB_SHA"]
          neighborhood = json.loads((root / "search-neighborhood.json").read_text())
          verify_neighborhood(neighborhood)
          assert neighborhood["source_sha"] == source_sha
          assert neighborhood["snapshot_digest"] == os.environ["EXPECTED_SNAPSHOT_DIGEST"]

          runtime_snapshot = json.loads((root / "runtime-snapshot" / "snapshot-manifest.json").read_text())
          fresh = verify_fresh_runtime_snapshot(
              root / "runtime-snapshot", runtime_snapshot,
              source_sha=source_sha,
              now_ms=int(os.environ["RUNTIME_CONSUME_NOW_MS"]),
          )
          assert fresh["decision"] == "pass", fresh
          assert runtime_snapshot["snapshot_digest"] == os.environ["EXPECTED_RUNTIME_SNAPSHOT_DIGEST"]
          assert runtime_snapshot["as_of_ms"] == int(os.environ["EXPECTED_RUNTIME_SNAPSHOT_AS_OF_MS"] )
          assert runtime_snapshot["source_sha"] == source_sha
          assert runtime_snapshot["symbols"] == list(SYMBOLS)
          assert runtime_snapshot["timeframes"] == list(TIMEFRAMES)
          assert runtime_snapshot["cell_count"] == 12
          assert runtime_snapshot["history_limit"] == 240
          assert runtime_snapshot["data_origin"] == "canonical_public_bybit_closed_candles"
          assert runtime_snapshot["snapshot_digest"] != neighborhood["snapshot_digest"]

          requalification = json.loads((root / "requalification" / "runtime-requalification.json").read_text())
          reused = os.environ["EXHAUSTION_REUSE"] == "true"
          if reused:
              reuse = json.loads((root / "exhaustion-reuse.json").read_text())
              assert verify_reuse_evidence(reuse)["decision"] == "pass"
              assert verify_fresh_no_work(requalification)["decision"] == "pass"
              assert reuse["source_sha"] == source_sha
              assert reuse["snapshot_digest"] == neighborhood["snapshot_digest"]
              assert requalification["historical_snapshot_digest"] == neighborhood["snapshot_digest"]
              historical = {
                  "snapshot_transport": "exact_exhaustion_certificate",
                  "snapshot_data_origin": reuse["snapshot_data_origin"],
                  "snapshot_runtime_freshness_claimed": reuse["snapshot_runtime_freshness_claimed"],
                  "snapshot_cell_count": reuse["snapshot_cell_count"],
                  "snapshot_history_limit": reuse["snapshot_history_limit"],
                  "snapshot_as_of_ms": reuse["snapshot_as_of_ms"],
                  "snapshot_digest": reuse["snapshot_digest"],
                  "discovery_digest": reuse["discovery_digest"],
                  "discovery_hypothesis_count": reuse["discovery_hypothesis_count"],
                  "base_research_proposal_count": 0,
                  "refinement_started": True,
                  "refinement_selection_basis": reuse["refinement_selection_basis"],
                  "locked_holdout_used_for_refinement": reuse["locked_holdout_used_for_refinement"],
                  "refinement_training_basis_digest": reuse["refinement_training_basis_digest"],
                  "refinement_targeted_cells": reuse["refinement_targeted_cells"],
                  "refinement_variant_counts": reuse["refinement_variant_counts"],
                  "effective_research_proposal_count": 0,
                  "research_proposal_count": 0,
                  "selection_policy": reuse["selection_policy"],
                  "multiplicity_policy": reuse["multiplicity_policy"],
                  "physical_discovery_skipped_exact_exhaustion": True,
                  "historical_discovery_result_reused_exact_exhaustion": True,
                  "runtime_requalification_skipped_no_proposals": True,
              }
          else:
              snapshot = json.loads((root / "snapshot" / "snapshot-manifest.json").read_text())
              discovery = json.loads((root / "discovery" / "multipair_strategy_discovery.json").read_text())
              base_discovery = json.loads((root / "base-discovery" / "multipair_strategy_discovery.json").read_text())
              refinement = json.loads((root / "refinement" / "refinement-plan.json").read_text())
              assert verify_snapshot(root / "snapshot", snapshot)["decision"] == "pass"
              assert verify_discovery(base_discovery)["decision"] == "pass"
              assert verify_discovery(discovery)["decision"] == "pass"
              assert verify_requalification(requalification)["decision"] == "pass"
              assert snapshot["source_sha"] == discovery["source_sha"] == requalification["source_sha"] == source_sha
              assert snapshot["snapshot_digest"] == neighborhood["snapshot_digest"]
              assert refinement["source_discovery_sha"] == source_sha
              assert refinement["source_discovery_digest"] == base_discovery["discovery_digest"]
              assert refinement["dataset_snapshot_sha256"] == snapshot["snapshot_digest"]
              assert refinement["base_research_proposal_count"] == base_discovery["research_proposal_count"]
              assert refinement["selection_basis"] == "training_only"
              assert refinement["locked_holdout_used_for_refinement"] is False
              assert refinement["research_only"] is True
              assert refinement["paper_only"] is True
              assert refinement["live_trading_authority"] is False
              assert refinement["private_credentials_used"] is False
              assert refinement["automatic_strategy_promotion"] is False
              assert refinement["automatic_paper_forward_started"] is False
              assert discovery["symbols"] == list(SYMBOLS)
              assert discovery["timeframes"] == list(TIMEFRAMES)
              assert discovery["families"] == list(FAMILIES)
              assert discovery["hypothesis_count"] == 9
              historical = {
                  "snapshot_transport": "digest_pinned_current_run_github_artifact",
                  "snapshot_data_origin": snapshot["data_origin"],
                  "snapshot_runtime_freshness_claimed": snapshot["runtime_freshness_claimed"],
                  "snapshot_cell_count": snapshot["cell_count"],
                  "snapshot_history_limit": snapshot["history_limit"],
                  "snapshot_as_of_ms": discovery["snapshot_as_of_ms"],
                  "snapshot_digest": snapshot["snapshot_digest"],
                  "discovery_digest": discovery["discovery_digest"],
                  "discovery_hypothesis_count": discovery["hypothesis_count"],
                  "base_research_proposal_count": base_discovery["research_proposal_count"],
                  "refinement_started": refinement["should_refine"],
                  "refinement_selection_basis": refinement["selection_basis"],
                  "locked_holdout_used_for_refinement": refinement["locked_holdout_used_for_refinement"],
                  "refinement_training_basis_digest": refinement["training_basis_digest"],
                  "refinement_targeted_cells": refinement["targeted_cells"],
                  "refinement_variant_counts": refinement["variant_counts"],
                  "effective_research_proposal_count": discovery["research_proposal_count"],
                  "research_proposal_count": discovery["research_proposal_count"],
                  "selection_policy": discovery["selection_policy"],
                  "multiplicity_policy": discovery["multiplicity_policy"],
                  "physical_discovery_skipped_exact_exhaustion": False,
                  "historical_discovery_result_reused_exact_exhaustion": False,
                  "runtime_requalification_skipped_no_proposals": False,
              }

          assert historical["snapshot_data_origin"] == "official_public_bybit_spot_trade_archive_aggregated"
          assert historical["snapshot_runtime_freshness_claimed"] is False
          assert historical["snapshot_cell_count"] == 12
          assert historical["snapshot_history_limit"] == 500
          assert historical["discovery_hypothesis_count"] == 9
          assert requalification["blocked_runtime_data_count"] == 0
          assert requalification["status"] in {"NO_WORK", "EVALUATED"}
          assert requalification["runtime_data_transport"] == TRANSPORT_ORIGIN
          assert requalification["runtime_snapshot_digest"] == runtime_snapshot["snapshot_digest"]
          assert requalification["runtime_snapshot_as_of_ms"] == runtime_snapshot["as_of_ms"]
          assert requalification["runtime_snapshot_distinct_from_discovery"] is True
          assert requalification["historical_discovery_snapshot_reused"] is False
          assert requalification["runtime_data_is_fresh_not_snapshot_reuse"] is True
          assert requalification["paper_execution_started"] is False
          assert requalification["automatic_strategy_promotion"] is False
          assert requalification["live_trading_authority"] is False
          assert requalification["private_credentials_used"] is False
          assert requalification["deterministic_risk_final_authority"] is True

          evidence = {
              "schema_version": "nexus.multipair-discovery-v2-physical-proof.v1",
              "source_sha": source_sha,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "physical_runner_name": os.environ["RUNNER_NAME_EVIDENCE"],
              "physical_runner_os": os.environ["RUNNER_OS_EVIDENCE"],
              "physical_runner_environment": os.environ["RUNNER_ENVIRONMENT_EVIDENCE"],
              "execution_plane": "nexus-bybit-network",
              "trusted_surface_source": "config/nexus-demo-strategy-matrix-v2.json",
              "symbols": list(SYMBOLS),
              "timeframes": list(TIMEFRAMES),
              "families": list(FAMILIES),
              "search_neighborhood_fingerprint": neighborhood["neighborhood_fingerprint"],
              **historical,
              "runtime_snapshot_transport": requalification["runtime_data_transport"],
              "runtime_snapshot_digest": runtime_snapshot["snapshot_digest"],
              "runtime_snapshot_as_of_ms": runtime_snapshot["as_of_ms"],
              "runtime_snapshot_history_limit": runtime_snapshot["history_limit"],
              "runtime_snapshot_data_origin": runtime_snapshot["data_origin"],
              "runtime_snapshot_distinct_from_discovery": requalification["runtime_snapshot_distinct_from_discovery"],
              "historical_discovery_snapshot_reused": requalification["historical_discovery_snapshot_reused"],
              "runtime_snapshot_freshness_verified": True,
              "requalification_digest": requalification["requalification_digest"],
              "requalification_status": requalification["status"],
              "qualified_for_review_count": requalification["qualified_for_review_count"],
              "rejected_count": requalification["rejected_count"],
              "blocked_runtime_data_count": requalification["blocked_runtime_data_count"],
              "runtime_data_is_fresh_not_snapshot_reuse": requalification["runtime_data_is_fresh_not_snapshot_reuse"],
              "zero_proposal_result_is_valid": True,
              "research_only": True,
              "paper_only": True,
              "paper_execution_started": False,
              "live_trading_authority": False,
              "private_credentials_used": False,
              "real_exchange_orders": False,
              "automatic_strategy_promotion": False,
              "deterministic_risk_final_authority": True,
              "state_storage": "physical_external_ephemeral_path",
              "state_isolated_from_issue_984": True,
              "issue_984_state_artifact_touched": False,
              "persistent_runtime_database_on_github": False,
              "legacy_btc_eth_discovery_archive_used": False,
          }
          if evidence["requalification_status"] == "EVALUATED":
              assert evidence["research_proposal_count"] > 0
              assert evidence["qualified_for_review_count"] + evidence["rejected_count"] == evidence["research_proposal_count"]
          else:
              assert evidence["research_proposal_count"] == 0
              assert evidence["qualified_for_review_count"] == 0
              assert evidence["rejected_count"] == 0
          target = root / "physical-discovery-v2-evidence.json"
          target.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(f"multipair_discovery_v2_proof_mode={'EXHAUSTION_REUSE' if reused else 'FULL_PHYSICAL'}")
          PY
          proof_file="$STATE_ROOT/physical-discovery-v2-evidence.json"
          proof_sha="$(sha256sum "$proof_file" | awk '{print $1}')"
          proof_b64="$(base64 -w 0 "$proof_file")"
          test "${#proof_b64}" -lt 60000
          echo "proof_sha256=$proof_sha" >> "$GITHUB_OUTPUT"
          echo "proof_b64=$proof_b64" >> "$GITHUB_OUTPUT"
          echo "multipair_discovery_v2_physical_verification=PASS"

      - name: Remove ephemeral physical Research state and source after proof capture
        if: always()
        run: |
          set -euo pipefail
          state_root="${STATE_ROOT:-$HOME/.local/share/nexus/multipair-discovery-v2/$GITHUB_RUN_ID}"
          source_root="${SOURCE_ROOT:-$HOME/.local/share/nexus/multipair-discovery-source/$GITHUB_RUN_ID}"
          case "$state_root" in
            "$HOME"/.local/share/nexus/multipair-discovery-v2/*) rm -rf "$state_root" ;;
            *) echo "::error::Refusing unsafe Research cleanup path."; exit 1 ;;
          esac
          case "$source_root" in
            "$HOME"/.local/share/nexus/multipair-discovery-source/*) rm -rf "$source_root" ;;
            *) echo "::error::Refusing unsafe retained Discovery source cleanup path."; exit 1 ;;
          esac

  persist-proof:
    if: ${{ always() && needs.requalify-physical.result == 'success' && needs.requalify-physical.outputs.proof_b64 != '' }}
    needs: requalify-physical
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROOF_B64: ${{ needs.requalify-physical.outputs.proof_b64 }}
      PROOF_SHA256: ${{ needs.requalify-physical.outputs.proof_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Rehydrate and independently enforce physical Discovery v2 proof
        run: |
          set -euo pipefail
          mkdir -p build/nexus-multipair-discovery-v2-proof
          printf '%s' "$PROOF_B64" | base64 --decode > build/nexus-multipair-discovery-v2-proof/evidence.json
          test "$(sha256sum build/nexus-multipair-discovery-v2-proof/evidence.json | awk '{print $1}')" = "$PROOF_SHA256"
          python - <<'PY'
          import json, re
          from pathlib import Path
          evidence = json.loads(Path("build/nexus-multipair-discovery-v2-proof/evidence.json").read_text())
          hex64 = re.compile(r"^[0-9a-f]{64}$")
          assert evidence["schema_version"] == "nexus.multipair-discovery-v2-physical-proof.v1"
          assert evidence["source_sha"] == "${{ github.sha }}"
          assert evidence["physical_runner_environment"] == "self-hosted"
          assert evidence["physical_runner_os"] == "Linux"
          assert evidence["execution_plane"] == "nexus-bybit-network"
          assert evidence["trusted_surface_source"] == "config/nexus-demo-strategy-matrix-v2.json"
          assert evidence["symbols"] == ["BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT"]
          assert evidence["timeframes"] == ["minute15", "hour1", "hour4"]
          assert evidence["families"] == ["momentum", "trend_breakout", "mean_reversion"]
          assert hex64.fullmatch(evidence["search_neighborhood_fingerprint"])
          assert evidence["snapshot_data_origin"] == "official_public_bybit_spot_trade_archive_aggregated"
          assert evidence["snapshot_runtime_freshness_claimed"] is False
          assert evidence["snapshot_cell_count"] == 12
          assert evidence["snapshot_history_limit"] == 500
          assert evidence["discovery_hypothesis_count"] == 9
          assert hex64.fullmatch(evidence["snapshot_digest"])
          assert hex64.fullmatch(evidence["discovery_digest"])
          assert hex64.fullmatch(evidence["refinement_training_basis_digest"])
          assert isinstance(evidence["refinement_targeted_cells"], list)
          assert len(evidence["refinement_targeted_cells"]) <= 9
          assert set(evidence["refinement_variant_counts"]) == {"momentum", "trend_breakout", "mean_reversion"}
          assert evidence["refinement_selection_basis"] == "training_only"
          assert evidence["locked_holdout_used_for_refinement"] is False
          assert evidence["effective_research_proposal_count"] == evidence["research_proposal_count"]
          assert evidence["runtime_snapshot_transport"] == "digest_pinned_physical_bybit_rest_snapshot"
          assert evidence["runtime_snapshot_data_origin"] == "canonical_public_bybit_closed_candles"
          assert evidence["runtime_snapshot_history_limit"] == 240
          assert evidence["runtime_snapshot_digest"] != evidence["snapshot_digest"]
          assert evidence["runtime_snapshot_distinct_from_discovery"] is True
          assert evidence["historical_discovery_snapshot_reused"] is False
          assert evidence["runtime_snapshot_freshness_verified"] is True
          assert evidence["blocked_runtime_data_count"] == 0
          assert evidence["requalification_status"] in {"NO_WORK", "EVALUATED"}
          assert evidence["runtime_data_is_fresh_not_snapshot_reuse"] is True
          assert evidence["zero_proposal_result_is_valid"] is True
          assert evidence["research_only"] is True
          assert evidence["paper_only"] is True
          assert evidence["paper_execution_started"] is False
          assert evidence["live_trading_authority"] is False
          assert evidence["private_credentials_used"] is False
          assert evidence["real_exchange_orders"] is False
          assert evidence["automatic_strategy_promotion"] is False
          assert evidence["deterministic_risk_final_authority"] is True
          assert evidence["state_storage"] == "physical_external_ephemeral_path"
          assert evidence["state_isolated_from_issue_984"] is True
          assert evidence["issue_984_state_artifact_touched"] is False
          assert evidence["persistent_runtime_database_on_github"] is False
          assert evidence["legacy_btc_eth_discovery_archive_used"] is False
          reused = evidence["physical_discovery_skipped_exact_exhaustion"]
          assert isinstance(reused, bool)
          if reused:
              assert evidence["snapshot_transport"] == "exact_exhaustion_certificate"
              assert evidence["historical_discovery_result_reused_exact_exhaustion"] is True
              assert evidence["runtime_requalification_skipped_no_proposals"] is True
              assert evidence["base_research_proposal_count"] == 0
              assert evidence["research_proposal_count"] == 0
              assert evidence["requalification_status"] == "NO_WORK"
          else:
              assert evidence["snapshot_transport"] == "digest_pinned_current_run_github_artifact"
              assert evidence["historical_discovery_result_reused_exact_exhaustion"] is False
              assert evidence["runtime_requalification_skipped_no_proposals"] is False
          if evidence["requalification_status"] == "EVALUATED":
              assert evidence["research_proposal_count"] > 0
              assert evidence["qualified_for_review_count"] + evidence["rejected_count"] == evidence["research_proposal_count"]
          else:
              assert evidence["research_proposal_count"] == 0
              assert evidence["qualified_for_review_count"] == 0
              assert evidence["rejected_count"] == 0
          print(f"hosted_multipair_discovery_v2_proof_verification=PASS reused={str(reused).lower()}")
          PY

      - name: Determine exact exhaustion certification eligibility
        id: exhaustion-decision
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          e = json.loads(Path("build/nexus-multipair-discovery-v2-proof/evidence.json").read_text())
          should = (
              e["physical_discovery_skipped_exact_exhaustion"] is False
              and e["base_research_proposal_count"] == 0
              and e["refinement_started"] is True
              and e["effective_research_proposal_count"] == 0
              and e["research_proposal_count"] == 0
              and e["requalification_status"] == "NO_WORK"
              and e["qualified_for_review_count"] == 0
              and e["rejected_count"] == 0
              and e["blocked_runtime_data_count"] == 0
          )
          print(f"should_certify={str(should).lower()}")
          PY

      - name: Certify exact exhausted Multi-Pair historical neighborhood
        if: steps.exhaustion-decision.outputs.should_certify == 'true'
        run: |
          set -euo pipefail
          snapshot_digest="$(python -c 'import json; print(json.load(open("build/nexus-multipair-discovery-v2-proof/evidence.json"))["snapshot_digest"])')"
          python nexus_multipair_search_exhaustion.py fingerprint \
            --manifest experiments/nexus_multipair_strategy_discovery_v2.json \
            --source-sha "$GITHUB_SHA" \
            --snapshot-digest "$snapshot_digest" \
            --root . \
            --output build/nexus-multipair-discovery-v2-proof/search-neighborhood.json >/dev/null
          python nexus_multipair_search_exhaustion.py certify \
            --neighborhood build/nexus-multipair-discovery-v2-proof/search-neighborhood.json \
            --proof build/nexus-multipair-discovery-v2-proof/evidence.json \
            --output build/nexus-multipair-discovery-v2-proof/exhaustion-certificate.json >/dev/null
          python nexus_multipair_search_exhaustion.py check \
            --neighborhood build/nexus-multipair-discovery-v2-proof/search-neighborhood.json \
            --certificate build/nexus-multipair-discovery-v2-proof/exhaustion-certificate.json \
            | python -c 'import json,sys; assert json.load(sys.stdin)["reusable"] is True'
          echo "multipair_search_exhaustion_certificate=PASS"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-multipair-discovery-v2-proof-${{ github.sha }}
          path: build/nexus-multipair-discovery-v2-proof/evidence.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Publish reusable exact Multi-Pair exhaustion certificate
        if: steps.exhaustion-decision.outputs.should_certify == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-multipair-search-exhaustion-${{ github.sha }}
          path: build/nexus-multipair-discovery-v2-proof/exhaustion-certificate.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
