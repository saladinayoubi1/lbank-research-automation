name: Collect Bybit Spot archive pilot

on:
  pull_request:
    paths:
      - ".github/workflows/bybit_spot_archive_collector.yml"
      - "bybit_spot_archive_collector.py"
      - "bybit_spot_archive_audit.py"
      - "run_bybit_spot_archive_audit.py"
      - "tests/test_bybit_spot_archive_collector.py"
      - "requirements.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Check dependency consistency
        run: python -m pip check

      - name: Collect three-day Bybit Spot pilot
        run: >-
          python bybit_spot_archive_collector.py
          --start-date 2026-07-30
          --end-date 2026-08-01
          --cache-root build/bybit_spot_archive_cache
          --output-root build/bybit_market
          --clean

      - name: Enforce pilot integrity gate
        run: >-
          python -c "import json, pathlib, sys;
          p=pathlib.Path('build/bybit_market/_collection_report.json');
          r=json.loads(p.read_text());
          sys.exit(0 if r['summary']['collector_ok'] else 1)"

      - name: Upload Bybit pilot dataset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bybit-spot-archive-pilot-${{ github.sha }}
          path: build/bybit_market
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
