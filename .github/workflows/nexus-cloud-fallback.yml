name: NEXUS Cloud Fallback

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  fallback-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install locked test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -d tests ] && [ ! -f requirements-dev.lock ]; then
            echo 'tests/ exists but requirements-dev.lock is missing; refusing an unpinned test environment' >&2
            exit 1
          fi
          if [ -f requirements-dev.lock ]; then
            python -m pip install -r requirements-dev.lock
          elif [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip check

      - name: Compile Python sources
        shell: bash
        run: |
          python - <<'PY'
          import compileall, re
          excluded = re.compile(r'(^|/)(\.git|\.venv|venv|node_modules)(/|$)')
          ok = compileall.compile_dir('.', quiet=1, rx=excluded)
          raise SystemExit(0 if ok else 1)
          PY

      - name: Run tests
        shell: bash
        run: |
          if [ -d tests ]; then python -m pytest -q; else echo 'No tests directory'; fi

      - name: Build fallback status
        if: always()
        shell: bash
        run: |
          mkdir -p fallback-status
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          data = {
              'mode': 'github-actions-cloud-fallback',
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'repository': os.getenv('GITHUB_REPOSITORY'),
              'sha': os.getenv('GITHUB_SHA'),
              'run_id': os.getenv('GITHUB_RUN_ID'),
              'note': 'Runs independently of the local laptop and provides a cloud-side health/test checkpoint.'
          }
          open('fallback-status/status.json','w',encoding='utf-8').write(json.dumps(data, indent=2))
          PY

      - name: Upload fallback checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-cloud-fallback-${{ github.run_id }}
          path: fallback-status/status.json
          retention-days: 14
