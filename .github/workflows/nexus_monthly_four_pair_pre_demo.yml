name: NEXUS 31-day four-pair pre-Demo backtests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "nexus_monthly_four_pair_pre_demo.py"
      - "tests/test_nexus_monthly_four_pair_pre_demo.py"
      - ".github/workflows/nexus_monthly_four_pair_pre_demo.yml"
      - "nexus_multitimeframe_strategy_discovery.py"
      - "nexus_multipair_trusted_surface.py"
      - "product_research_runtime.py"
      - "bybit_spot_backfill.py"
      - "bybit_spot_archive_collector.py"
      - "bybit_spot_archive_audit.py"
  push:
    branches: [main]
    paths:
      - "nexus_monthly_four_pair_pre_demo.py"
      - ".github/workflows/nexus_monthly_four_pair_pre_demo.yml"

permissions:
  contents: read

concurrency:
  group: nexus-monthly-pre-demo-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-dev.lock
          python -m pip check
      - name: Test complete one-month evidence and fail-closed checks
        run: python -m pytest -q tests/test_nexus_monthly_four_pair_pre_demo.py

  official-july-research:
    needs: regression
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify locked runtime
        run: |
          python -m pip install -r requirements.lock
          python -m pip check
      - name: Acquire full official Bybit July 2026 archives and run 36 pre-Demo research cells
        run: |
          python nexus_monthly_four_pair_pre_demo.py \
            --source-sha "$GITHUB_SHA" \
            --state-root "$RUNNER_TEMP/nexus-monthly-state" \
            --cache-root "$RUNNER_TEMP/nexus-monthly-cache" \
            --output-root build/nexus-monthly-pre-demo-results
      - name: Delete raw source archives and intermediate owner-ineligible data
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/nexus-monthly-state" "$RUNNER_TEMP/nexus-monthly-cache"
      - name: Verify strict 36-result no-Demo authority contract
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, os
          p = pathlib.Path("build/nexus-monthly-pre-demo-results/monthly-report.json")
          x = json.loads(p.read_text(encoding="utf-8"))
          assert x["source_sha"] == os.environ["GITHUB_SHA"]
          assert len(x["rows"]) == 36
          assert {z["symbol"] for z in x["rows"]} == {"BTCUSDT","ETHUSDT","SOLUSDT","XRPUSDT"}
          assert all(z["monthly_coverage"] is True for z in x["rows"])
          assert all(z["demo_promoted"] is False and z["live_enabled"] is False for z in x["rows"])
          assert x["automatic_paper_promotion"] is False and x["live_trading_authority"] is False
          assert len(x["archive_sources"]) == 4
          assert hashlib.sha256(p.read_bytes()).hexdigest()
          print("verified_four_pair_monthly_pre_demo_table=PASS")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-four-pair-july-monthly-pre-demo-table-${{ github.sha }}
          path: build/nexus-monthly-pre-demo-results/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
