name: Zotero Web API Sync

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: CSL JSON file to validate or upload
        required: true
        default: references/crypto-fx-library.json
      collection_key:
        description: Existing Zotero collection key (optional)
        required: false
      apply:
        description: Perform remote write after validation
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate unit tests
        run: python -m unittest tests.test_sync_zotero
      - name: Validate input only
        if: ${{ !inputs.apply }}
        run: python scripts/sync_zotero.py "${{ inputs.input_file }}"
      - name: Upload validated items
        if: ${{ inputs.apply }}
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_LIBRARY_ID: ${{ secrets.ZOTERO_LIBRARY_ID }}
        run: >-
          python scripts/sync_zotero.py "${{ inputs.input_file }}" --apply
          ${{ inputs.collection_key && format('--collection-key {0}', inputs.collection_key) || '' }}
