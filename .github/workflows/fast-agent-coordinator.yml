name: Fast Agent Coordinator

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/fast-agent-coordinator.yml'
      - '.github/workflows/nexus-runtime-worker.yml'
      - 'agent_manager.py'
      - 'agent_manager_runner.py'
      - 'agent_transport.py'
      - 'config/nexus-agent-manager.json'
      - 'scripts/agent_task_executor.py'
      - 'paper_schedule_watchdog.py'

permissions:
  contents: read
  actions: write

concurrency:
  group: fast-agent-coordinator
  cancel-in-progress: false

jobs:
  inspect-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      NEXUS_DEEPSEEK_PAID_ROUTING_ALLOWED: ${{ vars.NEXUS_DEEPSEEK_PAID_ROUTING_ALLOWED }}
    steps:
      - name: Release stale WSL recovery lock on explicit recovery commit
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[recover-wsl-runner-lock]')
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t stale_ids < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/345630835/runs?per_page=100" \
              --jq '[.workflow_runs[] | select(.status == "in_progress" or .status == "queued" or .status == "pending")] | sort_by(.created_at) | reverse | .[1:][] | .id'
          )
          for run_id in "${stale_ids[@]}"; do
            [ -z "$run_id" ] && continue
            echo "cancelling_stale_wsl_recovery_run=$run_id"
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" || true
          done

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Restore latest durable manager state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: data/agent_coordination
          key: nexus-agent-manager-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nexus-agent-manager-

      - name: Ingest completed worker results before stale-lease evaluation
        run: python agent_transport.py --mode poll --runtime data/agent_coordination/agent_manager_runtime.json --summary data/agent_coordination/manager_state.json --ref "${GITHUB_REF_NAME}"

      - name: Advance capability-aware mission DAG and five-minute triage
        run: python agent_manager_runner.py --config config/nexus-agent-manager.json

      - name: Dispatch newly leased tasks to their real transport
        run: python agent_transport.py --mode dispatch --runtime data/agent_coordination/agent_manager_runtime.json --summary data/agent_coordination/manager_state.json --ref "${GITHUB_REF_NAME}"

      - name: Inspect workflow states and retry only proven transient failures
        run: python fast_agent_orchestrator.py --once

      - name: Recover stale persistent Paper schedule without widening authority
        run: >-
          python paper_schedule_watchdog.py
          --stale-minutes 30
          --output data/agent_coordination/paper_schedule_watchdog.json

      - name: Export portable Mission Control snapshot
        if: always()
        run: >-
          python scripts/export_mission_control_snapshot.py
          --config config/nexus-agent-manager.json
          --runtime data/agent_coordination/agent_manager_runtime.json
          --summary data/agent_coordination/manager_state.json
          --events data/agent_coordination/manager_events.jsonl
          --output data/agent_coordination/nexus-mission-control-snapshot.json

      - name: Save durable manager state
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: data/agent_coordination
          key: nexus-agent-manager-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish coordinator and manager evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fast-agent-status-${{ github.run_id }}
          path: data/agent_coordination/
          if-no-files-found: warn
          retention-days: 14
