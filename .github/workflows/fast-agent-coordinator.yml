name: Fast Agent Coordinator

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: fast-agent-coordinator
  cancel-in-progress: false

jobs:
  inspect-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Advance capability-aware mission DAG
        run: python agent_manager.py --config config/nexus-agent-manager.json

      - name: Inspect workflow states and retry only proven transient failures
        run: python fast_agent_orchestrator.py --once

      - name: Publish coordinator and manager status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-agent-status-${{ github.run_id }}
          path: data/agent_coordination/
          if-no-files-found: warn
          retention-days: 7
