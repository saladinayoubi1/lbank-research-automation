name: Fast Agent Coordinator

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: fast-agent-coordinator
  cancel-in-progress: false

jobs:
  inspect-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Restore latest durable manager state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: data/agent_coordination
          key: nexus-agent-manager-${{ github.run_id }}
          restore-keys: |
            nexus-agent-manager-

      - name: Ingest completed worker results before stale-lease evaluation
        run: python agent_transport.py --mode poll --runtime data/agent_coordination/agent_manager_runtime.json --summary data/agent_coordination/manager_state.json --ref "${GITHUB_REF_NAME}"

      - name: Advance capability-aware mission DAG and five-minute triage
        run: python agent_manager_runner.py --config config/nexus-agent-manager.json

      - name: Dispatch newly leased tasks to their real transport
        run: python agent_transport.py --mode dispatch --runtime data/agent_coordination/agent_manager_runtime.json --summary data/agent_coordination/manager_state.json --ref "${GITHUB_REF_NAME}"

      - name: Inspect workflow states and retry only proven transient failures
        run: python fast_agent_orchestrator.py --once

      - name: Export portable Mission Control snapshot
        if: always()
        run: >-
          python scripts/export_mission_control_snapshot.py
          --config config/nexus-agent-manager.json
          --runtime data/agent_coordination/agent_manager_runtime.json
          --summary data/agent_coordination/manager_state.json
          --events data/agent_coordination/manager_events.jsonl
          --output data/agent_coordination/nexus-mission-control-snapshot.json

      - name: Save durable manager state
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: data/agent_coordination
          key: nexus-agent-manager-${{ github.run_id }}

      - name: Publish coordinator and manager evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fast-agent-status-${{ github.run_id }}
          path: data/agent_coordination/
          if-no-files-found: warn
          retention-days: 14
