name: Windows DR Keyless Evidence

on:
  push:
    branches: [main]
    paths:
      - 'create_project_backup.py'
      - 'scripts/disaster_recovery_gate.py'
      - 'scripts/windows_dr_keyless_exercise.py'
      - 'tests/test_windows_dr_keyless_exercise.py'
      - '.github/workflows/windows-dr-keyless.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  windows-dr-exercise:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Provision portable Python without machine changes
        shell: cmd
        run: |
          set "PYTHON_ZIP=%RUNNER_TEMP%\python-3.12.10-embed-amd64.zip"
          set "PYTHON_DIR=%RUNNER_TEMP%\nexus-python"
          if not exist "%PYTHON_DIR%\python.exe" mkdir "%PYTHON_DIR%"
          if not exist "%PYTHON_DIR%\python.exe" curl.exe --fail --location --silent --show-error "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip" --output "%PYTHON_ZIP%"
          if not exist "%PYTHON_DIR%\python.exe" powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "Expand-Archive -LiteralPath '%PYTHON_ZIP%' -DestinationPath '%PYTHON_DIR%' -Force"
          if not exist "%PYTHON_DIR%\python.exe" exit /b 1
          echo %GITHUB_WORKSPACE%>>"%PYTHON_DIR%\python312._pth"
          "%PYTHON_DIR%\python.exe" --version
          echo NEXUS_PYTHON=%PYTHON_DIR%\python.exe>>"%GITHUB_ENV%"
      - name: Run bounded Windows disaster-recovery exercise
        shell: cmd
        run: >-
          %NEXUS_PYTHON% scripts/windows_dr_keyless_exercise.py
          --output build\windows-dr-evidence
          --source-sha %GITHUB_SHA%
          --workflow-run-id %GITHUB_RUN_ID%
          --runner-name %RUNNER_NAME%
      - name: Revalidate generated evidence
        shell: cmd
        run: "%NEXUS_PYTHON% scripts/disaster_recovery_gate.py build\\windows-dr-evidence\\dr-evidence.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-dr-evidence
          path: build/windows-dr-evidence/dr-evidence-bundle.zip
          if-no-files-found: error
          retention-days: 30

  keyless-attestation:
    needs: windows-dr-exercise
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-dr-evidence
          path: dr-artifacts
      - name: Generate GitHub OIDC keyless attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dr-artifacts/dr-evidence-bundle.zip
