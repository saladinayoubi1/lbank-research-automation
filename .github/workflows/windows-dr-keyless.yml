name: Windows DR Keyless Evidence

on:
  push:
    branches: [main]
    paths:
      - 'create_project_backup.py'
      - 'scripts/disaster_recovery_gate.py'
      - 'scripts/windows_dr_keyless_exercise.py'
      - 'tests/test_windows_dr_keyless_exercise.py'
      - '.github/workflows/windows-dr-keyless.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  windows-dr-exercise:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Resolve preinstalled Python without machine changes
        shell: cmd
        run: |
          where py >nul 2>nul && (echo NEXUS_PYTHON=py -3>>"%GITHUB_ENV%" & py -3 --version & exit /b 0)
          where python >nul 2>nul && (echo NEXUS_PYTHON=python>>"%GITHUB_ENV%" & python --version & exit /b 0)
          echo Python 3 is required on the self-hosted runner.
          exit /b 1
      - name: Run bounded Windows disaster-recovery exercise
        shell: cmd
        run: >-
          %NEXUS_PYTHON% scripts/windows_dr_keyless_exercise.py
          --output build\windows-dr-evidence
          --source-sha %GITHUB_SHA%
          --workflow-run-id %GITHUB_RUN_ID%
          --runner-name %RUNNER_NAME%
      - name: Revalidate generated evidence
        shell: cmd
        run: %NEXUS_PYTHON% scripts/disaster_recovery_gate.py build\windows-dr-evidence\dr-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-dr-evidence
          path: build/windows-dr-evidence/dr-evidence-bundle.zip
          if-no-files-found: error
          retention-days: 30

  keyless-attestation:
    needs: windows-dr-exercise
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-dr-evidence
          path: dr-artifacts
      - name: Generate GitHub OIDC keyless attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dr-artifacts/dr-evidence-bundle.zip
