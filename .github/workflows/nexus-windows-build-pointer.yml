name: NEXUS Windows Build Pointer

on:
  workflow_run:
    workflows: ["Build NEXUS Desktop Windows"]
    types: [completed]

permissions:
  actions: read
  issues: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish exact-main Windows artifact pointer
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = 702;
            const expectedName = 'NEXUS_PERSONAL_PRO_FINAL_MISSION_CONTROL_WINDOWS_5_1_0';

            if (run.event !== 'push' || run.head_branch !== 'main' || run.conclusion !== 'success') {
              core.setFailed('Refusing to publish a non-successful, non-main, or non-push build.');
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(run.head_sha || '')) {
              core.setFailed('Workflow run head SHA is not an exact 40-character commit SHA.');
              return;
            }

            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: run.id, per_page: 100 }
            );
            const matches = artifacts.filter(a => a.name === expectedName && !a.expired);
            if (matches.length !== 1) {
              core.setFailed(`Expected exactly one non-expired ${expectedName} artifact; found ${matches.length}.`);
              return;
            }

            const artifact = matches[0];
            const marker = `<!-- nexus-windows-build:${run.head_sha} -->`;
            const artifactUrl = `https://github.com/${owner}/${repo}/actions/runs/${run.id}/artifacts/${artifact.id}`;
            const body = `${marker}\n## NEXUS exact-main Windows build\n\n` +
              `- state: **READY_FOR_PACKAGE_REVIEW**\n` +
              `- source SHA: \`${run.head_sha}\`\n` +
              `- workflow run: ${run.html_url}\n` +
              `- workflow run id: \`${run.id}\`\n` +
              `- artifact: \`${artifact.name}\`\n` +
              `- artifact id: \`${artifact.id}\`\n` +
              `- artifact size bytes: \`${artifact.size_in_bytes}\`\n` +
              `- artifact digest: \`${artifact.digest || 'unavailable'}\`\n` +
              `- artifact link: ${artifactUrl}\n\n` +
              `Scope: build-pointer evidence only. Physical laptop execution is **not** claimed by this comment.\n\n` +
              `Safety boundary: Research/Backtest/Paper only; no live trading, exchange credentials, withdrawals, production authority, signing, billing, runner registration, or task mutation.`;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(c => typeof c.body === 'string' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info(`Updated build pointer comment ${existing.id}.`);
            } else {
              const created = await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info(`Created build pointer comment ${created.data.id}.`);
            }
