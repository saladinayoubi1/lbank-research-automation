name: NEXUS Autonomous Research Feedback

# This augments the EXISTING rotating Research/Backtest workflows. It never
# dispatches executable AI code or changes Demo/Live/owner profile authority.
on:
  workflow_run:
    workflows:
      - "NEXUS multi-timeframe strategy discovery"
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Exact completed NEXUS multi-timeframe research run ID to inspect"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: nexus-autonomous-research-feedback
  cancel-in-progress: false

jobs:
  verified-research-feedback:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.inputs.source_run_id || github.event.workflow_run.id }}
      SOURCE_ARTIFACT: nexus-multitimeframe-search-exhaustion
      FRONTIER_ARTIFACT: nexus-research-frontier-state
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Install verified locked dependency set
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip check
      - name: Retrieve ONLY the exact triggering public research-run proof
        shell: bash
        run: |
          set -euo pipefail
          test "$RUN_ID" -ge 1
          mkdir -p build/research-feedback/input
          gh api -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
            > build/research-feedback/input/run.json

          artifact_id="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "nexus-multitimeframe-search-exhaustion" and (.expired == false))] | if length == 1 then .[0].id else empty end')"
          if [ -z "$artifact_id" ]; then
            echo "exact triggered run has no unique verified exhaustion evidence" >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            > build/research-feedback/exact-exhaustion.zip
          test "$(stat -c%s build/research-feedback/exact-exhaustion.zip)" -lt 1048576
          names="$(unzip -Z1 build/research-feedback/exact-exhaustion.zip)"
          test "$names" = "exhaustion-certificate.json"
          unzip -p build/research-feedback/exact-exhaustion.zip \
            exhaustion-certificate.json > build/research-feedback/input/exhaustion-certificate.json

      - name: Restore digest-bound feedback frontier from previous isolated workflow artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact_id="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$FRONTIER_ARTIFACT&per_page=100" \
            --jq '[.artifacts[] | select((.expired == false) and (.name == "nexus-research-frontier-state"))] | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -z "$artifact_id" ]; then
            echo "No previous verified frontier checkpoint; start fresh."
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            > build/research-feedback/frontier-prior.zip
          test "$(stat -c%s build/research-feedback/frontier-prior.zip)" -lt 2097152
          # Refuse duplicate, additional or path-traversal entries.
          names="$(unzip -Z1 build/research-feedback/frontier-prior.zip)"
          if ! printf '%s\n' "$names" | grep -qx 'frontier-state.json'; then
            echo "Existing frontier proof is incomplete" >&2
            exit 1
          fi
          unzip -p build/research-feedback/frontier-prior.zip frontier-state.json \
            > build/research-feedback/input/prior-state.json

      - name: Ingest verified exhaustion and nominate a DIFFERENT causal design
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ -f build/research-feedback/input/prior-state.json ]; then
            args+=(--prior-state build/research-feedback/input/prior-state.json)
          fi
          python nexus_strategy_research_feedback.py \
            --trigger-run build/research-feedback/input/run.json \
            --exhaustion-certificate build/research-feedback/input/exhaustion-certificate.json \
            --reviewed-mechanisms research/reviewed_composite_mechanisms_v1.json \
            "${args[@]}" \
            --output build/research-feedback/output

      - name: Upload durable RESEARCH-ONLY feedback, no strategy promotion
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-research-frontier-state
          path: build/research-feedback/output/
          if-no-files-found: error
          retention-days: 90
