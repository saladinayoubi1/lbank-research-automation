name: NEXUS Phase 3 Resource Activation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ema_walkforward_v1.py'
      - 'scripts/run_ema_walkforward_v1.py'
      - 'tests/test_ema_walkforward_v1.py'
      - 'breakout_robustness_v1.py'
      - 'scripts/run_breakout_robustness_v1.py'
      - 'tests/test_breakout_robustness_v1.py'
      - 'breakout_walkforward_v1.py'
      - 'scripts/run_breakout_walkforward_v1.py'
      - 'tests/test_breakout_walkforward_v1.py'
      - '.github/workflows/nexus_phase3_resource_activation.yml'
  push:
    branches: [main]
    paths:
      - 'config/nexus-mission-queue.json'
      - 'scripts/nexus_orchestrator.js'
      - 'scripts/nexus_phase3_worker.js'
      - 'scripts/nexus_ai_council.js'
      - 'scripts/test_nexus_ai_council.js'
      - 'scripts/deepseek_smoke.py'
      - 'scripts/run_ema_robustness_v1.py'
      - 'scripts/run_ema_walkforward_v1.py'
      - 'scripts/run_breakout_robustness_v1.py'
      - 'scripts/run_breakout_walkforward_v1.py'
      - 'ema_robustness_v1.py'
      - 'ema_walkforward_v1.py'
      - 'breakout_robustness_v1.py'
      - 'breakout_walkforward_v1.py'
      - 'deepseek_provider.py'
      - 'data/market/**'
      - '.github/workflows/nexus_phase3_resource_activation.yml'
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: nexus-phase3-resource-activation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cloud-agents-deepseek:
    name: Cloud agents and DeepSeek
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify orchestrator selection
        run: node scripts/nexus_orchestrator.js
      - name: Exercise AI council agents
        run: node scripts/test_nexus_ai_council.js
      - name: Exercise bounded DeepSeek provider when explicitly authorized
        env:
          NEXUS_DEEPSEEK_PAID_ROUTING_ALLOWED: ${{ vars.NEXUS_DEEPSEEK_PAID_ROUTING_ALLOWED }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          if [ "$NEXUS_DEEPSEEK_PAID_ROUTING_ALLOWED" != "1" ]; then
            echo 'DEEPSEEK_SKIPPED: paid routing is not explicitly authorized'
            exit 0
          fi
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo 'DEEPSEEK_UNVERIFIED: secret not available to this workflow'
            exit 0
          fi
          python scripts/deepseek_smoke.py
      - name: Emit cloud resource status without a second paid call
        env:
          NEXUS_DEEPSEEK_PAID_ROUTING_ALLOWED: '0'
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: node scripts/nexus_phase3_worker.js

  laptop-runner:
    name: Windows self-hosted laptop
    runs-on: [self-hosted, Windows]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify local Node toolchain
        shell: cmd
        run: node --version
      - name: Exercise orchestrator, AI council, and local runner
        shell: cmd
        env:
          NEXUS_DEEPSEEK_PAID_ROUTING_ALLOWED: '0'
        run: node scripts\nexus_phase3_worker.js
      - name: Bootstrap portable Python for Product/Research
        shell: cmd
        run: scripts\bootstrap_portable_python.cmd
      - name: Refresh market datasets and readiness status
        shell: cmd
        env:
          NEXUS_DEEPSEEK_PAID_ROUTING_ALLOWED: '0'
        run: python main.py
      - name: Execute real EMA robustness research on ready datasets
        shell: cmd
        env:
          NEXUS_DEEPSEEK_PAID_ROUTING_ALLOWED: '0'
        run: python scripts\run_ema_robustness_v1.py
      - name: Execute real EMA walk-forward research on ready datasets
        shell: cmd
        env:
          NEXUS_DEEPSEEK_PAID_ROUTING_ALLOWED: '0'
        run: python scripts\run_ema_walkforward_v1.py
      - name: Execute independent breakout robustness research on ready datasets
        shell: cmd
        env:
          NEXUS_DEEPSEEK_PAID_ROUTING_ALLOWED: '0'
        run: python scripts\run_breakout_robustness_v1.py
      - name: Execute breakout walk-forward validation on ready datasets
        shell: cmd
        env:
          NEXUS_DEEPSEEK_PAID_ROUTING_ALLOWED: '0'
        run: python scripts\run_breakout_walkforward_v1.py
      - name: Upload durable EMA research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ema-research-${{ github.run_id }}
          path: |
            build/research/ema_robustness_v1.json
            build/research/ema_walkforward_v1.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload durable breakout research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-breakout-research-${{ github.run_id }}
          path: |
            build/research/breakout_robustness_v1.json
            build/research/breakout_walkforward_v1.json
          if-no-files-found: warn
          retention-days: 14
