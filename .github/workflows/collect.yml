name: Collect LBank market data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: lbank-market-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect public market data
        run: python main.py

      - name: Repair bounded candle gaps
        id: gap_repair
        continue-on-error: true
        run: python gap_repair.py

      - name: Generate data readiness report
        run: python data_readiness.py

      - name: Commit data changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/market
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: update LBank public candles"
            git push
          fi

      - name: Report gap repair failure
        if: steps.gap_repair.outcome == 'failure'
        run: |
          echo "::error::Gap repair failed after collector data was committed."
          exit 1
