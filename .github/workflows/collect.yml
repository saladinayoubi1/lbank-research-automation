name: Collect LBank market data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: lbank-market-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Collect public market data
        run: python main.py

      - name: Repair bounded candle gaps
        id: gap_repair
        continue-on-error: true
        run: python gap_repair.py

      - name: Generate data readiness report
        run: python data_readiness.py

      - name: Generate dataset snapshot manifest
        run: python snapshot_manifest.py

      - name: Commit data changes to automation branch
        id: data_commit
        shell: bash
        env:
          DATA_BRANCH: automation/lbank-market-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/market
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
          else
            git commit -m "data: update LBank public candles"
            git fetch origin "$DATA_BRANCH:refs/remotes/origin/$DATA_BRANCH" || true
            git push --force-with-lease origin "HEAD:refs/heads/$DATA_BRANCH"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report data publication target
        if: steps.data_commit.outputs.changed == 'true'
        run: echo "Data update published to automation/lbank-market-data; main remains unchanged pending reviewed PR promotion."

      - name: Report gap repair failure
        if: steps.gap_repair.outcome == 'failure'
        run: |
          echo "::error::Gap repair failed; data changes remain isolated on the automation branch."
          exit 1
