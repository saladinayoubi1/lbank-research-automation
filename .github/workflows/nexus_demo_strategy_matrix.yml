      - "config/nexus-regime-strategy-policy-v1.json"
      - "requirements.txt"
      - "requirements.lock"
      - "product_web_server.py"
      - "product_ui/index.html"
      - "product_ui/product.js"
      - "android/lbank-mobile/**"
