      - "scripts/select_nexus_bybit_replay_artifact.py"
      - "scripts/build_nexus_bybit_replay_package.py"
      - "tests/test_mobile_delivery_surface.py"
      - ".github/workflows/build_lbank_mobile_apk.yml"
      - ".github/workflows/nexus_demo_regime_lifecycle_bridge.yml"
      - ".github/workflows/nexus_demo_strategy_matrix.yml"
      - ".github/workflows/nexus_bybit_replay_rehydrate.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: nexus-demo-strategy-matrix
  cancel-in-progress: false

jobs:
  contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip check
      - run: >-
          python -m pytest -q
          tests/test_nexus_demo_strategy_matrix.py
          tests/test_nexus_demo_archive_replay.py
          tests/test_nexus_demo_state_recovery.py
          tests/test_nexus_demo_strategy_matrix_runtime_dependencies.py
          tests/test_nexus_demo_paper_position_maintenance.py
          tests/test_nexus_demo_paper_lifecycle_persistence.py
          tests/test_nexus_demo_regime_cycle.py
          tests/test_nexus_strategy_paper_supervisor.py
          tests/test_nexus_strategy_paper_supervisor_matrix_symbol.py
          tests/test_nexus_paper_performance_pipeline.py
          tests/test_nexus_regime_paper_lane.py
          tests/test_nexus_regime_strategy_selector.py
          tests/test_product_demo_matrix_surface.py
          tests/test_nexus_bybit_replay_artifact_lifecycle.py

  matrix-cycle:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: contract-test
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      STATE_ARTIFACT: nexus-demo-strategy-matrix-state
      DATASET_FILE: BYBIT_full_history_2022-12-01_to_2026-07-31.zip
      DATASET_ARTIFACT_PREFIX: bybit-full-history-final-
      DATASET_SHA256: "5f1173467c2296201940c3b7786b7cc3e5442244e07289769ab4867ace41d668"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - name: Restore newest verified matrix state artifact
        run: |
          set -euo pipefail
          mkdir -p build/nexus_demo_strategy_matrix_state
          artifact_id="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$STATE_ARTIFACT&per_page=1" \
            --jq '.artifacts[0].id // empty')"
          if [ -n "$artifact_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > build/matrix-state.zip
            unzip -q build/matrix-state.zip -d build/nexus_demo_strategy_matrix_state
          fi
      - name: Restore verified immutable Bybit replay dataset
        run: |
          set -euo pipefail
          rm -rf build/nexus_demo_archive build/nexus_demo_delivery
          mkdir -p build/nexus_demo_archive build/nexus_demo_delivery
          python scripts/select_nexus_bybit_replay_artifact.py \
            --repository "$GITHUB_REPOSITORY" \
            --output-dir build/nexus_demo_delivery \
            --expected-file-name "$DATASET_FILE" \
            --expected-sha256 "$DATASET_SHA256" \
            --artifact-prefix "$DATASET_ARTIFACT_PREFIX"
          archive="build/nexus_demo_delivery/$DATASET_FILE"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$DATASET_SHA256"
          unzip -q "$archive" -d build/nexus_demo_archive
      - name: Quarantine incompatible bootstrap-only replay journals
        run: |
          set -euo pipefail
          python nexus_demo_state_recovery.py \
            --manifest config/nexus-demo-strategy-matrix-v1.json \
            --state-root build/nexus_demo_strategy_matrix_state \
            --replay-archive-root build/nexus_demo_archive \
            --archive-sha256 "$DATASET_SHA256"
      - name: Advance due Demo Paper cells and analyze results
        run: |
          set -euo pipefail
          python nexus_demo_strategy_matrix.py \
            --manifest config/nexus-demo-strategy-matrix-v1.json \
            --state-root build/nexus_demo_strategy_matrix_state \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --replay-archive-root build/nexus_demo_archive \
            --archive-sha256 "$DATASET_SHA256"
      - name: Enforce the 18-lane Paper-only Demo boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from nexus_demo_strategy_matrix import verify_snapshot

          snapshot = json.loads(Path(
              "build/nexus_demo_strategy_matrix_state/demo/strategy-matrix.json"
          ).read_text(encoding="utf-8"))
          assert verify_snapshot(snapshot)["decision"] == "pass"
          assert snapshot["expected_cell_count"] == 6
          assert snapshot["expected_lane_count"] == 18
          assert snapshot["paper_only"] is True
          assert snapshot["live_trading_authority"] is False
          assert snapshot["private_credentials_used"] is False
          assert snapshot["automatic_strategy_promotion"] is False
          assert snapshot["deterministic_risk_final_authority"] is True
          PY
      - name: Close risk-reducing Demo positions
        run: |
          set -euo pipefail
          python nexus_demo_paper_position_maintenance.py \
            --manifest config/nexus-demo-strategy-matrix-v1.json \
            --state-root build/nexus_demo_strategy_matrix_state \
            --source-sha "$GITHUB_SHA"
      - name: Enforce Paper maintenance cannot increase exposure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path(
              "build/nexus_demo_strategy_matrix_state/demo/paper-position-maintenance.json"
          ).read_text(encoding="utf-8"))
          assert result["cell_count"] == 6
          assert result["task_count"] == 18
          assert result["closed_count"] + result["held_count"] + result["flat_count"] == 18
          assert result["paper_only"] is True
          assert result["live_trading_authority"] is False
          assert result["private_credentials_used"] is False
          assert result["automatic_strategy_promotion"] is False
          assert result["exposure_increased"] is False
          assert all(row["exposure_increased"] is False for row in result["rows"])
          PY
      - name: Refresh journal-backed Paper lifecycle and performance
        run: |
          set -euo pipefail
          python nexus_demo_paper_performance_refresh.py \
            --manifest config/nexus-demo-strategy-matrix-v1.json \
            --state-root build/nexus_demo_strategy_matrix_state \
            --source-sha "$GITHUB_SHA"
      - name: Enforce Paper performance refresh authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path(
              "build/nexus_demo_strategy_matrix_state/demo/paper-performance-refresh.json"
          ).read_text(encoding="utf-8"))
          assert result["cell_count"] == 6
          assert result["paper_only"] is True
          assert result["live_trading_authority"] is False
          assert result["automatic_strategy_promotion"] is False
          PY
      - name: Run synchronized three-timeframe regime selection and isolated Paper
        run: |
          set -euo pipefail
          python nexus_demo_regime_cycle.py \
            --manifest config/nexus-demo-strategy-matrix-v1.json \
            --state-root build/nexus_demo_strategy_matrix_state \
            --source-sha "$GITHUB_SHA" \
            --replay-archive-root build/nexus_demo_archive \
            --archive-sha256 "$DATASET_SHA256" \
            --selector-policy config/nexus-regime-strategy-policy-v1.json
      - name: Enforce synchronized regime-cycle authority and evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from nexus_demo_regime_cycle import verify_cycle_snapshot

          snapshot = json.loads(Path(
              "build/nexus_demo_strategy_matrix_state/demo/regime-cycle.json"
          ).read_text(encoding="utf-8"))
          assert verify_cycle_snapshot(snapshot)["decision"] == "pass"
          assert snapshot["expected_cell_count"] == 6
          assert snapshot["verified_cell_count"] == 6
          assert snapshot["paper_only"] is True
          assert snapshot["live_trading_authority"] is False
          assert snapshot["private_credentials_used"] is False
          assert snapshot["automatic_strategy_promotion"] is False
          assert snapshot["deterministic_risk_final_authority"] is True
          assert snapshot["frozen_prospective_hour4_lane_mutated"] is False
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nexus-demo-strategy-matrix-state
          path: build/nexus_demo_strategy_matrix_state
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
