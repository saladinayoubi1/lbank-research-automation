      - "nexus_demo_state_recovery.py"
      - "nexus_demo_paper_position_maintenance.py"
      - "nexus_demo_paper_performance_refresh.py"
      - "nexus_demo_regime_cycle.py"
      - "nexus_demo_regime_lifecycle_bridge.py"
      - "nexus_isolated_product_runtime.py"
      - "nexus_regime_paper_lane.py"
      - "nexus_regime_strategy_selector.py"
      - "nexus_regime_strategy_runtime.py"
      - "nexus_regime_runtime_drift.py"
      - "cross_timeframe_context.py"
      - "data_intelligence.py"
      - "nexus_strategy_paper_supervisor.py"
      - "nexus_paper_performance_pipeline.py"
      - "nexus_paper_performance_drift.py"
      - "nexus_final_proof_mission.py"
      - "nexus_final_proof_assembler.py"
      - "docs/project_memory/STATE.json"
