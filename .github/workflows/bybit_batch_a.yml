name: Bybit history batch A

on:
  pull_request:
    paths:
      - ".github/workflows/bybit_batch_a.yml"
      - "bybit_spot_backfill.py"
      - "bybit_spot_archive_audit.py"
      - "bybit_spot_archive_collector.py"
      - "requirements.lock"

permissions:
  contents: read

jobs:
  chunk:
    name: chunk-${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { id: "01", start: "2024-06-01", end: "2024-06-30" }
          - { id: "02", start: "2024-07-01", end: "2024-07-31" }
          - { id: "03", start: "2024-08-01", end: "2024-08-31" }
          - { id: "04", start: "2024-09-01", end: "2024-09-30" }
          - { id: "05", start: "2024-10-01", end: "2024-10-31" }
          - { id: "06", start: "2024-11-01", end: "2024-11-30" }
          - { id: "07", start: "2024-12-01", end: "2024-12-31" }
          - { id: "08", start: "2025-01-01", end: "2025-01-31" }
          - { id: "09", start: "2025-02-01", end: "2025-02-28" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - name: Build verified month
        run: |
          success=false
          for attempt in 1 2 3; do
            rm -rf "build/chunk-${{ matrix.id }}"
            if python bybit_spot_backfill.py --start-date "${{ matrix.start }}" --end-date "${{ matrix.end }}" --state-root "build/chunk-${{ matrix.id }}" --cache-root "build/cache-${{ matrix.id }}" --max-archives-per-run 2 --clean; then
              success=true
              break
            fi
            sleep $((attempt * 15))
          done
          [ "$success" = "true" ] || exit 1
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads((Path(f"build/chunk-{os.environ['CHUNK_ID']}")/'_backfill_report.json').read_text())
          s=report['summary']
          ok=s['backfill_complete'] and s['completed_units']==1 and s['remaining_units']==0 and s['run_failures']==0 and s['current_dataset_integrity_ok'] and len(report['statuses'])==6 and all(x['integrity_ok'] for x in report['statuses'])
          raise SystemExit(0 if ok else 1)
          PY
        env:
          CHUNK_ID: ${{ matrix.id }}
      - uses: actions/upload-artifact@v4
        with:
          name: bybit-chunk-${{ matrix.id }}
          path: build/chunk-${{ matrix.id }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
