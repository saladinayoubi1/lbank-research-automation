name: Bybit history batch A

on:
  pull_request:
    paths:
      - ".github/workflows/bybit_batch_a.yml"

permissions:
  contents: read

jobs:
  chunk:
    name: chunk-${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { id: "01", start: "2024-06-01", end: "2024-06-30" }
          - { id: "02", start: "2024-07-01", end: "2024-07-31" }
          - { id: "03", start: "2024-08-01", end: "2024-08-31" }
          - { id: "05", start: "2024-10-01", end: "2024-10-31" }
          - { id: "06", start: "2024-11-01", end: "2024-11-30" }
          - { id: "07", start: "2024-12-01", end: "2024-12-31" }
          - { id: "08", start: "2025-01-01", end: "2025-01-31" }
          - { id: "09", start: "2025-02-01", end: "2025-02-28" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - name: Build verified month
        run: |
          state_root="build/chunk-${{ matrix.id }}"
          python bybit_spot_backfill.py --start-date "${{ matrix.start }}" --end-date "${{ matrix.end }}" --state-root "$state_root" --cache-root "build/cache-${{ matrix.id }}" --max-archives-per-run 2 --clean
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads((Path(f"build/chunk-{os.environ['CHUNK_ID']}")/'_backfill_report.json').read_text())
          s=report['summary']
          ok=s['backfill_complete'] and s['completed_units']==1 and s['remaining_units']==0 and s['run_failures']==0 and s['current_dataset_integrity_ok'] and len(report['statuses'])==6 and all(x['integrity_ok'] for x in report['statuses'])
          raise SystemExit(0 if ok else 1)
          PY
        env:
          CHUNK_ID: ${{ matrix.id }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: bybit-chunk-${{ matrix.id }}-attempt-${{ github.run_attempt }}
          path: build/chunk-${{ matrix.id }}
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9
