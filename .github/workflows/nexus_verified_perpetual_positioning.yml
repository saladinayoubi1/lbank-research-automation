name: NEXUS verified perpetual positioning research inputs

on:
  pull_request:
    paths:
      - "nexus_verified_perpetual_positioning.py"
      - "tests/test_nexus_verified_perpetual_positioning.py"
      - "tests/test_nexus_verified_perpetual_positioning_workflow.py"
      - "research/evidence/verified_perpetual_positioning_20260703_20260802.json"
      - ".github/workflows/nexus_verified_perpetual_positioning.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-test:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == github.repository_owner) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref_name == github.event.repository.default_branch)
    runs-on: [self-hosted, Windows, X64, nexus-research, nexus-worker-2]
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Prepare isolated Python
        shell: cmd
        run: |
          @echo off
          setlocal
          set "VENV=%RUNNER_TEMP%\nexus-positioning-%GITHUB_RUN_ID%"
          if exist "%VENV%" rmdir /s /q "%VENV%"
          python --version
          if errorlevel 1 exit /b %errorlevel%
          python -m venv "%VENV%"
          if errorlevel 1 exit /b %errorlevel%
          "%VENV%\Scripts\python.exe" -m pip install -r requirements-dev.lock
          if errorlevel 1 exit /b %errorlevel%
          >>"%GITHUB_PATH%" echo %VENV%\Scripts
          >>"%GITHUB_ENV%" echo NEXUS_POSITIONING_VENV=%VENV%

      - name: Check dependency consistency
        shell: cmd
        run: |
          @echo off
          python -m pip check
          if errorlevel 1 exit /b %errorlevel%

      - name: Run positioning capability contract tests
        shell: cmd
        run: |
          @echo off
          python -m pytest -q tests/test_nexus_verified_perpetual_positioning.py tests/test_nexus_verified_perpetual_positioning_workflow.py
          if errorlevel 1 exit /b %errorlevel%

      - name: Verify Research-plane positioning proof
        shell: cmd
        run: |
          @echo off
          python -c "import json; from pathlib import Path; from nexus_verified_perpetual_positioning import verify_proof; proof=json.loads(Path(r'research/evidence/verified_perpetual_positioning_20260703_20260802.json').read_text()); verify_proof(proof); assert proof['dataset_semantic_sha256'] == 'a59405c733ecc6cad5c9270155a22bab52173989cd62c9569cf37b06f844c6e6'; assert proof['oi_rows'] == {'BTCUSDT': 720, 'ETHUSDT': 720}; assert proof['funding_rows'] == {'BTCUSDT': 90, 'ETHUSDT': 90}; assert proof['credentials_used'] is False; assert proof['derivatives_execution_authority'] is False; assert proof['automatic_strategy_promotion'] is False; assert proof['live_trading_authority'] is False; print('committed_positioning_evidence=PASS')"
          if errorlevel 1 exit /b %errorlevel%

      - name: Build fresh public positioning proof
        shell: cmd
        run: |
          @echo off
          python nexus_verified_perpetual_positioning.py --start 2026-07-03T00:00:00Z --end-exclusive 2026-08-02T00:00:00Z --output-root build/perpetual-positioning-fresh
          if errorlevel 1 exit /b %errorlevel%

      - name: Compare fresh proof with committed evidence
        shell: cmd
        run: |
          @echo off
          python -c "import json; from pathlib import Path; from nexus_verified_perpetual_positioning import verify_proof; committed=json.loads(Path(r'research/evidence/verified_perpetual_positioning_20260703_20260802.json').read_text()); fresh=json.loads(Path(r'build/perpetual-positioning-fresh/_perpetual_positioning_proof.json').read_text()); verify_proof(committed); verify_proof(fresh); keys=('dataset_semantic_sha256','oi_rows','funding_rows','start_utc','end_exclusive_utc','oi_value_field','oi_methodology','credentials_used','derivatives_execution_authority','automatic_strategy_promotion','live_trading_authority'); mismatches=[key for key in keys if fresh[key] != committed[key]]; assert not mismatches, 'fresh positioning evidence mismatch: ' + ','.join(mismatches); print('fresh_positioning_evidence=PASS')"
          if errorlevel 1 exit /b %errorlevel%

      - name: Upload fresh source-bound positioning evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-verified-perpetual-positioning-${{ github.sha }}
          path: build/perpetual-positioning-fresh
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Clean isolated Python
        if: always()
        shell: cmd
        run: |
          @echo off
          if defined NEXUS_POSITIONING_VENV if exist "%NEXUS_POSITIONING_VENV%" rmdir /s /q "%NEXUS_POSITIONING_VENV%"
          exit /b 0
