name: NEXUS verified perpetual positioning research inputs

on:
  pull_request:
    paths:
      - "nexus_verified_perpetual_positioning.py"
      - "tests/test_nexus_verified_perpetual_positioning.py"
      - "tests/test_nexus_verified_perpetual_positioning_workflow.py"
      - "research/evidence/verified_perpetual_positioning_20260703_20260802.json"
      - ".github/workflows/nexus_verified_perpetual_positioning.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked test dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run positioning capability contract tests
        run: >-
          python -m pytest -q
          tests/test_nexus_verified_perpetual_positioning.py
          tests/test_nexus_verified_perpetual_positioning_workflow.py

      - name: Verify Research-plane positioning proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from nexus_verified_perpetual_positioning import verify_proof

          path = Path("research/evidence/verified_perpetual_positioning_20260703_20260802.json")
          proof = json.loads(path.read_text())
          verify_proof(proof)
          assert proof["dataset_semantic_sha256"] == "a59405c733ecc6cad5c9270155a22bab52173989cd62c9569cf37b06f844c6e6"
          assert proof["oi_rows"] == {"BTCUSDT": 720, "ETHUSDT": 720}
          assert proof["funding_rows"] == {"BTCUSDT": 90, "ETHUSDT": 90}
          assert proof["credentials_used"] is False
          assert proof["derivatives_execution_authority"] is False
          assert proof["automatic_strategy_promotion"] is False
          assert proof["live_trading_authority"] is False
          PY

      - name: Build fresh public positioning proof
        run: >-
          python nexus_verified_perpetual_positioning.py
          --start 2026-07-03T00:00:00Z
          --end-exclusive 2026-08-02T00:00:00Z
          --output-root build/perpetual-positioning-fresh

      - name: Compare fresh proof with committed evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from nexus_verified_perpetual_positioning import verify_proof

          committed = json.loads(Path(
              "research/evidence/verified_perpetual_positioning_20260703_20260802.json"
          ).read_text())
          fresh = json.loads(Path(
              "build/perpetual-positioning-fresh/_perpetual_positioning_proof.json"
          ).read_text())
          verify_proof(committed)
          verify_proof(fresh)
          for key in (
              "dataset_semantic_sha256",
              "oi_rows",
              "funding_rows",
              "start_utc",
              "end_exclusive_utc",
              "oi_value_field",
              "oi_methodology",
              "credentials_used",
              "derivatives_execution_authority",
              "automatic_strategy_promotion",
              "live_trading_authority",
          ):
              if fresh[key] != committed[key]:
                  raise SystemExit(
                      f"fresh positioning evidence mismatch for {key}: "
                      f"{fresh[key]!r} != {committed[key]!r}"
                  )
          print("fresh_positioning_evidence=PASS")
          PY

      - name: Upload fresh source-bound positioning evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-verified-perpetual-positioning-${{ github.sha }}
          path: build/perpetual-positioning-fresh
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
