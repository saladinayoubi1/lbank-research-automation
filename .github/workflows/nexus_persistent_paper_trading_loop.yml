name: NEXUS persistent Paper trading loop

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bybit_public_klines.py"
      - "nexus_persistent_paper_trading_loop.py"
      - "nexus_public_regime_cycle.py"
      - "nexus_regime_selected_position_rebalance.py"
      - "nexus_regime_selected_exposure_increase.py"
      - "nexus_strategy_discovery_health_trigger.py"
      - "nexus_demo_strategy_matrix.py"
      - "nexus_demo_paper_position_maintenance.py"
      - "nexus_demo_paper_performance_refresh.py"
      - "nexus_demo_regime_cycle.py"
      - "nexus_regime_paper_lane.py"
      - "nexus_regime_strategy_selector.py"
      - "nexus_regime_strategy_runtime.py"
      - "nexus_strategy_paper_supervisor.py"
      - "nexus_paper_performance_pipeline.py"
      - "scripts/nexus_strategy_discovery_controller.py"
      - "config/nexus-demo-strategy-matrix-v1.json"
      - "config/nexus-regime-strategy-policy-v1.json"
      - "research/strategy_family_catalog.json"
      - "tests/test_bybit_public_klines.py"
      - "tests/test_nexus_persistent_paper_trading_loop.py"
      - "tests/test_nexus_persistent_paper_trading_workflow.py"
      - "tests/test_nexus_regime_selected_position_rebalance.py"
      - "tests/test_nexus_regime_selected_exposure_increase.py"
      - "tests/test_nexus_strategy_discovery_health_trigger.py"
      - "tests/test_nexus_demo_paper_lifecycle_persistence.py"
      - "tests/test_nexus_paper_performance_pipeline.py"
      - ".github/workflows/nexus_persistent_paper_trading_loop.yml"
  pull_request:
    paths:
      - "bybit_public_klines.py"
      - "nexus_persistent_paper_trading_loop.py"
      - "nexus_public_regime_cycle.py"
      - "nexus_regime_selected_position_rebalance.py"
      - "nexus_regime_selected_exposure_increase.py"
      - "nexus_strategy_discovery_health_trigger.py"
      - "nexus_demo_strategy_matrix.py"
      - "nexus_demo_paper_position_maintenance.py"
      - "nexus_demo_paper_performance_refresh.py"
      - "nexus_demo_regime_cycle.py"
      - "nexus_regime_paper_lane.py"
      - "nexus_regime_strategy_selector.py"
      - "nexus_regime_strategy_runtime.py"
      - "nexus_strategy_paper_supervisor.py"
      - "nexus_paper_performance_pipeline.py"
      - "scripts/nexus_strategy_discovery_controller.py"
      - "config/nexus-demo-strategy-matrix-v1.json"
      - "config/nexus-regime-strategy-policy-v1.json"
      - "research/strategy_family_catalog.json"
      - "tests/test_bybit_public_klines.py"
      - "tests/test_nexus_persistent_paper_trading_loop.py"
      - "tests/test_nexus_persistent_paper_trading_workflow.py"
      - "tests/test_nexus_regime_selected_position_rebalance.py"
      - "tests/test_nexus_regime_selected_exposure_increase.py"
      - "tests/test_nexus_strategy_discovery_health_trigger.py"
      - "tests/test_nexus_demo_paper_lifecycle_persistence.py"
      - "tests/test_nexus_paper_performance_pipeline.py"
      - ".github/workflows/nexus_persistent_paper_trading_loop.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: nexus-persistent-paper-trading-loop-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  # A new exact-main push supersedes an older main runtime. Scheduled cycles
  # remain serial and never cancel one another.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip check
      - name: Verify persistent Trading Engine contracts
        run: >-
          python -m pytest -q
          tests/test_bybit_public_klines.py
          tests/test_nexus_persistent_paper_trading_loop.py
          tests/test_nexus_persistent_paper_trading_workflow.py
          tests/test_nexus_regime_selected_position_rebalance.py
          tests/test_nexus_regime_selected_exposure_increase.py
          tests/test_nexus_strategy_discovery_health_trigger.py
          tests/test_nexus_demo_strategy_matrix.py
          tests/test_nexus_demo_paper_position_maintenance.py
          tests/test_nexus_demo_paper_lifecycle_persistence.py
          tests/test_nexus_paper_performance_pipeline.py
          tests/test_nexus_demo_regime_cycle.py
          tests/test_nexus_regime_paper_lane.py
          tests/test_nexus_regime_strategy_selector.py
          tests/test_nexus_regime_strategy_runtime.py
          tests/test_nexus_strategy_paper_supervisor.py
          tests/test_nexus_strategy_discovery_controller.py

  paper-loop:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: contract-test
    runs-on: nexus-bybit-network
    timeout-minutes: 20
    outputs:
      state_archive_b64: ${{ steps.package.outputs.state_archive_b64 }}
      state_archive_sha256: ${{ steps.package.outputs.state_archive_sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      STATE_ARTIFACT: nexus-persistent-paper-trading-state
      STATE_ROOT: build/nexus_persistent_paper_trading_state
    steps:
      - name: Prepare exact repository and pre-provisioned Python 3.12 without JavaScript actions
        run: |
          set -euo pipefail
          repo_url="https://github.com/${GITHUB_REPOSITORY}.git"
          if [ -d .git ]; then
            git remote set-url origin "$repo_url"
            git reset --hard
            git clean -ffdx
          else
            find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
            git init .
            git remote add origin "$repo_url"
          fi
          git config --local --unset-all http.https://github.com/.extraheader || true
          git fetch --no-tags --prune --depth=1 origin "$GITHUB_SHA"
          git checkout --detach --force FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git clean -ffdx

          known_python="/opt/nexus-bybit-runner/_work/_tool/Python/3.12.14/x64/bin/python"
          python_bin=""
          if [ -x "$known_python" ]; then
            python_bin="$known_python"
          fi
          if [ -z "$python_bin" ]; then
            tool_root="${RUNNER_TOOL_CACHE:-/opt/nexus-bybit-runner/_work/_tool}"
            if [ "$(basename "$tool_root")" = "Python" ]; then
              python_root="$tool_root"
            else
              python_root="$tool_root/Python"
            fi
            python_bin="$(find "$python_root" -type f -path '*/3.12.*/x64/bin/python' 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [ -z "$python_bin" ]; then
            echo "::error::No pre-provisioned CPython 3.12 exists on the physical runner."
            exit 1
          fi
          "$python_bin" -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
          printf 'PYTHON_BIN=%s\n' "$python_bin" >> "$GITHUB_ENV"
          printf 'NATIVE_PREPARED=true\n' >> "$GITHUB_ENV"
          echo "physical_python_bin=$python_bin"
          echo "physical_checkout_sha=$(git rev-parse HEAD)"

      - name: Enforce eligible Bybit network execution plane
        run: >-
          "$PYTHON_BIN" -c "assert '${{ runner.environment }}' == 'self-hosted'; assert '${{ runner.os }}' == 'Linux'; import sys; assert sys.version_info[:2] == (3, 12); print('bybit_network_execution_plane=self-hosted:nexus-bybit-network')"
      - run: '"$PYTHON_BIN" -m pip install -r requirements.lock'
      - run: '"$PYTHON_BIN" -m pip check'
      - name: Restore newest persistent Paper state
        run: |
          set -euo pipefail
          rm -rf "$STATE_ROOT" build/persistent-state.zip
          mkdir -p "$STATE_ROOT"
          "$PYTHON_BIN" - <<'PY'
          import json
          import os
          import shutil
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          from pathlib import Path

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          artifact_name = os.environ["STATE_ARTIFACT"]
          state_root = Path(os.environ["STATE_ROOT"])
          archive_path = Path("build/persistent-state.zip")
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "nexus-persistent-paper-loop",
          }
          query = urllib.parse.urlencode({"name": artifact_name, "per_page": 1})
          list_url = f"https://api.github.com/repos/{repo}/actions/artifacts?{query}"
          with urllib.request.urlopen(
              urllib.request.Request(list_url, headers=headers), timeout=60
          ) as response:
              payload = json.load(response)
          artifacts = payload.get("artifacts") or []
          if artifacts:
              artifact_id = int(artifacts[0]["id"])
              download_url = f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}/zip"
              opener = urllib.request.build_opener(NoRedirect)
              try:
                  with opener.open(
                      urllib.request.Request(download_url, headers=headers), timeout=60
                  ) as response, archive_path.open("wb") as output:
                      if response.status != 200:
                          raise RuntimeError(f"unexpected artifact response: {response.status}")
                      shutil.copyfileobj(response, output)
              except urllib.error.HTTPError as exc:
                  if exc.code not in (301, 302, 303, 307, 308):
                      raise
                  location = exc.headers.get("Location")
                  if not location:
                      raise RuntimeError("artifact redirect missing Location") from exc
                  parsed = urllib.parse.urlparse(location)
                  if parsed.scheme != "https" or not parsed.hostname:
                      raise RuntimeError("artifact redirect must be absolute HTTPS") from exc
                  # The signed redirect URL is a different trust boundary. Never
                  # forward the GitHub bearer token to the object-storage host.
                  storage_request = urllib.request.Request(
                      location,
                      headers={"User-Agent": "nexus-persistent-paper-loop"},
                  )
                  with urllib.request.urlopen(storage_request, timeout=120) as response, archive_path.open("wb") as output:
                      shutil.copyfileobj(response, output)
              root = state_root.resolve()
              with zipfile.ZipFile(archive_path) as archive:
                  for member in archive.infolist():
                      target = (state_root / member.filename).resolve()
                      if target != root and root not in target.parents:
                          raise RuntimeError(f"unsafe artifact path: {member.filename}")
                  archive.extractall(state_root)
              print(f"restored_paper_state_artifact_id={artifact_id}")
          else:
              print("restored_paper_state_artifact_id=none")
          PY
      - name: Advance public closed-candle Paper portfolio loop
        run: |
          set -euo pipefail
          "$PYTHON_BIN" nexus_persistent_paper_trading_loop.py \
            --repo-root . \
            --state-root "$STATE_ROOT" \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID"
      - name: Independently enforce Paper authority and mission truth
        run: |
          set -euo pipefail
          "$PYTHON_BIN" - <<'PY'
          import json
          from pathlib import Path
          from nexus_persistent_paper_trading_loop import verify_loop_snapshot

          root = Path("build/nexus_persistent_paper_trading_state")
          snapshot = json.loads(
              (root / "demo" / "persistent-paper-trading-loop.json").read_text(encoding="utf-8")
          )
          verification = verify_loop_snapshot(snapshot)
          assert verification["decision"] == "pass", verification
          assert snapshot["data_mode"] == "public_bybit_closed_candles"
          assert snapshot["expected_cell_count"] == 6
          assert snapshot["expected_lane_count"] == 18
          assert snapshot["paper_only"] is True
          assert snapshot["live_trading_authority"] is False
          assert snapshot["private_credentials_used"] is False
          assert snapshot["automatic_strategy_promotion"] is False
          assert snapshot["deterministic_risk_final_authority"] is True
          assert snapshot["trading_engine_complete"] is False
          assert isinstance(snapshot["regime_selected_rebalance_operational"], bool)
          assert isinstance(snapshot["regime_selected_exposure_increase_operational"], bool)
          assert isinstance(snapshot["performance_health_feedback_operational"], bool)
          assert isinstance(snapshot["strategy_discovery_health_trigger_requested"], bool)
          print(json.dumps({
              "status": snapshot["status"],
              "fresh_cells": snapshot["fresh_cell_count"],
              "regime_status": snapshot["regime_status"],
              "rebalance_operational": snapshot["regime_selected_rebalance_operational"],
              "performance_health_feedback_operational": snapshot["performance_health_feedback_operational"],
              "research_required": snapshot["strategy_research_required"],
              "health_trigger_requested": snapshot["strategy_discovery_health_trigger_requested"],
              "remaining_core_gap": snapshot["remaining_core_gap"],
              "loop_digest": snapshot["loop_digest"],
          }, sort_keys=True))
          PY
      - name: Package Paper state for hosted artifact persistence
        id: package
        if: always()
        run: |
          set -euo pipefail
          if [ "${NATIVE_PREPARED:-false}" != "true" ] || [ ! -d "$STATE_ROOT" ]; then
            echo "state_archive_b64=" >> "$GITHUB_OUTPUT"
            echo "state_archive_sha256=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          "$PYTHON_BIN" - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          root = Path(os.environ["STATE_ROOT"])
          output = Path("build/persistent-state-handoff.zip")
          output.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(
              output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9
          ) as archive:
              for path in sorted(root.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(root).as_posix())
          print(f"state_handoff_zip_bytes={output.stat().st_size}")
          PY
          state_sha="$(sha256sum build/persistent-state-handoff.zip | awk '{print $1}')"
          state_b64="$(base64 -w 0 build/persistent-state-handoff.zip)"
          state_b64_bytes="${#state_b64}"
          if [ "$state_b64_bytes" -gt 450000 ]; then
            echo "::error::Packed Paper state exceeds bounded job-output handoff."
            exit 1
          fi
          {
            echo "state_archive_b64<<__NEXUS_STATE__"
            printf '%s\n' "$state_b64"
            echo "__NEXUS_STATE__"
            echo "state_archive_sha256=$state_sha"
          } >> "$GITHUB_OUTPUT"
          echo "state_handoff_base64_bytes=$state_b64_bytes"

  persist-state:
    if: ${{ always() && needs.paper-loop.outputs.state_archive_b64 != '' }}
    needs: paper-loop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STATE_ARCHIVE_B64: ${{ needs.paper-loop.outputs.state_archive_b64 }}
      STATE_ARCHIVE_SHA256: ${{ needs.paper-loop.outputs.state_archive_sha256 }}
      STATE_ROOT: build/nexus_persistent_paper_trading_state
    steps:
      - name: Rehydrate physical Paper state handoff
        run: |
          set -euo pipefail
          rm -rf "$STATE_ROOT" build/persistent-state-handoff.zip
          mkdir -p "$STATE_ROOT"
          printf '%s' "$STATE_ARCHIVE_B64" | base64 --decode > build/persistent-state-handoff.zip
          actual_sha="$(sha256sum build/persistent-state-handoff.zip | awk '{print $1}')"
          test "$actual_sha" = "$STATE_ARCHIVE_SHA256"
          python - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          state_root = Path(os.environ["STATE_ROOT"])
          archive_path = Path("build/persistent-state-handoff.zip")
          root = state_root.resolve()
          with zipfile.ZipFile(archive_path) as archive:
              for member in archive.infolist():
                  target = (state_root / member.filename).resolve()
                  if target != root and root not in target.parents:
                      raise RuntimeError(f"unsafe state handoff path: {member.filename}")
              archive.extractall(state_root)
          print("hosted_state_handoff_verification=PASS")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nexus-persistent-paper-trading-state
          path: build/nexus_persistent_paper_trading_state
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
