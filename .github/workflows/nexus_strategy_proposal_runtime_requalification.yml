name: NEXUS strategy proposal runtime requalification

on:
  workflow_run:
    workflows: ["NEXUS multi-timeframe strategy discovery"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nexus_strategy_proposal_runtime_requalification.py"
      - "nexus_multitimeframe_strategy_discovery.py"
      - "tests/test_nexus_strategy_proposal_runtime_requalification.py"
      - ".github/workflows/nexus_strategy_proposal_runtime_requalification.yml"
  pull_request:
    paths:
      - "nexus_strategy_proposal_runtime_requalification.py"
      - "nexus_multitimeframe_strategy_discovery.py"
      - "tests/test_nexus_strategy_proposal_runtime_requalification.py"
      - ".github/workflows/nexus_strategy_proposal_runtime_requalification.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: nexus-strategy-proposal-runtime-requalification-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: false

jobs:
  contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip check
      - name: Verify independent runtime requalification contracts
        run: >-
          python -m pytest -q
          tests/test_nexus_strategy_proposal_runtime_requalification.py
          tests/test_nexus_multitimeframe_strategy_discovery.py

  runtime-requalification:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    needs: contract-test
    runs-on: ${{ vars.NEXUS_BYBIT_NETWORK_RUNNER_ENABLED == '1' && 'nexus-bybit-network' || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
      TRIGGER_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      OUTPUT_ROOT: build/nexus_strategy_proposal_runtime_requalification
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Enforce eligible Bybit network execution plane
        if: vars.NEXUS_BYBIT_NETWORK_RUNNER_ENABLED == '1'
        run: >-
          python -c "assert '${{ runner.environment }}' == 'self-hosted'; assert '${{ runner.os }}' == 'Linux'; print('bybit_network_execution_plane=self-hosted:nexus-bybit-network')"
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - name: Restore exact triggering discovery evidence
        run: |
          set -euo pipefail
          rm -rf build/discovery-trigger "$OUTPUT_ROOT" build/discovery-trigger.zip
          mkdir -p build/discovery-trigger "$OUTPUT_ROOT"
          artifact_name="nexus-multitimeframe-strategy-discovery-$TRIGGER_RUN_ID"
          artifact_id="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$TRIGGER_RUN_ID/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name == \"$artifact_name\") | .id" \
            | head -n 1)"
          test -n "$artifact_id"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            > build/discovery-trigger.zip
          unzip -q build/discovery-trigger.zip -d build/discovery-trigger
          discovery="$(find build/discovery-trigger -type f -name multitimeframe_strategy_discovery.json -print -quit)"
          queue="$(find build/discovery-trigger -type f -name research_proposals.json -print -quit)"
          test -n "$discovery"
          test -n "$queue"
          printf '%s\n' "$discovery" > build/discovery-path.txt
          printf '%s\n' "$queue" > build/queue-path.txt
      - name: Requalify proposals on canonical public runtime data
        run: |
          set -euo pipefail
          python nexus_strategy_proposal_runtime_requalification.py \
            --discovery "$(cat build/discovery-path.txt)" \
            --queue "$(cat build/queue-path.txt)" \
            --source-sha "$TRIGGER_SOURCE_SHA" \
            --discovery-source-sha "$TRIGGER_SOURCE_SHA" \
            --state-root "$OUTPUT_ROOT/state" \
            --output "$OUTPUT_ROOT/runtime-requalification.json"
      - name: Verify fail-closed authority boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from nexus_strategy_proposal_runtime_requalification import verify_requalification
          path = Path("build/nexus_strategy_proposal_runtime_requalification/runtime-requalification.json")
          result = json.loads(path.read_text())
          verification = verify_requalification(result)
          assert verification["decision"] == "pass", verification
          assert result["source_sha"] == result["discovery_source_sha"]
          assert result["research_only"] is True
          assert result["paper_only"] is True
          assert result["paper_execution_started"] is False
          assert result["live_trading_authority"] is False
          assert result["private_credentials_used"] is False
          assert result["automatic_strategy_promotion"] is False
          assert result["deterministic_risk_final_authority"] is True
          print(json.dumps({
              "status": result["status"],
              "proposal_count": result["proposal_count"],
              "qualified_for_review_count": result["qualified_for_review_count"],
              "digest": result["requalification_digest"],
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-strategy-proposal-runtime-requalification-${{ github.run_id }}
          path: build/nexus_strategy_proposal_runtime_requalification
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
