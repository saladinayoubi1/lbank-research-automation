name: Disaster Recovery Readiness

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'scripts/disaster_recovery_gate.py'
      - 'tests/test_disaster_recovery_gate.py'
      - 'tests/test_recovery_workflow_triggers.py'
      - '.github/workflows/disaster-recovery-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run disaster recovery gate tests
        run: python -m unittest tests.test_disaster_recovery_gate -v
