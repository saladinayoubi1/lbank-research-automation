name: NEXUS Runtime Worker

on:
  workflow_dispatch:
    inputs:
      payload_b64:
        description: Optional bounded Agent Manager task envelope
        required: false
        default: ''
        type: string
      lease_id:
        description: Optional Agent Manager lease identity
        required: false
        default: ''
        type: string
      transport:
        description: Optional bounded task transport
        required: false
        default: ''
        type: choice
        options:
          - ''
          - github-cloud
          - deepseek
          - windows
  schedule:
    - cron: '7 * * * *'
  pull_request:
    paths:
      - 'scripts/nexus_runtime_worker.js'
      - 'scripts/nexus_orchestrator.js'
      - 'scripts/nexus_local_worker.py'
      - 'nexus_autonomous_orchestrator.py'
      - 'agent_transport.py'
      - 'nexus_strategy_independent_qa.py'
      - 'tests/test_nexus_strategy_independent_qa.py'
      - 'scripts/agent_task_executor.py'
      - 'scripts/bootstrap_portable_python.cmd'
      - 'tests/test_agent_transport.py'
      - 'scripts/nexus_research_qa_source_pin.py'
      - 'tests/test_nexus_research_qa_source_pin.py'
      - 'tests/test_phase3_windows_runtime_contract.py'
      - 'tests/test_nexus_local_runner_bootstrap_policy.py'
      - 'tests/test_nexus_autonomous_orchestrator.py'
      - 'config/nexus-mission-queue.json'
      - 'ai_room.py'
      - 'mission_runner.py'
      - 'web_ui_server.py'
      - 'web_ui/ai_room.js'
      - 'gate20_ai_room_evidence.py'
      - 'gate20_evidence_security.py'
      - 'phase4_e2e.py'
      - 'scripts/phase4_gate20_evidence.py'
      - 'tests/test_ai_room.py'
      - 'tests/test_ai_room_gateway.py'
      - 'tests/test_mission_runner.py'
      - 'tests/test_gate20_evidence_security_adversarial.py'
      - 'tests/test_phase4_gate20_e2e.py'
      - 'tests/test_phase4_postclose_security.py'
      - 'phase5_data_binding.py'
      - 'phase5_strategy_factory.py'
      - 'phase5_shadow_migration.py'
      - 'phase5_gate9_e2e.py'
      - 'scripts/phase5_gate9_evidence.py'
      - 'tests/test_phase5_*.py'
      - '.github/workflows/nexus-runtime-worker.yml'

permissions:
  contents: read

concurrency:
  group: nexus-runtime-worker-${{ github.event.inputs.lease_id || github.ref }}
  cancel-in-progress: true

env:
  RESULT_PATH: build/agent-result/result.json

jobs:
  preflight:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (github.ref_name == github.event.repository.default_branch &&
       (github.actor == github.repository_owner ||
        (github.actor == 'github-actions[bot]' &&
         github.event.inputs.payload_b64 != '' &&
         github.event.inputs.lease_id != '' &&
         github.event.inputs.transport != '')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXUS_DEEPSEEK_PAID_ROUTING_ALLOWED: ${{ vars.NEXUS_DEEPSEEK_PAID_ROUTING_ALLOWED }}
      NEXUS_DEEPSEEK_SMOKE: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
      - name: Validate orchestrator
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.payload_b64 == ''
        run: node scripts/nexus_orchestrator.js
      - name: Validate AI council
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.payload_b64 == ''
        run: node scripts/nexus_ai_council.js
      - name: Validate runtime worker once
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.payload_b64 == ''
        env:
          NEXUS_DEEPSEEK_PAID_ROUTING_ALLOWED: '0'
        run: node scripts/nexus_runtime_worker.js --once
      - name: Validate and pin original main ancestor for Research QA only
        id: pin-research-qa
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.payload_b64 != '' && github.event.inputs.transport == 'github-cloud'
        shell: bash
        env:
          NEXUS_TASK_PAYLOAD_B64: ${{ github.event.inputs.payload_b64 }}
          NEXUS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          NEXUS_DISPATCH_LEASE: ${{ github.event.inputs.lease_id }}
          NEXUS_DISPATCH_TRANSPORT: ${{ github.event.inputs.transport }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source_sha="$(python -m scripts.nexus_research_qa_source_pin)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          if [ "$source_sha" != "$GITHUB_SHA" ]; then
            test "$GITHUB_REF_NAME" = "main"
            origin="$(git remote get-url origin)"
            case "$origin" in
              "https://github.com/$GITHUB_REPOSITORY"|"https://github.com/$GITHUB_REPOSITORY.git") ;;
              *) echo "::error::Untrusted Research source origin"; exit 1 ;;
            esac
            git fetch --no-tags --deepen=80 origin main
            git cat-file -e "$source_sha^{commit}"
            git merge-base --is-ancestor "$source_sha" "$GITHUB_SHA"
            git checkout --detach "$source_sha"
            test "$(git rev-parse HEAD)" = "$source_sha"
            PINNED_ORIGINAL_SHA="$source_sha" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          core = {
              "schema": "nexus.original-source-research-qa-ancestry.v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "trusted_main_event_sha": os.environ["GITHUB_SHA"],
              "verified_main_ancestor_sha": os.environ["PINNED_ORIGINAL_SHA"],
              "original_source_checkout_verified": True,
              "independent_research_qa_only": True,
              "auto_demo_promotion": False,
              "live_enabled": False,
          }
          raw = json.dumps(core, sort_keys=True, separators=(",", ":")).encode()
          record = dict(core, attestation_sha256=hashlib.sha256(raw).hexdigest())
          out = Path("build/pinned-qa-attestation.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(record, sort_keys=True) + "\n")
          print("pinned_ancestor_research_QA=PASS digest=" + record["attestation_sha256"])
          PY
            echo "qa_pin_verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "qa_pin_verified=not_required" >> "$GITHUB_OUTPUT"
          fi
      - name: Install locked Python test dependencies for bounded cloud task
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.payload_b64 != '' && github.event.inputs.transport == 'github-cloud'
        shell: bash
        run: |
          python --version
          python -m pip install -r requirements-dev.lock
          python -m pip check
      - name: Inspect authorized real Research Agent lease before expensive cache restores
        id: inspect-research
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.payload_b64 != '' && github.event.inputs.transport == 'github-cloud'
        shell: bash
        env:
          NEXUS_TASK_PAYLOAD_B64: ${{ github.event.inputs.payload_b64 }}
          NEXUS_EXECUTION_SOURCE_SHA: ${{ steps.pin-research-qa.outputs.execution_source_sha }}
        run: |
          test -n "$NEXUS_EXECUTION_SOURCE_SHA"
          GITHUB_SHA="$NEXUS_EXECUTION_SOURCE_SHA" python -m nexus_agent_research_prepare --mode inspect

      - name: Restore immutable approved Bybit Research input transport
        id: research-data-cache
        if: steps.inspect-research.outputs.research_task == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build/agent-research-cache
          key: ${{ steps.inspect-research.outputs.research_cache_key }}

      - name: Restore ONLY the source and original producer-lease-bound numeric proof for QA
        if: steps.inspect-research.outputs.research_role == 'independent-qa'
        id: research-producer-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build/agent-producer-cache
          key: nexus-composite-producer-v1-${{ steps.inspect-research.outputs.producer_source_sha }}-${{ steps.inspect-research.outputs.producer_lease }}

      - name: Prepare verified cached archive and exact frontier for Research or independent QA
        id: prepare-research
        if: steps.inspect-research.outputs.research_task == 'true'
        continue-on-error: true
        shell: bash
        env:
          NEXUS_TASK_PAYLOAD_B64: ${{ github.event.inputs.payload_b64 }}
          NEXUS_EXECUTION_SOURCE_SHA: ${{ steps.pin-research-qa.outputs.execution_source_sha }}
        run: |
          test -n "$NEXUS_EXECUTION_SOURCE_SHA"
          GITHUB_SHA="$NEXUS_EXECUTION_SOURCE_SHA" python -m nexus_agent_research_prepare --mode auto --root build/agent-research
      - name: Verify Python runtime for bounded DeepSeek task
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.payload_b64 != '' && github.event.inputs.transport == 'deepseek'
        shell: bash
        run: python --version
      - name: Execute bounded cloud task
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.payload_b64 != '' && github.event.inputs.transport == 'github-cloud'
        continue-on-error: true
        shell: bash
        env:
          NEXUS_TASK_PAYLOAD_B64: ${{ github.event.inputs.payload_b64 }}
          NEXUS_TASK_TRANSPORT: ${{ github.event.inputs.transport }}
          NEXUS_EXECUTION_SOURCE_SHA: ${{ steps.pin-research-qa.outputs.execution_source_sha }}
        run: |
          test -n "$NEXUS_EXECUTION_SOURCE_SHA"
          GITHUB_SHA="$NEXUS_EXECUTION_SOURCE_SHA" python scripts/agent_task_executor.py --output "$RESULT_PATH"
      - name: Execute bounded DeepSeek task
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.payload_b64 != '' && github.event.inputs.transport == 'deepseek'
        continue-on-error: true
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NEXUS_TASK_PAYLOAD_B64: ${{ github.event.inputs.payload_b64 }}
          NEXUS_TASK_TRANSPORT: ${{ github.event.inputs.transport }}
        run: python scripts/agent_task_executor.py --output "$RESULT_PATH"
      - name: Stage completed source-bound Research producer result into immutable cache
        if: steps.prepare-research.outputs.research_role == 'producer'
        run: |
          set -euo pipefail
          test -s build/agent-research/result/agent-receipt.json
          test -s build/agent-research/result/novelty-ledger.json
          test -s build/agent-research/result/previous-ledger.json
          test -s build/agent-research/result/research-report.json
          mkdir -p build/agent-producer-cache
          cp -R build/agent-research/result build/agent-producer-cache/

      - name: Bind QA to immutable producer cache without widening workflow permissions
        if: steps.prepare-research.outputs.research_role == 'producer'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build/agent-producer-cache
          key: nexus-composite-producer-v1-${{ github.sha }}-${{ github.event.inputs.lease_id }}

      - name: Upload bounded cloud or DeepSeek result
        if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.payload_b64 != '' && github.event.inputs.transport != 'windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-agent-result-${{ github.event.inputs.lease_id }}
          path: ${{ env.RESULT_PATH }}
          if-no-files-found: error
          retention-days: 14
      - name: Publish real producer numerical evidence for exact independent QA lease
        if: always() && github.event_name == 'workflow_dispatch' && steps.prepare-research.outputs.research_role == 'producer'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-agent-research-${{ github.event.inputs.lease_id }}
          path: |
            build/agent-research/preparation.json
            build/agent-research/result/
          if-no-files-found: error
          retention-days: 30
      - name: Publish independent numerical QA proof
        if: always() && github.event_name == 'workflow_dispatch' && steps.prepare-research.outputs.research_role == 'independent-qa'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-agent-research-qa-${{ github.event.inputs.lease_id }}
          path: build/agent-research/qa-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish independently bounded original-source QA ancestry attestation
        if: always() && github.event_name == 'workflow_dispatch' && steps.pin-research-qa.outputs.qa_pin_verified == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-agent-qa-source-pin-${{ github.event.inputs.lease_id }}
          path: build/pinned-qa-attestation.json
          if-no-files-found: error
          retention-days: 30
      - name: Checkout exact PR head for Phase 4/5 evidence
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: gate-evidence-head
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact-head Gate 20 cloud evidence
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner
        working-directory: gate-evidence-head
        shell: bash
        run: |
          python --version
          python -m pip install -r requirements-dev.lock
          python -m pip check
          python -m pytest -q tests/test_phase4_gate20_e2e.py tests/test_phase4_postclose_security.py tests/test_ai_room.py tests/test_ai_room_gateway.py tests/test_mission_runner.py tests/test_gate20_evidence_security_adversarial.py
          python scripts/phase4_gate20_evidence.py --source-sha '${{ github.event.pull_request.head.sha }}' --output build/phase4-gate20-evidence.json
      - name: Upload exact-head Phase 4 Gate 20 cloud evidence
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase4-gate20-cloud-evidence-${{ github.event.pull_request.head.sha }}
          path: gate-evidence-head/build/phase4-gate20-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify exact-head Phase 5 Gate 9 cloud evidence
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner
        working-directory: gate-evidence-head
        shell: bash
        run: python scripts/phase5_gate9_evidence.py --source-sha '${{ github.event.pull_request.head.sha }}' --output build/phase5-gate9-evidence.json
      - name: Upload exact-head Phase 5 Gate 9 cloud evidence
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase5-gate9-cloud-evidence-${{ github.event.pull_request.head.sha }}
          path: gate-evidence-head/build/phase5-gate9-evidence.json
          if-no-files-found: error
          retention-days: 14

  windows-candidate-validation:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      NEXUS_DEEPSEEK_PAID_ROUTING_ALLOWED: '0'
      NEXUS_DEEPSEEK_SMOKE: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact PR head checkout
        shell: cmd
        run: |
          for /f %%i in ('git rev-parse HEAD') do set "NEXUS_RUNTIME_HEAD=%%i"
          if /I not "%NEXUS_RUNTIME_HEAD%"=="${{ github.event.pull_request.head.sha }}" exit /b 1
          echo exact_pr_head_verified=%NEXUS_RUNTIME_HEAD%
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
      - name: Bootstrap portable Python
        shell: cmd
        run: call scripts\bootstrap_portable_python.cmd
      - name: Initialize candidate state path
        shell: cmd
        run: |
          set "NEXUS_CANDIDATE_KEY=%GITHUB_HEAD_REF:/=-%"
          echo NEXUS_STATE_DIR=%RUNNER_WORKSPACE%\_nexus_phase3_candidate_state\%NEXUS_CANDIDATE_KEY%>>%GITHUB_ENV%
      - name: Exercise durable candidate state
        shell: cmd
        run: |
          python -c "import os,pathlib; d=pathlib.Path(os.environ['NEXUS_STATE_DIR']); q=d/'autonomous-queue.json'; s=d/'state.json'; print('candidate_queue_preexisting='+str(q.exists()).lower()); print('candidate_state_preexisting='+str(s.exists()).lower())"
          python nexus_autonomous_orchestrator.py
          python -c "import os,pathlib; d=pathlib.Path(os.environ['NEXUS_STATE_DIR']); q=d/'autonomous-queue.json'; s=d/'state.json'; assert q.is_file(), 'durable queue missing'; assert s.is_file(), 'durable state missing'; print('candidate_durable_state_verified=true')"
      - name: Verify Windows candidate runtime and Gate 20 E2E
        shell: cmd
        run: |
          node --version
          python --version
          node scripts\nexus_orchestrator.js
          node scripts\nexus_ai_council.js
          node scripts\nexus_runtime_worker.js --once
          python -m pytest -q tests\test_phase3_windows_runtime_contract.py tests\test_nexus_local_runner_bootstrap_policy.py tests\test_nexus_autonomous_orchestrator.py tests\test_agent_transport.py tests\test_phase4_gate20_e2e.py tests\test_phase4_postclose_security.py tests\test_ai_room.py tests\test_ai_room_gateway.py tests\test_mission_runner.py tests\test_gate20_evidence_security_adversarial.py
      - name: Generate exact-head Phase 4 Gate 20 evidence
        shell: cmd
        run: python scripts\phase4_gate20_evidence.py --source-sha "${{ github.event.pull_request.head.sha }}" --output build\phase4-gate20-evidence.json
      - name: Upload exact-head Phase 4 Gate 20 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase4-gate20-windows-evidence-${{ github.event.pull_request.head.sha }}
          path: build/phase4-gate20-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Generate exact-head Phase 5 Gate 9 Windows evidence
        shell: cmd
        run: python scripts\phase5_gate9_evidence.py --source-sha "${{ github.event.pull_request.head.sha }}" --output build\phase5-gate9-evidence.json
      - name: Upload exact-head Phase 5 Gate 9 Windows evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase5-gate9-windows-evidence-${{ github.event.pull_request.head.sha }}
          path: build/phase5-gate9-evidence.json
          if-no-files-found: error
          retention-days: 14

  laptop-worker:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner &&
      github.ref_name == github.event.repository.default_branch &&
      (github.event.inputs.payload_b64 == '' ||
       github.event.inputs.transport == 'windows')
    needs: preflight
    runs-on: [self-hosted, Windows, nexus-local]
    timeout-minutes: 58
    env:
      NEXUS_DEEPSEEK_PAID_ROUTING_ALLOWED: '0'
      NEXUS_DEEPSEEK_SMOKE: '0'
      RUNNER_ENVIRONMENT: self-hosted-windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
      - name: Bootstrap portable Python for bounded task
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.payload_b64 != '' && github.event.inputs.transport == 'windows'
        shell: cmd
        run: call scripts\bootstrap_portable_python.cmd
      - name: Verify runtime prerequisites
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.payload_b64 == ''
        shell: cmd
        run: |
          node --version
          node scripts\nexus_orchestrator.js
          node scripts\nexus_ai_council.js
      - name: Execute bounded Windows task
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.payload_b64 != '' && github.event.inputs.transport == 'windows'
        shell: cmd
        continue-on-error: true
        env:
          NEXUS_TASK_PAYLOAD_B64: ${{ github.event.inputs.payload_b64 }}
          NEXUS_TASK_TRANSPORT: ${{ github.event.inputs.transport }}
        run: python scripts/agent_task_executor.py --output "%RESULT_PATH%"
      - name: Upload bounded Windows result
        if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.payload_b64 != '' && github.event.inputs.transport == 'windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-agent-result-${{ github.event.inputs.lease_id }}
          path: ${{ env.RESULT_PATH }}
          if-no-files-found: error
          retention-days: 14
      - name: Start continuous NEXUS worker on explicit request
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.payload_b64 == ''
        shell: cmd
        run: node scripts\nexus_runtime_worker.js --interval-ms=20000
