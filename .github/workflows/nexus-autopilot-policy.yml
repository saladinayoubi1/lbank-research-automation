name: NEXUS Autopilot Policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths:
      - 'config/nexus-autopilot-policy.json'
      - 'scripts/validate_nexus_autopilot_policy.js'
      - '.github/workflows/nexus-autopilot-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-policy:
    name: control-plane trusted guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted PR base
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Check out trusted current revision
        if: github.event_name != 'pull_request_target'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject candidate modification of frozen Phase 3 control plane
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$HEAD_SHA"
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed"
          protected=(
            ".github/CODEOWNERS"
            ".github/workflows/tests.yml"
            ".github/workflows/workflow-permissions-audit.yml"
            ".github/workflows/nexus-autopilot-policy.yml"
            "nexus_architecture_validator.py"
            "docs/architecture/module-contract-registry.yaml"
            "tests/test_nexus_architecture_validator.py"
            "tests/test_nexus_architecture_recovery.py"
            "scripts/check_workflow_permissions.py"
            "security/workflow-permissions-policy-v1.json"
            "tests/test_workflow_permissions.py"
          )
          blocked=0
          for path in "${protected[@]}"; do
            if grep -Fxq "$path" <<<"$changed"; then
              echo "::error file=$path::Frozen Phase 3 Gate 4 protected control-plane path changed; owner-controlled break-glass is required."
              blocked=1
            fi
          done
          exit "$blocked"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate trusted autopilot policy
        run: node scripts/validate_nexus_autopilot_policy.js

      - name: Record trusted-source boundary
        if: github.event_name == 'pull_request_target'
        run: |
          echo "CONTROL_PLANE_GUARD=PASS source=trusted-base candidate-code-executed=false"
