name: NEXUS Autopilot Policy

on:
  pull_request:
    paths:
      - 'config/nexus-autopilot-policy.json'
      - 'scripts/validate_nexus_autopilot_policy.js'
      - '.github/workflows/nexus-autopilot-policy.yml'
  push:
    branches: [main]
    paths:
      - 'config/nexus-autopilot-policy.json'
      - 'scripts/validate_nexus_autopilot_policy.js'
      - '.github/workflows/nexus-autopilot-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate policy
        run: node scripts/validate_nexus_autopilot_policy.js
