name: Research Evidence Refresh

on:
  workflow_dispatch:
    inputs:
      monthly_bybit:
        description: Run completed UTC calendar month public Bybit pre-Demo research (owner only)
        required: false
        type: boolean
        default: false
      month_start:
        description: First UTC day of the completed calendar month
        required: false
        type: string
        default: '2026-08-01'
      next_month_start:
        description: First UTC day of the next month, exclusive
        required: false
        type: string
        default: '2026-09-01'
  schedule:
    - cron: '23 5 * * 1'
  pull_request:
    paths:
      - 'research/**'
      - 'references/references.bib'
      - 'scripts/validate_research_registry.py'
      - 'scripts/validate_bibtex.py'
      - 'tests/test_research_registry.py'
      - 'tests/test_validate_bibtex.py'
      - 'tests/test_nexus_ctrend_causal_*.py'
      - 'tests/test_nexus_ctrend_intake_guard_v1.py'
      - 'tests/test_nexus_ctrend_validation_gate_v1.py'
      - '.github/workflows/research-evidence-refresh.yml'
      - 'scripts/nexus_monthly_bybit_backtest.py'
      - 'tests/test_nexus_monthly_bybit_backtest.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned test runner
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5'
      - name: Validate immutable research registry
        run: python scripts/validate_research_registry.py
      - name: Validate curated bibliography
        run: python scripts/validate_bibtex.py references/references.bib
      - name: Run research boundary tests
        run: python -m pytest -q tests/test_research_registry.py tests/test_validate_bibtex.py tests/test_validate_research_evidence_matrix.py tests/test_research_evidence_refresh_workflow.py


      - name: Install isolated locked CTREND scientific environment
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          python -m venv build/ctrend-scientific
          build/ctrend-scientific/bin/python -m pip install --disable-pip-version-check --only-binary=:all: --index-url https://pypi.org/simple -r research/requirements-ctrend-causal-v1.lock
          build/ctrend-scientific/bin/python -m pip check
      - name: Require complete synthetic CTREND execution without skips
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          mkdir -p build/ctrend-validation
          git rev-parse HEAD > build/ctrend-validation/checked-out-source-sha.txt
          build/ctrend-scientific/bin/python -m unittest discover -s tests -p test_nexus_ctrend_validation_gate_v1.py -v
          build/ctrend-scientific/bin/python research/run_ctrend_causal_validation_v1.py --report build/ctrend-validation/synthetic-validation.json
          build/ctrend-scientific/bin/python research/run_ctrend_causal_validation_v1.py --subset intake-guard --report build/ctrend-validation/intake-guard-validation.json
      - name: Upload synthetic CTREND execution evidence
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ctrend-causal-synthetic-${{ github.sha }}
          path: build/ctrend-validation
          if-no-files-found: warn
          retention-days: 30

      - name: Install locked monthly research dependencies
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.monthly_bybit == true && github.actor == github.repository_owner && github.ref == 'refs/heads/main' }}
        run: python -m pip install -r requirements-dev.lock
      - name: Validate owner-approved full-month research contract
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.monthly_bybit == true && github.actor == github.repository_owner && github.ref == 'refs/heads/main' }}
        run: python -m pytest -q tests/test_nexus_monthly_bybit_backtest.py
      - name: Run full month on official public Bybit without Demo authority
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.monthly_bybit == true && github.actor == github.repository_owner && github.ref == 'refs/heads/main' }}
        env:
          NEXUS_SOURCE_SHA: ${{ github.sha }}
          NEXUS_BYBIT_PUBLIC_REGION: GLOBAL
          MONTH_START: ${{ inputs.month_start }}
          NEXT_MONTH_START: ${{ inputs.next_month_start }}
        run: |
          test "$NEXUS_SOURCE_SHA" = "$(git rev-parse HEAD)"
          python scripts/nexus_monthly_bybit_backtest.py \
            --start "$MONTH_START" --end-exclusive "$NEXT_MONTH_START" \
            --output build/owner-pre-demo-monthly-matrix
      - name: Validate all 12 canonical data windows and 36 historical strategy cells
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.monthly_bybit == true && github.actor == github.repository_owner && github.ref == 'refs/heads/main' }}
        env:
          NEXUS_SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path("build/owner-pre-demo-monthly-matrix")
          summary = json.loads((root / "summary.json").read_text())
          assert summary["code_sha"] == os.environ["NEXUS_SOURCE_SHA"]
          assert summary["decision"] == "FULL_MONTH_HISTORICAL_BACKTEST_COMPLETE"
          assert summary["exact_canonical_months"] == 12
          assert summary["strategy_cells"] == 36
          assert summary["no_demo_or_live_execution"] is True
          assert summary["owner_review_required_before_any_new_demo"] is True
          assert len(list((root / "datasets").glob("*.json"))) == 12
          assert sum(1 for row in (root / "cells.jsonl").open() if row.strip()) == 36
          PY
      - name: Upload full-month source-bound owner review evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.monthly_bybit == true && github.actor == github.repository_owner && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-bybit-full-month-owner-review-${{ github.sha }}
          path: build/owner-pre-demo-monthly-matrix
          if-no-files-found: warn
          retention-days: 30
