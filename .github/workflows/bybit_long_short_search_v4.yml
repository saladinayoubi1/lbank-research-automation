name: Bybit long short search v4

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: "Final immutable Bybit delivery artifact"
        required: false
        default: "8867026863"

permissions:
  contents: read
  actions: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_ARTIFACT_ID: "8867026863"
      EXPECTED_SHA256: "5f1173467c2296201940c3b7786b7cc3e5442244e07289769ab4867ace41d668"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip check
      - run: python -m pytest -q
      - name: Download immutable Bybit dataset
        env:
          DISPATCH_ARTIFACT_ID: ${{ github.event.inputs.artifact_id }}
        run: |
          set -euo pipefail
          artifact_id="$DISPATCH_ARTIFACT_ID"
          if [ -z "$artifact_id" ]; then artifact_id="$DEFAULT_ARTIFACT_ID"; fi
          rm -rf build/final_delivery build/bybit_dataset
          mkdir -p build/final_delivery build/bybit_dataset
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > build/final_delivery.zip
          unzip -q build/final_delivery.zip -d build/final_delivery
          archive="build/final_delivery/BYBIT_full_history_2022-12-01_to_2026-07-31.zip"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -q "$archive" -d build/bybit_dataset
      - name: Reproduce v4 result
        run: |
          python bybit_long_short_search_v4.py \
            --manifest experiments/bybit_long_short_search_v4.json \
            --output build/bybit_long_short_search_v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bybit-long-short-search-v4-${{ github.run_attempt }}
          path: build/bybit_long_short_search_v4
          if-no-files-found: error
          retention-days: 30
          compression-level: 9