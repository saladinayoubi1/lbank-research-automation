name: NEXUS Windows Remote Commander Rescue

on:
  workflow_dispatch:
  push:
    branches:
      - codex/nexus-windows-remote-rescue-20260907
    paths:
      - .github/workflows/nexus-windows-remote-commander-rescue.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: nexus-windows-remote-commander-rescue-v5
  cancel-in-progress: false

jobs:
  rescue:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - name: Verify exact existing Windows runner
        shell: cmd
        run: |
          if /I not "%RUNNER_NAME%"=="NEXUS-WINDOWS-DR" exit /b 1
          echo exact_windows_runner=NEXUS-WINDOWS-DR
      - name: Publish sanitized recovery diagnostics
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $taskText = (& schtasks.exe /Query /TN 'NEXUS-Remote-Commander-Recovery' /FO LIST /V 2>&1 | Out-String)
          $taskExit = $LASTEXITCODE
          $processText = (Get-Process node,powershell,wscript -ErrorAction SilentlyContinue | Select-Object Id,ProcessName,SessionId,Path | Format-Table -AutoSize | Out-String)
          $desktopCmd = Test-Path -LiteralPath 'C:\Users\afaq\Desktop\NEXUS_REMOTE_CONNECT.cmd'
          $nexusLocal = Test-Path -LiteralPath 'C:\Users\afaq\AppData\Local\NEXUS'
          $diag = @"
exact_windows_runner=NEXUS-WINDOWS-DR
schtasks_query_exit=$taskExit
--- TASK ---
$taskText
--- PROCESSES ---
$processText
--- FILES ---
NEXUS_REMOTE_CONNECT.cmd=$desktopCmd
LOCALAPPDATA_NEXUS=$nexusLocal
diagnostic_mutation=false
runner_registration_mutated=false
runner_credentials_mutated=false
windows_acl_mutated=false
windows_service_identity_mutated=false
live_trading_authority_changed=false
"@
          if ($diag.Length -gt 12000) { $diag = $diag.Substring(0,12000) }
          $comment = "Physical Windows rescue diagnostic from run $env:GITHUB_RUN_ID on branch $env:GITHUB_REF_NAME.`n```text`n$diag`n```"
          $json = @{ body = $comment } | ConvertTo-Json -Depth 3
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          Invoke-RestMethod -Method Post -Uri 'https://api.github.com/repos/saladinayoubi1/lbank-research-automation/issues/1372/comments' -Headers $headers -ContentType 'application/json' -Body $json | Out-Null
          Write-Host 'maintenance_issue_diagnostic_comment=PASS'
