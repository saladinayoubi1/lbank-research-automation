name: NEXUS Windows Remote Commander Rescue

on:
  workflow_dispatch:
  push:
    branches:
      - codex/nexus-windows-remote-rescue-20260907
    paths:
      - .github/workflows/nexus-windows-remote-commander-rescue.yml

permissions:
  contents: read

concurrency:
  group: nexus-windows-remote-commander-rescue-v2
  cancel-in-progress: false

jobs:
  rescue:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    steps:
      - name: Verify exact existing Windows runner
        shell: cmd
        run: |
          if /I not "%RUNNER_NAME%"=="NEXUS-WINDOWS-DR" exit /b 1
          echo exact_windows_runner=NEXUS-WINDOWS-DR
      - name: Request existing Remote Commander recovery task bounded
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = "$env:SystemRoot\System32\schtasks.exe"
          $psi.Arguments = '/Run /TN "NEXUS-Remote-Commander-Recovery"'
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $p = New-Object System.Diagnostics.Process
          $p.StartInfo = $psi
          if (-not $p.Start()) { throw 'schtasks process did not start.' }
          if (-not $p.WaitForExit(15000)) {
            try { $p.Kill() } catch { }
            throw 'schtasks /Run exceeded bounded timeout.'
          }
          $stdout = $p.StandardOutput.ReadToEnd()
          $stderr = $p.StandardError.ReadToEnd()
          Write-Host $stdout
          if ($stderr) { Write-Host $stderr }
          if ($p.ExitCode -ne 0) { throw "schtasks /Run failed with exit $($p.ExitCode)." }
          Start-Sleep -Seconds 15
          Write-Host 'remote_commander_recovery_request=PASS'
          Write-Host 'task_definition_mutated=false'
          Write-Host 'runner_registration_mutated=false'
          Write-Host 'runner_credentials_mutated=false'
          Write-Host 'windows_acl_mutated=false'
          Write-Host 'windows_service_identity_mutated=false'
          Write-Host 'live_trading_authority_changed=false'
