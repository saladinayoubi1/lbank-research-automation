name: NEXUS Windows Remote Commander Rescue

on:
  workflow_dispatch:
  push:
    branches:
      - codex/nexus-windows-remote-rescue-20260907
    paths:
      - .github/workflows/nexus-windows-remote-commander-rescue.yml

permissions:
  contents: read

concurrency:
  group: nexus-windows-remote-commander-rescue-v7
  cancel-in-progress: false

jobs:
  rescue:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - name: Exact Windows runner
        shell: cmd
        run: if /I not "%RUNNER_NAME%"=="NEXUS-WINDOWS-DR" exit /b 1

      - name: Remote Commander command line identified
        continue-on-error: true
        shell: powershell
        run: |
          $matches = @(Get-WmiObject Win32_Process -Filter "Name='node.exe'" -ErrorAction SilentlyContinue | Where-Object { [string]$_.CommandLine -match '(?i)desktop-commander|desktopcommander|wonderwhy-er' })
          if ($matches.Count -lt 1) { exit 1 }

      - name: Desktop Commander MCP endpoint reachable
        continue-on-error: true
        shell: cmd
        run: >-
          node -e "fetch('https://mcp.desktopcommander.app/api/mcp-info').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(2))"

      - name: Desktop Commander auth endpoint reachable
        continue-on-error: true
        shell: cmd
        run: >-
          node -e "fetch('https://auth.desktopcommander.app').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(2))"

      - name: Recovery task action targets NEXUS remote recovery
        continue-on-error: true
        shell: powershell
        run: |
          $svc = New-Object -ComObject 'Schedule.Service'
          $svc.Connect()
          $task = $svc.GetFolder('\').GetTask('NEXUS-Remote-Commander-Recovery')
          $text = (($task.Definition.Actions | ForEach-Object { ([string]$_.Path) + ' ' + ([string]$_.Arguments) }) -join ' ')
          if ($text -notmatch '(?i)NEXUS|RemoteCommander|Remote.Commander') { exit 1 }

      - name: Safety boundary unchanged
        shell: cmd
        run: |
          echo diagnostic_mutation=false
          echo runner_registration_mutated=false
          echo runner_credentials_mutated=false
          echo windows_acl_mutated=false
          echo windows_service_identity_mutated=false
          echo live_trading_authority_changed=false
