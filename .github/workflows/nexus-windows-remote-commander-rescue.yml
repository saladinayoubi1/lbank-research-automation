name: NEXUS Windows Remote Commander Rescue

on:
  workflow_dispatch:
  push:
    branches:
      - codex/nexus-windows-remote-rescue-20260907
    paths:
      - .github/workflows/nexus-windows-remote-commander-rescue.yml

permissions:
  contents: read

concurrency:
  group: nexus-windows-remote-commander-rescue-v6
  cancel-in-progress: false

jobs:
  rescue:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - name: Exact Windows runner
        shell: cmd
        run: if /I not "%RUNNER_NAME%"=="NEXUS-WINDOWS-DR" exit /b 1

      - name: Recovery task queryable
        continue-on-error: true
        shell: powershell
        run: |
          & schtasks.exe /Query /TN 'NEXUS-Remote-Commander-Recovery' /FO LIST /V | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Recovery task last result healthy
        continue-on-error: true
        shell: powershell
        run: |
          $svc = New-Object -ComObject 'Schedule.Service'
          $svc.Connect()
          $task = $svc.GetFolder('\').GetTask('NEXUS-Remote-Commander-Recovery')
          if ($task.LastTaskResult -notin @(0,267009)) { exit 1 }

      - name: Signed-in user session exists
        continue-on-error: true
        shell: powershell
        run: |
          $explorer = Get-Process explorer -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $explorer) { exit 1 }

      - name: Remote Commander node exists in user session
        continue-on-error: true
        shell: powershell
        run: |
          $explorer = Get-Process explorer -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $explorer) { exit 1 }
          $nodes = @(Get-Process node -ErrorAction SilentlyContinue | Where-Object { $_.SessionId -eq $explorer.SessionId })
          if ($nodes.Count -lt 1) { exit 1 }

      - name: Manual recovery launcher exists
        continue-on-error: true
        shell: powershell
        run: |
          if (-not (Test-Path -LiteralPath 'C:\Users\afaq\Desktop\NEXUS_REMOTE_CONNECT.cmd')) { exit 1 }

      - name: Local NEXUS recovery root exists
        continue-on-error: true
        shell: powershell
        run: |
          if (-not (Test-Path -LiteralPath 'C:\Users\afaq\AppData\Local\NEXUS')) { exit 1 }

      - name: Safety boundary unchanged
        shell: cmd
        run: |
          echo runner_registration_mutated=false
          echo runner_credentials_mutated=false
          echo windows_acl_mutated=false
          echo windows_service_identity_mutated=false
          echo live_trading_authority_changed=false
