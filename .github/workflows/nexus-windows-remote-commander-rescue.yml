name: NEXUS Windows Remote Commander Rescue

on:
  workflow_dispatch:
  push:
    branches:
      - codex/nexus-windows-remote-rescue-20260907
    paths:
      - .github/workflows/nexus-windows-remote-commander-rescue.yml

permissions:
  contents: read

concurrency:
  group: nexus-windows-remote-commander-rescue-v3
  cancel-in-progress: false

jobs:
  rescue:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    steps:
      - name: Verify exact existing Windows runner
        shell: cmd
        run: |
          if /I not "%RUNNER_NAME%"=="NEXUS-WINDOWS-DR" exit /b 1
          echo exact_windows_runner=NEXUS-WINDOWS-DR
      - name: Inspect existing Remote Commander recovery state
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host '--- TASK ---'
          & schtasks.exe /Query /TN 'NEXUS-Remote-Commander-Recovery' /FO LIST /V
          Write-Host '--- PROCESSES ---'
          Get-Process node,powershell,wscript -ErrorAction SilentlyContinue |
            Select-Object Id,ProcessName,SessionId,Path |
            Format-Table -AutoSize
          Write-Host '--- USER SESSION ---'
          & query.exe user
          Write-Host '--- KNOWN RECOVERY FILES ---'
          foreach ($path in @(
            'C:\Users\afaq\Desktop\NEXUS_REMOTE_CONNECT.cmd',
            'C:\Users\afaq\AppData\Local\NEXUS'
          )) {
            Write-Host ("{0}={1}" -f $path,(Test-Path -LiteralPath $path))
          }
          Write-Host 'diagnostic_mutation=false'
          Write-Host 'runner_registration_mutated=false'
          Write-Host 'runner_credentials_mutated=false'
          Write-Host 'windows_acl_mutated=false'
          Write-Host 'windows_service_identity_mutated=false'
          Write-Host 'live_trading_authority_changed=false'
