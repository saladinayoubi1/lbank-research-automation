name: NEXUS Phase 7 Proof Mission

on:
  pull_request:
    paths:
      - 'agent_manager.py'
      - 'agent_transport.py'
      - 'offline_agent_courier.py'
      - 'phase5_mission_contract.py'
      - 'phase5_state_store.py'
      - 'phase6_research_pipeline.py'
      - 'phase7_e2e_proof.py'
      - 'scripts/agent_task_executor.py'
      - 'scripts/phase7_proof_prepare.py'
      - 'config/nexus-phase7-proof-mission.json'
      - 'tests/test_phase7_*.py'
      - '.github/workflows/nexus-phase7-proof-mission.yml'
      - 'security/workflow-permissions-policy-v1.json'
  push:
    branches: [main]
    paths:
      - 'agent_manager.py'
      - 'agent_transport.py'
      - 'offline_agent_courier.py'
      - 'phase5_mission_contract.py'
      - 'phase5_state_store.py'
      - 'phase6_research_pipeline.py'
      - 'phase7_e2e_proof.py'
      - 'scripts/agent_task_executor.py'
      - 'scripts/phase7_proof_prepare.py'
      - 'config/nexus-phase7-proof-mission.json'
      - 'tests/test_phase7_*.py'
      - '.github/workflows/nexus-phase7-proof-mission.yml'
      - 'security/workflow-permissions-policy-v1.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-phase7-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked test dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip check
      - name: Validate Phase 7 proof contracts and boundaries
        run: |
          python -m pytest -q \
            tests/test_phase7_agent_task_executor.py \
            tests/test_phase7_resource_manager.py \
            tests/test_phase7_mission_projection.py \
            tests/test_phase7_courier_zero_idle.py \
            tests/test_phase7_e2e_proof.py \
            tests/test_phase7_proof_prepare.py \
            tests/test_offline_agent_courier.py

  proof:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXUS_OFFLINE_COURIER_KEY: ${{ secrets.NEXUS_OFFLINE_COURIER_KEY }}
      NEXUS_DEEPSEEK_PAID_ROUTING_ALLOWED: ${{ vars.NEXUS_DEEPSEEK_PAID_ROUTING_ALLOWED }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked proof dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip check
      - name: Execute exact-source Phase 7 cloud proof and prepare offline courier
        run: |
          python scripts/phase7_proof_prepare.py --source-sha "$GITHUB_SHA" --output-dir build/phase7-proof
      - name: Verify proof artifact remains Paper-only and exact-source
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import phase7_e2e_proof as proof
          root = Path('build/phase7-proof')
          artifact = json.loads((root / 'phase7-e2e-proof.json').read_text(encoding='utf-8'))
          proof.validate_proof(artifact, expected_source_sha=os.environ['GITHUB_SHA'])
          run = json.loads((root / 'phase7-proof-mission-run.json').read_text(encoding='utf-8'))
          assert run['paper_only'] is True
          assert run['live_trading_authority'] is False
          assert run['core_cloud_chain_complete'] is True
          assert run['source_sha'] == os.environ['GITHUB_SHA'].lower()
          print('phase7_exact_source_cloud_proof_verified=true')
          print('phase7_hardware_proof_complete=' + str(bool(run['hardware_proof_complete'])).lower())
          print('phase7_courier_status=' + str(run['courier']['status']))
          print('phase7_deepseek_status=' + str(run['deepseek']['status']))
          PY
      - name: Upload Phase 7 proof and courier evidence
        uses: actions/upload-artifact@v4
        with:
          name: nexus-phase7-proof-${{ github.sha }}
          path: build/phase7-proof
          if-no-files-found: error
          retention-days: 14
