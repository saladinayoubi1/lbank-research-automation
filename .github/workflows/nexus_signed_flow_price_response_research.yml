name: NEXUS signed-flow price-response research

on:
  workflow_dispatch:
    inputs:
      validation_mode:
        description: Existing historical research or preregistered data QA
        type: choice
        default: historical
        options: [historical, live-side, future]
  schedule:
    - cron: "15 4 10 10 *"
    - cron: "15 4 9 11 *"
  push:
    branches:
      - main
    paths:
      - "nexus_signed_flow_price_response_research.py"
      - "nexus_verified_signed_trade_flow.py"
      - "bybit_spot_archive_collector.py"
      - ".github/workflows/nexus_signed_flow_price_response_research.yml"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Select the existing A6 research or preregistered validation task
        id: window
        env:
          A6_VALIDATION_EVENT: ${{ github.event_name }}
          A6_VALIDATION_SCHEDULE: ${{ github.event.schedule }}
          A6_VALIDATION_MODE: ${{ github.event.inputs.validation_mode }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime, timezone
          event = os.environ['A6_VALIDATION_EVENT']
          execute = event != 'schedule' or datetime.now(timezone.utc).year == 2026
          mode = os.environ['A6_VALIDATION_MODE'] or 'historical'
          if event == 'schedule':
              mode = 'future' if os.environ['A6_VALIDATION_SCHEDULE'] == '15 4 9 11 *' else 'live-side'
          if mode not in {'historical', 'live-side', 'future'}:
              raise SystemExit('unsupported A6 validation task')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'execute={str(execute).lower()}\nmode={mode}\n')
          PY

      - name: Check out repository
        if: steps.window.outputs.execute == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check out the frozen future model
        if: steps.window.outputs.execute == 'true' && steps.window.outputs.mode == 'future'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d72c92f315abd514fd7210388ce211258a670799
          path: frozen-model

      - name: Set up Python
        if: steps.window.outputs.execute == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        if: steps.window.outputs.execute == 'true'
        env:
          A6_VALIDATION_MODE: ${{ steps.window.outputs.mode }}
        run: |
          if [ "$A6_VALIDATION_MODE" = future ]; then
            python -m pip install -r frozen-model/requirements.lock
          else
            python -m pip install -r requirements.lock
          fi

      - name: Check dependency consistency
        if: steps.window.outputs.execute == 'true'
        run: python -m pip check

      - name: Collect verified 30-day Bybit Spot signed-flow inputs
        if: steps.window.outputs.execute == 'true' && steps.window.outputs.mode == 'historical'
        run: >-
          python bybit_spot_archive_collector.py
          --start-date 2026-07-03
          --end-date 2026-08-01
          --cache-root build/a6-signed-flow-cache
          --output-root build/a6-signed-flow-market
          --clean

      - name: Run A6 signed-flow price-response research
        if: steps.window.outputs.execute == 'true' && steps.window.outputs.mode == 'historical'
        run: >-
          python nexus_signed_flow_price_response_research.py
          --input-root build/a6-signed-flow-market
          --output build/a6-signed-flow-report
          --source-sha "$GITHUB_SHA"

      - name: Enforce research-only strategy authority
        if: steps.window.outputs.execute == 'true' && steps.window.outputs.mode == 'historical'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("build/a6-signed-flow-report/signed-flow-price-response-report.json").read_text()
          )
          proof = json.loads(
              Path("build/a6-signed-flow-market/_signed_trade_flow_proof.json").read_text()
          )

          assert report["mechanism"] == "signed_flow_price_response"
          assert report["start_date"] == "2026-07-03"
          assert report["end_date"] == "2026-08-01"
          assert len(report["rows"]) == 12
          assert report["research_only"] is True
          assert report["paper_only"] is True
          assert report["automatic_strategy_promotion"] is False
          assert report["live_trading_authority"] is False
          assert report["qualification"] == "NOT_QUALIFIED_NO_PRISTINE_FUTURE_HOLDOUT"
          assert all(row["trade_count_limit"] is None for row in report["rows"])

          assert proof["capability"] == "verified_signed_trade_flow"
          assert proof["rows"] == 30 * 2 * 96
          assert proof["raw_trade_rows_published"] is False
          assert proof["research_only"] is True
          assert proof["paper_only"] is True
          assert proof["automatic_strategy_promotion"] is False
          assert proof["live_trading_authority"] is False
          PY

      - name: Upload A6 research evidence
        if: steps.window.outputs.execute == 'true' && steps.window.outputs.mode == 'historical'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-a6-signed-flow-research-${{ github.sha }}
          path: |
            build/a6-signed-flow-report/signed-flow-price-response-report.json
            build/a6-signed-flow-market/_signed_trade_flow_proof.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Execute preregistered data validation without admission
        if: steps.window.outputs.execute == 'true' && steps.window.outputs.mode != 'historical'
        run: >-
          python scripts/nexus_a6_preregistered_validation.py
          --mode "${{ steps.window.outputs.mode }}"
          --output-root build/a6-preregistered-${{ github.run_id }}
          --model-root frozen-model

      - name: Upload supplemental A6 data QA evidence
        if: always() && steps.window.outputs.execute == 'true' && steps.window.outputs.mode != 'historical'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-a6-preregistered-validation-${{ github.run_id }}
          path: build/a6-preregistered-${{ github.run_id }}/preregistered-validation-progress.json
          if-no-files-found: error
          retention-days: 90
