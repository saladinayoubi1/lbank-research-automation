name: NEXUS signed-flow price-response research

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "nexus_signed_flow_price_response_research.py"
      - "nexus_verified_signed_trade_flow.py"
      - "bybit_spot_archive_collector.py"
      - ".github/workflows/nexus_signed_flow_price_response_research.yml"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Check dependency consistency
        run: python -m pip check

      - name: Collect verified 30-day Bybit Spot signed-flow inputs
        run: >-
          python bybit_spot_archive_collector.py
          --start-date 2026-07-03
          --end-date 2026-08-01
          --cache-root build/a6-signed-flow-cache
          --output-root build/a6-signed-flow-market
          --clean

      - name: Run A6 signed-flow price-response research
        run: >-
          python nexus_signed_flow_price_response_research.py
          --input-root build/a6-signed-flow-market
          --output build/a6-signed-flow-report
          --source-sha "$GITHUB_SHA"

      - name: Enforce research-only strategy authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("build/a6-signed-flow-report/signed-flow-price-response-report.json").read_text()
          )
          proof = json.loads(
              Path("build/a6-signed-flow-market/_signed_trade_flow_proof.json").read_text()
          )

          assert report["mechanism"] == "signed_flow_price_response"
          assert report["start_date"] == "2026-07-03"
          assert report["end_date"] == "2026-08-01"
          assert len(report["rows"]) == 12
          assert report["research_only"] is True
          assert report["paper_only"] is True
          assert report["automatic_strategy_promotion"] is False
          assert report["live_trading_authority"] is False
          assert report["qualification"] == "NOT_QUALIFIED_NO_PRISTINE_FUTURE_HOLDOUT"
          assert all(row["trade_count_limit"] is None for row in report["rows"])

          assert proof["capability"] == "verified_signed_trade_flow"
          assert proof["rows"] == 30 * 2 * 96
          assert proof["raw_trade_rows_published"] is False
          assert proof["research_only"] is True
          assert proof["paper_only"] is True
          assert proof["automatic_strategy_promotion"] is False
          assert proof["live_trading_authority"] is False
          PY

      - name: Upload A6 research evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-a6-signed-flow-research-${{ github.sha }}
          path: |
            build/a6-signed-flow-report/signed-flow-price-response-report.json
            build/a6-signed-flow-market/_signed_trade_flow_proof.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
