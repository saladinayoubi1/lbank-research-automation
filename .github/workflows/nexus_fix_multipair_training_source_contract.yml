name: NEXUS fix Multi-Pair training source contract

on:
  push:
    branches:
      - codex/multipair-training-robustness-20260911
    paths:
      - .github/workflows/nexus_fix_multipair_training_source_contract.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/multipair-training-robustness-20260911
          fetch-depth: 0
      - name: Preserve the established training-only source contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          replacements = {
              Path('nexus_multipair_strategy_discovery.py'): (
                  '"selection_source": "training_only_temporal_robustness",',
                  '"selection_source": "training_only",',
              ),
              Path('tests/test_nexus_multipair_training_refinement.py'): (
                  '"selection_source": "training_only_temporal_robustness",',
                  '"selection_source": "training_only",',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected replacement count for {path}: {text.count(old)}')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python -m py_compile nexus_multipair_strategy_discovery.py tests/test_nexus_multipair_training_refinement.py
          grep -q '"selection_source": "training_only"' nexus_multipair_strategy_discovery.py
          grep -q 'training_only_temporal_robustness' nexus_multipair_strategy_discovery.py && exit 1 || true
      - name: Commit the contract fix and remove this helper
        run: |
          set -euo pipefail
          rm -f .github/workflows/nexus_fix_multipair_training_source_contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Preserve Multi-Pair training-only source contract'
          git push origin HEAD:codex/multipair-training-robustness-20260911
