name: NEXUS Continuous Phase 3 Workers

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: nexus-phase3-continuous-workers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cloud-agent-lane:
    name: Cloud agent / orchestrator lane
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Select Phase 3 missions
        run: node scripts/nexus_orchestrator.js config/nexus-mission-queue.json
      - name: Exercise AI council
        run: |
          node scripts/nexus_ai_council.js
          node scripts/test_nexus_ai_council.js
      - name: Record cloud-agent execution evidence
        run: |
          mkdir -p .nexus-runtime
          printf '{"lane":"cloud-agent","status":"executed","sha":"%s","run_id":"%s","purpose":"phase3"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .nexus-runtime/cloud-agent.json
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-cloud-agent-${{ github.run_id }}
          path: .nexus-runtime/cloud-agent.json
          retention-days: 7

  deepseek-advisory-lane:
    name: DeepSeek bounded advisory lane
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify DeepSeek availability
        id: key
        shell: bash
        run: |
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Execute bounded DeepSeek verification
        if: steps.key.outputs.available == 'true'
        run: python scripts/deepseek_smoke.py
      - name: Mark unavailable without blocking other workers
        if: steps.key.outputs.available != 'true'
        run: echo 'DeepSeek UNVERIFIED for this run: DEEPSEEK_API_KEY unavailable to workflow.'

  windows-laptop-lane:
    name: Windows laptop / self-hosted lane
    runs-on: [self-hosted, Windows]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Execute orchestrator on laptop
        shell: powershell
        run: node scripts/nexus_orchestrator.js config/nexus-mission-queue.json
      - name: Exercise local agent council
        shell: powershell
        run: |
          node scripts/nexus_ai_council.js
          node scripts/test_nexus_ai_council.js
      - name: Probe Zotero local integration
        shell: powershell
        run: |
          if (Test-Path scripts/sync_zotero.py) {
            python scripts/sync_zotero.py --help
          } else {
            throw 'scripts/sync_zotero.py missing'
          }
      - name: Record laptop execution evidence
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .nexus-runtime | Out-Null
          $json = @{ lane='windows-self-hosted'; status='executed'; sha=$env:GITHUB_SHA; run_id=$env:GITHUB_RUN_ID; purpose='phase3' } | ConvertTo-Json -Compress
          Set-Content -Path .nexus-runtime/windows-self-hosted.json -Value $json
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-windows-runner-${{ github.run_id }}
          path: .nexus-runtime/windows-self-hosted.json
          retention-days: 7
