name: Zotero One-Time Upload

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  upload:
    if: github.event.head_commit.message == 'ops: run one-time Zotero upload'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate sync tests
        run: python -m unittest tests.test_sync_zotero
      - name: Upload approved seed library
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_LIBRARY_ID: ${{ secrets.ZOTERO_LIBRARY_ID }}
        run: python scripts/sync_zotero.py references/crypto-fx-library.json --apply
