name: NEXUS WSL Virtualization Preflight
# Marker-gated physical diagnostic trigger. The source script is normalized into
# an ephemeral copy before execution so legacy `elif` tokens cannot block the
# hardware probe; the repository checkout and runner service remain untouched.

on:
  push:
    branches:
      - main
    paths:
      - scripts/diagnose_nexus_wsl_virtualization.ps1
      - .github/workflows/nexus-wsl-virtualization-preflight.yml

permissions:
  contents: read

concurrency:
  group: nexus-wsl-virtualization-preflight
  cancel-in-progress: true

jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[diagnose-wsl-virtualization]')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Verify exact trigger SHA
        run: |
          for /f %%S in ('git rev-parse HEAD') do set "CHECKED_OUT_SHA=%%S"
          if /I not "%CHECKED_OUT_SHA%"=="%GITHUB_SHA%" exit /b 1
          echo exact_trigger_sha=%CHECKED_OUT_SHA%

      - name: Normalize and parse virtualization diagnostic
        run: >-
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -Command "$source='scripts\diagnose_nexus_wsl_virtualization.ps1'; $target=Join-Path $env:RUNNER_TEMP 'nexus-wsl-virtualization.ps1'; $text=[IO.File]::ReadAllText($source); $text=[regex]::Replace($text,'(?m)^elif\s+','elseif '); [IO.File]::WriteAllText($target,$text,(New-Object Text.UTF8Encoding($false))); $tokens=$null; $errors=$null; [Management.Automation.Language.Parser]::ParseFile($target,[ref]$tokens,[ref]$errors) | Out-Null; if($errors.Count -gt 0){$errors | ForEach-Object { Write-Error $_.Message }; exit 1}; Write-Host ('normalized_script=' + $target)"

      - name: Diagnose and repair bounded virtualization boot state
        run: >-
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File "%RUNNER_TEMP%\nexus-wsl-virtualization.ps1"
          -OutputPath "build\wsl-virtualization\evidence.json"

      - name: Upload virtualization evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-wsl-virtualization-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: build/wsl-virtualization/evidence.json
