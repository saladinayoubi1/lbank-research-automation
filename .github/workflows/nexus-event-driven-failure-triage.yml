name: NEXUS Event-Driven Failure Triage

on:
  workflow_run:
    workflows:
      - Test
      - NEXUS Cloud Fallback
      - NEXUS Build Verification
      - NEXUS Local Runner
      - Build NEXUS Desktop Windows
    types: [completed]
  push:
    branches:
      - main
    paths:
      - .nexus/repair-trigger.txt

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: nexus-failure-triage-${{ github.event_name }}-${{ github.event.workflow_run.id || github.sha }}
  cancel-in-progress: false

jobs:
  triage:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && (
        github.event.workflow_run.name == 'Test' ||
        github.event.workflow_run.name == 'NEXUS Cloud Fallback' ||
        github.event.workflow_run.name == 'NEXUS Build Verification' ||
        github.event.workflow_run.name == 'NEXUS Local Runner' ||
        github.event.workflow_run.name == 'Build NEXUS Desktop Windows'
      ))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Upsert actionable failure and runner install evidence
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { owner, repo } = context.repo;
            const defaultBranch = context.payload.repository?.default_branch || 'main';
            const installWorkflow = 'NEXUS Local Runner';
            const packageWorkflow = 'Build NEXUS Desktop Windows';
            const packageArtifactName = 'NEXUS_PERSONAL_PRO_FINAL_MISSION_CONTROL_WINDOWS_5_1_0';
            const installIssueNumber = 702;
            const installCommitMarker = '[install-autostart]';
            const validSha = (value) => typeof value === 'string' && /^[0-9a-f]{40}$/.test(value);
            const installMarkerFor = (sha) => `<!-- nexus-zero-touch-install:${sha} -->`;
            const packageMarkerFor = (sha) => `<!-- nexus-windows-main-package:${sha} -->`;

            const upsertInstallEvidence = async ({ sha, state, lines }) => {
              if (!validSha(sha) || !['PENDING', 'SUCCESS', 'FAILURE'].includes(state)) {
                core.setFailed('Refused malformed zero-touch install evidence.');
                return false;
              }
              const marker = installMarkerFor(sha);
              const body = [
                marker,
                '## NEXUS zero-touch laptop install evidence',
                '',
                `- state: **${state}**`,
                `- exact main SHA: \`${sha}\``,
                ...lines,
                '',
                state === 'SUCCESS'
                  ? '- Scope: this proves the zero-touch autostart installer completed and emitted its expected artifact for this exact SHA. It does **not** by itself prove reboot/resume or the complete Phase 7 hardware Proof Mission.'
                  : state === 'PENDING'
                    ? '- Scope: dispatch evidence only. Physical installation is **not** claimed until the self-hosted runner completes and the exact expected artifact is independently observed.'
                    : '- Scope: fail-closed. Physical installation is **not** claimed for this SHA.',
                '',
                '- Safety boundary: Research/Backtest/Paper only; no live trading, exchange credentials, withdrawals, production authority, signing, or billing.'
              ].join('\n');

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: installIssueNumber,
                per_page: 100
              });
              const matches = comments.filter(comment => typeof comment.body === 'string' && comment.body.includes(marker));
              if (matches.length > 1) {
                core.warning(`Multiple zero-touch evidence comments found for ${sha}; updating the oldest stable marker only.`);
              }
              if (matches.length > 0) {
                const selected = [...matches].sort((a, b) => a.id - b.id)[0];
                await github.rest.issues.updateComment({ owner, repo, comment_id: selected.id, body });
                core.info(`Updated Phase 7 install evidence comment ${selected.id} for ${sha}: ${state}`);
              } else {
                const created = await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: installIssueNumber,
                  body
                });
                core.info(`Created Phase 7 install evidence comment ${created.data.id} for ${sha}: ${state}`);
              }
              return true;
            };

            const upsertPackageEvidence = async ({ sha, state, lines }) => {
              if (!validSha(sha) || !['SUCCESS', 'FAILURE'].includes(state)) {
                core.setFailed('Refused malformed exact-main Windows package evidence.');
                return false;
              }
              const marker = packageMarkerFor(sha);
              const body = [
                marker,
                '## NEXUS exact-main Windows package evidence',
                '',
                `- state: **${state}**`,
                `- exact main SHA: \`${sha}\``,
                ...lines,
                '',
                state === 'SUCCESS'
                  ? '- Scope: this proves the Windows Setup/Portable package artifact was produced by the trusted main-push build and independently located for this exact SHA. It does **not** prove execution on the owner laptop, autostart installation, reboot/resume, or complete Phase 7 acceptance.'
                  : '- Scope: fail-closed. An exact-main Windows package is **not** claimed for this SHA.',
                '',
                '- Safety boundary: Research/Backtest/Paper only; no live trading, exchange credentials, withdrawals, production authority, signing, or billing.'
              ].join('\n');

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: installIssueNumber,
                per_page: 100
              });
              const matches = comments.filter(comment => typeof comment.body === 'string' && comment.body.includes(marker));
              if (matches.length > 1) {
                core.warning(`Multiple Windows package evidence comments found for ${sha}; updating the oldest stable marker only.`);
              }
              if (matches.length > 0) {
                const selected = [...matches].sort((a, b) => a.id - b.id)[0];
                await github.rest.issues.updateComment({ owner, repo, comment_id: selected.id, body });
                core.info(`Updated Phase 7 Windows package evidence comment ${selected.id} for ${sha}: ${state}`);
              } else {
                const created = await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: installIssueNumber,
                  body
                });
                core.info(`Created Phase 7 Windows package evidence comment ${created.data.id} for ${sha}: ${state}`);
              }
              return true;
            };

            if (context.eventName === 'push') {
              const sha = context.payload.after;
              const ref = context.payload.ref;
              const message = context.payload.head_commit?.message;
              const expectedRef = `refs/heads/${defaultBranch}`;
              if (ref !== expectedRef || !validSha(sha)) {
                core.warning('Rejected malformed or non-default-branch zero-touch dispatch metadata; no issue write performed.');
                return;
              }
              if (typeof message !== 'string' || !message.includes(installCommitMarker)) {
                core.info('Repair trigger push has no install marker; zero-touch evidence bridge is a no-op.');
                return;
              }
              await upsertInstallEvidence({
                sha,
                state: 'PENDING',
                lines: [
                  '- local runner state: `AWAITING_COMPLETION`',
                  '- evidence source: trusted GitHub-hosted push event on `main`',
                  '- expected completion workflow: `NEXUS Local Runner`'
                ]
              });
              return;
            }

            const run = context.payload.workflow_run;
            const ciWorkflows = new Set([
              'Test',
              'NEXUS Cloud Fallback',
              'NEXUS Build Verification'
            ]);
            const failureConclusions = new Set([
              'failure',
              'cancelled',
              'timed_out',
              'action_required'
            ]);
            const allowedConclusions = new Set([
              'success',
              ...failureConclusions
            ]);
            const validHeadSha = validSha(run?.head_sha);
            const validRunId = Number.isSafeInteger(run?.id) && run.id > 0;
            const validRunUrl = typeof run?.html_url === 'string' && /^https:\/\/github\.com\//.test(run.html_url);
            const validAttempt = Number.isInteger(run?.run_attempt) && run.run_attempt >= 1;

            if (run?.name === packageWorkflow) {
              if (
                !allowedConclusions.has(run.conclusion) ||
                !validHeadSha ||
                !validRunId ||
                !validRunUrl ||
                !validAttempt ||
                run.event !== 'push' ||
                run.head_branch !== defaultBranch
              ) {
                core.warning('Rejected malformed or non-main Windows package completion metadata; no package evidence write performed.');
                return;
              }
              const expectedRunUrl = `https://github.com/${owner}/${repo}/actions/runs/${run.id}`;
              if (run.html_url !== expectedRunUrl) {
                core.warning('Rejected Windows package completion with non-canonical run URL.');
                return;
              }

              try {
                const commit = (await github.rest.repos.getCommit({ owner, repo, ref: run.head_sha })).data;
                if (commit?.sha !== run.head_sha) {
                  core.warning('Rejected Windows package completion that could not bind to the exact main commit.');
                  return;
                }
              } catch (error) {
                core.warning(`Could not bind Windows package completion to exact commit (${error.message}); preserving fail-closed state.`);
                return;
              }

              let artifacts;
              try {
                artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                  owner,
                  repo,
                  run_id: run.id,
                  per_page: 100
                });
              } catch (error) {
                await upsertPackageEvidence({
                  sha: run.head_sha,
                  state: 'FAILURE',
                  lines: [
                    `- build conclusion: \`${run.conclusion}\``,
                    `- workflow run: ${run.html_url}`,
                    `- expected artifact: \`${packageArtifactName}\``,
                    `- verification error: \`${String(error.message || 'artifact lookup failed').replace(/[`\r\n\t]/g, ' ')}\``
                  ]
                });
                return;
              }

              const matches = artifacts.filter(artifact =>
                artifact?.name === packageArtifactName &&
                artifact?.expired === false &&
                Number.isSafeInteger(artifact?.id) && artifact.id > 0 &&
                Number.isFinite(artifact?.size_in_bytes) && artifact.size_in_bytes > 0
              );
              const artifactVerified = matches.length === 1;
              const success = run.conclusion === 'success' && artifactVerified;
              const evidenceLines = [
                `- build conclusion: \`${run.conclusion}\``,
                `- workflow run: ${run.html_url}`,
                `- workflow run id: \`${run.id}\``,
                `- expected artifact: \`${packageArtifactName}\``,
                `- verified matching artifacts: \`${matches.length}\``
              ];
              if (artifactVerified) {
                const artifact = matches[0];
                evidenceLines.push(`- artifact id: \`${artifact.id}\``);
                evidenceLines.push(`- artifact size bytes: \`${artifact.size_in_bytes}\``);
                if (typeof artifact.digest === 'string' && /^sha256:[0-9a-f]{64}$/.test(artifact.digest)) {
                  evidenceLines.push(`- artifact digest: \`${artifact.digest}\``);
                }
              }
              await upsertPackageEvidence({
                sha: run.head_sha,
                state: success ? 'SUCCESS' : 'FAILURE',
                lines: evidenceLines
              });
              return;
            }

            if (run?.name === installWorkflow) {
              if (
                !allowedConclusions.has(run.conclusion) ||
                !validHeadSha ||
                !validRunId ||
                !validRunUrl ||
                !validAttempt ||
                run.event !== 'push' ||
                run.head_branch !== defaultBranch
              ) {
                core.warning('Rejected malformed or non-main NEXUS Local Runner completion metadata; no install evidence write performed.');
                return;
              }
              const expectedRunUrl = `https://github.com/${owner}/${repo}/actions/runs/${run.id}`;
              if (run.html_url !== expectedRunUrl) {
                core.warning('Rejected NEXUS Local Runner completion with non-canonical run URL.');
                return;
              }

              let commit;
              try {
                commit = (await github.rest.repos.getCommit({ owner, repo, ref: run.head_sha })).data;
              } catch (error) {
                core.warning(`Could not bind local runner completion to exact commit (${error.message}); preserving fail-closed state.`);
                return;
              }
              const commitMessage = commit?.commit?.message;
              if (commit?.sha !== run.head_sha || typeof commitMessage !== 'string' || !commitMessage.includes(installCommitMarker)) {
                core.info('Local runner completion is not bound to an install-autostart main commit; no install evidence write required.');
                return;
              }

              let artifacts;
              try {
                artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                  owner,
                  repo,
                  run_id: run.id,
                  per_page: 100
                });
              } catch (error) {
                await upsertInstallEvidence({
                  sha: run.head_sha,
                  state: 'FAILURE',
                  lines: [
                    `- local runner conclusion: \`${run.conclusion}\``,
                    `- workflow run: ${run.html_url}`,
                    '- expected install artifact: `UNVERIFIED`',
                    `- verification error: \`${String(error.message || 'artifact lookup failed').replace(/[`\r\n\t]/g, ' ')}\``
                  ]
                });
                return;
              }

              const expectedArtifactName = `nexus-zero-touch-install-${run.id}`;
              const matches = artifacts.filter(artifact =>
                artifact?.name === expectedArtifactName &&
                artifact?.expired === false &&
                Number.isSafeInteger(artifact?.id) && artifact.id > 0 &&
                Number.isFinite(artifact?.size_in_bytes) && artifact.size_in_bytes > 0
              );
              const artifactVerified = matches.length === 1;
              const success = run.conclusion === 'success' && artifactVerified;
              const evidenceLines = [
                `- local runner conclusion: \`${run.conclusion}\``,
                `- workflow run: ${run.html_url}`,
                `- expected artifact: \`${expectedArtifactName}\``,
                `- verified matching artifacts: \`${matches.length}\``
              ];
              if (artifactVerified) {
                evidenceLines.push(`- artifact id: \`${matches[0].id}\``);
                evidenceLines.push(`- artifact size bytes: \`${matches[0].size_in_bytes}\``);
              }
              await upsertInstallEvidence({
                sha: run.head_sha,
                state: success ? 'SUCCESS' : 'FAILURE',
                lines: evidenceLines
              });
              return;
            }

            if (
              !run ||
              !ciWorkflows.has(run.name) ||
              !allowedConclusions.has(run.conclusion) ||
              !validHeadSha ||
              !validRunUrl ||
              !validAttempt
            ) {
              core.warning('Rejected malformed or non-allow-listed workflow_run metadata; no issue write performed.');
              return;
            }

            const safeInline = (value) => String(value ?? 'unknown')
              .replace(/[\r\n\t]/g, ' ')
              .replace(/`/g, '\\`')
              .replace(/[\u0000-\u001f\u007f]/g, '');

            const safeBranch = safeInline(run.head_branch);
            const safeEvent = safeInline(run.event);
            const marker = `<!-- nexus-ci-triage:${run.name}:${run.head_sha} -->`;
            const title = `[NEXUS CI] ${run.name} failed on ${run.head_sha.slice(0, 12)}`;
            const body = [
              marker,
              '## Event-driven CI failure',
              '',
              `- workflow: \`${run.name}\``,
              `- conclusion: \`${run.conclusion}\``,
              `- head SHA: \`${run.head_sha}\``,
              `- branch: \`${safeBranch}\``,
              `- event: \`${safeEvent}\``,
              `- run attempt: \`${run.run_attempt}\``,
              `- run: ${run.html_url}`,
              '',
              '## NEXUS handling',
              '',
              '- Treat this SHA as **not releasable / not merge-authorized** until exact-head evidence is green.',
              '- Inspect failed job logs and classify transient vs persistent.',
              '- Retry only within bounded retry policy; persistent failures require the smallest safe fix plus regression coverage.',
              '- Do not weaken tests, validators, security gates, data-integrity gates, or policy to obtain green CI.',
              '- Keep research/paper-only safety boundary; no credentials, billing, signing, production deployment, or live financial authority.',
              '',
              'This issue was created immediately by `NEXUS Event-Driven Failure Triage` so autonomous reviewers can react without waiting for the periodic polling cycle.'
            ].join('\n');

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });
            const openPrNumbers = new Set(
              issues.filter(issue => Boolean(issue.pull_request)).map(issue => issue.number)
            );

            const parseTriage = (issue) => {
              if (issue.pull_request) return null;
              const text = issue.body || '';
              const markerMatch = text.match(/<!-- nexus-ci-triage:([^:]+):([0-9a-f]{40}) -->/);
              if (!markerMatch || !ciWorkflows.has(markerMatch[1])) return null;
              const eventMatch = text.match(/^- event: `([^`]+)`/m);
              const branchMatch = text.match(/^- branch: `([^`]+)`/m);
              const runMatch = text.match(/^- run: https:\/\/github\.com\/[^/\s]+\/[^/\s]+\/actions\/runs\/(\d+)$/m);
              return {
                workflow: markerMatch[1],
                sha: markerMatch[2],
                event: eventMatch?.[1] || 'unknown',
                branch: branchMatch?.[1] || 'unknown',
                runId: runMatch ? Number(runMatch[1]) : null
              };
            };

            const closeIssue = async (issue, reason) => {
              const currentBody = issue.body || '';
              const note = `\n\n---\nClosed automatically by NEXUS CI hygiene: ${reason}`;
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'not_planned',
                body: currentBody.includes('Closed automatically by NEXUS CI hygiene:') ? currentBody : currentBody + note
              });
              core.info(`Closed superseded triage issue #${issue.number}: ${reason}`);
            };

            const currentBranchSupersedes = (parsed) => (
              parsed.workflow === run.name &&
              parsed.event === run.event &&
              parsed.branch === safeBranch &&
              parsed.sha !== run.head_sha
            );

            for (const issue of issues) {
              const parsed = parseTriage(issue);
              if (!parsed) continue;

              if (currentBranchSupersedes(parsed)) {
                await closeIssue(issue, `a newer ${run.name} run exists for branch ${safeBranch}.`);
                continue;
              }

              if (
                parsed.event === 'push' &&
                parsed.branch === defaultBranch &&
                run.event === 'push' &&
                safeBranch === defaultBranch &&
                parsed.workflow === run.name &&
                parsed.sha !== run.head_sha
              ) {
                await closeIssue(issue, `a newer ${run.name} run exists on ${defaultBranch}.`);
                continue;
              }

              if (parsed.event === 'pull_request' && Number.isSafeInteger(parsed.runId) && parsed.runId > 0) {
                try {
                  const historical = (await github.rest.actions.getWorkflowRun({
                    owner,
                    repo,
                    run_id: parsed.runId
                  })).data;
                  const expectedRepoUrl = `https://github.com/${owner}/${repo}/actions/runs/${parsed.runId}`;
                  const bound = historical.name === parsed.workflow &&
                    historical.head_sha === parsed.sha &&
                    historical.event === 'pull_request' &&
                    historical.html_url === expectedRepoUrl;
                  const associatedPrNumbers = Array.isArray(historical.pull_requests)
                    ? historical.pull_requests
                        .map(pr => pr?.number)
                        .filter(number => Number.isSafeInteger(number) && number > 0)
                    : [];

                  if (!bound) {
                    core.warning(`Preserved triage issue #${issue.number}: historical workflow evidence mismatch.`);
                    continue;
                  }
                  if (associatedPrNumbers.length === 0) {
                    core.warning(`Preserved triage issue #${issue.number}: no independently associated pull request.`);
                    continue;
                  }
                  if (associatedPrNumbers.every(number => !openPrNumbers.has(number))) {
                    await closeIssue(issue, `all pull requests bound to workflow run ${parsed.runId} are closed or merged.`);
                  }
                } catch (error) {
                  core.warning(`Preserved triage issue #${issue.number}: historical run verification failed (${error.message}).`);
                }
              }
            }

            const refreshedIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });
            const existing = refreshedIssues.find(i => !i.pull_request && (i.body || '').includes(marker));

            if (run.conclusion === 'success') {
              if (existing) {
                await closeIssue(existing, 'the exact SHA now has a successful workflow run.');
              }
              core.info(`Successful ${run.name} run on ${run.head_sha}; no failure issue required.`);
              return;
            }

            if (!failureConclusions.has(run.conclusion)) {
              core.info(`Conclusion ${run.conclusion} does not require a failure issue.`);
              return;
            }

            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                title,
                body
              });
              core.info(`Updated triage issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body });
              core.info(`Created triage issue #${created.data.number}`);
            }