name: Export dataset snapshot

on:
  pull_request:
    paths:
      - ".github/workflows/export_snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Generate verified snapshot manifest
        run: python snapshot_manifest.py

      - name: Record source revision
        shell: bash
        run: |
          printf '%s\n' "${GITHUB_SHA}" > data/market/_source_revision.txt

      - name: Upload market dataset snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lbank-market-snapshot-${{ github.sha }}
          path: data/market
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
