name: Export dataset snapshot

on:
  pull_request:
    paths:
      - ".github/workflows/export_snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Generate verified snapshot manifest
        run: python snapshot_manifest.py

      - name: Record source revision
        shell: bash
        run: |
          printf '%s\n' "${GITHUB_SHA}" > data/market/_source_revision.txt

      - name: Upload market dataset snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lbank-market-snapshot-${{ github.sha }}
          path: data/market
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
