name: NEXUS Bybit WSL Runner Wake

on:
  workflow_dispatch:
  schedule:
    - cron: '11,41 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/nexus-bybit-wsl-runner-wake.yml

# Bootstrap-safe recovery path. The GitHub Windows service runner cannot rely on
# visibility of a WSL distribution that belongs to the interactive Windows user.
# It therefore requests an already-configured Scheduled Task, which executes
# under its existing principal and owns the Windows -> WSL boundary. The job may
# re-enable only the exact allowlisted existing recovery tasks when Windows reports
# them disabled. It never creates/deletes tasks, re-registers runners, or changes
# Paper/Live trading authority.
#
# Deliberately contains no `uses:` steps. GitHub pre-downloads actions before any
# step executes; a transient action-download failure must not prevent recovery.
permissions:
  contents: read

concurrency:
  group: nexus-bybit-wsl-runner-wake
  cancel-in-progress: true

jobs:
  wake:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event_name == 'push'
    runs-on: [self-hosted, Windows, nexus-local]
    timeout-minutes: 5
    steps:
      - name: Recover and request existing scheduled Bybit WSL recovery
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $schtasks = Join-Path $env:SystemRoot 'System32\schtasks.exe'
          if (-not (Test-Path -LiteralPath $schtasks -PathType Leaf)) {
            throw 'schtasks.exe is required for bootstrap-safe Bybit WSL recovery.'
          }

          # Exact allowlist only. A task is changed only when /Run returns the
          # explicit disabled-state error; every other failure remains fail-closed.
          $candidates = @(
            'NEXUS Bybit WSL Runner Persistent',
            'NEXUS Bybit WSL Runner'
          )

          Write-Host "source_sha=$env:GITHUB_SHA"
          Write-Host 'runner_registration_mutated=false'
          Write-Host 'live_trading_authority_changed=false'

          $selected = $null
          $taskMutationPerformed = $false
          foreach ($taskName in $candidates) {
            Write-Host "scheduler_attempt_task=$taskName"

            $previousErrorActionPreference = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            try {
              $runOutput = @(& $schtasks /Run /TN $taskName 2>&1)
              $runCode = $LASTEXITCODE
            }
            finally {
              $ErrorActionPreference = $previousErrorActionPreference
            }

            $sanitized = (($runOutput | ForEach-Object { $_.ToString() }) | Out-String).Trim()
            Write-Host "scheduler_attempt_exit_code=$runCode"
            if ($sanitized) { Write-Host "scheduler_response=$sanitized" }

            if ($runCode -eq 0) {
              $selected = $taskName
              break
            }

            if ($sanitized -match '(?i)disabled') {
              Write-Host "scheduler_enable_attempt_task=$taskName"
              $previousErrorActionPreference = $ErrorActionPreference
              $ErrorActionPreference = 'Continue'
              try {
                $enableOutput = @(& $schtasks /Change /TN $taskName /ENABLE 2>&1)
                $enableCode = $LASTEXITCODE
              }
              finally {
                $ErrorActionPreference = $previousErrorActionPreference
              }

              $enableSanitized = (($enableOutput | ForEach-Object { $_.ToString() }) | Out-String).Trim()
              Write-Host "scheduler_enable_exit_code=$enableCode"
              if ($enableSanitized) { Write-Host "scheduler_enable_response=$enableSanitized" }

              if ($enableCode -eq 0) {
                $taskMutationPerformed = $true
                $previousErrorActionPreference = $ErrorActionPreference
                $ErrorActionPreference = 'Continue'
                try {
                  $retryOutput = @(& $schtasks /Run /TN $taskName 2>&1)
                  $retryCode = $LASTEXITCODE
                }
                finally {
                  $ErrorActionPreference = $previousErrorActionPreference
                }

                $retrySanitized = (($retryOutput | ForEach-Object { $_.ToString() }) | Out-String).Trim()
                Write-Host "scheduler_retry_exit_code=$retryCode"
                if ($retrySanitized) { Write-Host "scheduler_retry_response=$retrySanitized" }
                if ($retryCode -eq 0) {
                  $selected = $taskName
                  break
                }
              }
            }
          }

          Write-Host "task_mutation_performed=$($taskMutationPerformed.ToString().ToLowerInvariant())"
          if (-not $selected) {
            throw 'All approved NEXUS Bybit WSL Scheduled Task run requests were rejected.'
          }

          Write-Host "selected_recovery_task=$selected"
          Write-Host 'bybit_wsl_scheduler_wake_request=PASS'
