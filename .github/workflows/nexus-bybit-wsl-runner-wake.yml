name: NEXUS Bybit WSL Runner Wake

on:
  workflow_dispatch:
  schedule:
    - cron: '11,41 * * * *'
  push:
    branches: [main]
    paths:
      - scripts/trigger_nexus_bybit_wsl_runner_task.ps1
      - .github/workflows/nexus-bybit-wsl-runner-wake.yml

# Recovery boundary: the Windows GitHub runner is a service account and must
# not invoke WSL directly because WSL distributions are user-context scoped.
# This workflow only requests an already-registered user-context Scheduled Task.
# It never creates/replaces tasks or runners and never changes Paper/Live authority.
permissions:
  contents: read

concurrency:
  group: nexus-bybit-wsl-runner-wake
  cancel-in-progress: true

jobs:
  wake:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[wake-bybit-wsl]'))
    runs-on: [self-hosted, Windows]
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Verify exact trigger SHA
        run: |
          for /f %%S in ('git rev-parse HEAD') do set "CHECKED_OUT_SHA=%%S"
          if /I not "%CHECKED_OUT_SHA%"=="%GITHUB_SHA%" exit /b 1
          echo exact_trigger_sha=%CHECKED_OUT_SHA%

      - name: Parse bounded task-context wake script
        run: >-
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command
          "$tokens=$null;$errors=$null;[void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts\trigger_nexus_bybit_wsl_runner_task.ps1'),[ref]$tokens,[ref]$errors);if($errors.Count -gt 0){$errors | ForEach-Object { Write-Error $_.Message };exit 1}"

      - name: Request existing user-context Bybit WSL task
        run: >-
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts\trigger_nexus_bybit_wsl_runner_task.ps1
          -OutputPath "build\bybit-wsl-runner-wake\evidence.json"

      - name: Upload sanitized wake evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-bybit-wsl-runner-wake-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/bybit-wsl-runner-wake/evidence.json
          if-no-files-found: error
          retention-days: 14
