name: NEXUS Bybit WSL Runner Wake

on:
  workflow_dispatch:
  schedule:
    - cron: '11,41 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/nexus-bybit-wsl-runner-wake.yml

# Bootstrap-safe recovery path for the already-registered Bybit WSL runner.
# The legacy Windows Scheduled Tasks are intentionally not used here because
# runtime evidence proved they are disabled and ACL-locked even from the
# repository-bound DR runner. Instead, the DR runner verifies the exact existing
# WSL runner registration and starts that registration directly inside Ubuntu.
# No runner registration, credentials, Windows task ACLs, or trading authority
# are modified.
permissions:
  contents: read

concurrency:
  group: nexus-bybit-wsl-runner-wake
  cancel-in-progress: true

jobs:
  wake:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event_name == 'push'
    runs-on: [self-hosted, Windows, X64, nexus-remote-rescue]
    timeout-minutes: 5
    steps:
      - name: Verify and wake exact existing Bybit WSL runner
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          Set-StrictMode -Version 2.0

          $windowsRunnerRoot = 'C:\actions-runner\actions-runner'
          $windowsRunnerConfig = Join-Path $windowsRunnerRoot '.runner'
          $expectedWindowsRunnerName = 'NEXUS-WINDOWS-DR'
          $expectedGitHubUrl = 'https://github.com/saladinayoubi1/lbank-research-automation'
          $distribution = 'Ubuntu'
          $wslRunnerRoot = '/opt/nexus-bybit-runner'
          $expectedWslRunnerName = 'NEXUS-BYBIT-WSL'
          $serviceName = 'nexus-bybit-runner.service'
          $wsl = Join-Path $env:SystemRoot 'System32\wsl.exe'

          if (-not (Test-Path -LiteralPath $windowsRunnerConfig -PathType Leaf)) {
            throw "exact DR runner config missing: $windowsRunnerConfig"
          }
          $windowsConfig = Get-Content -LiteralPath $windowsRunnerConfig -Raw | ConvertFrom-Json
          if ([string]$windowsConfig.agentName -ne $expectedWindowsRunnerName) {
            throw "exact DR runner name mismatch: $($windowsConfig.agentName)"
          }
          if ([string]$windowsConfig.gitHubUrl -ne $expectedGitHubUrl) {
            throw 'exact DR runner repository binding mismatch'
          }
          if (-not (Test-Path -LiteralPath $wsl -PathType Leaf)) {
            throw 'wsl.exe is required for native Bybit runner recovery.'
          }

          function Invoke-Wsl {
            param([Parameter(Mandatory = $true)][string]$Command)
            $previous = $ErrorActionPreference
            try {
              $ErrorActionPreference = 'Continue'
              $normalizedCommand = $Command.Replace("`r", '')
              $raw = @(& $wsl -d $distribution -u root -- bash -lc $normalizedCommand 2>&1)
              $code = $LASTEXITCODE
              $text = (($raw | ForEach-Object { $_.ToString() }) | Out-String).Trim()
              return [pscustomobject]@{ Code = [int]$code; Text = $text }
            }
            finally {
              $ErrorActionPreference = $previous
            }
          }

          Write-Host "recovery_runner=$($windowsConfig.agentName)"
          Write-Host 'recovery_runner_binding=PASS'
          Write-Host "source_sha=$env:GITHUB_SHA"
          Write-Host 'legacy_scheduled_tasks_used=false'
          Write-Host 'windows_task_acl_modified=false'
          Write-Host 'runner_registration_mutated=false'
          Write-Host 'runner_credentials_mutated=false'
          Write-Host 'live_trading_authority_changed=false'

          $registrationProbe = @"
          set -euo pipefail
          test -x '$wslRunnerRoot/run.sh'
          test -x '$wslRunnerRoot/bin/Runner.Listener'
          test -f '$wslRunnerRoot/.runner'
          test -f '$wslRunnerRoot/.credentials'
          grep -Eq '"agentName"[[:space:]]*:[[:space:]]*"$expectedWslRunnerName"' '$wslRunnerRoot/.runner'
          grep -Eq '"gitHubUrl"[[:space:]]*:[[:space:]]*"https://github.com/saladinayoubi1/lbank-research-automation/?"' '$wslRunnerRoot/.runner'
          "@
          $probe = Invoke-Wsl -Command $registrationProbe
          if ($probe.Code -ne 0) {
            if ($probe.Text) { Write-Host "wsl_registration_probe=$($probe.Text)" }
            throw 'Exact existing Bybit WSL runner registration could not be verified.'
          }
          Write-Host "wsl_distribution=$distribution"
          Write-Host "wsl_runner_root=$wslRunnerRoot"
          Write-Host "wsl_runner_name=$expectedWslRunnerName"
          Write-Host 'wsl_runner_registration=PASS'

          $listenerProbe = Invoke-Wsl -Command "pgrep -f '$wslRunnerRoot/bin/Runner.Listener' >/dev/null 2>&1"
          if ($listenerProbe.Code -eq 0) {
            Write-Host 'wsl_runner_listener=ALREADY_RUNNING'
            Write-Host 'bybit_wsl_native_wake=PASS'
            exit 0
          }

          $systemdProbe = Invoke-Wsl -Command "ps -p 1 -o comm= | grep -qx '[[:space:]]*systemd[[:space:]]*' && test -f '/etc/systemd/system/$serviceName'"
          if ($systemdProbe.Code -eq 0) {
            $start = Invoke-Wsl -Command "set -e; systemctl daemon-reload; systemctl start '$serviceName'"
            if ($start.Code -ne 0) {
              if ($start.Text) { Write-Host "systemd_start_response=$($start.Text)" }
              throw 'Existing Bybit WSL systemd service could not be started.'
            }
            Write-Host 'wsl_runner_start_method=existing-systemd-service'
          }
          else {
            # Clear GitHub runner process tracking for the detached child so the
            # Windows job cleanup does not treat the Linux listener as an orphan.
            $env:RUNNER_TRACKING_ID = ''
            $start = Invoke-Wsl -Command "set -e; cd '$wslRunnerRoot'; nohup env RUNNER_ALLOW_RUNASROOT=1 ./run.sh > /tmp/nexus-bybit-runner.log 2>&1 < /dev/null &"
            if ($start.Code -ne 0) {
              if ($start.Text) { Write-Host "direct_start_response=$($start.Text)" }
              throw 'Exact existing Bybit WSL runner could not be started directly.'
            }
            Write-Host 'wsl_runner_start_method=detached-existing-run-sh'
          }

          $observed = $false
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            Start-Sleep -Seconds 1
            $listenerProbe = Invoke-Wsl -Command "pgrep -f '$wslRunnerRoot/bin/Runner.Listener' >/dev/null 2>&1"
            if ($listenerProbe.Code -eq 0) {
              $observed = $true
              break
            }
          }
          if (-not $observed) {
            $tail = Invoke-Wsl -Command "test -f /tmp/nexus-bybit-runner.log && tail -n 30 /tmp/nexus-bybit-runner.log || true"
            if ($tail.Text) { Write-Host "wsl_runner_log_tail=$($tail.Text)" }
            throw 'Bybit WSL Runner.Listener was not observed within the bounded startup window.'
          }

          Write-Host 'wsl_runner_listener=RUNNING'
          Write-Host 'bybit_wsl_native_wake=PASS'
