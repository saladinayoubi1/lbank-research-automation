name: NEXUS Bybit WSL Runner Wake

on:
  workflow_dispatch:
  schedule:
    - cron: '11,41 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/nexus-bybit-wsl-runner-wake.yml

# Bootstrap-safe recovery for the already-registered Bybit WSL runner.
# Keep the recovery contract aligned with install_nexus_bybit_wsl_user_startup.ps1:
# exact Ubuntu distribution, exact isolated runner root, exact existing runner name,
# procfs liveness checks, and no registration/credential/ACL/trading-authority mutation.
permissions:
  contents: read

concurrency:
  group: nexus-bybit-wsl-runner-wake
  cancel-in-progress: true

jobs:
  wake:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event_name == 'push'
    runs-on: [self-hosted, Windows, X64, nexus-remote-rescue]
    timeout-minutes: 5
    steps:
      - name: Verify and wake exact existing Bybit WSL runner
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          Set-StrictMode -Version 2.0

          $windowsRunnerRoot = 'C:\actions-runner\actions-runner'
          $windowsRunnerConfig = Join-Path $windowsRunnerRoot '.runner'
          $expectedWindowsRunnerName = 'NEXUS-WINDOWS-DR'
          $expectedGitHubUrl = 'https://github.com/saladinayoubi1/lbank-research-automation'
          $distribution = 'Ubuntu'
          $wslRunnerRoot = '/opt/nexus-bybit-runner'
          $expectedWslRunnerName = 'NEXUS-BYBIT-WSL'
          $wsl = Join-Path $env:SystemRoot 'System32\wsl.exe'

          if (-not (Test-Path -LiteralPath $windowsRunnerConfig -PathType Leaf)) {
            throw "exact DR runner config missing: $windowsRunnerConfig"
          }
          $windowsConfig = Get-Content -LiteralPath $windowsRunnerConfig -Raw | ConvertFrom-Json
          if ([string]$windowsConfig.agentName -ne $expectedWindowsRunnerName) {
            throw "exact DR runner name mismatch: $($windowsConfig.agentName)"
          }
          if ([string]$windowsConfig.gitHubUrl -ne $expectedGitHubUrl) {
            throw 'exact DR runner repository binding mismatch'
          }
          if (-not (Test-Path -LiteralPath $wsl -PathType Leaf)) {
            throw 'wsl.exe is required for native Bybit runner recovery.'
          }

          function Invoke-Wsl {
            param([Parameter(Mandatory = $true)][string]$Command)
            $previous = $ErrorActionPreference
            try {
              $ErrorActionPreference = 'Continue'
              $normalizedCommand = $Command.Replace("`r`n", "`n").Replace("`r", "`n")
              $raw = @(& $wsl -d $distribution -u root -- bash -lc $normalizedCommand 2>&1)
              $code = $LASTEXITCODE
              $text = (($raw | ForEach-Object { $_.ToString() }) | Out-String).Trim()
              return [pscustomobject]@{ Code = [int]$code; Text = $text }
            }
            finally {
              $ErrorActionPreference = $previous
            }
          }

          function Get-ListenerState {
            $command = @'
listener=0
for proc in /proc/[0-9]*; do
  [ -r "$proc/cmdline" ] || continue
  exe=''
  IFS= read -r -d '' exe < "$proc/cmdline" || continue
  case "$exe" in
    '__RUNNER_ROOT__/bin/Runner.Listener') listener=1; break ;;
  esac
done
printf 'listener=%s\n' "$listener"
'@
            $command = $command.Replace('__RUNNER_ROOT__', $wslRunnerRoot)
            $probe = Invoke-Wsl -Command $command
            if ($probe.Code -ne 0) {
              return [pscustomobject]@{ Known = $false; Listener = $false }
            }
            if ($probe.Text -match '(?m)^listener=1$') {
              return [pscustomobject]@{ Known = $true; Listener = $true }
            }
            if ($probe.Text -match '(?m)^listener=0$') {
              return [pscustomobject]@{ Known = $true; Listener = $false }
            }
            return [pscustomobject]@{ Known = $false; Listener = $false }
          }

          Write-Host "recovery_runner=$($windowsConfig.agentName)"
          Write-Host 'recovery_runner_binding=PASS'
          Write-Host "source_sha=$env:GITHUB_SHA"
          Write-Host 'legacy_scheduled_tasks_used=false'
          Write-Host 'windows_task_acl_modified=false'
          Write-Host 'runner_registration_mutated=false'
          Write-Host 'runner_credentials_mutated=false'
          Write-Host 'live_trading_authority_changed=false'

          # Match the canonical existing-registration contract used by the user-startup watchdog.
          $registrationProbe = @'
test -x '__RUNNER_ROOT__/run.sh' || { printf 'registration_check=run_sh_missing\n'; exit 10; }
test -f '__RUNNER_ROOT__/.runner' || { printf 'registration_check=runner_config_missing\n'; exit 11; }
found=0
while IFS= read -r line; do
  case "$line" in
    *'"agentName"'*'__EXPECTED_RUNNER_NAME__'*) found=1 ;;
  esac
done < '__RUNNER_ROOT__/.runner'
if [ "$found" -ne 1 ]; then printf 'registration_check=runner_name_mismatch\n'; exit 12; fi
printf 'registration_check=pass\n'
'@
          $registrationProbe = $registrationProbe.Replace('__RUNNER_ROOT__', $wslRunnerRoot).Replace('__EXPECTED_RUNNER_NAME__', $expectedWslRunnerName)
          $probe = Invoke-Wsl -Command $registrationProbe
          if ($probe.Code -ne 0) {
            if ($probe.Text) { Write-Host $probe.Text }
            throw "Exact existing Bybit WSL runner registration could not be verified (exit=$($probe.Code))."
          }
          Write-Host 'wsl_runner_registration=PASS'

          $state = Get-ListenerState
          if (-not $state.Known) {
            throw 'Bybit WSL listener state could not be determined safely.'
          }
          if ($state.Listener) {
            Write-Host 'wsl_runner_listener=ALREADY_RUNNING'
            Write-Host 'bybit_wsl_native_wake=PASS'
            exit 0
          }

          # Keep a detached Windows wsl.exe host alive for WSL1 compatibility, mirroring
          # the canonical user-startup watchdog. Clearing RUNNER_TRACKING_ID prevents
          # GitHub job cleanup from classifying this long-lived host as a job orphan.
          $previousTrackingId = [string]$env:RUNNER_TRACKING_ID
          $env:RUNNER_TRACKING_ID = ''
          $psi = New-Object Diagnostics.ProcessStartInfo
          $psi.FileName = $wsl
          $psi.Arguments = '-d ' + $distribution + ' -u root -- bash'
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $psi.WindowStyle = [Diagnostics.ProcessWindowStyle]::Hidden
          $psi.RedirectStandardInput = $true
          $hostProcess = New-Object Diagnostics.Process
          $hostProcess.StartInfo = $psi

          try {
            if (-not $hostProcess.Start()) {
              throw 'Could not start the existing Bybit WSL runner host process.'
            }
            $startCommand = "cd '$wslRunnerRoot' && export RUNNER_ALLOW_RUNASROOT=1 && export RUNNER_TRACKING_ID= && exec ./run.sh >>'/tmp/nexus-bybit-runner.log' 2>&1"
            $normalizedStart = $startCommand.Replace("`r`n", "`n").Replace("`r", "`n")
            $hostProcess.StandardInput.Write($normalizedStart)
            $hostProcess.StandardInput.Write("`n")
            $hostProcess.StandardInput.Close()
            Start-Sleep -Seconds 5
            if ($hostProcess.HasExited) {
              throw "Existing Bybit WSL runner exited during startup (exit=$($hostProcess.ExitCode))."
            }

            $observed = $false
            for ($attempt = 1; $attempt -le 20; $attempt++) {
              $state = Get-ListenerState
              if ($state.Known -and $state.Listener) {
                $observed = $true
                break
              }
              Start-Sleep -Seconds 1
            }
            if (-not $observed) {
              throw 'Bybit WSL Runner.Listener was not observed within the bounded startup window.'
            }

            Write-Host "wsl_host_pid=$($hostProcess.Id)"
            Write-Host 'wsl_runner_start_method=managed-existing-run-sh'
            Write-Host 'wsl_runner_listener=RUNNING'
            Write-Host 'bybit_wsl_native_wake=PASS'
          }
          finally {
            $env:RUNNER_TRACKING_ID = $previousTrackingId
            if ($null -ne $hostProcess -and $hostProcess.HasExited) {
              $hostProcess.Dispose()
            }
          }
