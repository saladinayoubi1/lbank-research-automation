name: NEXUS Bybit WSL Runner Wake

on:
  workflow_dispatch:
  schedule:
    - cron: '11,41 * * * *'
  push:
    branches: [main]
    paths:
      - scripts/install_nexus_bybit_wsl_user_startup.ps1
      - .github/workflows/nexus-bybit-wsl-runner-wake.yml

# Bootstrap-safe recovery for the already-registered Bybit WSL runner. The
# signed-in Lenovo user watchdog owns the long-lived wsl.exe child so it is not
# coupled to the lifetime of this GitHub Actions job. Registration, credentials,
# Windows ACLs, Task Scheduler, and trading authority remain untouched.
permissions:
  contents: read

env:
  NEXUS_BYBIT_WSL_STARTUP_SCRIPT_BLOB_SHA: b89fd80acaad635a2f2c8a43f095e6bcaa28cfcb

concurrency:
  group: nexus-bybit-wsl-runner-wake
  cancel-in-progress: true

jobs:
  wake:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event_name == 'push'
    runs-on: [self-hosted, Windows, X64, nexus-local]
    timeout-minutes: 8
    steps:
      - name: Prepare exact pinned user-context watchdog without action downloads
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          Set-StrictMode -Version 2.0

          $expectedWindowsRunnerName = 'NEXUS-LOCAL-RUNNER'
          $expectedRepository = 'saladinayoubi1/lbank-research-automation'
          $relativePath = 'scripts\install_nexus_bybit_wsl_user_startup.ps1'
          $expectedBlob = $env:NEXUS_BYBIT_WSL_STARTUP_SCRIPT_BLOB_SHA.ToLowerInvariant()
          $targetSha = [string]$env:GITHUB_SHA
          $prepared = Join-Path $env:RUNNER_TEMP "nexus-bybit-wsl-user-startup-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.ps1"
          $rawUrl = "https://raw.githubusercontent.com/$expectedRepository/$targetSha/scripts/install_nexus_bybit_wsl_user_startup.ps1"

          if ([string]$env:RUNNER_NAME -ne $expectedWindowsRunnerName) {
            throw "exact local runner name mismatch: $env:RUNNER_NAME"
          }
          if ([string]$env:GITHUB_REPOSITORY -ne $expectedRepository) {
            throw "exact repository binding mismatch: $env:GITHUB_REPOSITORY"
          }
          if ([string]$env:RUNNER_OS -ne 'Windows' -or [string]$env:RUNNER_ARCH -ne 'X64') {
            throw "unexpected recovery runner platform: $env:RUNNER_OS/$env:RUNNER_ARCH"
          }

          function Get-GitBlob([string]$Path) {
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) { return '' }
            $value = (& git hash-object -- $Path 2>$null)
            if ($LASTEXITCODE -ne 0 -or -not $value) { return '' }
            return ([string]$value).Trim().ToLowerInvariant()
          }

          Remove-Item -LiteralPath $prepared -Force -ErrorAction SilentlyContinue
          $source = ''
          $cached = Join-Path $env:GITHUB_WORKSPACE $relativePath
          if ((Get-GitBlob -Path $cached) -eq $expectedBlob) {
            Copy-Item -LiteralPath $cached -Destination $prepared -Force
            $source = 'local-pinned-cache'
          }

          if (-not $source) {
            for ($attempt = 1; $attempt -le 4; $attempt++) {
              try {
                Invoke-WebRequest -UseBasicParsing -Uri $rawUrl -OutFile $prepared -TimeoutSec 20
                if ((Get-GitBlob -Path $prepared) -eq $expectedBlob) {
                  $source = "bounded-raw-fetch-attempt-$attempt"
                  break
                }
                Write-Warning "Downloaded watchdog failed pinned blob verification on attempt $attempt."
              }
              catch {
                Write-Warning "Bounded watchdog fetch attempt $attempt failed: $($_.Exception.Message)"
              }
              if ($attempt -lt 4) {
                Remove-Item -LiteralPath $prepared -Force -ErrorAction SilentlyContinue
                Start-Sleep -Seconds (2 * $attempt)
              }
            }
          }

          $actualBlob = Get-GitBlob -Path $prepared
          if (-not $source -or $actualBlob -ne $expectedBlob) {
            throw "Exact pinned Bybit WSL watchdog unavailable: expected=$expectedBlob actual=$actualBlob"
          }

          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($prepared, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'Pinned Bybit WSL watchdog failed PowerShell parsing.'
          }

          $utf8 = New-Object Text.UTF8Encoding($false)
          [IO.File]::AppendAllText($env:GITHUB_ENV, "NEXUS_BYBIT_WSL_RECOVERY_SCRIPT=$prepared`n", $utf8)
          Write-Host "physical_source_transport=$source"
          Write-Host "source_sha=$targetSha"
          Write-Host "bybit_wsl_watchdog_blob=$actualBlob"
          Write-Host 'hosted_actions_used=false'
          Write-Host 'runner_registration_mutated=false'
          Write-Host 'runner_credentials_mutated=false'
          Write-Host 'windows_task_acl_modified=false'
          Write-Host 'live_trading_authority_changed=false'

      - name: Install and start durable signed-in-user watchdog
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File $env:NEXUS_BYBIT_WSL_RECOVERY_SCRIPT `
            -Mode Install `
            -Distribution Ubuntu `
            -RunnerRoot /opt/nexus-bybit-runner `
            -ExpectedRunnerName NEXUS-BYBIT-WSL
          if ($LASTEXITCODE -ne 0) {
            throw "Durable Bybit WSL watchdog installation failed with exit code $LASTEXITCODE."
          }

      - name: Require detached watchdog and live exact listener
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version 2.0

          $stateRoot = Join-Path $env:LOCALAPPDATA 'NEXUS\BybitWSLUserStartup'
          $evidencePath = Join-Path $stateRoot 'evidence.json'
          if (-not (Test-Path -LiteralPath $evidencePath -PathType Leaf)) {
            throw 'Durable Bybit WSL watchdog evidence is missing.'
          }
          $evidence = Get-Content -LiteralPath $evidencePath -Raw | ConvertFrom-Json
          if ($evidence.schema_version -ne 7) { throw "Unexpected evidence schema: $($evidence.schema_version)" }
          if ($evidence.decision -ne 'USER_CONTEXT_MANAGED_CHILD_LIVENESS_SELF_HEAL_ACTIVE') {
            throw "Durable recovery did not reach the active state: $($evidence.decision)"
          }
          if ($evidence.expected_runner_name -ne 'NEXUS-BYBIT-WSL' -or $evidence.distribution -ne 'Ubuntu') {
            throw 'Exact Bybit WSL runner identity was not preserved.'
          }
          if ($evidence.listener_observed -ne $true -or $evidence.watchdog_generation -ne 9) {
            throw 'Exact Bybit WSL listener or current watchdog generation was not observed.'
          }
          if ($evidence.wsl_command_transport -ne 'BASE64_ARGV') {
            throw "Unexpected WSL command transport: $($evidence.wsl_command_transport)"
          }
          if ($evidence.wsl_standard_stream_redirection -ne $false) {
            throw 'WSL1 recovery unexpectedly redirected a standard stream.'
          }
          foreach ($requiredFalse in @(
            'task_scheduler_used',
            'runner_registration_modified',
            'runner_credentials_modified',
            'windows_acl_modified',
            'windows_service_modified',
            'private_exchange_credentials_used',
            'live_trading_authority_changed'
          )) {
            if ($evidence.$requiredFalse -ne $false) { throw "Safety boundary changed: $requiredFalse" }
          }
          if ($evidence.actions_process_tracking_detached -ne $true) {
            throw 'Watchdog did not detach from GitHub Actions process tracking.'
          }
          if (-not (Test-Path -LiteralPath $evidence.startup_path -PathType Leaf) -or
              -not (Test-Path -LiteralPath $evidence.stable_watchdog_path -PathType Leaf)) {
            throw 'Per-user startup launcher or stable watchdog is missing.'
          }

          Start-Sleep -Seconds 20
          $watchdogMutexName = 'Local\NEXUS-Bybit-WSL-Watchdog-v' + [int]$evidence.watchdog_generation + '-' + [string]$evidence.windows_user_sid
          $createdNew = $false
          $watchdogMutex = New-Object Threading.Mutex($false, $watchdogMutexName, [ref]$createdNew)
          $watchdogFound = $false
          try {
            if (-not $createdNew) {
              $acquired = $false
              try {
                $acquired = $watchdogMutex.WaitOne(0)
              }
              catch [Threading.AbandonedMutexException] {
                $acquired = $true
              }
              if ($acquired) {
                try { $watchdogMutex.ReleaseMutex() } catch { }
              }
              else {
                $watchdogFound = $true
              }
            }
          }
          finally {
            $watchdogMutex.Dispose()
          }
          if (-not $watchdogFound) { throw 'Detached signed-in-user watchdog did not remain alive.' }

          Write-Host 'bybit_wsl_durable_recovery=PASS'
          Write-Host 'post_install_watchdog_process=RUNNING'
          Write-Host 'wsl_runner_listener=RUNNING'
          Write-Host 'actions_process_tracking_detached=true'
          Write-Host 'task_scheduler_used=false'
          Write-Host 'runner_registration_mutated=false'
          Write-Host 'runner_credentials_mutated=false'
          Write-Host 'live_trading_authority_changed=false'
