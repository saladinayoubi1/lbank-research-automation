name: Build Nursery Android APK

on:
  push:
    branches: [ "nursery-android-build" ]
    paths:
      - "android-nursery/**"
      - ".github/workflows/build-nursery-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android-nursery
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore fast-entry app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          parts = sorted(Path('payload_v110').glob('part*.txt'))
          if not parts:
              raise SystemExit('payload parts missing')
          src = ''.join(p.read_text().strip() for p in parts)
          raw = gzip.decompress(base64.b64decode(src))
          out = Path('app/src/main/assets/index.html')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(raw)
          print('restored', len(raw), 'bytes from', len(parts), 'parts')
          PY

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Validate APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 5
          sha256sum "$APK"
          cp "$APK" NurseryDaily-Android-v1.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NurseryDaily-Android-v1.1.0-fast-entry
          path: android-nursery/NurseryDaily-Android-v1.1.0.apk
          if-no-files-found: error
          retention-days: 30
