name: Verify resumable Bybit Spot backfill

on:
  pull_request:
    paths:
      - ".github/workflows/bybit_resumable_backfill.yml"
      - "bybit_spot_backfill.py"
      - "bybit_spot_archive_audit.py"
      - "bybit_spot_archive_collector.py"
      - "tests/test_bybit_spot_backfill.py"
      - "requirements.lock"
      - "requirements-dev.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Check dependency consistency
        run: python -m pip check

      - name: Process the first bounded monthly unit
        run: >-
          python bybit_spot_backfill.py
          --start-date 2022-12-01
          --end-date 2023-01-31
          --state-root build/bybit_backfill_state
          --cache-root build/bybit_backfill_cache
          --max-archives-per-run 2
          --clean

      - name: Verify the incomplete checkpoint after stage one
        run: >-
          python -c "import json, pathlib, sys;
          root=pathlib.Path('build/bybit_backfill_state');
          report=json.loads((root/'_backfill_report.json').read_text());
          checkpoint=json.loads((root/'_checkpoint.json').read_text());
          s=report['summary'];
          units=[u['unit_id'] for u in checkpoint['completed_units']];
          ok=(s['plan_units']==2 and s['completed_units']==1 and
          s['remaining_units']==1 and s['units_completed_this_run']==1 and
          s['archives_completed_this_run']==2 and not s['backfill_complete'] and
          s['current_dataset_integrity_ok'] and units==['monthly:2022-12']);
          sys.exit(0 if ok else 1)"

      - name: Resume and process the second bounded monthly unit
        run: >-
          python bybit_spot_backfill.py
          --start-date 2022-12-01
          --end-date 2023-01-31
          --state-root build/bybit_backfill_state
          --cache-root build/bybit_backfill_cache
          --max-archives-per-run 2

      - name: Verify completion without reprocessing December
        run: >-
          python -c "import json, pathlib, sys;
          root=pathlib.Path('build/bybit_backfill_state');
          report=json.loads((root/'_backfill_report.json').read_text());
          checkpoint=json.loads((root/'_checkpoint.json').read_text());
          sources=json.loads((root/'_source_manifest.json').read_text());
          s=report['summary'];
          units=[u['unit_id'] for u in checkpoint['completed_units']];
          source_units=[x['unit_id'] for x in sources];
          ok=(s['plan_units']==2 and s['completed_units']==2 and
          s['remaining_units']==0 and s['units_completed_this_run']==1 and
          s['archives_completed_this_run']==2 and s['backfill_complete'] and
          s['current_dataset_integrity_ok'] and
          units==['monthly:2022-12','monthly:2023-01'] and
          source_units.count('monthly:2022-12')==2 and
          source_units.count('monthly:2023-01')==2);
          sys.exit(0 if ok else 1)"

      - name: Upload resumed state snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bybit-resumable-backfill-2022-12-to-2023-01-${{ github.sha }}
          path: build/bybit_backfill_state
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
