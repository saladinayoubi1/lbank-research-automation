name: NEXUS WSL Host Runner Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/nexus-wsl-host-runner-recovery.yml

permissions:
  contents: read

concurrency:
  group: nexus-wsl-host-runner-recovery
  cancel-in-progress: true

jobs:
  wake-windows-runner:
    if: github.ref == 'refs/heads/main'
    runs-on: nexus-bybit-network
    timeout-minutes: 5
    steps:
      - name: Start existing Windows Actions runner through WSL interop
        shell: bash
        run: |
          set -euo pipefail
          PS_EXE='/mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe'
          if [ ! -f "$PS_EXE" ]; then
            echo 'windows_powershell_interop=missing' >&2
            exit 2
          fi
          "$PS_EXE" -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command '
            $ErrorActionPreference = "Stop"
            $taskName = "NEXUS-GitHub-Runner-Autostart"
            $runnerRoot = "C:\actions-runner\actions-runner"
            $runnerCmd = Join-Path $runnerRoot "run.cmd"
            $listener = @(Get-Process -Name "Runner.Listener" -ErrorAction SilentlyContinue)
            if ($listener.Count -eq 0) {
              $task = Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
              if ($task) {
                try {
                  Start-ScheduledTask -TaskName $taskName -ErrorAction Stop
                  Write-Host "NEXUS_WINDOWS_RUNNER_WAKE_METHOD=scheduled-task"
                }
                catch {
                  Write-Host "NEXUS_WINDOWS_RUNNER_TASK_START_ERROR=$($_.Exception.Message)"
                }
                Start-Sleep -Seconds 12
                $listener = @(Get-Process -Name "Runner.Listener" -ErrorAction SilentlyContinue)
              }
            }
            if ($listener.Count -eq 0) {
              if (-not (Test-Path -LiteralPath $runnerCmd -PathType Leaf)) {
                throw "existing Windows runner entrypoint missing: $runnerCmd"
              }
              $cmd = Join-Path $env:SystemRoot "System32\cmd.exe"
              $arguments = "/d /s /c start `"NEXUS Actions Runner`" /min `"$runnerCmd`""
              Start-Process -FilePath $cmd -ArgumentList $arguments -WorkingDirectory $runnerRoot -WindowStyle Hidden
              Write-Host "NEXUS_WINDOWS_RUNNER_WAKE_METHOD=detached-cmd-start"
              Start-Sleep -Seconds 12
              $listener = @(Get-Process -Name "Runner.Listener" -ErrorAction SilentlyContinue)
            }
            if ($listener.Count -eq 0) {
              throw "Windows Runner.Listener did not start"
            }
            Write-Host "NEXUS_WINDOWS_RUNNER_WAKE=SUCCESS"
            Write-Host "NEXUS_WINDOWS_RUNNER_REGISTRATION_CHANGED=false"
            Write-Host "NEXUS_WINDOWS_RUNNER_CREDENTIALS_CHANGED=false"
          '
