name: NEXUS WSL Host Runner Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/nexus-wsl-host-runner-recovery.yml

permissions:
  contents: read

concurrency:
  group: nexus-wsl-host-runner-recovery
  cancel-in-progress: true

jobs:
  wake-windows-runner:
    if: github.ref == 'refs/heads/main'
    runs-on: nexus-bybit-network
    timeout-minutes: 5
    steps:
      - name: Recover exact existing Windows Actions runner through WSL interop
        shell: bash
        run: |
          set -euo pipefail
          PS_EXE='/mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe'
          if [ ! -f "$PS_EXE" ]; then
            echo 'windows_powershell_interop=missing' >&2
            exit 2
          fi
          "$PS_EXE" -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command '
            $ErrorActionPreference = "Stop"
            Set-StrictMode -Version 2.0

            $runnerRoot = "C:\actions-runner\actions-runner"
            $runnerCmd = Join-Path $runnerRoot "run.cmd"
            $runnerConfig = Join-Path $runnerRoot ".runner"
            $listenerExe = Join-Path $runnerRoot "bin\Runner.Listener.exe"
            $expectedRunnerName = "NEXUS-WINDOWS-DR"
            $expectedGitHubUrl = "https://github.com/saladinayoubi1/lbank-research-automation"

            function Normalize-Url([string]$Value) {
              if (-not $Value) { return "" }
              return $Value.Trim().TrimEnd("/").ToLowerInvariant()
            }

            foreach ($requiredPath in @($runnerCmd, $runnerConfig, $listenerExe)) {
              if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) {
                throw "exact Windows runner file missing: $requiredPath"
              }
            }

            $config = Get-Content -LiteralPath $runnerConfig -Raw | ConvertFrom-Json
            if ([string]$config.agentName -ne $expectedRunnerName) {
              throw "exact Windows runner name mismatch"
            }
            if ((Normalize-Url ([string]$config.gitHubUrl)) -ne (Normalize-Url $expectedGitHubUrl)) {
              throw "exact Windows runner repository binding mismatch"
            }
            Write-Host "NEXUS_WINDOWS_RUNNER_TARGET_VERIFIED=true"

            $rootPrefix = ([IO.Path]::GetFullPath($runnerRoot).TrimEnd("\") + "\")
            function Get-ExactTargetListeners {
              $matches = @()
              foreach ($proc in Get-Process -Name "Runner.Listener" -ErrorAction SilentlyContinue) {
                try {
                  $path = [string]$proc.Path
                  if ($path -and ([IO.Path]::GetFullPath($path)).StartsWith($rootPrefix, [StringComparison]::OrdinalIgnoreCase)) {
                    $matches += $proc
                  }
                }
                catch { }
              }
              return @($matches)
            }

            $existing = @(Get-ExactTargetListeners)
            $restartPerformed = $false
            if ($existing.Count -gt 0) {
              $oldPids = @($existing | ForEach-Object { $_.Id })
              Write-Host "NEXUS_WINDOWS_RUNNER_STALE_LISTENER_COUNT=$($existing.Count)"
              Write-Host "NEXUS_WINDOWS_RUNNER_OLD_PIDS=$($oldPids -join ',')"
              foreach ($proc in $existing) {
                Stop-Process -Id $proc.Id -Force -ErrorAction Stop
              }
              $restartPerformed = $true
              $stopDeadline = [DateTime]::UtcNow.AddSeconds(15)
              while ([DateTime]::UtcNow -lt $stopDeadline) {
                if (@(Get-ExactTargetListeners).Count -eq 0) { break }
                Start-Sleep -Seconds 1
              }
              if (@(Get-ExactTargetListeners).Count -ne 0) {
                throw "exact Windows runner listener did not stop within bounded timeout"
              }
            }

            $cmd = Join-Path $env:SystemRoot "System32\cmd.exe"
            $arguments = "/d /s /c start `"NEXUS Actions Runner`" /min `"$runnerCmd`""
            Start-Process -FilePath $cmd -ArgumentList $arguments -WorkingDirectory $runnerRoot -WindowStyle Hidden
            Write-Host "NEXUS_WINDOWS_RUNNER_WAKE_METHOD=exact-detached-cmd-start"

            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            $listener = $null
            while ([DateTime]::UtcNow -lt $deadline) {
              Start-Sleep -Seconds 1
              $candidate = @(Get-ExactTargetListeners)
              if ($candidate.Count -gt 0) {
                $listener = $candidate[0]
                break
              }
            }
            if (-not $listener) {
              throw "exact Windows Runner.Listener did not start within bounded timeout"
            }

            Write-Host "NEXUS_WINDOWS_RUNNER_NEW_PID=$($listener.Id)"
            Write-Host "NEXUS_WINDOWS_RUNNER_RESTARTED=$($restartPerformed.ToString().ToLowerInvariant())"
            Write-Host "NEXUS_WINDOWS_RUNNER_WAKE=SUCCESS"
            Write-Host "NEXUS_WINDOWS_RUNNER_REGISTRATION_CHANGED=false"
            Write-Host "NEXUS_WINDOWS_RUNNER_CREDENTIALS_CHANGED=false"
            Write-Host "NEXUS_WINDOWS_RUNNER_OTHER_PATHS_CHANGED=false"
            Write-Host "NEXUS_LIVE_TRADING_AUTHORITY_CHANGED=false"
          '
