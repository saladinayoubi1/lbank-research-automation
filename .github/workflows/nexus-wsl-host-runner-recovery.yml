name: NEXUS WSL Host Runner Recovery

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/nexus-wsl-host-runner-recovery.yml

permissions:
  contents: read

concurrency:
  group: nexus-wsl-host-runner-recovery
  cancel-in-progress: true

jobs:
  wake-windows-runner:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        target: [wsl, windows]
    runs-on: ${{ matrix.target == 'windows' && 'nexus-remote-rescue' || 'nexus-bybit-network' }}
    timeout-minutes: 5
    steps:
      - name: Recover exact existing Windows Actions runner through WSL interop
        if: matrix.target == 'wsl' && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          PS_EXE='/mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe'
          if [ ! -f "$PS_EXE" ]; then
            echo 'windows_powershell_interop=missing' >&2
            exit 2
          fi
          "$PS_EXE" -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command '
            $ErrorActionPreference = "Stop"
            Set-StrictMode -Version 2.0

            $runnerRoot = "C:\actions-runner\actions-runner"
            $runnerCmd = Join-Path $runnerRoot "run.cmd"
            $runnerConfig = Join-Path $runnerRoot ".runner"
            $listenerExe = Join-Path $runnerRoot "bin\Runner.Listener.exe"
            $expectedRunnerName = "NEXUS-WINDOWS-DR"
            $expectedGitHubUrl = "https://github.com/saladinayoubi1/lbank-research-automation"

            function Normalize-Url([string]$Value) {
              if (-not $Value) { return "" }
              return $Value.Trim().TrimEnd("/").ToLowerInvariant()
            }

            foreach ($requiredPath in @($runnerCmd, $runnerConfig, $listenerExe)) {
              if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) {
                throw "exact Windows runner file missing: $requiredPath"
              }
            }

            $config = Get-Content -LiteralPath $runnerConfig -Raw | ConvertFrom-Json
            if ([string]$config.agentName -ne $expectedRunnerName) {
              throw "exact Windows runner name mismatch"
            }
            if ((Normalize-Url ([string]$config.gitHubUrl)) -ne (Normalize-Url $expectedGitHubUrl)) {
              throw "exact Windows runner repository binding mismatch"
            }
            Write-Host "NEXUS_WINDOWS_RUNNER_TARGET_VERIFIED=true"

            $rootPrefix = ([IO.Path]::GetFullPath($runnerRoot).TrimEnd("\") + "\")
            function Get-ExactTargetListeners {
              $matches = @()
              foreach ($proc in Get-Process -Name "Runner.Listener" -ErrorAction SilentlyContinue) {
                try {
                  $path = [string]$proc.Path
                  if ($path -and ([IO.Path]::GetFullPath($path)).StartsWith($rootPrefix, [StringComparison]::OrdinalIgnoreCase)) {
                    $matches += $proc
                  }
                }
                catch { }
              }
              return @($matches)
            }

            $existing = @(Get-ExactTargetListeners)
            $restartPerformed = $false
            if ($existing.Count -gt 0) {
              $oldPids = @($existing | ForEach-Object { $_.Id })
              Write-Host "NEXUS_WINDOWS_RUNNER_STALE_LISTENER_COUNT=$($existing.Count)"
              Write-Host "NEXUS_WINDOWS_RUNNER_OLD_PIDS=$($oldPids -join ",")"
              foreach ($proc in $existing) {
                Stop-Process -Id $proc.Id -Force -ErrorAction Stop
              }
              $restartPerformed = $true
              $stopDeadline = [DateTime]::UtcNow.AddSeconds(15)
              while ([DateTime]::UtcNow -lt $stopDeadline) {
                if (@(Get-ExactTargetListeners).Count -eq 0) { break }
                Start-Sleep -Seconds 1
              }
              if (@(Get-ExactTargetListeners).Count -ne 0) {
                throw "exact Windows runner listener did not stop within bounded timeout"
              }
            }

            $cmd = Join-Path $env:SystemRoot "System32\cmd.exe"
            $arguments = "/d /s /c start `"NEXUS Actions Runner`" /min `"$runnerCmd`""
            Start-Process -FilePath $cmd -ArgumentList $arguments -WorkingDirectory $runnerRoot -WindowStyle Hidden
            Write-Host "NEXUS_WINDOWS_RUNNER_WAKE_METHOD=exact-detached-cmd-start"

            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            $listener = $null
            while ([DateTime]::UtcNow -lt $deadline) {
              Start-Sleep -Seconds 1
              $candidate = @(Get-ExactTargetListeners)
              if ($candidate.Count -gt 0) {
                $listener = $candidate[0]
                break
              }
            }
            if (-not $listener) {
              throw "exact Windows Runner.Listener did not start within bounded timeout"
            }

            Write-Host "NEXUS_WINDOWS_RUNNER_NEW_PID=$($listener.Id)"
            Write-Host "NEXUS_WINDOWS_RUNNER_RESTARTED=$($restartPerformed.ToString().ToLowerInvariant())"
            Write-Host "NEXUS_WINDOWS_RUNNER_WAKE=SUCCESS"
            Write-Host "NEXUS_WINDOWS_RUNNER_REGISTRATION_CHANGED=false"
            Write-Host "NEXUS_WINDOWS_RUNNER_CREDENTIALS_CHANGED=false"
            Write-Host "NEXUS_WINDOWS_RUNNER_OTHER_PATHS_CHANGED=false"
            Write-Host "NEXUS_LIVE_TRADING_AUTHORITY_CHANGED=false"
          '

      - name: Request existing Remote Commander user-context recovery through WSL
        if: matrix.target == 'wsl'
        shell: bash
        run: |
          set -euo pipefail
          WINPS='/mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe'
          test -x "$WINPS"
          "$WINPS" -NoProfile -NonInteractive -Command '$task="NEXUS-Remote-Commander-Recovery"; & schtasks.exe /Query /TN $task /FO LIST /V; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; & schtasks.exe /Run /TN $task; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; Start-Sleep -Seconds 5; & schtasks.exe /Query /TN $task /FO LIST /V; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; Write-Host "remote_commander_rescue_request=PASS"; Write-Host "remote_commander_task_mutated=false"; Write-Host "runner_registration_mutated=false"; Write-Host "live_trading_authority_changed=false"'

      - name: Request existing Remote Commander user-context recovery directly on Windows
        if: matrix.target == 'windows' && github.event_name != 'workflow_dispatch'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version 2.0
          $runnerRoot = 'C:\actions-runner\actions-runner'
          $runnerConfig = Join-Path $runnerRoot '.runner'
          $expectedRunnerName = 'NEXUS-WINDOWS-DR'
          $expectedGitHubUrl = 'https://github.com/saladinayoubi1/lbank-research-automation'
          $task = 'NEXUS-Remote-Commander-Recovery'

          if (-not (Test-Path -LiteralPath $runnerConfig -PathType Leaf)) {
            throw "exact Windows runner config missing: $runnerConfig"
          }
          $config = Get-Content -LiteralPath $runnerConfig -Raw | ConvertFrom-Json
          if ([string]$config.agentName -ne $expectedRunnerName) {
            throw 'exact Windows runner name mismatch'
          }
          if ([string]$config.gitHubUrl -ne $expectedGitHubUrl) {
            throw 'exact Windows runner repository binding mismatch'
          }

          & schtasks.exe /Query /TN $task /FO LIST /V
          if ($LASTEXITCODE -ne 0) { throw 'existing Remote Commander recovery task missing or inaccessible' }
          & schtasks.exe /Run /TN $task
          if ($LASTEXITCODE -ne 0) { throw 'Remote Commander recovery task request failed' }
          Start-Sleep -Seconds 5
          & schtasks.exe /Query /TN $task /FO LIST /V
          if ($LASTEXITCODE -ne 0) { throw 'Remote Commander recovery task post-query failed' }

          Write-Host 'remote_commander_windows_rescue=PASS'
          Write-Host 'remote_commander_task_mutated=false'
          Write-Host 'runner_registration_mutated=false'
          Write-Host 'runner_credentials_mutated=false'
          Write-Host 'windows_acl_modified=false'
          Write-Host 'windows_service_modified=false'
          Write-Host 'live_trading_authority_changed=false'

      - name: Capture bounded Windows rescue diagnostics
        if: matrix.target == 'windows' && failure()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'nexus-remote-rescue-diagnostic.txt'
          "generated_at_utc=$([DateTime]::UtcNow.ToString('o'))" | Set-Content -LiteralPath $out -Encoding UTF8
          "runner_name=$env:RUNNER_NAME" | Add-Content -LiteralPath $out -Encoding UTF8
          "runner_arch=$env:RUNNER_ARCH" | Add-Content -LiteralPath $out -Encoding UTF8
          "identity=$([Security.Principal.WindowsIdentity]::GetCurrent().Name)" | Add-Content -LiteralPath $out -Encoding UTF8
          "session_id=$([Diagnostics.Process]::GetCurrentProcess().SessionId)" | Add-Content -LiteralPath $out -Encoding UTF8
          '--- task-query ---' | Add-Content -LiteralPath $out -Encoding UTF8
          $taskText = & schtasks.exe /Query /TN 'NEXUS-Remote-Commander-Recovery' /FO LIST /V 2>&1
          $taskExit = $LASTEXITCODE
          $taskText | Out-String | Add-Content -LiteralPath $out -Encoding UTF8
          "task_query_exit=$taskExit" | Add-Content -LiteralPath $out -Encoding UTF8
          '--- user-sessions ---' | Add-Content -LiteralPath $out -Encoding UTF8
          (& query.exe user 2>&1 | Out-String) | Add-Content -LiteralPath $out -Encoding UTF8
          '--- wsl-visible-to-runner ---' | Add-Content -LiteralPath $out -Encoding UTF8
          $wslText = & "$env:SystemRoot\System32\wsl.exe" -l -v 2>&1
          $wslExit = $LASTEXITCODE
          $wslText | Out-String | Add-Content -LiteralPath $out -Encoding UTF8
          "wsl_list_exit=$wslExit" | Add-Content -LiteralPath $out -Encoding UTF8
          '--- relevant-processes ---' | Add-Content -LiteralPath $out -Encoding UTF8
          Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -in @('node.exe','powershell.exe','wsl.exe','Runner.Listener.exe') } |
            Select-Object Name,ProcessId,SessionId,ExecutablePath |
            Format-Table -AutoSize | Out-String | Add-Content -LiteralPath $out -Encoding UTF8
          'diagnostic_mutation=false' | Add-Content -LiteralPath $out -Encoding UTF8
          'runner_registration_mutated=false' | Add-Content -LiteralPath $out -Encoding UTF8
          'windows_acl_modified=false' | Add-Content -LiteralPath $out -Encoding UTF8
          'windows_service_modified=false' | Add-Content -LiteralPath $out -Encoding UTF8
          'live_trading_authority_changed=false' | Add-Content -LiteralPath $out -Encoding UTF8

      - name: Upload bounded Windows rescue diagnostics
        if: matrix.target == 'windows' && failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-remote-rescue-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/nexus-remote-rescue-diagnostic.txt
          if-no-files-found: error
          retention-days: 3
