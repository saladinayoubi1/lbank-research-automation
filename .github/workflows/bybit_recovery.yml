name: Recover incomplete Bybit months

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/bybit_recovery.yml"
      - "sitecustomize.py"
      - "bybit_spot_backfill.py"
      - "bybit_spot_archive_audit.py"
      - "bybit_spot_archive_collector.py"
      - "requirements.lock"

permissions:
  contents: read
  actions: read

jobs:
  recover:
    name: recover-chunk-${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { id: "01", start: "2024-06-01", end: "2024-06-30" }
          - { id: "02", start: "2024-07-01", end: "2024-07-31" }
          - { id: "03", start: "2024-08-01", end: "2024-08-31" }
          - { id: "05", start: "2024-10-01", end: "2024-10-31" }
          - { id: "06", start: "2024-11-01", end: "2024-11-30" }
          - { id: "07", start: "2024-12-01", end: "2024-12-31" }
          - { id: "08", start: "2025-01-01", end: "2025-01-31" }
          - { id: "09", start: "2025-02-01", end: "2025-02-28" }
          - { id: "18", start: "2025-11-01", end: "2025-11-30" }
          - { id: "21", start: "2026-02-01", end: "2026-02-28" }
          - { id: "22", start: "2026-03-01", end: "2026-03-31" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - name: Build and verify month with bounded retries
        env:
          CHUNK_ID: ${{ matrix.id }}
          START_DATE: ${{ matrix.start }}
          END_DATE: ${{ matrix.end }}
        run: |
          set -euo pipefail
          state_root="build/chunk-${CHUNK_ID}"
          cache_root="build/cache-${CHUNK_ID}"
          for attempt in 1 2 3; do
            rm -rf "$state_root" "$cache_root"
            if python bybit_spot_backfill.py \
              --start-date "$START_DATE" \
              --end-date "$END_DATE" \
              --state-root "$state_root" \
              --cache-root "$cache_root" \
              --max-archives-per-run 2 \
              --clean; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Recovery failed after $attempt attempts for chunk-$CHUNK_ID" >&2
              exit 1
            fi
            sleep $((attempt * 20))
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(f"build/chunk-{os.environ['CHUNK_ID']}")
          report = json.loads((root / "_backfill_report.json").read_text())
          summary = report["summary"]
          statuses = report["statuses"]
          ok = (
              summary["backfill_complete"]
              and summary["completed_units"] == 1
              and summary["remaining_units"] == 0
              and summary["run_failures"] == 0
              and summary["current_dataset_integrity_ok"]
              and len(statuses) == 6
              and all(item["integrity_ok"] and item["status"] == "ready" for item in statuses)
          )
          print(json.dumps(summary, sort_keys=True))
          raise SystemExit(0 if ok else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bybit-chunk-${{ matrix.id }}-attempt-${{ github.run_attempt }}
          path: build/chunk-${{ matrix.id }}
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9
