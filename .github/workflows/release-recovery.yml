name: Release Recovery

on:
  pull_request:
    paths:
      - 'scripts/release_recovery_gate.py'
      - 'tests/test_release_recovery_gate.py'
      - '.github/workflows/release-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproducibility-and-rollback:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run release recovery tests
        run: python -m unittest tests.test_release_recovery_gate -v
