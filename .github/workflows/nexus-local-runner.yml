name: NEXUS Local Runner

on:
  workflow_dispatch:
    inputs:
      task:
        description: Safe local task to run
        required: true
        type: choice
        options:
          - health
          - tests
          - readiness
          - exhaustive-gap-repair
          - deepseek-smoke
          - zotero-status
          - ai-council-health
          - autonomous
  push:
    branches:
      - main
    paths:
      - .nexus/repair-trigger.txt
      - .nexus/deepseek-trigger.txt
      - .nexus/zotero-trigger.txt
      - .nexus/autonomous-trigger.txt
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: nexus-local-runner
  cancel-in-progress: false

jobs:
  local:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Bootstrap portable Python
        run: |
          set "PYROOT=%RUNNER_TEMP%\python312"
          set "PYZIP=%RUNNER_TEMP%\python-3.12.10-embed-amd64.zip"
          set "PIP_WHEEL=%RUNNER_TEMP%\pip-26.1.2-py3-none-any.whl"
          set "PYZIP_SHA256=4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3"
          set "PIP_WHEEL_SHA256=382ff9f685ee3bc25864f820aa50505825f10f5458ffff07e30a6d96e5715cab"
          if exist "%PYZIP%" (
            certutil -hashfile "%PYZIP%" SHA256 | findstr /i "%PYZIP_SHA256%" >nul
            if errorlevel 1 del /f /q "%PYZIP%"
          )
          if not exist "%PYZIP%" (
            curl.exe -L --fail --retry 3 --retry-delay 2 -o "%PYZIP%.tmp" https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
            if errorlevel 1 exit /b 1
            certutil -hashfile "%PYZIP%.tmp" SHA256 | findstr /i "%PYZIP_SHA256%" >nul
            if errorlevel 1 (
              del /f /q "%PYZIP%.tmp"
              exit /b 1
            )
            move /y "%PYZIP%.tmp" "%PYZIP%" >nul
            if errorlevel 1 exit /b 1
          )
          certutil -hashfile "%PYZIP%" SHA256 | findstr /i "%PYZIP_SHA256%" >nul
          if errorlevel 1 exit /b 1
          if exist "%PIP_WHEEL%" (
            certutil -hashfile "%PIP_WHEEL%" SHA256 | findstr /i "%PIP_WHEEL_SHA256%" >nul
            if errorlevel 1 del /f /q "%PIP_WHEEL%"
          )
          if not exist "%PIP_WHEEL%" (
            curl.exe -L --fail --retry 3 --retry-delay 2 -o "%PIP_WHEEL%.tmp" https://files.pythonhosted.org/packages/5d/95/6b5cb3461ea5673ba0995989746db58eb18b91b54dbf331e72f569540946/pip-26.1.2-py3-none-any.whl
            if errorlevel 1 exit /b 1
            certutil -hashfile "%PIP_WHEEL%.tmp" SHA256 | findstr /i "%PIP_WHEEL_SHA256%" >nul
            if errorlevel 1 (
              del /f /q "%PIP_WHEEL%.tmp"
              exit /b 1
            )
            move /y "%PIP_WHEEL%.tmp" "%PIP_WHEEL%" >nul
            if errorlevel 1 exit /b 1
          )
          certutil -hashfile "%PIP_WHEEL%" SHA256 | findstr /i "%PIP_WHEEL_SHA256%" >nul
          if errorlevel 1 exit /b 1
          if exist "%PYROOT%" rmdir /s /q "%PYROOT%"
          mkdir "%PYROOT%"
          tar.exe -xf "%PYZIP%" -C "%PYROOT%"
          if errorlevel 1 exit /b 1
          if not exist "%PYROOT%\python.exe" exit /b 1
          mkdir "%PYROOT%\Lib\site-packages"
          if errorlevel 1 exit /b 1
          tar.exe -xf "%PIP_WHEEL%" -C "%PYROOT%\Lib\site-packages"
          if errorlevel 1 exit /b 1
          echo Lib\site-packages>>"%PYROOT%\python312._pth"
          echo import site>>"%PYROOT%\python312._pth"
          echo %GITHUB_WORKSPACE%>>"%PYROOT%\python312._pth"
          "%PYROOT%\python.exe" -m pip --version
          if errorlevel 1 exit /b 1
          "%PYROOT%\python.exe" -m pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements.txt pytest PyYAML
          if errorlevel 1 exit /b 1
          echo %PYROOT%>>"%GITHUB_PATH%"

      - name: Privacy guard
        run: python -c "import pathlib; root=pathlib.Path.cwd().resolve(); home=pathlib.Path.home().resolve(); assert root != home and home not in root.parents; print('privacy_guard=ok')"

      - name: Health
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'health'
        run: python -m pytest -q tests/test_nexus_architecture_validator.py tests/test_web_dashboard.py

      - name: Tests
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'tests'
        run: python -m pytest -q

      - name: Readiness
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'readiness'
        run: python data_readiness.py --status-path data\market\_backfill_status.csv

      - name: Exhaustive gap repair
        if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[gap-repair]')) || inputs.task == 'exhaustive-gap-repair'
        run: python exhaustive_gap_repair.py

      - name: DeepSeek smoke
        if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[deepseek-smoke]')) || inputs.task == 'deepseek-smoke'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts\deepseek_smoke.py

      - name: Zotero local API status
        if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[zotero-status]')) || inputs.task == 'zotero-status'
        run: |
          python -c "import json,urllib.request; urls=['http://127.0.0.1:23119/connector/ping','http://127.0.0.1:23119/api/users/0/items?limit=1']; out={}; ok=False; exec('for u in urls:\n try:\n  r=urllib.request.urlopen(u,timeout=5); out[u]={\"status\":r.status}; ok=True\n except Exception as e:\n  out[u]={\"error\":type(e).__name__}'); print('ZOTERO_LOCAL_STATUS='+json.dumps(out,sort_keys=True)); raise SystemExit(0 if ok else 1)"

      - name: AI Council health
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'ai-council-health'
        run: node scripts\nexus_ai_council.js

      - name: Persistent autonomous worker
        if: github.event_name == 'schedule' || inputs.task == 'autonomous' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[autonomous]'))
        env:
          NEXUS_WORKER_MAX_SECONDS: '3300'
          NEXUS_WORKER_IDLE_SLEEP: '60'
        run: python scripts\nexus_local_worker.py

      - name: Local change report
        if: always()
        run: git status --short
