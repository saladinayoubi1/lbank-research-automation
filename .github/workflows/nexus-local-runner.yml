name: NEXUS Local Runner

on:
  workflow_dispatch:
    inputs:
      task:
        description: Safe local task to run
        required: true
        type: choice
        options:
          - health
          - tests
          - readiness
          - exhaustive-gap-repair

permissions:
  contents: read

concurrency:
  group: nexus-local-runner
  cancel-in-progress: false

jobs:
  local:
    # Self-hosted runners must never execute repository code from arbitrary refs.
    # Dispatches against non-main refs are skipped fail-closed.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Privacy guard
        shell: powershell
        run: |
          $root = (Get-Location).Path
          $homePath = [Environment]::GetFolderPath('UserProfile')
          if ($root -eq $homePath -or $root.StartsWith($homePath + [IO.Path]::DirectorySeparatorChar)) {
            throw 'Workspace must not be inside the service account home directory.'
          }
          Write-Host 'privacy_guard=ok'
          Write-Host ('workspace=' + (Split-Path $root -Leaf))

      - name: Health
        if: inputs.task == 'health'
        run: python -m pytest -q tests/test_nexus_architecture_validator.py tests/test_web_dashboard.py

      - name: Tests
        if: inputs.task == 'tests'
        run: python -m pytest -q

      - name: Readiness
        if: inputs.task == 'readiness'
        run: python data_readiness.py --status-path data\market\_backfill_status.csv

      - name: Exhaustive gap repair
        if: inputs.task == 'exhaustive-gap-repair'
        run: python exhaustive_gap_repair.py

      - name: Local change report
        if: always()
        run: git status --short
