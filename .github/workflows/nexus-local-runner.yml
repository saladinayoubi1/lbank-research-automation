name: NEXUS Local Runner

on:
  workflow_dispatch:
    inputs:
      task:
        description: Safe local task to run
        required: true
        type: choice
        options:
          - health
          - tests
          - readiness
          - exhaustive-gap-repair
          - deepseek-smoke
          - zotero-status
  push:
    branches:
      - main
    paths:
      - .nexus/repair-trigger.txt
      - .nexus/deepseek-trigger.txt
      - .nexus/zotero-trigger.txt

permissions:
  contents: read

concurrency:
  group: nexus-local-runner
  cancel-in-progress: false

jobs:
  local:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Bootstrap portable Python
        run: |
          set "PYROOT=%RUNNER_TEMP%\python312"
          set "PYZIP=%RUNNER_TEMP%\python312.zip"
          set "GETPIP=%RUNNER_TEMP%\get-pip.py"
          if exist "%PYROOT%" rmdir /s /q "%PYROOT%"
          if exist "%PYZIP%" del /f /q "%PYZIP%"
          if exist "%GETPIP%" del /f /q "%GETPIP%"
          mkdir "%PYROOT%"
          curl.exe -L --fail --retry 3 --retry-delay 2 -o "%PYZIP%" https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
          if errorlevel 1 exit /b 1
          tar.exe -xf "%PYZIP%" -C "%PYROOT%"
          if errorlevel 1 exit /b 1
          if not exist "%PYROOT%\python.exe" (
            echo ERROR: python.exe missing after extraction
            dir "%PYROOT%"
            exit /b 1
          )
          echo Lib\site-packages>>"%PYROOT%\python312._pth"
          echo import site>>"%PYROOT%\python312._pth"
          echo %GITHUB_WORKSPACE%>>"%PYROOT%\python312._pth"
          curl.exe -L --fail --retry 3 --retry-delay 2 -o "%GETPIP%" https://bootstrap.pypa.io/get-pip.py
          if errorlevel 1 exit /b 1
          "%PYROOT%\python.exe" "%GETPIP%" --no-warn-script-location
          if errorlevel 1 exit /b 1
          "%PYROOT%\python.exe" -m pip install --disable-pip-version-check -r requirements.txt pytest PyYAML
          if errorlevel 1 exit /b 1
          echo %PYROOT%>>"%GITHUB_PATH%"
          "%PYROOT%\python.exe" -c "import sys; print(sys.version); print(sys.path)"
          "%PYROOT%\python.exe" -c "import nexus_architecture_validator, web_dashboard; print('workspace_imports=ok')"

      - name: Privacy guard
        run: |
          python -c "import pathlib; root=pathlib.Path.cwd().resolve(); home=pathlib.Path.home().resolve(); assert root != home and home not in root.parents; print('privacy_guard=ok'); print('workspace=' + root.name)"

      - name: Health
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'health'
        run: python -m pytest -q tests/test_nexus_architecture_validator.py tests/test_web_dashboard.py

      - name: Tests
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'tests'
        run: python -m pytest -q

      - name: Readiness
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'readiness'
        run: python data_readiness.py --status-path data\market\_backfill_status.csv

      - name: Exhaustive gap repair
        if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[gap-repair]')) || inputs.task == 'exhaustive-gap-repair'
        run: python exhaustive_gap_repair.py

      - name: DeepSeek smoke
        if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[deepseek-smoke]')) || inputs.task == 'deepseek-smoke'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if "%DEEPSEEK_API_KEY%"=="" (
            echo ERROR: DEEPSEEK_API_KEY is not configured
            exit /b 1
          )
          python scripts\deepseek_smoke.py

      - name: Zotero local API status
        if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[zotero-status]')) || inputs.task == 'zotero-status'
        run: |
          python -c "import json,urllib.request; urls=['http://127.0.0.1:23119/connector/ping','http://127.0.0.1:23119/api/users/0/items?limit=1']; out={}; ok=False; import urllib.error; 
          for u in urls:
              try:
                  r=urllib.request.urlopen(u,timeout=5); out[u]={'status':r.status,'content_type':r.headers.get('Content-Type','')}; ok=True
              except Exception as e:
                  out[u]={'error':type(e).__name__}
          print('ZOTERO_LOCAL_STATUS='+json.dumps(out,sort_keys=True)); raise SystemExit(0 if ok else 1)"

      - name: Local change report
        if: always()
        run: git status --short
