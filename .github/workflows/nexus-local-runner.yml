name: NEXUS Local Runner

on:
  workflow_dispatch:
    inputs:
      task:
        description: Safe local task to run
        required: true
        type: choice
        options:
          - health
          - tests
          - readiness
          - exhaustive-gap-repair

permissions:
  contents: read

concurrency:
  group: nexus-local-runner
  cancel-in-progress: false

jobs:
  local:
    # Self-hosted runners must never execute repository code from arbitrary refs.
    # Dispatches against non-main refs are skipped fail-closed.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Bootstrap portable Python
        run: |
          set "PYROOT=%RUNNER_TEMP%\python312"
          if not exist "%PYROOT%\python.exe" (
            mkdir "%PYROOT%"
            curl.exe -L --fail --retry 3 -o "%RUNNER_TEMP%\python312.zip" https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
            tar.exe -xf "%RUNNER_TEMP%\python312.zip" -C "%PYROOT%"
            echo Lib\site-packages>>"%PYROOT%\python312._pth"
            echo import site>>"%PYROOT%\python312._pth"
            curl.exe -L --fail --retry 3 -o "%RUNNER_TEMP%\get-pip.py" https://bootstrap.pypa.io/get-pip.py
            "%PYROOT%\python.exe" "%RUNNER_TEMP%\get-pip.py" --no-warn-script-location
          )
          "%PYROOT%\python.exe" -m pip install --disable-pip-version-check -r requirements.txt pytest PyYAML
          echo %PYROOT%>>"%GITHUB_PATH%"
          "%PYROOT%\python.exe" --version

      - name: Privacy guard
        run: |
          python -c "import pathlib; root=pathlib.Path.cwd().resolve(); home=pathlib.Path.home().resolve(); assert root != home and home not in root.parents; print('privacy_guard=ok'); print('workspace=' + root.name)"

      - name: Health
        if: inputs.task == 'health'
        run: python -m pytest -q tests/test_nexus_architecture_validator.py tests/test_web_dashboard.py

      - name: Tests
        if: inputs.task == 'tests'
        run: python -m pytest -q

      - name: Readiness
        if: inputs.task == 'readiness'
        run: python data_readiness.py --status-path data\market\_backfill_status.csv

      - name: Exhaustive gap repair
        if: inputs.task == 'exhaustive-gap-repair'
        run: python exhaustive_gap_repair.py

      - name: Local change report
        if: always()
        run: git status --short
