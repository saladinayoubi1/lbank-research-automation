name: NEXUS Local Runner

on:
  workflow_dispatch:
    inputs:
      task:
        description: Safe local task to run
        required: true
        type: choice
        options:
          - health
          - tests
          - readiness
          - exhaustive-gap-repair
          - deepseek-smoke
          - zotero-status
          - ai-council-health
          - sidecar-compat
          - bybit-wsl-status
          - bybit-wsl-enable
          - autonomous
  push:
    branches:
      - main
    paths:
      - .nexus/repair-trigger.txt
      - .nexus/deepseek-trigger.txt
      - .nexus/zotero-trigger.txt
      - .nexus/autonomous-trigger.txt
      - .nexus/owner-autostart-proof-target.txt
      - scripts/bootstrap_portable_python.cmd
      - scripts/install_nexus_autostart_from_runner.ps1
      - scripts/verify_nexus_owner_autostart.ps1
      - .github/workflows/nexus-local-runner.yml

permissions:
  contents: read

concurrency:
  group: >-
    nexus-local-runner-${{
      github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-owner-autostart]') && 'owner-proof' ||
      github.event_name == 'push' && contains(github.event.head_commit.message, '[install-autostart]') && 'install' ||
      github.event_name == 'push' && contains(github.event.head_commit.message, '[sidecar-compat]') && 'sidecar-compat' ||
      ((github.event_name == 'push' && contains(github.event.head_commit.message, '[autonomous]')) ||
       (github.event_name == 'workflow_dispatch' && inputs.task == 'autonomous')) && 'autonomous' ||
      'general'
    }}
  cancel-in-progress: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-owner-autostart]') }}

jobs:
  local:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Verify exact trigger SHA
        run: |
          for /f %%S in ('git rev-parse HEAD') do set "CHECKED_OUT_SHA=%%S"
          if /I not "%CHECKED_OUT_SHA%"=="%GITHUB_SHA%" (
            echo Checkout SHA mismatch: expected %GITHUB_SHA% got %CHECKED_OUT_SHA%
            exit /b 1
          )
          echo exact_trigger_sha=%CHECKED_OUT_SHA%

      - name: Owner-proof privacy guard
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-owner-autostart]')
        run: >-
          powershell.exe -NoProfile -NonInteractive -Command
          "$root=[IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\\');
          $repoName=($env:GITHUB_REPOSITORY -split '/')[-1];
          $leaf=Split-Path -Leaf $root;
          $repoWork=Split-Path -Parent $root;
          $repoWorkLeaf=Split-Path -Leaf $repoWork;
          $workRoot=Split-Path -Parent $repoWork;
          $workLeaf=Split-Path -Leaf $workRoot;
          if (-not $repoName -or $leaf -ine $repoName -or $repoWorkLeaf -ine $repoName -or $workLeaf -ine '_work')
          { Write-Error 'Owner-proof workspace is not an isolated GitHub Actions _work/repo/repo checkout'; exit 1 };
          Write-Host 'owner_proof_privacy_guard=ok'"

      - name: Verify owner-user autostart read-only
        id: owner_autostart_proof
        continue-on-error: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[sidecar-compat]') }}
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-owner-autostart]')
        run: |
          set /p OWNER_SOURCE_SHA=<.nexus\owner-autostart-proof-target.txt
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts\verify_nexus_owner_autostart.ps1 -SourceSha "%OWNER_SOURCE_SHA%"

      - name: Upload owner-user autostart proof
        id: owner_autostart_artifact
        continue-on-error: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[sidecar-compat]') }}
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-owner-autostart]')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-owner-autostart-proof-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: build/owner-autostart-proof/evidence.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[verify-owner-autostart]')
        with:
          node-version: '20'

      - name: Bootstrap portable Python
        if: >-
          (github.event_name != 'push' || !contains(github.event.head_commit.message, '[verify-owner-autostart]')) ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[sidecar-compat]'))
        run: call scripts\bootstrap_portable_python.cmd

      - name: Privacy guard
        if: >-
          (github.event_name != 'push' || !contains(github.event.head_commit.message, '[verify-owner-autostart]')) ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[sidecar-compat]'))
        run: python -c "import os,pathlib; root=pathlib.Path.cwd().resolve(); repo=os.environ['GITHUB_REPOSITORY'].split('/')[-1]; assert root.name.casefold()==repo.casefold() and root.parent.name.casefold()==repo.casefold() and root.parent.parent.name.casefold()=='_work'; print('privacy_guard=ok')"

      - name: Install zero-touch NEXUS autostart
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[install-autostart]')
        run: >-
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts\install_nexus_autostart_from_runner.ps1
          -SourceSha "%GITHUB_SHA%"

      - name: Upload zero-touch install evidence
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[install-autostart]')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-zero-touch-install-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: build/autostart-install/evidence.json

      - name: Health
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'health'
        run: python -m pytest -q tests/test_nexus_architecture_validator.py tests/test_web_dashboard.py

      - name: Tests
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'tests'
        run: python -m pytest -q

      - name: Readiness
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'readiness'
        run: python data_readiness.py --status-path data\market\_backfill_status.csv

      - name: Exhaustive gap repair
        if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[gap-repair]')) || inputs.task == 'exhaustive-gap-repair'
        run: python exhaustive_gap_repair.py

      - name: DeepSeek smoke
        if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[deepseek-smoke]')) || inputs.task == 'deepseek-smoke'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NEXUS_DEEPSEEK_PAID_ROUTING_ALLOWED: ${{ vars.NEXUS_DEEPSEEK_PAID_ROUTING_ALLOWED }}
        run: |
          if not "%NEXUS_DEEPSEEK_PAID_ROUTING_ALLOWED%"=="1" (
            echo DeepSeek paid-routing budget gate is closed
            exit /b 1
          )
          python scripts\deepseek_smoke.py

      - name: Zotero local API status
        if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[zotero-status]')) || inputs.task == 'zotero-status'
        run: |
          python -c "import json,urllib.request; urls=['http://127.0.0.1:23119/connector/ping','http://127.0.0.1:23119/api/users/0/items?limit=1']; out={}; ok=False; exec('for u in urls:\n try:\n  r=urllib.request.urlopen(u,timeout=5); out[u]={\"status\":r.status}; ok=True\n except Exception as e:\n  out[u]={\"error\":type(e).__name__}'); print('ZOTERO_LOCAL_STATUS='+json.dumps(out,sort_keys=True)); raise SystemExit(0 if ok else 1)"

      - name: AI Council health
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'ai-council-health'
        run: node scripts\nexus_ai_council.js

      - name: Physical sidecar compatibility diagnostic
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.task == 'sidecar-compat') ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[sidecar-compat]'))
        run: >-
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts\windows_sidecar_local_compat.ps1
          -SourceSha "%GITHUB_SHA%"
          -OutputPath "build\windows-sidecar-local-compat\evidence.json"

      - name: Diagnose WSL and Bybit public-network eligibility
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'bybit-wsl-status'
        run: >-
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts\diagnose_nexus_bybit_wsl_runner.ps1
          -OutputPath "build\bybit-wsl-runner-diagnostic\evidence.json"

      - name: Upload WSL and Bybit public-network evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.task == 'bybit-wsl-status'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-bybit-wsl-runner-diagnostic-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: build/bybit-wsl-runner-diagnostic/evidence.json

      - name: Enable WSL platform for the isolated Bybit Linux runner
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'bybit-wsl-enable'
        run: >-
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts\enable_nexus_bybit_wsl.ps1
          -OutputPath "build\bybit-wsl-enablement\evidence.json"

      - name: Upload WSL enablement evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.task == 'bybit-wsl-enable'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-bybit-wsl-enablement-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: build/bybit-wsl-enablement/

      - name: Upload physical sidecar compatibility evidence
        if: >-
          always() && (
            (github.event_name == 'workflow_dispatch' && inputs.task == 'sidecar-compat') ||
            (github.event_name == 'push' && contains(github.event.head_commit.message, '[sidecar-compat]'))
          )
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-windows-sidecar-local-compat-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: build/windows-sidecar-local-compat/evidence.json

      - name: Enforce dual-marker owner-proof result
        if: >-
          always() &&
          github.event_name == 'push' &&
          contains(github.event.head_commit.message, '[sidecar-compat]') &&
          contains(github.event.head_commit.message, '[verify-owner-autostart]')
        run: |
          if /I not "${{ steps.owner_autostart_proof.outcome }}"=="success" (
            echo owner_autostart_proof_outcome=${{ steps.owner_autostart_proof.outcome }}
            exit /b 1
          )
          if /I not "${{ steps.owner_autostart_artifact.outcome }}"=="success" (
            echo owner_autostart_artifact_outcome=${{ steps.owner_autostart_artifact.outcome }}
            exit /b 1
          )
          echo dual_marker_owner_proof=success

      - name: Persistent autonomous worker
        if: inputs.task == 'autonomous' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[autonomous]'))
        env:
          NEXUS_STATE_DIR: ${{ runner.workspace }}\_nexus_local_worker_state
          NEXUS_WORKER_MAX_SECONDS: '720'
          NEXUS_WORKER_MAX_TASKS_PER_LEASE: '1'
          NEXUS_WORKER_EXIT_ON_IDLE: '1'
          NEXUS_WORKER_IDLE_SLEEP: '15'
          NEXUS_DEEPSEEK_PAID_ROUTING_ALLOWED: '0'
        run: python scripts\nexus_local_worker.py

      - name: Upload autonomous worker evidence
        if: always() && (inputs.task == 'autonomous' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[autonomous]')))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-local-worker-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.workspace }}\_nexus_local_worker_state\autonomous-queue.json
            ${{ runner.workspace }}\_nexus_local_worker_state\worker-heartbeat.json

      - name: Local change report
        if: always()
        run: git status --short
