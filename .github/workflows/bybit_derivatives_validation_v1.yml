name: Bybit derivatives validation v1

on:
  pull_request:
    paths:
      - ".github/workflows/bybit_derivatives_validation_v1.yml"
      - "bybit_derivatives_core_v1.py"
      - "bybit_derivatives_validation_v1.py"
      - "experiments/bybit_derivatives_validation_v1.json"
      - "experiments/bybit_frozen_regime_strategy_v1.json"
      - "tests/test_bybit_derivatives_validation_v1.py"
      - "docs/BYBIT_DERIVATIVES_VALIDATION_V1.md"
  workflow_dispatch:
    inputs:
      artifact_id:
        description: "Optional exact canonical Bybit replay-v2 delivery artifact"
        required: false

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SEMANTIC_SHA256: "2455a725886d81adaec9d3478e8f3b2daaba6c0c9645a691e71737eb64f67422"
      DATASET_FILE: "NEXUS_BYBIT_replay_v2_2022-12-01_to_2026-07-31.zip"
      DATASET_DELIVERY: "NEXUS_BYBIT_replay_v2_delivery.json"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip check
      - run: python -m pytest -q
      - name: Download immutable Spot signal dataset
        env:
          DISPATCH_ARTIFACT_ID: ${{ github.event.inputs.artifact_id }}
        run: |
          set -euo pipefail
          rm -rf build/final_delivery build/bybit_dataset
          mkdir -p build/final_delivery build/bybit_dataset

          artifact_id="$DISPATCH_ARTIFACT_ID"
          if [ -z "$artifact_id" ]; then
            python scripts/select_nexus_bybit_replay_artifact.py \
              --repository "$GITHUB_REPOSITORY" \
              --output-dir build/final_delivery \
              --expected-file-name "$DATASET_FILE" \
              --expected-semantic-sha256 "$EXPECTED_SEMANTIC_SHA256" \
              --delivery-name "$DATASET_DELIVERY" \
              --artifact-prefix bybit-full-history-final-rehydrated- \
              --max-candidates 3 > build/full-history-selection.json
            artifact_id="$(python -c 'import json; print(int(json.load(open("build/full-history-selection.json"))["artifact_id"]))')"
          else
            test "$artifact_id" -gt 0
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > build/final_delivery.zip
            python - <<'PY'
          from pathlib import Path
          from scripts.select_nexus_bybit_replay_artifact import safe_extract
          safe_extract(Path("build/final_delivery.zip"), Path("build/final_delivery"))
          PY
          fi
          test -n "$artifact_id"

          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > build/full-history-artifact.json
          python - <<'PY'
          import json
          from pathlib import Path

          item = json.loads(Path("build/full-history-artifact.json").read_text())
          assert str(item.get("name", "")).startswith("bybit-full-history-final-rehydrated-")
          assert item.get("expired") is False
          run = item.get("workflow_run")
          assert isinstance(run, dict) and run.get("head_branch") == "main"
          Path("build/full-history-source-run.txt").write_text(str(int(run["id"])))
          print(f"selected_full_history_artifact={item['id']}:{item['name']}")
          PY

          source_run_id="$(cat build/full-history-source-run.txt)"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id" > build/full-history-source-run.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from nexus_demo_archive_contract import ARCHIVE_SHA256
          from scripts.build_nexus_bybit_replay_package import build_manifest
          from scripts.select_nexus_bybit_replay_artifact import safe_extract, validate_candidate

          run = json.loads(Path("build/full-history-source-run.json").read_text())
          assert run["path"] == ".github/workflows/bybit_full_history_backfill.yml"
          assert run["head_branch"] == "main"
          assert run["event"] in {"push", "workflow_dispatch"}
          assert run["status"] == "completed" and run["conclusion"] == "success"
          expected = os.environ["EXPECTED_SEMANTIC_SHA256"].lower()
          assert expected == ARCHIVE_SHA256
          archive, delivery_path = validate_candidate(
              Path("build/final_delivery"), os.environ["DATASET_FILE"],
              expected_semantic_sha256=expected,
              delivery_name=os.environ["DATASET_DELIVERY"],
          )
          delivery = json.loads(delivery_path.read_text())
          assert delivery["schema_version"] == 2
          assert delivery["file_name"] == os.environ["DATASET_FILE"]
          assert delivery["semantic_dataset_sha256"] == expected
          assert delivery["range"] == "2022-12-01 through 2026-07-31 UTC"
          assert delivery["series_count"] == 6
          assert delivery["paper_replay_only"] is True
          assert delivery["live_trading_authority"] is False
          assert delivery["private_credentials_used"] is False
          safe_extract(archive, Path("build/bybit_dataset"))
          manifest = build_manifest(Path("build/bybit_dataset"))
          assert manifest["semantic_dataset_sha256"] == expected
          assert manifest["venue"] == "bybit" and manifest["series_count"] == 6
          assert manifest["source"] == "official_public_spot_trade_archives"
          print("full_history_delivery_contract=PASS")
          print("full_history_market_content_digest=PASS")
          PY
      - name: Run corrected derivatives validation
        run: |
          python bybit_derivatives_validation_v1.py \
            --manifest experiments/bybit_derivatives_validation_v1.json \
            --output build/bybit_derivatives_validation_v1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: bybit-derivatives-validation-v1-${{ github.run_attempt }}
          path: build/bybit_derivatives_validation_v1
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
      - name: Enforce corrected validation gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('build/bybit_derivatives_validation_v1/derivatives_validation_v1.json').read_text())
          print(json.dumps(report['summary'], indent=2, sort_keys=True))
          print(json.dumps(report['profiles'], indent=2, sort_keys=True))
          assert report['frozen_parameters_changed'] is False
          assert report['summary']['all_profiles_pass'] is True
          assert report['summary']['automatic_paper_forward_started'] is False
          assert report['summary']['live_trading_enabled'] is False
          PY
