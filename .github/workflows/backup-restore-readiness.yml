name: Backup Restore Readiness

on:
  pull_request:
    paths:
      - 'scripts/backup_restore_gate.py'
      - 'tests/test_backup_restore_gate.py'
      - '.github/workflows/backup-restore-readiness.yml'
      - '.github/workflows/workflow-permissions-audit.yml'
      - 'security/workflow-permissions-policy-v1.json'
      - 'scripts/check_workflow_permissions.py'
      - 'tests/test_workflow_permissions.py'
      - 'docs/adr/ADR-0016-workflow-token-permissions.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install safe YAML parser
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Run backup restore gate tests
        run: python -m unittest tests.test_backup_restore_gate -v
      - name: Run workflow permission adversarial tests
        run: python -m unittest tests.test_workflow_permissions -v
      - name: Audit complete workflow inventory
        run: python scripts/check_workflow_permissions.py
