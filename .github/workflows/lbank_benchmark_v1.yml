name: Run LBank benchmark v1

on:
  pull_request:
    paths:
      - ".github/workflows/lbank_benchmark_v1.yml"
      - "benchmark_v1.py"
      - "experiments/lbank_benchmark_v1.json"
      - "tests/test_benchmark_v1.py"
      - "backtest_engine.py"
      - "research_data.py"
      - "data_readiness.py"
      - "data/market/**"
      - "requirements.lock"
      - "requirements-dev.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run versioned benchmark and suitability gate
        run: >-
          python benchmark_v1.py
          --manifest experiments/lbank_benchmark_v1.json
          --output-root build/lbank_benchmark_v1
          --clean

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lbank-benchmark-v1-${{ github.sha }}
          path: build/lbank_benchmark_v1
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
