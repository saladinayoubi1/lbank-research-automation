name: NEXUS Android shared Paper UI regression

on:
  pull_request:
    paths:
      - "android/lbank-mobile/app/src/main/assets/**"
      - "scripts/test_mobile_shared_paper_ux.js"
      - ".github/workflows/nexus_android_shared_paper_ui_test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browserless-ui-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check JavaScript syntax and mobile account isolation
        run: |
          set -euo pipefail
          node --check scripts/test_mobile_shared_paper_ux.js
          node --check android/lbank-mobile/app/src/main/assets/mobile-shared-terminal.js
          node --check android/lbank-mobile/app/src/main/assets/mobile-redesign.js
          node scripts/test_mobile_shared_paper_ux.js
