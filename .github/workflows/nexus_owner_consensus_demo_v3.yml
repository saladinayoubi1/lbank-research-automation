name: NEXUS Owner Consensus Demo v3

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nexus-owner-consensus-demo-v3
  cancel-in-progress: false

jobs:
  paper-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      PINNED_SOURCE_SHA: e3f11c536c8de18fa8855934ca9c35f3546c5fb6
      STATE_ARTIFACT: nexus-owner-consensus-demo-v3-state
      STATE_PARENT: build/nexus-owner-consensus-demo-product-data
      STATE_ROOT: build/nexus-owner-consensus-demo-product-data/shared_paper
    steps:
      - name: Check out the exact installed Demo engine source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PINNED_SOURCE_SHA }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked runtime dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Restore newest immutable owner Demo state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$STATE_PARENT" build/owner-demo-state.zip
          mkdir -p "$STATE_PARENT"
          artifact_id="$(gh api             -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$STATE_ARTIFACT&per_page=100"             --jq '[.artifacts[] | select(.expired == false)][0].id // empty')"
          if [ -n "$artifact_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"               > build/owner-demo-state.zip
            unzip -q build/owner-demo-state.zip -d "$STATE_PARENT"
            echo "restored_artifact_id=$artifact_id" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No prior owner Demo state; initializing a fresh 500-USDT Paper wallet."               >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Advance one bounded owner Demo cycle
        shell: bash
        run: |
          set -euo pipefail
          python nexus_owner_consensus_demo_v3.py             --root "$STATE_ROOT"             --source-sha "$PINNED_SOURCE_SHA"

      - name: Verify owner Demo authority and terminal projection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from product_shared_paper import load_snapshot

          parent = Path(os.environ["STATE_PARENT"])
          root = Path(os.environ["STATE_ROOT"])
          snapshot = load_snapshot(parent)
          activation = json.loads((root / "activation.json").read_text(encoding="utf-8"))
          state = json.loads((root / "state.json").read_text(encoding="utf-8"))
          status = json.loads((root / "status.json").read_text(encoding="utf-8"))

          assert snapshot["available"] is True
          assert snapshot["mode"] == "internal_paper"
          assert snapshot["read_only"] is True
          assert snapshot["live_trading_authority"] is False
          assert float(snapshot["account"]["initial_balance"]) == 500.0
          assert activation["source_sha"] == os.environ["PINNED_SOURCE_SHA"]
          assert activation["automatic_promotion"] is False
          assert activation["config"]["authority"]["live_trading_enabled"] is False
          assert state["paper_only"] is True
          assert state["live_trading_enabled"] is False
          assert status["paper_only"] is True
          assert status["live_trading_authority"] is False
          assert status["strategy_id"] == "bybit_btc_eth_regime_consensus_v1"
          print(json.dumps({
              "status": status["status"],
              "completed_bars": status["completed_bars"],
              "position_count": len(snapshot["positions"]),
              "equity": snapshot["account"]["equity"],
              "paper_only": True,
              "live_trading_authority": False,
          }, sort_keys=True))
          PY

      - name: Persist verified owner Demo state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-owner-consensus-demo-v3-state
          path: build/nexus-owner-consensus-demo-product-data
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
