name: NEXUS perpetual positioning divergence research

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "nexus_perpetual_positioning_divergence_research.py"
      - "bybit_derivatives_core_v1.py"
      - "bybit_spot_archive_collector.py"
      - "experiments/bybit_derivatives_validation_v1.json"
      - ".github/workflows/nexus_perpetual_positioning_divergence_research.yml"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Check dependency consistency
        run: python -m pip check

      - name: Collect verified 30-day Bybit Spot inputs
        run: >-
          python bybit_spot_archive_collector.py
          --start-date 2026-07-03
          --end-date 2026-08-01
          --cache-root build/a9-positioning-cache
          --output-root build/a9-positioning-market
          --clean

      - name: Run A9 perpetual positioning divergence research
        run: >-
          python nexus_perpetual_positioning_divergence_research.py
          --spot-root build/a9-positioning-market
          --output build/a9-positioning-report
          --source-sha "$GITHUB_SHA"
          --config experiments/bybit_derivatives_validation_v1.json
          --start-date 2026-07-03
          --end-date 2026-08-01

      - name: Enforce research-only positioning authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("build/a9-positioning-report/perpetual-positioning-divergence-report.json").read_text()
          )
          proof = report["positioning_proof"]

          assert report["mechanism"] == "perpetual_positioning_divergence"
          assert report["start_date"] == "2026-07-03"
          assert report["end_date"] == "2026-08-01"
          assert len(report["rows"]) == 12
          assert len(report["spot_source_manifest_sha256"]) == 64
          assert len(report["spot_semantic_sha256"]) == 64
          assert report["research_only"] is True
          assert report["paper_only"] is True
          assert report["automatic_strategy_promotion"] is False
          assert report["derivative_execution_authority"] is False
          assert report["live_trading_authority"] is False
          assert report["qualification"] == "NOT_QUALIFIED_NO_PRISTINE_FUTURE_HOLDOUT"
          assert all(row["trade_count_limit"] is None for row in report["rows"])
          assert all(row["execution_instrument"] == "spot_long_or_cash_only" for row in report["rows"])

          assert proof["open_interest_endpoint"] == "/v5/market/open-interest"
          assert proof["funding_endpoint"] == "/v5/market/funding/history"
          assert proof["open_interest_availability_model"] == "one_completed_15m_interval_lag"
          assert proof["research_only"] is True
          assert proof["spot_execution_only"] is True
          assert proof["derivative_execution_authority"] is False
          assert proof["automatic_strategy_promotion"] is False
          assert proof["live_trading_authority"] is False
          for symbol in ("BTCUSDT", "ETHUSDT"):
              assert proof["counts"][symbol]["open_interest_rows"] == 30 * 96
              assert proof["counts"][symbol]["funding_rows_with_lookback"] >= 60
          PY

      - name: Upload A9 research evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-a9-positioning-research-${{ github.sha }}
          path: |
            build/a9-positioning-report/perpetual-positioning-divergence-report.json
            build/a9-positioning-market/_source_manifest.json
            build/a9-positioning-market/_collection_report.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9