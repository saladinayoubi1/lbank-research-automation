name: NEXUS Build Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-gateway-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Verify Android secure gateway
        run: |
          test -f android/lbank-mobile/app/src/main/java/com/saladinayoubi/lbankmobile/MainActivity.java
          grep -q 'AndroidKeyStore' android/lbank-mobile/app/src/main/java/com/saladinayoubi/lbankmobile/MainActivity.java
          grep -q 'NexusNative' android/lbank-mobile/app/src/main/java/com/saladinayoubi/lbankmobile/MainActivity.java
          grep -q 'AES/GCM/NoPadding' android/lbank-mobile/app/src/main/java/com/saladinayoubi/lbankmobile/MainActivity.java
      - name: Verify final Mission Control product surface
        run: |
          for path in \
            product_runtime.py product_research_runtime.py product_control_runtime.py product_web_server.py \
            product_offline_runtime.py product_offline_web_server.py product_mission_runtime.py product_build_runtime.py \
            product_ui/index.html product_ui/product.js product_ui/product-offline.js product_ui/product-offline.css \
            product_ui/product-mission.js product_ui/product-mission.css desktop/nexus-product/main.js desktop/nexus-product/preload.js \
            config/nexus-agent-manager.json scripts/export_mission_control_snapshot.py; do test -f "$path"; done
          node --check desktop/nexus-product/main.js
          node --check desktop/nexus-product/preload.js
          node --check product_ui/product.js
          node --check product_ui/product-offline.js
          node --check product_ui/product-mission.js
          node -e "const p=require('./desktop/nexus-product/package.json'); if(p.version!=='5.1.0' || !p.build.files?.includes('preload.js') || !p.build.extraResources?.some(x=>x.to==='nexus-product-server') || !p.build.extraResources?.some(x=>x.to==='source-sha.txt') || !p.build.extraResources?.some(x=>x.to==='build-evidence.json') || !p.build.extraResources?.some(x=>x.to==='config/nexus-agent-manager.json')) process.exit(1)"
          grep -q 'contextIsolation: true' desktop/nexus-product/main.js
          grep -q 'sandbox: true' desktop/nexus-product/main.js
          grep -q 'nodeIntegration: false' desktop/nexus-product/main.js
          grep -q 'NEXUS_AGENT_MANAGER_CONFIG' desktop/nexus-product/main.js
          grep -q 'NEXUS_BUILD_EVIDENCE_PATH' desktop/nexus-product/main.js
          grep -q 'MAX_RESTARTS_PER_WINDOW = 3' desktop/nexus-product/main.js
          grep -q 'bounded_restart_policy' desktop/nexus-product/main.js
          grep -q 'nexus:ui-preferences:get' desktop/nexus-product/preload.js
          grep -q 'nexus:ui-preferences:set' desktop/nexus-product/preload.js
          grep -q 'nexus:ui-preferences:reset' desktop/nexus-product/preload.js
          grep -q 'run_automated_signal_pipeline' product_research_runtime.py
          grep -q 'run_research_job' product_research_runtime.py
          grep -q 'execute_paper_command' product_runtime.py
          grep -q 'recovery_snapshot' product_control_runtime.py
          grep -q 'OfflineDatasetStore' product_offline_runtime.py
          grep -q 'StrategyEvidenceStore' product_offline_runtime.py
          grep -q 'ProductMissionRuntime' product_offline_web_server.py
          grep -q '/api/product/mission/full' product_offline_web_server.py
          grep -q '/api/product/mission/import' product_offline_web_server.py
          grep -q '/api/product/build-evidence' product_offline_web_server.py
          grep -q 'OWNER ACTION' product_ui/product-mission.js
          grep -q 'LEADING STRATEGY' product_ui/product-mission.js
          grep -q 'OFFLINE-FIRST' product_ui/product-offline.js
          grep -q 'OWNER-CONTROLLED FUTURE STAGE' product_ui/index.html
      - name: Install locked product test dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Verify independent Phase 4 paper/live air gap
        run: python scripts/independent_phase4_airgap_gate.py
      - name: Run Gate 18 adversarial tests
        run: python -m pytest -q tests/test_paper_live_airgap.py
      - name: Run final Mission Control regression tests
        run: >-
          python -m pytest -q
          tests/test_product_runtime.py
          tests/test_product_web_server.py
          tests/test_product_research_runtime.py
          tests/test_product_offline_runtime.py
          tests/test_product_mission_runtime.py
          tests/test_windows_delivery_surface.py
          tests/test_windows_ui_personalization.py

  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/lbank-mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '8.9'
      - name: Verify and capture Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          java_version="$(java -XshowSettings:properties -version 2>&1 | awk -F'= ' '/java.specification.version =/{print $2; exit}')"
          gradle_version="$(gradle --version | awk '/^Gradle /{print $2; exit}')"
          if [[ "$java_version" != "17" ]]; then
            echo "Unexpected Java specification version: $java_version" >&2
            exit 1
          fi
          if [[ "$gradle_version" != "8.9" ]]; then
            echo "Unexpected Gradle version: $gradle_version" >&2
            exit 1
          fi
          echo "NEXUS_RELEASE_JAVA=$java_version" >> "$GITHUB_ENV"
          echo "NEXUS_RELEASE_GRADLE=$gradle_version" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Build unsigned Android evidence bundle
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_release_evidence.py \
            --bundle-dir release-evidence/android \
            --artifact-glob 'android/lbank-mobile/app/build/outputs/apk/debug/*.apk' \
            --source-commit '${{ github.sha }}' \
            --builder 'github-actions/nexus-build-verification/android-apk' \
            --build-parameter 'platform=android' \
            --build-parameter 'package_profile=debug-apk' \
            --build-parameter "java=$NEXUS_RELEASE_JAVA" \
            --build-parameter "gradle=$NEXUS_RELEASE_GRADLE"
      - name: Fail-closed verify Android evidence bundle
        working-directory: ${{ github.workspace }}
        run: >-
          python scripts/release_gate.py release-evidence/android
          --allow-unsigned
          --expected-source-commit '${{ github.sha }}'
          --expected-builder 'github-actions/nexus-build-verification/android-apk'
          --expected-build-parameter 'platform=android'
          --expected-build-parameter 'package_profile=debug-apk'
          --expected-build-parameter 'java=17'
          --expected-build-parameter 'gradle=8.9'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-android-debug-apk
          path: android/lbank-mobile/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-android-release-evidence
          path: release-evidence/android
          if-no-files-found: error

  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Verify and capture Windows build identity
        shell: pwsh
        run: |
          $pythonVersion = (python -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')").Trim()
          $nodeMajor = ((node --version).Trim().TrimStart('v').Split('.')[0])
          $productVersion = (node -p "require('./desktop/nexus-product/package.json').version").Trim()
          if ($pythonVersion -ne '3.12') { throw "Unexpected Python version: $pythonVersion" }
          if ($nodeMajor -ne '22') { throw "Unexpected Node major version: $nodeMajor" }
          if ($productVersion -ne '5.1.0') { throw "Unexpected product version: $productVersion" }
          "NEXUS_RELEASE_PYTHON=$pythonVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NEXUS_RELEASE_NODE=$nodeMajor" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NEXUS_RELEASE_PRODUCT_VERSION=$productVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install canonical product build dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install -r requirements-product-build.lock
      - name: Build final Mission Control Python sidecar
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onedir
          --name nexus-product-server
          --add-data "product_ui;product_ui"
          --add-data ".nexus/phase6-checkpoint.json;.nexus"
          --add-data "docs/project_memory/STATE.json;docs/project_memory"
          product_offline_web_server.py
      - name: Stage exact-source Mission Control resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'desktop/nexus-product/sidecar' -Force | Out-Null
          Copy-Item 'dist/nexus-product-server' 'desktop/nexus-product/sidecar/nexus-product-server' -Recurse -Force
          Set-Content -LiteralPath 'desktop/nexus-product/sidecar/source-sha.txt' -Value $env:GITHUB_SHA -NoNewline -Encoding ascii
          Copy-Item 'docs/architecture/market-data-source-registry.yaml' 'desktop/nexus-product/sidecar/market-data-source-registry.yaml'
          Copy-Item 'config/nexus-agent-manager.json' 'desktop/nexus-product/sidecar/nexus-agent-manager.json'
          $sourceTimestamp = git show -s --format=%cI $env:GITHUB_SHA
          python scripts/write_deterministic_product_build_evidence.py `
            --output 'desktop/nexus-product/sidecar/build-evidence.json' `
            --source-sha $env:GITHUB_SHA `
            --source-timestamp $sourceTimestamp
      - name: Install Electron dependencies
        working-directory: desktop/nexus-product
        run: npm install --no-audit --no-fund
      - name: Build final installer and portable package
        working-directory: desktop/nexus-product
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged final resources and package variants
        shell: pwsh
        run: |
          $root = 'desktop/nexus-product/dist/win-unpacked/resources'
          foreach ($path in @(
            "$root/nexus-product-server/nexus-product-server.exe",
            "$root/source-sha.txt",
            "$root/build-evidence.json",
            "$root/docs/architecture/market-data-source-registry.yaml",
            "$root/config/nexus-agent-manager.json"
          )) { if (!(Test-Path $path)) { throw "Packaged Mission Control resource missing: $path" } }
          if ((Get-Content "$root/source-sha.txt" -Raw).Trim() -ne $env:GITHUB_SHA) { throw 'Packaged source SHA mismatch' }
          if (!(Get-ChildItem 'desktop/nexus-product/dist/NEXUS_Personal_Pro_Setup_5.1.0_*.exe' -ErrorAction SilentlyContinue)) { throw 'Setup EXE missing' }
          if (!(Get-ChildItem 'desktop/nexus-product/dist/NEXUS_Personal_Pro_Portable_5.1.0_*.exe' -ErrorAction SilentlyContinue)) { throw 'Portable EXE missing' }
          $packageFiles = Get-ChildItem 'desktop/nexus-product/dist/*.exe' | Sort-Object Name
          if (-not $packageFiles) { throw 'No Windows .exe artifacts were produced' }
          foreach ($file in $packageFiles) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status.ToString() -ne 'NotSigned') {
              throw "Windows package signing state does not match disabled policy: $($file.Name) status=$($signature.Status)"
            }
          }
          "NEXUS_RELEASE_CODE_SIGNING=disabled" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Generate Windows SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem 'desktop/nexus-product/dist/*.exe' | Sort-Object Name
          if (-not $files) { throw 'No Windows .exe artifacts were produced' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding ascii 'desktop/nexus-product/dist/SHA256SUMS.txt'
      - name: Build unsigned Windows evidence bundle
        shell: pwsh
        run: |
          python scripts/build_release_evidence.py `
            --bundle-dir release-evidence/windows `
            --artifact-glob 'desktop/nexus-product/dist/*.exe' `
            --artifact-glob 'desktop/nexus-product/dist/SHA256SUMS.txt' `
            --source-commit '${{ github.sha }}' `
            --builder 'github-actions/nexus-build-verification/windows-desktop' `
            --build-parameter 'platform=windows' `
            --build-parameter 'package_profile=electron-nsis-portable' `
            --build-parameter "product_version=$env:NEXUS_RELEASE_PRODUCT_VERSION" `
            --build-parameter "python=$env:NEXUS_RELEASE_PYTHON" `
            --build-parameter "node=$env:NEXUS_RELEASE_NODE" `
            --build-parameter "code_signing=$env:NEXUS_RELEASE_CODE_SIGNING"
      - name: Fail-closed verify Windows evidence bundle
        run: >-
          python scripts/release_gate.py release-evidence/windows
          --allow-unsigned
          --expected-source-commit '${{ github.sha }}'
          --expected-builder 'github-actions/nexus-build-verification/windows-desktop'
          --expected-build-parameter 'platform=windows'
          --expected-build-parameter 'package_profile=electron-nsis-portable'
          --expected-build-parameter 'product_version=5.1.0'
          --expected-build-parameter 'python=3.12'
          --expected-build-parameter 'node=22'
          --expected-build-parameter 'code_signing=disabled'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-windows-final-mission-control-packages
          path: |
            desktop/nexus-product/dist/NEXUS_Personal_Pro_Setup_5.1.0_*.exe
            desktop/nexus-product/dist/NEXUS_Personal_Pro_Portable_5.1.0_*.exe
            desktop/nexus-product/dist/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-windows-final-mission-control-release-evidence
          path: release-evidence/windows
          if-no-files-found: error
