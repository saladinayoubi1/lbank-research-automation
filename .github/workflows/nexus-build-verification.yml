name: NEXUS Build Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-gateway-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Android secure gateway
        run: |
          test -f android/lbank-mobile/app/src/main/java/com/saladinayoubi/lbankmobile/MainActivity.java
          grep -q 'AndroidKeyStore' android/lbank-mobile/app/src/main/java/com/saladinayoubi/lbankmobile/MainActivity.java
          grep -q 'NexusNative' android/lbank-mobile/app/src/main/java/com/saladinayoubi/lbankmobile/MainActivity.java
          grep -q 'AES/GCM/NoPadding' android/lbank-mobile/app/src/main/java/com/saladinayoubi/lbankmobile/MainActivity.java
      - name: Verify Electron secure bridge and desktop surface
        run: |
          test -f desktop/lbank-monitor/preload.js
          test -f desktop/lbank-monitor/main.js
          test -f desktop/lbank-monitor/app/index.html
          test -f desktop/lbank-monitor/app/desktop.css
          test -f desktop/lbank-monitor/app/desktop-runtime.js
          test -f desktop/lbank-monitor/app/project-data.js
          node -e "const p=require('./desktop/lbank-monitor/package.json'); if(!p.build.files.includes('preload.js') || !p.build.extraResources?.some(x=>x.from==='app')) process.exit(1)"
          grep -q 'contextBridge' desktop/lbank-monitor/preload.js
          grep -q 'contextIsolation: true' desktop/lbank-monitor/main.js
          grep -q 'sandbox: true' desktop/lbank-monitor/main.js
          grep -q 'nodeIntegration: false' desktop/lbank-monitor/main.js
          grep -q 'PUBLIC_MARKET_SYMBOLS' desktop/lbank-monitor/main.js
          grep -q 'nexus:public-market' desktop/lbank-monitor/main.js
      - name: Install locked Gate 18 test dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Verify independent Phase 4 paper/live air gap
        run: python scripts/independent_phase4_airgap_gate.py
      - name: Run Gate 18 adversarial tests
        run: python -m pytest -q tests/test_paper_live_airgap.py
      - name: Run Windows delivery regression tests
        run: python -m pytest -q tests/test_windows_delivery_surface.py

  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/lbank-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Build unsigned Android evidence bundle
        working-directory: ${{ github.workspace }}
        run: >-
          python scripts/build_release_evidence.py
          --bundle-dir release-evidence/android
          --artifact-glob 'android/lbank-mobile/app/build/outputs/apk/debug/*.apk'
          --source-commit '${{ github.sha }}'
          --builder 'github-actions/nexus-build-verification/android-apk'
      - name: Fail-closed verify Android evidence bundle
        working-directory: ${{ github.workspace }}
        run: >-
          python scripts/release_gate.py release-evidence/android
          --allow-unsigned
          --expected-source-commit '${{ github.sha }}'
          --expected-builder 'github-actions/nexus-build-verification/android-apk'
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-android-debug-apk
          path: android/lbank-mobile/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-android-release-evidence
          path: release-evidence/android
          if-no-files-found: error

  windows-desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/lbank-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/lbank-monitor/package.json
      - name: Validate committed Windows UI
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $required = @(
            'desktop/lbank-monitor/app/index.html',
            'desktop/lbank-monitor/app/desktop.css',
            'desktop/lbank-monitor/app/desktop-runtime.js',
            'desktop/lbank-monitor/app/project-data.js'
          )
          foreach ($path in $required) { if (!(Test-Path $path)) { throw "Missing desktop UI asset: $path" } }
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build installer and portable package
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged UI and package variants
        shell: pwsh
        run: |
          $resourceRoot = 'dist/win-unpacked/resources/app'
          foreach ($name in @('index.html','desktop.css','desktop-runtime.js','project-data.js')) {
            if (!(Test-Path (Join-Path $resourceRoot $name))) { throw "Packaged UI asset missing: $name" }
          }
          if (!(Get-ChildItem 'dist/NEXUS_Personal_Pro_Setup_3.4.0_*.exe' -ErrorAction SilentlyContinue)) { throw 'Setup EXE missing' }
          if (!(Get-ChildItem 'dist/NEXUS_Personal_Pro_Portable_3.4.0_*.exe' -ErrorAction SilentlyContinue)) { throw 'Portable EXE missing' }
      - name: Generate Windows SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem 'dist/*.exe' | Sort-Object Name
          if (-not $files) { throw 'No Windows .exe artifacts were produced' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding ascii 'dist/SHA256SUMS.txt'
      - name: Build unsigned Windows evidence bundle
        working-directory: ${{ github.workspace }}
        run: >-
          python scripts/build_release_evidence.py
          --bundle-dir release-evidence/windows
          --artifact-glob 'desktop/lbank-monitor/dist/*.exe'
          --artifact-glob 'desktop/lbank-monitor/dist/SHA256SUMS.txt'
          --source-commit '${{ github.sha }}'
          --builder 'github-actions/nexus-build-verification/windows-desktop'
      - name: Fail-closed verify Windows evidence bundle
        working-directory: ${{ github.workspace }}
        run: >-
          python scripts/release_gate.py release-evidence/windows
          --allow-unsigned
          --expected-source-commit '${{ github.sha }}'
          --expected-builder 'github-actions/nexus-build-verification/windows-desktop'
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-windows-packages
          path: |
            desktop/lbank-monitor/dist/NEXUS_Personal_Pro_Setup_3.4.0_*.exe
            desktop/lbank-monitor/dist/NEXUS_Personal_Pro_Portable_3.4.0_*.exe
            desktop/lbank-monitor/dist/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-windows-release-evidence
          path: release-evidence/windows
          if-no-files-found: error
