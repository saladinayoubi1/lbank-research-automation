name: NEXUS apply Multi-Pair training robustness patch

on:
  push:
    branches:
      - codex/multipair-training-robustness-20260911
    paths:
      - .github/workflows/nexus_apply_multipair_training_robustness_patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/multipair-training-robustness-20260911
          fetch-depth: 0
      - name: Apply exact reviewed patch
        run: |
          set -euo pipefail
          patch_file=tools/patches/multipair_training_robustness_20260911.patch
          git apply --check "$patch_file"
          git apply "$patch_file"
          python -m py_compile \
            nexus_multipair_strategy_discovery.py \
            nexus_multipair_training_refinement.py \
            tests/test_nexus_multipair_strategy_discovery.py \
            tests/test_nexus_multipair_training_refinement.py
          grep -q 'training_only_temporal_robustness' nexus_multipair_strategy_discovery.py
          grep -q 'locked chronological holdout is not used for ranking' nexus_multipair_strategy_discovery.py
          grep -q 'training_robustness' nexus_multipair_training_refinement.py
      - name: Commit only the product and test changes
        run: |
          set -euo pipefail
          rm -f tools/patches/multipair_training_robustness_20260911.patch
          rm -f .github/workflows/nexus_apply_multipair_training_robustness_patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git diff --cached --name-only | grep -Fx 'nexus_multipair_strategy_discovery.py'
          git diff --cached --name-only | grep -Fx 'nexus_multipair_training_refinement.py'
          git diff --cached --name-only | grep -Fx 'tests/test_nexus_multipair_strategy_discovery.py'
          git diff --cached --name-only | grep -Fx 'tests/test_nexus_multipair_training_refinement.py'
          git commit -m 'Rank Multi-Pair discovery by training temporal robustness'
          git push origin HEAD:codex/multipair-training-robustness-20260911
