name: NEXUS System Map Gate

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-system-map-gate-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-system-map:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked validation dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip check
      - name: Validate accepted architecture contract registry
        run: python nexus_architecture_validator.py docs/architecture/module-contract-registry.yaml
      - name: Validate NEXUS Master System Map
        run: python nexus_system_map_validator.py config/nexus-system-map-v1.yaml
      - name: Run architecture and system-map regression tests
        run: >-
          python -m pytest -q
          tests/test_nexus_architecture_validator.py
          tests/test_nexus_system_map_validator.py

  pr-architecture-precheck:
    if: github.event_name == 'pull_request'
    needs: validate-system-map
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked validation dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip check
      - name: Require mapped architecture intent in PR body
        run: python nexus_system_map_validator.py config/nexus-system-map-v1.yaml --pr-body-env PR_BODY
