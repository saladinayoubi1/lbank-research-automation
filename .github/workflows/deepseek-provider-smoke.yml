name: DeepSeek Provider Smoke

on:
  push:
    branches:
      - feature/deepseek-provider-232
    paths:
      - deepseek_provider.py
      - scripts/deepseek_smoke.py
      - tests/test_deepseek_provider.py
      - .github/workflows/deepseek-provider-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: DeepSeek provider unit tests
        run: python -m pytest -q tests/test_deepseek_provider.py

  smoke:
    runs-on: ubuntu-latest
    needs: unit
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify secret is configured without exposing it
        shell: bash
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY is not configured"
            exit 1
          fi
      - name: Run tiny paid DeepSeek smoke test
        run: python scripts/deepseek_smoke.py
