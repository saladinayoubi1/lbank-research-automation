name: NEXUS Demo regime lifecycle bridge

on:
  pull_request:
    paths:
      - "nexus_demo_regime_lifecycle_bridge.py"
      - "nexus_regime_selected_position_rebalance.py"
      - "nexus_regime_selected_exposure_increase.py"
      - "nexus_demo_regime_cycle.py"
      - "nexus_demo_archive_replay.py"
      - "config/nexus-demo-strategy-matrix-v1.json"
      - "tests/test_nexus_demo_regime_lifecycle_bridge.py"
      - "tests/test_nexus_regime_selected_position_rebalance.py"
      - "tests/test_nexus_regime_selected_exposure_increase.py"
      - ".github/workflows/nexus_demo_regime_lifecycle_bridge.yml"
  workflow_run:
    workflows: ["NEXUS Demo strategy matrix"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip check
      - name: Verify archive lifecycle bridge contracts
        run: >-
          python -m pytest -q
          tests/test_nexus_demo_regime_lifecycle_bridge.py
          tests/test_nexus_regime_selected_position_rebalance.py
          tests/test_nexus_regime_selected_exposure_increase.py
          tests/test_nexus_demo_regime_cycle.py
          tests/test_nexus_demo_archive_replay.py

  lifecycle:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    needs: contract-test
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: nexus-demo-strategy-matrix
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      STATE_ARTIFACT: nexus-demo-strategy-matrix-state
      DATASET_ARTIFACT_ID: "8867026863"
      DATASET_SHA256: "5f1173467c2296201940c3b7786b7cc3e5442244e07289769ab4867ace41d668"
      STATE_ROOT: build/nexus_demo_strategy_matrix_state
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - name: Restore exact triggering Demo matrix state
        run: |
          set -euo pipefail
          rm -rf "$STATE_ROOT" build/trigger-state.zip
          mkdir -p "$STATE_ROOT"
          artifact_id="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$TRIGGER_RUN_ID/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name == \"$STATE_ARTIFACT\") | .id" \
            | head -n 1)"
          test -n "$artifact_id"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > build/trigger-state.zip
          unzip -q build/trigger-state.zip -d "$STATE_ROOT"
      - name: Restore verified immutable Bybit replay dataset
        run: |
          set -euo pipefail
          rm -rf build/nexus_demo_archive build/nexus_demo_delivery build/nexus_demo_delivery.zip
          mkdir -p build/nexus_demo_archive build/nexus_demo_delivery
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$DATASET_ARTIFACT_ID/zip" \
            > build/nexus_demo_delivery.zip
          unzip -q build/nexus_demo_delivery.zip -d build/nexus_demo_delivery
          archive="build/nexus_demo_delivery/BYBIT_full_history_2022-12-01_to_2026-07-31.zip"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$DATASET_SHA256"
          unzip -q "$archive" -d build/nexus_demo_archive
      - name: Apply regime-selected close resize and fresh-Risk increase
        run: |
          set -euo pipefail
          python nexus_demo_regime_lifecycle_bridge.py \
            --manifest config/nexus-demo-strategy-matrix-v1.json \
            --state-root "$STATE_ROOT" \
            --source-sha "$SOURCE_SHA" \
            --replay-archive-root build/nexus_demo_archive \
            --archive-sha256 "$DATASET_SHA256"
      - name: Independently enforce archive lifecycle authority
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from nexus_demo_regime_lifecycle_bridge import verify_demo_regime_lifecycle

          snapshot = json.loads(Path(
              "build/nexus_demo_strategy_matrix_state/demo/regime-lifecycle-bridge.json"
          ).read_text(encoding="utf-8"))
          verification = verify_demo_regime_lifecycle(snapshot)
          assert verification["decision"] == "pass", verification
          assert snapshot["risk_reducing_rebalance_operational"] is True
          assert snapshot["exposure_increase_operational"] is True
          assert snapshot["regime_selected_rebalance_operational"] is True
          assert snapshot["fresh_deterministic_risk_required"] is True
          assert snapshot["paper_only"] is True
          assert snapshot["live_trading_authority"] is False
          assert snapshot["private_credentials_used"] is False
          assert snapshot["automatic_strategy_promotion"] is False
          assert snapshot["deterministic_risk_final_authority"] is True
          assert snapshot["parallel_execution_engine_created"] is False
          print(json.dumps(snapshot, sort_keys=True))
          PY
      - name: Persist lifecycle-enriched Demo matrix state
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nexus-demo-strategy-matrix-state
          path: build/nexus_demo_strategy_matrix_state
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
      - name: Publish dedicated lifecycle evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nexus-demo-regime-lifecycle-evidence
          path: |
            build/nexus_demo_strategy_matrix_state/demo/regime-cycle.json
            build/nexus_demo_strategy_matrix_state/demo/regime-selected-rebalance.json
            build/nexus_demo_strategy_matrix_state/demo/regime-selected-exposure-increase.json
            build/nexus_demo_strategy_matrix_state/demo/regime-lifecycle-bridge.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
