name: NEXUS multi-timeframe strategy discovery

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: "Immutable Bybit archive artifact"
        required: false
        default: "8867026863"
  push:
    branches: [main]
    paths:
      - "nexus_multitimeframe_strategy_discovery.py"
      - "experiments/nexus_multitimeframe_strategy_discovery_v1.json"
      - "tests/test_nexus_multitimeframe_strategy_discovery.py"
      - ".github/workflows/nexus_multitimeframe_strategy_discovery.yml"
  pull_request:
    paths:
      - "nexus_multitimeframe_strategy_discovery.py"
      - "experiments/nexus_multitimeframe_strategy_discovery_v1.json"
      - "tests/test_nexus_multitimeframe_strategy_discovery.py"
      - "scripts/nexus_strategy_discovery_controller.py"
      - ".github/workflows/nexus_multitimeframe_strategy_discovery.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: nexus-multitimeframe-strategy-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip check
      - run: >-
          python -m pytest -q
          tests/test_nexus_multitimeframe_strategy_discovery.py
          tests/test_nexus_strategy_discovery_controller.py

  discover:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: contract-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_ARTIFACT_ID: "8867026863"
      EXPECTED_SHA256: "5f1173467c2296201940c3b7786b7cc3e5442244e07289769ab4867ace41d668"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip check
      - name: Restore immutable Bybit archive
        env:
          DISPATCH_ARTIFACT_ID: ${{ github.event.inputs.artifact_id }}
        run: |
          set -euo pipefail
          artifact_id="$DISPATCH_ARTIFACT_ID"
          if [ -z "$artifact_id" ]; then artifact_id="$DEFAULT_ARTIFACT_ID"; fi
          rm -rf build/final_delivery build/bybit_dataset build/nexus_multitimeframe_strategy_discovery
          mkdir -p build/final_delivery build/bybit_dataset
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > build/final_delivery.zip
          unzip -q build/final_delivery.zip -d build/final_delivery
          archive="build/final_delivery/BYBIT_full_history_2022-12-01_to_2026-07-31.zip"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -q "$archive" -d build/bybit_dataset
      - name: Run leakage-resistant discovery
        run: |
          set -euo pipefail
          python nexus_multitimeframe_strategy_discovery.py \
            --manifest experiments/nexus_multitimeframe_strategy_discovery_v1.json \
            --output build/nexus_multitimeframe_strategy_discovery
      - name: Verify authority boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from nexus_multitimeframe_strategy_discovery import verify_discovery
          root = Path("build/nexus_multitimeframe_strategy_discovery")
          result = json.loads((root / "multitimeframe_strategy_discovery.json").read_text())
          verification = verify_discovery(result)
          assert verification["decision"] == "pass", verification
          assert result["research_only"] is True
          assert result["paper_only"] is True
          assert result["live_trading_authority"] is False
          assert result["automatic_strategy_promotion"] is False
          assert result["automatic_paper_forward_started"] is False
          print(json.dumps({"proposal_count": result["research_proposal_count"], "digest": result["discovery_digest"]}, sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nexus-multitimeframe-strategy-discovery-${{ github.run_id }}
          path: build/nexus_multitimeframe_strategy_discovery
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
