name: NEXUS multi-timeframe strategy discovery

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: "Optional exact replay-v2 artifact ID; blank selects the newest verified match"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "nexus_multitimeframe_strategy_discovery.py"
      - "nexus_multitimeframe_training_refinement.py"
      - "nexus_multitimeframe_search_exhaustion.py"
      - "nexus_multitimeframe_verified_archive_discovery.py"
      - "nexus_composite_strategy_research.py"
      - "nexus_research_missions.py"
      - "config/nexus-agent-manager.json"
      - "research/reviewed_composite_mechanisms_v1.json"
      - "nexus_agent_research_prepare.py"
      - "nexus_agent_composite_runtime.py"
      - "tests/test_nexus_research_successor.py"
      - "tests/test_nexus_agent_composite_runtime.py"
      - "experiments/nexus_composite_strategy_research_v1.json"
      - "tests/test_nexus_composite_strategy_research.py"
      - "scripts/nexus_qa_attested_discovery_frontier.py"
      - "tests/test_nexus_qa_attested_discovery_frontier.py"
      - "nexus_demo_archive_replay.py"
      - "scripts/select_nexus_bybit_replay_artifact.py"
      - "experiments/nexus_multitimeframe_strategy_discovery_v1.json"
      - "tests/test_nexus_bybit_replay_artifact_lifecycle.py"
      - "tests/test_nexus_multitimeframe_search_exhaustion.py"
      - "tests/test_nexus_multitimeframe_strategy_discovery.py"
      - "tests/test_nexus_discovery_execution_fill_integrity.py"
      - "tests/test_nexus_multitimeframe_training_refinement.py"
      - "tests/test_nexus_multitimeframe_verified_archive_discovery.py"
      - ".github/workflows/nexus_multitimeframe_strategy_discovery.yml"
  pull_request:
    paths:
      - "nexus_multitimeframe_strategy_discovery.py"
      - "nexus_multitimeframe_training_refinement.py"
      - "nexus_multitimeframe_search_exhaustion.py"
      - "nexus_multitimeframe_verified_archive_discovery.py"
      - "nexus_composite_strategy_research.py"
      - "nexus_research_missions.py"
      - "config/nexus-agent-manager.json"
      - "research/reviewed_composite_mechanisms_v1.json"
      - "nexus_agent_research_prepare.py"
      - "nexus_agent_composite_runtime.py"
      - "tests/test_nexus_research_successor.py"
      - "tests/test_nexus_agent_composite_runtime.py"
      - "experiments/nexus_composite_strategy_research_v1.json"
      - "tests/test_nexus_composite_strategy_research.py"
      - "scripts/nexus_qa_attested_discovery_frontier.py"
      - "tests/test_nexus_qa_attested_discovery_frontier.py"
      - "nexus_demo_archive_replay.py"
      - "scripts/select_nexus_bybit_replay_artifact.py"
      - "experiments/nexus_multitimeframe_strategy_discovery_v1.json"
      - "tests/test_nexus_bybit_replay_artifact_lifecycle.py"
      - "tests/test_nexus_multitimeframe_search_exhaustion.py"
      - "tests/test_nexus_multitimeframe_strategy_discovery.py"
      - "tests/test_nexus_discovery_execution_fill_integrity.py"
      - "tests/test_nexus_multitimeframe_training_refinement.py"
      - "tests/test_nexus_multitimeframe_verified_archive_discovery.py"
      - "scripts/nexus_strategy_discovery_controller.py"
      - ".github/workflows/nexus_multitimeframe_strategy_discovery.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: nexus-multitimeframe-strategy-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip check
      - run: >-
          python -m pytest -q
          tests/test_nexus_multitimeframe_strategy_discovery.py
          tests/test_nexus_discovery_execution_fill_integrity.py
          tests/test_nexus_multitimeframe_training_refinement.py
          tests/test_nexus_multitimeframe_search_exhaustion.py
          tests/test_nexus_multitimeframe_search_exhaustion_workflow.py
          tests/test_nexus_multitimeframe_verified_archive_discovery.py
          tests/test_nexus_strategy_discovery_controller.py
          tests/test_nexus_bybit_replay_artifact_lifecycle.py
          tests/test_nexus_composite_strategy_research.py
          tests/test_nexus_agent_composite_runtime.py
          tests/test_nexus_research_successor.py
          tests/test_nexus_qa_attested_discovery_frontier.py

  discover:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: contract-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      DATASET_FILE: NEXUS_BYBIT_replay_v2_2022-12-01_to_2026-07-31.zip
      DATASET_DELIVERY: NEXUS_BYBIT_replay_v2_delivery.json
      DATASET_ARTIFACT_PREFIX: bybit-full-history-final-
      DATASET_SHA256: "2455a725886d81adaec9d3478e8f3b2daaba6c0c9645a691e71737eb64f67422"
      EXHAUSTION_ARTIFACT: nexus-multitimeframe-search-exhaustion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip check

      - name: Fingerprint exact search neighborhood
        run: |
          set -euo pipefail
          rm -rf build/nexus_multitimeframe_preflight
          mkdir -p build/nexus_multitimeframe_preflight
          python nexus_multitimeframe_search_exhaustion.py fingerprint \
            --manifest experiments/nexus_multitimeframe_strategy_discovery_v1.json \
            --dataset-semantic-sha256 "$DATASET_SHA256" \
            --root . \
            --output build/nexus_multitimeframe_preflight/search-neighborhood.json

      - name: Reuse exact exhausted neighborhood when unchanged
        id: exhaustion
        run: |
          set -euo pipefail
          echo "reuse=false" >> "$GITHUB_OUTPUT"
          rm -rf build/exhaustion-cache
          mkdir -p build/exhaustion-cache
          artifact_id="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$EXHAUSTION_ARTIFACT&per_page=100" \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -z "$artifact_id" ]; then
            echo "search_exhaustion_reuse=MISS reason=no_certificate"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            > build/exhaustion-cache/certificate.zip
          unzip -q build/exhaustion-cache/certificate.zip -d build/exhaustion-cache/content
          certificate="$(find build/exhaustion-cache/content -type f -name 'exhaustion-certificate.json' -print -quit)"
          if [ -z "$certificate" ]; then
            echo "search_exhaustion_reuse=MISS reason=certificate_missing"
            exit 0
          fi
          reusable="$(python nexus_multitimeframe_search_exhaustion.py check \
            --neighborhood build/nexus_multitimeframe_preflight/search-neighborhood.json \
            --certificate "$certificate" \
            | python -c 'import json,sys; print(str(json.load(sys.stdin)["reusable"]).lower())')"
          if [ "$reusable" != "true" ]; then
            echo "search_exhaustion_reuse=MISS reason=fingerprint_changed"
            exit 0
          fi
          mkdir -p build/nexus_multitimeframe_strategy_discovery
          cp build/nexus_multitimeframe_preflight/search-neighborhood.json \
            build/nexus_multitimeframe_strategy_discovery/search-neighborhood.json
          cp "$certificate" \
            build/nexus_multitimeframe_strategy_discovery/reused-exhaustion-certificate.json
          echo "reuse=true" >> "$GITHUB_OUTPUT"
          echo "search_exhaustion_reuse=PASS policy=exact_static_neighborhood_only"

      - name: Verify reused exhaustion remains Research/Paper-only
        if: steps.exhaustion.outputs.reuse == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          certificate = json.loads(
              Path("build/nexus_multitimeframe_strategy_discovery/reused-exhaustion-certificate.json").read_text()
          )
          assert certificate["exhausted"] is True
          assert certificate["selection_basis"] == "training_only"
          assert certificate["locked_holdout_used_for_refinement"] is False
          assert certificate["research_only"] is True
          assert certificate["paper_only"] is True
          assert certificate["automatic_strategy_promotion"] is False
          assert certificate["live_trading_authority"] is False
          print("search_exhaustion_authority=PASS")
          PY

      - name: Restore verified immutable Bybit replay-v2 dataset
        if: steps.exhaustion.outputs.reuse != 'true'
        env:
          DISPATCH_ARTIFACT_ID: ${{ github.event.inputs.artifact_id }}
        run: |
          set -euo pipefail
          selector_args=()
          if [ -n "$DISPATCH_ARTIFACT_ID" ]; then
            selector_args+=(--artifact-id "$DISPATCH_ARTIFACT_ID")
          fi
          rm -rf build/final_delivery build/bybit_dataset build/nexus_multitimeframe_strategy_discovery
          mkdir -p build/final_delivery build/bybit_dataset
          python scripts/select_nexus_bybit_replay_artifact.py \
            --repository "$GITHUB_REPOSITORY" \
            --output-dir build/final_delivery \
            --expected-file-name "$DATASET_FILE" \
            --expected-semantic-sha256 "$DATASET_SHA256" \
            --delivery-name "$DATASET_DELIVERY" \
            --artifact-prefix "$DATASET_ARTIFACT_PREFIX" \
            "${selector_args[@]}"
          archive="build/final_delivery/$DATASET_FILE"
          test -s "$archive"
          unzip -q "$archive" -d build/bybit_dataset

      - name: Run leakage-resistant discovery
        if: steps.exhaustion.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          python nexus_multitimeframe_verified_archive_discovery.py \
            --manifest experiments/nexus_multitimeframe_strategy_discovery_v1.json \
            --source-sha "$GITHUB_SHA" \
            --output build/nexus_multitimeframe_strategy_discovery

      - name: Plan bounded training-only refinement
        if: steps.exhaustion.outputs.reuse != 'true'
        id: refinement
        run: |
          set -euo pipefail
          python nexus_multitimeframe_training_refinement.py \
            --manifest experiments/nexus_multitimeframe_strategy_discovery_v1.json \
            --discovery build/nexus_multitimeframe_strategy_discovery/multitimeframe_strategy_discovery.json \
            --output build/nexus_multitimeframe_strategy_discovery/refinement
          should_refine="$(python -c 'import json; print(str(json.load(open("build/nexus_multitimeframe_strategy_discovery/refinement/refinement-plan.json"))["should_refine"]).lower())')"
          echo "should_refine=$should_refine" >> "$GITHUB_OUTPUT"

      - name: Run bounded training-only refinement discovery
        if: steps.exhaustion.outputs.reuse != 'true' && steps.refinement.outputs.should_refine == 'true'
        run: |
          set -euo pipefail
          python nexus_multitimeframe_verified_archive_discovery.py \
            --manifest build/nexus_multitimeframe_strategy_discovery/refinement/refinement-manifest.json \
            --source-sha "$GITHUB_SHA" \
            --output build/nexus_multitimeframe_strategy_discovery/refinement/discovery

      - name: Verify authority boundary
        if: steps.exhaustion.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from nexus_multitimeframe_strategy_discovery import verify_discovery
          from nexus_demo_archive_replay import ARCHIVE_SHA256
          root = Path("build/nexus_multitimeframe_strategy_discovery")
          result = json.loads((root / "multitimeframe_strategy_discovery.json").read_text())
          verification = verify_discovery(result)
          assert verification["decision"] == "pass", verification
          assert result["source_sha"] == "${{ github.sha }}"
          assert result["dataset_archive_sha256"] == ARCHIVE_SHA256
          assert result["research_only"] is True
          assert result["paper_only"] is True
          assert result["live_trading_authority"] is False
          assert result["automatic_strategy_promotion"] is False
          assert result["automatic_paper_forward_started"] is False

          plan = json.loads((root / "refinement" / "refinement-plan.json").read_text())
          refined_manifest = json.loads((root / "refinement" / "refinement-manifest.json").read_text())
          base_manifest = json.loads(Path("experiments/nexus_multitimeframe_strategy_discovery_v1.json").read_text())
          assert plan["selection_basis"] == "training_only"
          assert plan["locked_holdout_used_for_refinement"] is False
          assert plan["research_only"] is True
          assert plan["paper_only"] is True
          assert plan["live_trading_authority"] is False
          assert plan["private_credentials_used"] is False
          assert plan["automatic_strategy_promotion"] is False
          assert plan["automatic_paper_forward_started"] is False
          assert refined_manifest["gates"] == base_manifest["gates"]
          assert refined_manifest["authority"] == base_manifest["authority"]

          refined_count = None
          if plan["should_refine"]:
              refined = json.loads((root / "refinement" / "discovery" / "multitimeframe_strategy_discovery.json").read_text())
              refined_verification = verify_discovery(refined)
              assert refined_verification["decision"] == "pass", refined_verification
              assert refined["source_sha"] == "${{ github.sha }}"
              assert refined["dataset_archive_sha256"] == ARCHIVE_SHA256
              assert refined["research_only"] is True
              assert refined["paper_only"] is True
              assert refined["live_trading_authority"] is False
              assert refined["automatic_strategy_promotion"] is False
              assert refined["automatic_paper_forward_started"] is False
              refined_count = refined["research_proposal_count"]

          print(json.dumps({
              "base_proposal_count": result["research_proposal_count"],
              "refinement_started": plan["should_refine"],
              "refined_proposal_count": refined_count,
              "training_basis_digest": plan["training_basis_digest"],
          }, sort_keys=True))
          PY

      - name: Determine exact search exhaustion
        if: steps.exhaustion.outputs.reuse != 'true'
        id: exhaustion-decision
        run: |
          set -euo pipefail
          python - <<'PY' > build/nexus_multitimeframe_preflight/exhaustion-decision.txt
          import json
          from pathlib import Path
          root = Path("build/nexus_multitimeframe_strategy_discovery")
          base = json.loads((root / "multitimeframe_strategy_discovery.json").read_text())
          plan = json.loads((root / "refinement" / "refinement-plan.json").read_text())
          refined_count = None
          if plan["should_refine"]:
              refined = json.loads((root / "refinement" / "discovery" / "multitimeframe_strategy_discovery.json").read_text())
              refined_count = int(refined["research_proposal_count"])
          should_certify = (
              int(base["research_proposal_count"]) == 0
              and plan["should_refine"] is True
              and refined_count == 0
          )
          print(f"should_certify={str(should_certify).lower()}")
          PY
          cat build/nexus_multitimeframe_preflight/exhaustion-decision.txt >> "$GITHUB_OUTPUT"

      - name: Certify exact exhausted neighborhood
        if: steps.exhaustion-decision.outputs.should_certify == 'true'
        run: |
          set -euo pipefail
          cp build/nexus_multitimeframe_preflight/search-neighborhood.json \
            build/nexus_multitimeframe_strategy_discovery/search-neighborhood.json
          python nexus_multitimeframe_search_exhaustion.py certify \
            --neighborhood build/nexus_multitimeframe_preflight/search-neighborhood.json \
            --base-discovery build/nexus_multitimeframe_strategy_discovery/multitimeframe_strategy_discovery.json \
            --refinement-plan build/nexus_multitimeframe_strategy_discovery/refinement/refinement-plan.json \
            --refined-discovery build/nexus_multitimeframe_strategy_discovery/refinement/discovery/multitimeframe_strategy_discovery.json \
            --output build/nexus_multitimeframe_strategy_discovery/exhaustion-certificate.json
          echo "search_exhaustion_certificate=PASS"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-multitimeframe-strategy-discovery-${{ github.run_id }}
          path: build/nexus_multitimeframe_strategy_discovery
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Publish reusable exact exhaustion certificate
        if: steps.exhaustion-decision.outputs.should_certify == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-multitimeframe-search-exhaustion
          path: build/nexus_multitimeframe_strategy_discovery/exhaustion-certificate.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      # The bounded composite hypotheses share the verified data/authority of
      # this pre-existing approved Research workflow. No extra workflow, job
      # token scope, or protected Phase-3 policy change is required.
      - name: Restore previous composite mechanism ledger
        run: |
          set -euo pipefail
          mkdir -p build/previous-composite
          artifact_id="$(gh api             "repos/$GITHUB_REPOSITORY/actions/artifacts?name=nexus-composite-novelty-state&per_page=100"             --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -n "$artifact_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"               > build/previous-composite.zip
            unzip -q build/previous-composite.zip -d build/previous-composite
            test -s build/previous-composite/novelty-ledger.json
            python - <<'PY'
          from pathlib import Path
          from nexus_composite_strategy_research import load_ledger
          prior = load_ledger(Path("build/previous-composite/novelty-ledger.json"))
          assert prior["research_only"] and prior["auto_demo_promotion"] is False
          assert prior["live_enabled"] is False
          print("prior_mechanism_configs=" + str(len(prior["config_fingerprints_evaluated"])))
          PY
          else
            echo "No prior novelty evidence; starting source-bound first mechanism."
          fi

      - name: Restore immutable archive for composite search if exact static cache skipped discovery
        if: steps.exhaustion.outputs.reuse == 'true'
        run: |
          set -euo pipefail
          mkdir -p build/final_delivery build/bybit_dataset
          python scripts/select_nexus_bybit_replay_artifact.py             --repository "$GITHUB_REPOSITORY"             --output-dir build/final_delivery             --expected-file-name "$DATASET_FILE"             --expected-semantic-sha256 "$DATASET_SHA256"             --delivery-name "$DATASET_DELIVERY"             --artifact-prefix "$DATASET_ARTIFACT_PREFIX"
          test -s "build/final_delivery/$DATASET_FILE"
          unzip -q "build/final_delivery/$DATASET_FILE" -d build/bybit_dataset

      - name: Research next previously unseen composite mechanism and backtest historical folds
        run: |
          set -euo pipefail
          extra=()
          if [ -s build/previous-composite/novelty-ledger.json ]; then
            extra+=(--previous-ledger build/previous-composite/novelty-ledger.json)
          fi
          python nexus_composite_strategy_research.py             --archive-root build/bybit_dataset             --output build/composite             --source-sha "$GITHUB_SHA"             "${extra[@]}"

      - name: Independently verify research-only composite evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from nexus_composite_strategy_research import ARCHIVE_SHA256, digest, load_ledger
          root = Path("build/composite")
          report = json.loads((root / "research-report.json").read_text())
          claimed = report.pop("report_digest")
          assert claimed == digest(report)
          assert report["source_sha"] == os.environ["GITHUB_SHA"]
          assert report["archive_sha256"] == ARCHIVE_SHA256
          assert report["research_only"] is True
          assert report["auto_demo_promotion"] is False
          assert report["live_enabled"] is False
          assert report["status"] in {"EVALUATED_RESEARCH_ONLY", "EXHAUSTED_REQUIRES_NEW_MECHANISM"}
          ledger = load_ledger(root / "novelty-ledger.json")
          if report["status"] == "EVALUATED_RESEARCH_ONLY":
              assert len(report["rows"]) == 12
              assert report["qualification"] == "NOT_QUALIFIED_NO_PRISTINE_FUTURE_HOLDOUT"
              assert report["ledger_digest"] == ledger["ledger_digest"]
              assert all(row["trade_count_limit"] is None for row in report["rows"])
          else:
              assert report["rows"] == []
          print("composite_research_status=" + report["status"])
          PY

      # Existing reviewed discovery owns the verified replay source,
      # signed novelty frontier, and Actions read scope. Export a source-bound
      # immutable cache for the leased real Research Agent without widening
      # the protected NEXUS Runtime Worker's permissions.
      - name: Check existing approved Research input transport cache
        if: github.ref == 'refs/heads/main'
        id: agent-input-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build/agent-research-cache
          key: nexus-composite-inputs-v1-${{ github.sha }}
          lookup-only: true

      - name: Bind canonical archive and novelty frontier as one Research lease input
        if: github.ref == 'refs/heads/main' && steps.agent-input-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          test -s "build/final_delivery/$DATASET_FILE"
          test -s "build/final_delivery/$DATASET_DELIVERY"
          # Agent must execute the NEXT mechanism against the reviewed prior
          # frontier, not rebind to the standalone discovery step\x27s freshly
          # consumed mechanism (which would skip new candidates).
          test -s build/composite/novelty-ledger.json
          rm -rf build/agent-research-cache
          mkdir -p build/agent-research-cache
          cp "build/final_delivery/$DATASET_FILE" build/agent-research-cache/
          cp "build/final_delivery/$DATASET_DELIVERY" build/agent-research-cache/
          # FOURTH and later Agent missions consume ONLY the prior real
          # producer whose exact receipt a distinct independent QA attested
          # and which the durable main-branch coordinator marked DONE.
          # Standalone exploratory novelty artifacts are explicitly forbidden
          # as a replacement: they may have already consumed the next family.
          python scripts/nexus_qa_attested_discovery_frontier.py \
            --repository "$GITHUB_REPOSITORY" \
            --output build/agent-research-cache/previous-ledger.json
          test -s build/agent-research-cache/previous-ledger.json
          python - <<'PY'
          import os
          from pathlib import Path
          from nexus_composite_strategy_research import ARCHIVE_SHA256, digest, load_ledger, safe_write
          from scripts.select_nexus_bybit_replay_artifact import validate_candidate, sha256_file
          root = Path("build/agent-research-cache")
          archive, _ = validate_candidate(
              root, expected_file_name=os.environ["DATASET_FILE"],
              expected_semantic_sha256=ARCHIVE_SHA256, delivery_name=os.environ["DATASET_DELIVERY"],
          )
          old = load_ledger(root / "previous-ledger.json")
          assert old["config_fingerprints_evaluated"], "only non-empty verified research frontier is leasable"
          core = {
              "schema": "nexus.real-research-transport.v1",
              "source_sha": os.environ["GITHUB_SHA"],
              "archive_sha256": ARCHIVE_SHA256,
              "replay_zip_sha256": sha256_file(archive),
              "prior_ledger_digest": old["ledger_digest"],
              "research_only": True,
              "auto_demo_promotion": False,
              "live_enabled": False,
          }
          safe_write(root / "manifest.json", {**core, "manifest_digest": digest(core)})
          print("agent_research_inputs_verified=" + old["ledger_digest"])
          PY

      - name: Publish immutable approved Research input transport
        if: github.ref == 'refs/heads/main' && steps.agent-input-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build/agent-research-cache
          key: nexus-composite-inputs-v1-${{ github.sha }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nexus-composite-novelty-state
          path: |
