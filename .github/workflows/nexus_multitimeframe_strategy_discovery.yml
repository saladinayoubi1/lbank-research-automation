name: NEXUS multi-timeframe strategy discovery

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: "Optional exact replay-v2 artifact ID; blank selects the newest verified match"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "nexus_multitimeframe_strategy_discovery.py"
      - "nexus_multitimeframe_training_refinement.py"
      - "nexus_multitimeframe_verified_archive_discovery.py"
      - "nexus_demo_archive_replay.py"
      - "scripts/select_nexus_bybit_replay_artifact.py"
      - "experiments/nexus_multitimeframe_strategy_discovery_v1.json"
      - "tests/test_nexus_bybit_replay_artifact_lifecycle.py"
      - "tests/test_nexus_multitimeframe_strategy_discovery.py"
      - "tests/test_nexus_multitimeframe_training_refinement.py"
      - "tests/test_nexus_multitimeframe_verified_archive_discovery.py"
      - ".github/workflows/nexus_multitimeframe_strategy_discovery.yml"
  pull_request:
    paths:
      - "nexus_multitimeframe_strategy_discovery.py"
      - "nexus_multitimeframe_training_refinement.py"
      - "nexus_multitimeframe_verified_archive_discovery.py"
      - "nexus_demo_archive_replay.py"
      - "scripts/select_nexus_bybit_replay_artifact.py"
      - "experiments/nexus_multitimeframe_strategy_discovery_v1.json"
      - "tests/test_nexus_bybit_replay_artifact_lifecycle.py"
      - "tests/test_nexus_multitimeframe_strategy_discovery.py"
      - "tests/test_nexus_multitimeframe_training_refinement.py"
      - "tests/test_nexus_multitimeframe_verified_archive_discovery.py"
      - "scripts/nexus_strategy_discovery_controller.py"
      - ".github/workflows/nexus_multitimeframe_strategy_discovery.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: nexus-multitimeframe-strategy-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip check
      - run: >-
          python -m pytest -q
          tests/test_nexus_multitimeframe_strategy_discovery.py
          tests/test_nexus_multitimeframe_training_refinement.py
          tests/test_nexus_multitimeframe_verified_archive_discovery.py
          tests/test_nexus_strategy_discovery_controller.py
          tests/test_nexus_bybit_replay_artifact_lifecycle.py

  discover:
    if: github.event_name == 'pull_request' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    needs: contract-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      DATASET_FILE: NEXUS_BYBIT_replay_v2_2022-12-01_to_2026-07-31.zip
      DATASET_DELIVERY: NEXUS_BYBIT_replay_v2_delivery.json
      DATASET_ARTIFACT_PREFIX: bybit-full-history-final-
      DATASET_SHA256: "2455a725886d81adaec9d3478e8f3b2daaba6c0c9645a691e71737eb64f67422"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip check
      - name: Restore verified immutable Bybit replay-v2 dataset
        env:
          DISPATCH_ARTIFACT_ID: ${{ github.event.inputs.artifact_id }}
        run: |
          set -euo pipefail
          selector_args=()
          if [ -n "$DISPATCH_ARTIFACT_ID" ]; then
            selector_args+=(--artifact-id "$DISPATCH_ARTIFACT_ID")
          fi
          rm -rf build/final_delivery build/bybit_dataset build/nexus_multitimeframe_strategy_discovery
          mkdir -p build/final_delivery build/bybit_dataset
          python scripts/select_nexus_bybit_replay_artifact.py \
            --repository "$GITHUB_REPOSITORY" \
            --output-dir build/final_delivery \
            --expected-file-name "$DATASET_FILE" \
            --expected-semantic-sha256 "$DATASET_SHA256" \
            --delivery-name "$DATASET_DELIVERY" \
            --artifact-prefix "$DATASET_ARTIFACT_PREFIX" \
            "${selector_args[@]}"
          archive="build/final_delivery/$DATASET_FILE"
          test -s "$archive"
          unzip -q "$archive" -d build/bybit_dataset
      - name: Run leakage-resistant discovery
        run: |
          set -euo pipefail
          python nexus_multitimeframe_verified_archive_discovery.py \
            --manifest experiments/nexus_multitimeframe_strategy_discovery_v1.json \
            --source-sha "$GITHUB_SHA" \
            --output build/nexus_multitimeframe_strategy_discovery
      - name: Plan bounded training-only refinement
        id: refinement
        run: |
          set -euo pipefail
          python nexus_multitimeframe_training_refinement.py \
            --manifest experiments/nexus_multitimeframe_strategy_discovery_v1.json \
            --discovery build/nexus_multitimeframe_strategy_discovery/multitimeframe_strategy_discovery.json \
            --output build/nexus_multitimeframe_strategy_discovery/refinement
          should_refine="$(python -c 'import json; print(str(json.load(open("build/nexus_multitimeframe_strategy_discovery/refinement/refinement-plan.json"))["should_refine"]).lower())')"
          echo "should_refine=$should_refine" >> "$GITHUB_OUTPUT"

      - name: Run bounded training-only refinement discovery
        if: steps.refinement.outputs.should_refine == 'true'
        run: |
          set -euo pipefail
          python nexus_multitimeframe_verified_archive_discovery.py \
            --manifest build/nexus_multitimeframe_strategy_discovery/refinement/refinement-manifest.json \
            --source-sha "$GITHUB_SHA" \
            --output build/nexus_multitimeframe_strategy_discovery/refinement/discovery

      - name: Verify authority boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from nexus_multitimeframe_strategy_discovery import verify_discovery
          from nexus_demo_archive_replay import ARCHIVE_SHA256
          root = Path("build/nexus_multitimeframe_strategy_discovery")
          result = json.loads((root / "multitimeframe_strategy_discovery.json").read_text())
          verification = verify_discovery(result)
          assert verification["decision"] == "pass", verification
          assert result["source_sha"] == "${{ github.sha }}"
          assert result["dataset_archive_sha256"] == ARCHIVE_SHA256
          assert result["research_only"] is True
          assert result["paper_only"] is True
          assert result["live_trading_authority"] is False
          assert result["automatic_strategy_promotion"] is False
          assert result["automatic_paper_forward_started"] is False

          plan = json.loads((root / "refinement" / "refinement-plan.json").read_text())
          refined_manifest = json.loads((root / "refinement" / "refinement-manifest.json").read_text())
          base_manifest = json.loads(Path("experiments/nexus_multitimeframe_strategy_discovery_v1.json").read_text())
          assert plan["selection_basis"] == "training_only"
          assert plan["locked_holdout_used_for_refinement"] is False
          assert plan["research_only"] is True
          assert plan["paper_only"] is True
          assert plan["live_trading_authority"] is False
          assert plan["private_credentials_used"] is False
          assert plan["automatic_strategy_promotion"] is False
          assert plan["automatic_paper_forward_started"] is False
          assert refined_manifest["gates"] == base_manifest["gates"]
          assert refined_manifest["authority"] == base_manifest["authority"]

          refined_count = None
          if plan["should_refine"]:
              refined = json.loads((root / "refinement" / "discovery" / "multitimeframe_strategy_discovery.json").read_text())
              refined_verification = verify_discovery(refined)
              assert refined_verification["decision"] == "pass", refined_verification
              assert refined["source_sha"] == "${{ github.sha }}"
              assert refined["dataset_archive_sha256"] == ARCHIVE_SHA256
              assert refined["research_only"] is True
              assert refined["paper_only"] is True
              assert refined["live_trading_authority"] is False
              assert refined["automatic_strategy_promotion"] is False
              assert refined["automatic_paper_forward_started"] is False
              refined_count = refined["research_proposal_count"]

          print(json.dumps({
              "base_proposal_count": result["research_proposal_count"],
              "refinement_started": plan["should_refine"],
              "refined_proposal_count": refined_count,
              "training_basis_digest": plan["training_basis_digest"],
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-multitimeframe-strategy-discovery-${{ github.run_id }}
          path: build/nexus_multitimeframe_strategy_discovery
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
