name: Workflow Permissions Policy

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'security/workflow-permissions-policy-v1.json'
      - 'scripts/check_workflow_permissions.py'
      - 'workflow_trust_boundaries.py'
      - 'tests/test_workflow_permissions.py'
      - 'tests/test_workflow_trust_boundaries.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install safe YAML parser
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Run adversarial unit tests
        run: python -m unittest tests.test_workflow_permissions tests.test_workflow_trust_boundaries -v
      - name: Audit complete workflow inventory
        run: python scripts/check_workflow_permissions.py
