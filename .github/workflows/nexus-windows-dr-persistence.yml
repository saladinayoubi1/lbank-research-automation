name: NEXUS Windows DR Persistence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - scripts/install_nexus_windows_dr_autostart.ps1
      - .github/workflows/nexus-windows-dr-persistence.yml
  push:
    branches: [main]
    paths:
      - scripts/install_nexus_windows_dr_autostart.ps1
      - .github/workflows/nexus-windows-dr-persistence.yml
  schedule:
    - cron: '7,27,47 * * * *'

permissions:
  contents: read

concurrency:
  group: nexus-windows-dr-persistence-${{ github.event_name == 'pull_request' && 'contract' || 'runtime' }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Verify physical exact-fetch contract
        shell: powershell
        run: |
          $text = Get-Content '.github\workflows\nexus-windows-dr-persistence.yml' -Raw
          $parts = [regex]::Split($text, '(?m)^  persist:\s*$', 2)
          if ($parts.Count -ne 2) { throw 'Unable to isolate physical persistence job.' }
          $persist = $parts[1]
          if ($persist -match 'uses:\s+actions/checkout@') { throw 'Physical persistence job must not use actions/checkout.' }
          foreach ($required in @(
            'https://github.com/${env:GITHUB_REPOSITORY}.git',
            'git config --local --unset-all http.https://github.com/.extraheader',
            'http.version=HTTP/1.1',
            '$fetchMaxAttempts = 3',
            'for ($fetchAttempt = 1; $fetchAttempt -le $fetchMaxAttempts; $fetchAttempt++)',
            '--no-tags --prune --depth=1 origin $env:GITHUB_SHA',
            'git checkout --detach --force FETCH_HEAD',
            'exact_trigger_sha='
          )) {
            if (-not $persist.Contains($required)) { throw "Required physical exact-fetch marker missing: $required" }
          }
          foreach ($forbidden in @('x-access-token', 'Authorization: Bearer', 'http.extraHeader')) {
            if ($persist.Contains($forbidden)) { throw "Forbidden physical checkout credential marker present: $forbidden" }
          }

      - name: Parse targeted persistence script
        shell: powershell
        run: |
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts\install_nexus_windows_dr_autostart.ps1'),[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){$errors | ForEach-Object { Write-Error $_.Message }; exit 1}

      - name: Verify fail-closed behavior on a non-target runner
        shell: powershell
        run: |
          .\scripts\install_nexus_windows_dr_autostart.ps1 `
            -Mode Install `
            -RunnerRoot 'C:\actions-runner\actions-runner' `
            -ExpectedRunnerName 'NEXUS-WINDOWS-DR' `
            -ExpectedGitHubUrl 'https://github.com/saladinayoubi1/lbank-research-automation' `
            -OutputPath 'build\windows-dr-autostart\contract-evidence.json'
          $evidence = Get-Content 'build\windows-dr-autostart\contract-evidence.json' -Raw | ConvertFrom-Json
          if ($evidence.decision -ne 'SKIPPED_WRONG_RUNNER') { throw "Expected SKIPPED_WRONG_RUNNER, got $($evidence.decision)" }
          if ($evidence.runner_registration_modified -ne $false) { throw 'Runner registration mutation must remain false.' }
          if ($evidence.runner_credentials_modified -ne $false) { throw 'Runner credential mutation must remain false.' }
          if ($evidence.other_runner_paths_modified -ne $false) { throw 'Other runner path mutation must remain false.' }
          if ($evidence.live_trading_authority -ne $false) { throw 'Live authority must remain false.' }

  persist:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    defaults:
      run:
        shell: cmd
    steps:
      - name: Prepare anonymous exact source with bounded HTTP/1.1 retries
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version 2.0

          $repoUrl = "https://github.com/${env:GITHUB_REPOSITORY}.git"
          if (Test-Path '.git' -PathType Container) {
            & git remote set-url origin $repoUrl
            if ($LASTEXITCODE -ne 0) { throw 'Failed to bind existing workspace to anonymous repository URL.' }
            & git reset --hard
            if ($LASTEXITCODE -ne 0) { throw 'Failed to reset existing physical workspace.' }
            & git clean -ffdx
            if ($LASTEXITCODE -ne 0) { throw 'Failed to clean existing physical workspace.' }
          }
          else {
            Get-ChildItem -Force | Remove-Item -Recurse -Force
            & git init .
            if ($LASTEXITCODE -ne 0) { throw 'Failed to initialize physical workspace.' }
            & git remote add origin $repoUrl
            if ($LASTEXITCODE -ne 0) { throw 'Failed to add anonymous repository remote.' }
          }

          & git config --local --unset-all http.https://github.com/.extraheader
          $fetchOk = $false
          $fetchMaxAttempts = 3
          for ($fetchAttempt = 1; $fetchAttempt -le $fetchMaxAttempts; $fetchAttempt++) {
            & git -c 'http.version=HTTP/1.1' fetch --no-tags --prune --depth=1 origin $env:GITHUB_SHA
            if ($LASTEXITCODE -eq 0) {
              $fetchOk = $true
              break
            }
            Write-Warning "Exact repository fetch attempt $fetchAttempt/$fetchMaxAttempts failed."
            if ($fetchAttempt -lt $fetchMaxAttempts) {
              Start-Sleep -Seconds ($fetchAttempt * 5)
            }
          }
          if (-not $fetchOk) {
            throw "Exact repository fetch failed after $fetchMaxAttempts bounded attempts."
          }

          & git checkout --detach --force FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Exact repository checkout failed.' }
          $checkedOutSha = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $checkedOutSha -ne $env:GITHUB_SHA) {
            throw "Exact trigger SHA mismatch: expected=$env:GITHUB_SHA actual=$checkedOutSha"
          }
          & git clean -ffdx
          if ($LASTEXITCODE -ne 0) { throw 'Post-checkout workspace clean failed.' }
          Write-Host "exact_trigger_sha=$checkedOutSha"

      - name: Parse targeted Windows DR persistence script
        run: >-
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command
          "$tokens=$null;$errors=$null;[void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts\install_nexus_windows_dr_autostart.ps1'),[ref]$tokens,[ref]$errors);if($errors.Count -gt 0){$errors | ForEach-Object { Write-Error $_.Message };exit 1}"

      - name: Install persistence only when claimed by NEXUS-WINDOWS-DR
        continue-on-error: true
        run: >-
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts\install_nexus_windows_dr_autostart.ps1
          -Mode Install
          -RunnerRoot "C:\actions-runner\actions-runner"
          -ExpectedRunnerName "NEXUS-WINDOWS-DR"
          -ExpectedGitHubUrl "https://github.com/saladinayoubi1/lbank-research-automation"
          -OutputPath "build\windows-dr-autostart\evidence.json"

      - name: Require exact target claim and successful persistence install
        if: always()
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          if (-not (Test-Path 'build\windows-dr-autostart\evidence.json' -PathType Leaf)) { throw 'Persistence evidence is missing.' }
          $evidence = Get-Content 'build\windows-dr-autostart\evidence.json' -Raw | ConvertFrom-Json
          if ($evidence.decision -ne 'SUCCESS') {
            $detail = if ($evidence.error) { [string]$evidence.error } else { 'no error detail recorded' }
            throw "Persistence was not installed by the exact target runner: $($evidence.decision); error=$detail"
          }
          if ($evidence.current_runner_name -ne 'NEXUS-WINDOWS-DR') { throw "Unexpected runner claim: $($evidence.current_runner_name)" }
          if ($evidence.expected_runner_name -ne 'NEXUS-WINDOWS-DR') { throw "Unexpected expected runner: $($evidence.expected_runner_name)" }
          if ($evidence.runner_registration_modified -ne $false) { throw 'Runner registration mutation must remain false.' }
          if ($evidence.runner_credentials_modified -ne $false) { throw 'Runner credential mutation must remain false.' }
          if ($evidence.other_runner_paths_modified -ne $false) { throw 'Other runner path mutation must remain false.' }
          if ($evidence.live_trading_authority -ne $false) { throw 'Live authority must remain false.' }

      - name: Upload sanitized persistence evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-windows-dr-persistence-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/windows-dr-autostart/evidence.json
          if-no-files-found: error
          retention-days: 14
