name: NEXUS Windows DR Persistence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - scripts/install_nexus_windows_dr_autostart.ps1
      - .github/workflows/nexus-windows-dr-persistence.yml
  push:
    branches: [main]
    paths:
      - scripts/install_nexus_windows_dr_autostart.ps1
      - .github/workflows/nexus-windows-dr-persistence.yml
  schedule:
    - cron: '7,27,47 * * * *'

permissions:
  contents: read

concurrency:
  group: nexus-windows-dr-persistence-${{ github.event_name == 'pull_request' && 'contract' || 'runtime' }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Verify physical exact-fetch contract
        shell: powershell
        run: |
          $text = Get-Content '.github\workflows\nexus-windows-dr-persistence.yml' -Raw
          $parts = [regex]::Split($text, '(?m)^  persist:\s*$', 2)
          if ($parts.Count -ne 2) { throw 'Unable to isolate physical persistence job.' }
          $persist = [regex]::Split($parts[1], '(?m)^  upload-evidence:\s*          foreach ($required in @(
            'https://github.com/${env:GITHUB_REPOSITORY}.git',
            '$sourceRoot = Join-Path $env:RUNNER_TEMP',
            'NEXUS_DR_SOURCE_ROOT=',
            'git config --local --unset-all http.https://github.com/.extraheader',
            'http.version=HTTP/1.1',
            '$fetchMaxAttempts = 3',
            'for ($fetchAttempt = 1; $fetchAttempt -le $fetchMaxAttempts; $fetchAttempt++)',
            '--no-tags --prune --depth=1 origin $env:GITHUB_SHA',
            'git checkout --detach --force FETCH_HEAD',
            'exact_trigger_sha='
          )) {
            if (-not $persist.Contains($required)) { throw "Required physical exact-fetch marker missing: $required" }
          }
          foreach ($forbidden in @(
            'x-access-token',
            'Authorization: Bearer',
            'http.extraHeader',
            'safe.directory',
            'git reset --hard',
            'git clean -ffdx',
            'git remote set-url origin'
          )) {
            if ($persist.Contains($forbidden)) { throw "Forbidden physical checkout credential marker present: $forbidden" }
          }

      - name: Parse targeted persistence script
        shell: powershell
        run: |
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts\install_nexus_windows_dr_autostart.ps1'),[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){$errors | ForEach-Object { Write-Error $_.Message }; exit 1}

      - name: Verify fail-closed existing-service reuse contract
        shell: powershell
        run: |
          $text = Get-Content 'scripts\install_nexus_windows_dr_autostart.ps1' -Raw
          foreach ($required in @(
            'Get-ExactExistingRunnerService',
            "Join-Path `$FullRoot '.service'",
            "Join-Path `$FullRoot 'bin\RunnerService.exe'",
            'Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\',
            'Get-ItemProperty -LiteralPath $serviceRegistryPath',
            'Get-Service -Name $serviceName',
            'serviceConfig.Start -ne 2',
            "serviceController.Status -ne 'Running'",
            "persistence_mode = 'EXISTING_WINDOWS_SERVICE'",
            'existing_service_reused = $true',
            'service_modified = $false',
            'scheduled_task_modified = $false',
            'target_service_observed = $true',
            'supervisor_skipped_existing_service=true'
          )) {
            if (-not $text.Contains($required)) { throw "Required existing-service proof marker missing: $required" }
          }
          foreach ($forbidden in @('Get-CimInstance -ClassName Win32_Service','New-Service','Set-Service','Start-Service','Stop-Service','config.cmd','remove.cmd')) {
            if ($text.Contains($forbidden)) { throw "Forbidden service or registration mutation marker present: $forbidden" }
          }

      - name: Verify fail-closed behavior on a non-target runner
        shell: powershell
        run: |
          .\scripts\install_nexus_windows_dr_autostart.ps1 `
            -Mode Install `
            -RunnerRoot 'C:\actions-runner\actions-runner' `
            -ExpectedRunnerName 'NEXUS-WINDOWS-DR' `
            -ExpectedGitHubUrl 'https://github.com/saladinayoubi1/lbank-research-automation' `
            -OutputPath 'build\windows-dr-autostart\contract-evidence.json'
          $evidence = Get-Content 'build\windows-dr-autostart\contract-evidence.json' -Raw | ConvertFrom-Json
          if ($evidence.decision -ne 'SKIPPED_WRONG_RUNNER') { throw "Expected SKIPPED_WRONG_RUNNER, got $($evidence.decision)" }
          if ($evidence.runner_registration_modified -ne $false) { throw 'Runner registration mutation must remain false.' }
          if ($evidence.runner_credentials_modified -ne $false) { throw 'Runner credential mutation must remain false.' }
          if ($evidence.other_runner_paths_modified -ne $false) { throw 'Other runner path mutation must remain false.' }
          if ($evidence.service_installed -ne $false) { throw 'This recovery must not install a Windows service.' }
          if ($evidence.live_trading_authority -ne $false) { throw 'Live authority must remain false.' }

  persist:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, nexus-remote-rescue]
    timeout-minutes: 10
    outputs:
      evidence_b64: ${{ steps.evidence_handoff.outputs.evidence_b64 }}
      evidence_sha256: ${{ steps.evidence_handoff.outputs.evidence_sha256 }}
      evidence_bytes: ${{ steps.evidence_handoff.outputs.evidence_bytes }}
    defaults:
      run:
        shell: cmd
    steps:
      - name: Prepare anonymous exact source with bounded HTTP/1.1 retries
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version 2.0

          $repoUrl = "https://github.com/${env:GITHUB_REPOSITORY}.git"
          $sourceRoot = Join-Path $env:RUNNER_TEMP "nexus-windows-dr-source-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $sourceRoot = [IO.Path]::GetFullPath($sourceRoot).TrimEnd('\')
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          if ((Split-Path -Parent $sourceRoot) -ne $runnerTemp -or
              (Split-Path -Leaf $sourceRoot) -notmatch '^nexus-windows-dr-source-[0-9]+-[0-9]+$') {
            throw 'Isolated DR source root escaped the exact runner temp boundary.'
          }
          if (Test-Path -LiteralPath $sourceRoot) {
            throw 'Exact isolated DR source root already exists; refusing to reuse stale source.'
          }

          New-Item -ItemType Directory -Path $sourceRoot | Out-Null
          $utf8 = New-Object Text.UTF8Encoding($false)
          [IO.File]::AppendAllText($env:GITHUB_ENV, "NEXUS_DR_SOURCE_ROOT=$sourceRoot`n", $utf8)
          Push-Location $sourceRoot
          try {
            & git init .
            if ($LASTEXITCODE -ne 0) { throw 'Failed to initialize isolated physical source.' }
            & git remote add origin $repoUrl
            if ($LASTEXITCODE -ne 0) { throw 'Failed to add anonymous repository remote.' }

            & git config --local --unset-all http.https://github.com/.extraheader
            $fetchOk = $false
            $fetchMaxAttempts = 3
            for ($fetchAttempt = 1; $fetchAttempt -le $fetchMaxAttempts; $fetchAttempt++) {
              & git -c 'http.version=HTTP/1.1' fetch --no-tags --prune --depth=1 origin $env:GITHUB_SHA
              if ($LASTEXITCODE -eq 0) {
                $fetchOk = $true
                break
              }
              Write-Warning "Exact repository fetch attempt $fetchAttempt/$fetchMaxAttempts failed."
              if ($fetchAttempt -lt $fetchMaxAttempts) {
                Start-Sleep -Seconds ($fetchAttempt * 5)
              }
            }
            if (-not $fetchOk) {
              throw "Exact repository fetch failed after $fetchMaxAttempts bounded attempts."
            }

            & git checkout --detach --force FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Exact repository checkout failed.' }
            $checkedOutSha = (& git rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $checkedOutSha -ne $env:GITHUB_SHA) {
              throw "Exact trigger SHA mismatch: expected=$env:GITHUB_SHA actual=$checkedOutSha"
            }
          }
          finally {
            Pop-Location
          }
          Write-Host "isolated_source_root=$sourceRoot"
          Write-Host "exact_trigger_sha=$checkedOutSha"

      - name: Parse targeted Windows DR persistence script
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $path = Join-Path $env:NEXUS_DR_SOURCE_ROOT 'scripts\install_nexus_windows_dr_autostart.ps1'
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw 'Exact DR persistence script is missing.' }
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Install persistence only when claimed by NEXUS-WINDOWS-DR
        continue-on-error: true
        run: >-
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File "%NEXUS_DR_SOURCE_ROOT%\scripts\install_nexus_windows_dr_autostart.ps1"
          -Mode Install
          -RunnerRoot "C:\actions-runner\actions-runner"
          -ExpectedRunnerName "NEXUS-WINDOWS-DR"
          -ExpectedGitHubUrl "https://github.com/saladinayoubi1/lbank-research-automation"
          -OutputPath "%RUNNER_TEMP%\nexus-windows-dr-persistence-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%.json"

      - name: Require exact target claim and successful persistence install
        if: always()
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $evidencePath = Join-Path $env:RUNNER_TEMP "nexus-windows-dr-persistence-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.json"
          if (-not (Test-Path -LiteralPath $evidencePath -PathType Leaf)) { throw 'Persistence evidence is missing.' }
          $evidence = Get-Content -LiteralPath $evidencePath -Raw | ConvertFrom-Json
          if ($evidence.schema_version -ne 3) { throw "Unexpected persistence evidence schema: $($evidence.schema_version)" }
          if ($evidence.decision -ne 'SUCCESS') {
            $detail = if ($evidence.error) { [string]$evidence.error } else { 'no error detail recorded' }
            throw "Persistence was not installed by the exact target runner: $($evidence.decision); error=$detail"
          }
          if ($evidence.current_runner_name -ne 'NEXUS-WINDOWS-DR') { throw "Unexpected runner claim: $($evidence.current_runner_name)" }
          if ($evidence.expected_runner_name -ne 'NEXUS-WINDOWS-DR') { throw "Unexpected expected runner: $($evidence.expected_runner_name)" }
          if ($evidence.runner_registration_modified -ne $false) { throw 'Runner registration mutation must remain false.' }
          if ($evidence.runner_credentials_modified -ne $false) { throw 'Runner credential mutation must remain false.' }
          if ($evidence.other_runner_paths_modified -ne $false) { throw 'Other runner path mutation must remain false.' }
          if ($evidence.service_installed -ne $false) { throw 'This recovery must not install a Windows service.' }
          if ($evidence.live_trading_authority -ne $false) { throw 'Live authority must remain false.' }
          if ($evidence.persistence_mode -eq 'EXISTING_WINDOWS_SERVICE') {
            if ($evidence.existing_service_reused -ne $true -or
                $evidence.service_modified -ne $false -or
                $evidence.scheduled_task_modified -ne $false -or
                $evidence.service_state -ne 'Running' -or
                $evidence.service_start_mode -ne 'Auto' -or
                $evidence.target_service_observed -ne $true) {
              throw 'Existing Windows service persistence proof is incomplete.'
            }
            if ($null -eq $evidence.target_listener_observed) {
              throw 'Existing Windows service listener visibility must be explicitly recorded.'
            }
          }
          elseif ($evidence.persistence_mode -ne 'INTERACTIVE_USER_SCHEDULED_TASK') {
            throw "Unexpected DR persistence mode: $($evidence.persistence_mode)"
          }

      - name: Export bounded sanitized persistence evidence
        id: evidence_handoff
        if: always()
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $evidencePath = Join-Path $env:RUNNER_TEMP "nexus-windows-dr-persistence-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.json"
          if (-not (Test-Path -LiteralPath $evidencePath -PathType Leaf)) {
            Write-Host 'evidence_handoff=SKIPPED_MISSING'
            exit 0
          }
          $bytes = [IO.File]::ReadAllBytes($evidencePath)
          if ($bytes.Length -lt 2 -or $bytes.Length -gt 65536) {
            throw "Persistence evidence escaped bounded handoff size: $($bytes.Length)"
          }
          $b64 = [Convert]::ToBase64String($bytes)
          $sha256 = (Get-FileHash -LiteralPath $evidencePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $utf8 = New-Object Text.UTF8Encoding($false)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "evidence_b64=$b64`n", $utf8)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "evidence_sha256=$sha256`n", $utf8)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "evidence_bytes=$($bytes.Length)`n", $utf8)
          Write-Host "evidence_handoff=PASS bytes=$($bytes.Length) sha256=$sha256"

      - name: Remove exact isolated source
        if: always()
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          if (-not $env:NEXUS_DR_SOURCE_ROOT) {
            Write-Host 'isolated_source_cleanup=SKIPPED_NOT_CREATED'
            exit 0
          }
          $sourceRoot = [IO.Path]::GetFullPath($env:NEXUS_DR_SOURCE_ROOT).TrimEnd('\')
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          if ((Split-Path -Parent $sourceRoot) -ne $runnerTemp -or
              (Split-Path -Leaf $sourceRoot) -notmatch '^nexus-windows-dr-source-[0-9]+-[0-9]+$') {
            throw 'Refusing cleanup outside the exact isolated DR source boundary.'
          }
          if (Test-Path -LiteralPath $sourceRoot) {
            Remove-Item -LiteralPath $sourceRoot -Recurse -Force
          }
          Write-Host 'isolated_source_cleanup=PASS'

  upload-evidence:
    if: ${{ always() && github.event_name != 'pull_request' && needs.persist.outputs.evidence_b64 != '' }}
    needs: persist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EVIDENCE_B64: ${{ needs.persist.outputs.evidence_b64 }}
      EVIDENCE_SHA256: ${{ needs.persist.outputs.evidence_sha256 }}
      EVIDENCE_BYTES: ${{ needs.persist.outputs.evidence_bytes }}
    steps:
      - name: Rehydrate and verify sanitized persistence evidence
        run: |
          set -euo pipefail
          case "$EVIDENCE_BYTES" in
            ''|*[!0-9]*) echo "::error::Invalid evidence byte count."; exit 1 ;;
          esac
          if [ "$EVIDENCE_BYTES" -lt 2 ] || [ "$EVIDENCE_BYTES" -gt 65536 ]; then
            echo "::error::Persistence evidence escaped bounded handoff size."
            exit 1
          fi
          mkdir -p build/windows-dr-persistence
          printf '%s' "$EVIDENCE_B64" | base64 -d > build/windows-dr-persistence/evidence.json
          actual_bytes="$(wc -c < build/windows-dr-persistence/evidence.json | tr -d '[:space:]')"
          test "$actual_bytes" = "$EVIDENCE_BYTES"
          actual_sha="$(sha256sum build/windows-dr-persistence/evidence.json | awk '{print $1}')"
          test "$actual_sha" = "$EVIDENCE_SHA256"
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("build/windows-dr-persistence/evidence.json").read_text(encoding="utf-8-sig"))
          if payload.get("schema_version") != 3:
              raise SystemExit("unexpected persistence evidence schema")
          if payload.get("runner_registration_modified") is not False:
              raise SystemExit("runner registration boundary changed")
          if payload.get("runner_credentials_modified") is not False:
              raise SystemExit("runner credential boundary changed")
          if payload.get("live_trading_authority") is not False:
              raise SystemExit("live authority boundary changed")
          print("hosted_evidence_rehydration=PASS")
          PY

      - name: Upload sanitized persistence evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-windows-dr-persistence-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/windows-dr-persistence/evidence.json
          if-no-files-found: error
          retention-days: 14
, 2)[0]
          if (-not $persist.Contains('runs-on: [self-hosted, Windows, X64, nexus-remote-rescue]')) { throw 'Physical persistence job must target the dedicated DR runner label.' }
          if ($persist -match 'uses:\s+actions/checkout@') { throw 'Physical persistence job must not use actions/checkout.' }
          if ($persist -match 'uses:\s+actions/upload-artifact@') { throw 'Physical persistence job must not upload artifacts directly.' }
          if (-not $persist.Contains('Export bounded sanitized persistence evidence')) { throw 'Physical persistence job must export a bounded evidence handoff.' }
          foreach ($required in @(
            'https://github.com/${env:GITHUB_REPOSITORY}.git',
            '$sourceRoot = Join-Path $env:RUNNER_TEMP',
            'NEXUS_DR_SOURCE_ROOT=',
            'git config --local --unset-all http.https://github.com/.extraheader',
            'http.version=HTTP/1.1',
            '$fetchMaxAttempts = 3',
            'for ($fetchAttempt = 1; $fetchAttempt -le $fetchMaxAttempts; $fetchAttempt++)',
            '--no-tags --prune --depth=1 origin $env:GITHUB_SHA',
            'git checkout --detach --force FETCH_HEAD',
            'exact_trigger_sha='
          )) {
            if (-not $persist.Contains($required)) { throw "Required physical exact-fetch marker missing: $required" }
          }
          foreach ($forbidden in @(
            'x-access-token',
            'Authorization: Bearer',
            'http.extraHeader',
            'safe.directory',
            'git reset --hard',
            'git clean -ffdx',
            'git remote set-url origin'
          )) {
            if ($persist.Contains($forbidden)) { throw "Forbidden physical checkout credential marker present: $forbidden" }
          }

      - name: Parse targeted persistence script
        shell: powershell
        run: |
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts\install_nexus_windows_dr_autostart.ps1'),[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){$errors | ForEach-Object { Write-Error $_.Message }; exit 1}

      - name: Verify fail-closed existing-service reuse contract
        shell: powershell
        run: |
          $text = Get-Content 'scripts\install_nexus_windows_dr_autostart.ps1' -Raw
          foreach ($required in @(
            'Get-ExactExistingRunnerService',
            "Join-Path `$FullRoot '.service'",
            "Join-Path `$FullRoot 'bin\RunnerService.exe'",
            'Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\',
            'Get-ItemProperty -LiteralPath $serviceRegistryPath',
            'Get-Service -Name $serviceName',
            'serviceConfig.Start -ne 2',
            "serviceController.Status -ne 'Running'",
            "persistence_mode = 'EXISTING_WINDOWS_SERVICE'",
            'existing_service_reused = $true',
            'service_modified = $false',
            'scheduled_task_modified = $false',
            'target_service_observed = $true',
            'supervisor_skipped_existing_service=true'
          )) {
            if (-not $text.Contains($required)) { throw "Required existing-service proof marker missing: $required" }
          }
          foreach ($forbidden in @('Get-CimInstance -ClassName Win32_Service','New-Service','Set-Service','Start-Service','Stop-Service','config.cmd','remove.cmd')) {
            if ($text.Contains($forbidden)) { throw "Forbidden service or registration mutation marker present: $forbidden" }
          }

      - name: Verify fail-closed behavior on a non-target runner
        shell: powershell
        run: |
          .\scripts\install_nexus_windows_dr_autostart.ps1 `
            -Mode Install `
            -RunnerRoot 'C:\actions-runner\actions-runner' `
            -ExpectedRunnerName 'NEXUS-WINDOWS-DR' `
            -ExpectedGitHubUrl 'https://github.com/saladinayoubi1/lbank-research-automation' `
            -OutputPath 'build\windows-dr-autostart\contract-evidence.json'
          $evidence = Get-Content 'build\windows-dr-autostart\contract-evidence.json' -Raw | ConvertFrom-Json
          if ($evidence.decision -ne 'SKIPPED_WRONG_RUNNER') { throw "Expected SKIPPED_WRONG_RUNNER, got $($evidence.decision)" }
          if ($evidence.runner_registration_modified -ne $false) { throw 'Runner registration mutation must remain false.' }
          if ($evidence.runner_credentials_modified -ne $false) { throw 'Runner credential mutation must remain false.' }
          if ($evidence.other_runner_paths_modified -ne $false) { throw 'Other runner path mutation must remain false.' }
          if ($evidence.service_installed -ne $false) { throw 'This recovery must not install a Windows service.' }
          if ($evidence.live_trading_authority -ne $false) { throw 'Live authority must remain false.' }

  persist:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, nexus-remote-rescue]
    timeout-minutes: 10
    outputs:
      evidence_b64: ${{ steps.evidence_handoff.outputs.evidence_b64 }}
      evidence_sha256: ${{ steps.evidence_handoff.outputs.evidence_sha256 }}
      evidence_bytes: ${{ steps.evidence_handoff.outputs.evidence_bytes }}
    defaults:
      run:
        shell: cmd
    steps:
      - name: Prepare anonymous exact source with bounded HTTP/1.1 retries
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version 2.0

          $repoUrl = "https://github.com/${env:GITHUB_REPOSITORY}.git"
          $sourceRoot = Join-Path $env:RUNNER_TEMP "nexus-windows-dr-source-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $sourceRoot = [IO.Path]::GetFullPath($sourceRoot).TrimEnd('\')
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          if ((Split-Path -Parent $sourceRoot) -ne $runnerTemp -or
              (Split-Path -Leaf $sourceRoot) -notmatch '^nexus-windows-dr-source-[0-9]+-[0-9]+$') {
            throw 'Isolated DR source root escaped the exact runner temp boundary.'
          }
          if (Test-Path -LiteralPath $sourceRoot) {
            throw 'Exact isolated DR source root already exists; refusing to reuse stale source.'
          }

          New-Item -ItemType Directory -Path $sourceRoot | Out-Null
          $utf8 = New-Object Text.UTF8Encoding($false)
          [IO.File]::AppendAllText($env:GITHUB_ENV, "NEXUS_DR_SOURCE_ROOT=$sourceRoot`n", $utf8)
          Push-Location $sourceRoot
          try {
            & git init .
            if ($LASTEXITCODE -ne 0) { throw 'Failed to initialize isolated physical source.' }
            & git remote add origin $repoUrl
            if ($LASTEXITCODE -ne 0) { throw 'Failed to add anonymous repository remote.' }

            & git config --local --unset-all http.https://github.com/.extraheader
            $fetchOk = $false
            $fetchMaxAttempts = 3
            for ($fetchAttempt = 1; $fetchAttempt -le $fetchMaxAttempts; $fetchAttempt++) {
              & git -c 'http.version=HTTP/1.1' fetch --no-tags --prune --depth=1 origin $env:GITHUB_SHA
              if ($LASTEXITCODE -eq 0) {
                $fetchOk = $true
                break
              }
              Write-Warning "Exact repository fetch attempt $fetchAttempt/$fetchMaxAttempts failed."
              if ($fetchAttempt -lt $fetchMaxAttempts) {
                Start-Sleep -Seconds ($fetchAttempt * 5)
              }
            }
            if (-not $fetchOk) {
              throw "Exact repository fetch failed after $fetchMaxAttempts bounded attempts."
            }

            & git checkout --detach --force FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Exact repository checkout failed.' }
            $checkedOutSha = (& git rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $checkedOutSha -ne $env:GITHUB_SHA) {
              throw "Exact trigger SHA mismatch: expected=$env:GITHUB_SHA actual=$checkedOutSha"
            }
          }
          finally {
            Pop-Location
          }
          Write-Host "isolated_source_root=$sourceRoot"
          Write-Host "exact_trigger_sha=$checkedOutSha"

      - name: Parse targeted Windows DR persistence script
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $path = Join-Path $env:NEXUS_DR_SOURCE_ROOT 'scripts\install_nexus_windows_dr_autostart.ps1'
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw 'Exact DR persistence script is missing.' }
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Install persistence only when claimed by NEXUS-WINDOWS-DR
        continue-on-error: true
        run: >-
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File "%NEXUS_DR_SOURCE_ROOT%\scripts\install_nexus_windows_dr_autostart.ps1"
          -Mode Install
          -RunnerRoot "C:\actions-runner\actions-runner"
          -ExpectedRunnerName "NEXUS-WINDOWS-DR"
          -ExpectedGitHubUrl "https://github.com/saladinayoubi1/lbank-research-automation"
          -OutputPath "%RUNNER_TEMP%\nexus-windows-dr-persistence-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%.json"

      - name: Require exact target claim and successful persistence install
        if: always()
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $evidencePath = Join-Path $env:RUNNER_TEMP "nexus-windows-dr-persistence-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.json"
          if (-not (Test-Path -LiteralPath $evidencePath -PathType Leaf)) { throw 'Persistence evidence is missing.' }
          $evidence = Get-Content -LiteralPath $evidencePath -Raw | ConvertFrom-Json
          if ($evidence.schema_version -ne 3) { throw "Unexpected persistence evidence schema: $($evidence.schema_version)" }
          if ($evidence.decision -ne 'SUCCESS') {
            $detail = if ($evidence.error) { [string]$evidence.error } else { 'no error detail recorded' }
            throw "Persistence was not installed by the exact target runner: $($evidence.decision); error=$detail"
          }
          if ($evidence.current_runner_name -ne 'NEXUS-WINDOWS-DR') { throw "Unexpected runner claim: $($evidence.current_runner_name)" }
          if ($evidence.expected_runner_name -ne 'NEXUS-WINDOWS-DR') { throw "Unexpected expected runner: $($evidence.expected_runner_name)" }
          if ($evidence.runner_registration_modified -ne $false) { throw 'Runner registration mutation must remain false.' }
          if ($evidence.runner_credentials_modified -ne $false) { throw 'Runner credential mutation must remain false.' }
          if ($evidence.other_runner_paths_modified -ne $false) { throw 'Other runner path mutation must remain false.' }
          if ($evidence.service_installed -ne $false) { throw 'This recovery must not install a Windows service.' }
          if ($evidence.live_trading_authority -ne $false) { throw 'Live authority must remain false.' }
          if ($evidence.persistence_mode -eq 'EXISTING_WINDOWS_SERVICE') {
            if ($evidence.existing_service_reused -ne $true -or
                $evidence.service_modified -ne $false -or
                $evidence.scheduled_task_modified -ne $false -or
                $evidence.service_state -ne 'Running' -or
                $evidence.service_start_mode -ne 'Auto' -or
                $evidence.target_service_observed -ne $true) {
              throw 'Existing Windows service persistence proof is incomplete.'
            }
            if ($null -eq $evidence.target_listener_observed) {
              throw 'Existing Windows service listener visibility must be explicitly recorded.'
            }
          }
          elseif ($evidence.persistence_mode -ne 'INTERACTIVE_USER_SCHEDULED_TASK') {
            throw "Unexpected DR persistence mode: $($evidence.persistence_mode)"
          }

      - name: Export bounded sanitized persistence evidence
        id: evidence_handoff
        if: always()
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $evidencePath = Join-Path $env:RUNNER_TEMP "nexus-windows-dr-persistence-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.json"
          if (-not (Test-Path -LiteralPath $evidencePath -PathType Leaf)) {
            Write-Host 'evidence_handoff=SKIPPED_MISSING'
            exit 0
          }
          $bytes = [IO.File]::ReadAllBytes($evidencePath)
          if ($bytes.Length -lt 2 -or $bytes.Length -gt 65536) {
            throw "Persistence evidence escaped bounded handoff size: $($bytes.Length)"
          }
          $b64 = [Convert]::ToBase64String($bytes)
          $sha256 = (Get-FileHash -LiteralPath $evidencePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $utf8 = New-Object Text.UTF8Encoding($false)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "evidence_b64=$b64`n", $utf8)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "evidence_sha256=$sha256`n", $utf8)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "evidence_bytes=$($bytes.Length)`n", $utf8)
          Write-Host "evidence_handoff=PASS bytes=$($bytes.Length) sha256=$sha256"

      - name: Remove exact isolated source
        if: always()
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          if (-not $env:NEXUS_DR_SOURCE_ROOT) {
            Write-Host 'isolated_source_cleanup=SKIPPED_NOT_CREATED'
            exit 0
          }
          $sourceRoot = [IO.Path]::GetFullPath($env:NEXUS_DR_SOURCE_ROOT).TrimEnd('\')
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          if ((Split-Path -Parent $sourceRoot) -ne $runnerTemp -or
              (Split-Path -Leaf $sourceRoot) -notmatch '^nexus-windows-dr-source-[0-9]+-[0-9]+$') {
            throw 'Refusing cleanup outside the exact isolated DR source boundary.'
          }
          if (Test-Path -LiteralPath $sourceRoot) {
            Remove-Item -LiteralPath $sourceRoot -Recurse -Force
          }
          Write-Host 'isolated_source_cleanup=PASS'

  upload-evidence:
    if: ${{ always() && github.event_name != 'pull_request' && needs.persist.outputs.evidence_b64 != '' }}
    needs: persist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EVIDENCE_B64: ${{ needs.persist.outputs.evidence_b64 }}
      EVIDENCE_SHA256: ${{ needs.persist.outputs.evidence_sha256 }}
      EVIDENCE_BYTES: ${{ needs.persist.outputs.evidence_bytes }}
    steps:
      - name: Rehydrate and verify sanitized persistence evidence
        run: |
          set -euo pipefail
          case "$EVIDENCE_BYTES" in
            ''|*[!0-9]*) echo "::error::Invalid evidence byte count."; exit 1 ;;
          esac
          if [ "$EVIDENCE_BYTES" -lt 2 ] || [ "$EVIDENCE_BYTES" -gt 65536 ]; then
            echo "::error::Persistence evidence escaped bounded handoff size."
            exit 1
          fi
          mkdir -p build/windows-dr-persistence
          printf '%s' "$EVIDENCE_B64" | base64 -d > build/windows-dr-persistence/evidence.json
          actual_bytes="$(wc -c < build/windows-dr-persistence/evidence.json | tr -d '[:space:]')"
          test "$actual_bytes" = "$EVIDENCE_BYTES"
          actual_sha="$(sha256sum build/windows-dr-persistence/evidence.json | awk '{print $1}')"
          test "$actual_sha" = "$EVIDENCE_SHA256"
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("build/windows-dr-persistence/evidence.json").read_text(encoding="utf-8-sig"))
          if payload.get("schema_version") != 3:
              raise SystemExit("unexpected persistence evidence schema")
          if payload.get("runner_registration_modified") is not False:
              raise SystemExit("runner registration boundary changed")
          if payload.get("runner_credentials_modified") is not False:
              raise SystemExit("runner credential boundary changed")
          if payload.get("live_trading_authority") is not False:
              raise SystemExit("live authority boundary changed")
          print("hosted_evidence_rehydration=PASS")
          PY

      - name: Upload sanitized persistence evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-windows-dr-persistence-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/windows-dr-persistence/evidence.json
          if-no-files-found: error
          retention-days: 14
