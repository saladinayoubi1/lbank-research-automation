name: Build NEXUS Desktop Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - "product_runtime.py"
      - "product_research_runtime.py"
      - "product_control_runtime.py"
      - "product_web_server.py"
      - "product_ui/**"
      - "desktop/nexus-product/**"
      - "docs/architecture/market-data-source-registry.yaml"
      - "requirements-product-build.lock"
      - "tests/test_product_*.py"
      - "tests/test_windows_delivery_surface.py"
      - ".github/workflows/build_lbank_desktop_windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install product test and build dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install -r requirements-product-build.lock

      - name: Run canonical product integration tests
        run: >-
          python -m pytest -q
          tests/test_product_runtime.py
          tests/test_product_web_server.py
          tests/test_product_research_runtime.py
          tests/test_windows_delivery_surface.py

      - name: Build canonical NEXUS Python sidecar
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onedir
          --name nexus-product-server
          --add-data "product_ui;product_ui"
          --add-data ".nexus/phase6-checkpoint.json;.nexus"
          --add-data "docs/project_memory/STATE.json;docs/project_memory"
          product_web_server.py

      - name: Smoke-test canonical product sidecar
        env:
          NEXUS_SOURCE_SHA: ${{ github.sha }}
          NEXUS_MARKET_REGISTRY_PATH: ${{ github.workspace }}\docs\architecture\market-data-source-registry.yaml
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP "nexus-product-runtime"
          $market = Join-Path $runtime "market"
          New-Item -ItemType Directory -Path $market -Force | Out-Null
          $server = Start-Process -FilePath "dist/nexus-product-server/nexus-product-server.exe" -ArgumentList @("--host","127.0.0.1","--port","18765","--data-root",$market) -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 100; $i++) {
              if ($server.HasExited) { throw "Canonical NEXUS product sidecar exited with code $($server.ExitCode)" }
              try {
                $payload = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/product/overview" -TimeoutSec 2
                if ($payload.paper.active -eq $true -and $payload.live.enabled -eq $false) { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 300 }
            }
            if (-not $ready) { throw "Canonical NEXUS product sidecar did not become ready" }
            $paper = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/product/paper" -TimeoutSec 3
            if ($paper.paper_only -ne $true) { throw "Paper authority contract missing" }
            $live = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/product/live" -TimeoutSec 3
            if ($live.orders_allowed -ne $false -or $live.live_trading_authority -ne $false) { throw "Live authority widened" }
            $registry = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/product/data/registry" -TimeoutSec 3
            if ($registry.private_credentials_required -ne $false) { throw "Public data authority contract widened" }
            $recovery = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/product/recovery" -TimeoutSec 3
            if ($recovery.status -ne "verified") { throw "Paper recovery verification failed" }
            $mission = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/product/mission-control" -TimeoutSec 3
            if ($mission.status -ne "idle" -or $mission.mission.status -ne "idle") { throw "Clean-install Mission Control is not truthful idle" }
            if ($mission.agents.Count -ne 0 -or $mission.runners.Count -ne 0 -or $mission.providers.PSObject.Properties.Count -ne 0) { throw "Clean-install Mission Control fabricated runtime actors" }
            if ($mission.queue.counts.READY -ne 0 -or $mission.queue.counts.RUNNING -ne 0) { throw "Clean-install Mission Control queue is not empty" }
            $css = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:18765/ui/product-extra.css" -TimeoutSec 3
            if ($css.StatusCode -ne 200) { throw "Extended full-product UI stylesheet missing" }
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }

      - name: Stage source-bound resources for Electron
        run: |
          Remove-Item "desktop/nexus-product/sidecar/nexus-product-server" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "desktop/nexus-product/sidecar" -Force | Out-Null
          Copy-Item "dist/nexus-product-server" "desktop/nexus-product/sidecar/nexus-product-server" -Recurse -Force
          Set-Content -LiteralPath "desktop/nexus-product/sidecar/source-sha.txt" -Value $env:GITHUB_SHA -NoNewline -Encoding ascii
          Copy-Item "docs/architecture/market-data-source-registry.yaml" "desktop/nexus-product/sidecar/market-data-source-registry.yaml"

      - name: Validate Electron source bindings
        run: |
          node --check "desktop/nexus-product/main.js"
          node -e "const p=require('./desktop/nexus-product/package.json'); if(p.version!=='4.1.2') process.exit(1)"
          if ((Get-Content "desktop/nexus-product/sidecar/source-sha.txt" -Raw).Trim() -ne $env:GITHUB_SHA) { throw "Source SHA binding mismatch" }
          if (!(Test-Path "desktop/nexus-product/sidecar/nexus-product-server/nexus-product-server.exe")) { throw "Onedir sidecar staging failed" }
          if (!(Test-Path "desktop/nexus-product/sidecar/market-data-source-registry.yaml")) { throw "Canonical registry staging failed" }

      - name: Install Electron packaging dependencies
        working-directory: desktop/nexus-product
        run: npm install --no-audit --no-fund

      - name: Build canonical Setup and Portable EXE
        working-directory: desktop/nexus-product
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Verify packaged Python sidecar and source bindings
        run: |
          $root = "desktop/nexus-product/dist/win-unpacked/resources"
          foreach ($path in @(
            "$root/nexus-product-server/nexus-product-server.exe",
            "$root/source-sha.txt",
            "$root/docs/architecture/market-data-source-registry.yaml"
          )) { if (!(Test-Path $path)) { throw "Packaged canonical resource missing: $path" } }
          if ((Get-Item "$root/nexus-product-server/nexus-product-server.exe").Length -lt 1000000) { throw "Packaged sidecar executable is unexpectedly small" }
          if ((Get-Content "$root/source-sha.txt" -Raw).Trim() -ne $env:GITHUB_SHA) { throw "Packaged source SHA mismatch" }
          $setup = Get-ChildItem "desktop/nexus-product/dist/NEXUS_Personal_Pro_Setup_4.1.2_*.exe" -ErrorAction SilentlyContinue
          $portable = Get-ChildItem "desktop/nexus-product/dist/NEXUS_Personal_Pro_Portable_4.1.2_*.exe" -ErrorAction SilentlyContinue
          if (!$setup) { throw "NEXUS Product Setup EXE missing" }
          if (!$portable) { throw "NEXUS Product Portable EXE missing" }

      - name: Generate SHA-256 checksums
        run: |
          $files = Get-ChildItem "desktop/nexus-product/dist/*.exe" | Sort-Object Name
          if (-not $files) { throw "No canonical Windows product artifacts were produced" }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding ascii "desktop/nexus-product/dist/SHA256SUMS.txt"
          Get-Content "desktop/nexus-product/dist/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS_PERSONAL_PRO_PRODUCT_WINDOWS_4_1_2
          path: |
            desktop/nexus-product/dist/NEXUS_Personal_Pro_Setup_4.1.2_*.exe
            desktop/nexus-product/dist/NEXUS_Personal_Pro_Portable_4.1.2_*.exe
            desktop/nexus-product/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
