name: Build NEXUS Desktop Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "product_runtime.py"
      - "product_web_server.py"
      - "product_ui/**"
      - "desktop/nexus-product/**"
      - "requirements-product-build.lock"
      - "tests/test_product_*.py"
      - ".github/workflows/build_lbank_desktop_windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install product test and build dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install -r requirements-product-build.lock

      - name: Run canonical product integration tests
        run: python -m pytest -q tests/test_product_runtime.py tests/test_product_web_server.py

      - name: Build canonical NEXUS Python sidecar
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --name nexus-product-server
          --add-data "product_ui;product_ui"
          --add-data ".nexus/phase6-checkpoint.json;.nexus"
          --add-data "docs/project_memory/STATE.json;docs/project_memory"
          product_web_server.py

      - name: Smoke-test canonical product sidecar
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP "nexus-product-runtime"
          $market = Join-Path $runtime "market"
          New-Item -ItemType Directory -Path $market -Force | Out-Null
          $server = Start-Process -FilePath "dist/nexus-product-server.exe" -ArgumentList @("--host","127.0.0.1","--port","18765","--data-root",$market) -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              try {
                $payload = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/product/overview" -TimeoutSec 2
                if ($payload.paper.active -eq $true -and $payload.live.enabled -eq $false) { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 300 }
            }
            if (-not $ready) { throw "Canonical NEXUS product sidecar did not become ready" }
            $paper = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/product/paper" -TimeoutSec 3
            if ($paper.paper_only -ne $true) { throw "Paper authority contract missing" }
            $live = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/product/live" -TimeoutSec 3
            if ($live.orders_allowed -ne $false -or $live.live_trading_authority -ne $false) { throw "Live authority widened" }
            $ui = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:18765/" -TimeoutSec 3
            if ($ui.Content -notmatch "اتاق هوش مصنوعی" -or $ui.Content -notmatch "ترید دمو" -or $ui.Content -notmatch "ترید اصلی") { throw "Full product UI surface missing" }
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }

      - name: Stage Python sidecar for Electron
        run: |
          New-Item -ItemType Directory -Path "desktop/nexus-product/sidecar" -Force | Out-Null
          Copy-Item "dist/nexus-product-server.exe" "desktop/nexus-product/sidecar/nexus-product-server.exe"

      - name: Install Electron packaging dependencies
        working-directory: desktop/nexus-product
        run: npm install --no-audit --no-fund

      - name: Build canonical Setup and Portable EXE
        working-directory: desktop/nexus-product
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Verify packaged Python sidecar and authority markers
        run: |
          $resource = "desktop/nexus-product/dist/win-unpacked/resources/nexus-product-server.exe"
          if (!(Test-Path $resource)) { throw "Packaged NEXUS product sidecar missing" }
          if ((Get-Item $resource).Length -lt 1000000) { throw "Packaged sidecar is unexpectedly small" }
          $setup = Get-ChildItem "desktop/nexus-product/dist/NEXUS_Personal_Pro_Setup_4.0.0_*.exe" -ErrorAction SilentlyContinue
          $portable = Get-ChildItem "desktop/nexus-product/dist/NEXUS_Personal_Pro_Portable_4.0.0_*.exe" -ErrorAction SilentlyContinue
          if (!$setup) { throw "NEXUS Product Setup EXE missing" }
          if (!$portable) { throw "NEXUS Product Portable EXE missing" }

      - name: Generate SHA-256 checksums
        run: |
          $files = Get-ChildItem "desktop/nexus-product/dist/*.exe" | Sort-Object Name
          if (-not $files) { throw "No canonical Windows product artifacts were produced" }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding ascii "desktop/nexus-product/dist/SHA256SUMS.txt"
          Get-Content "desktop/nexus-product/dist/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS_PERSONAL_PRO_PRODUCT_WINDOWS_4_0_0
          path: |
            desktop/nexus-product/dist/NEXUS_Personal_Pro_Setup_4.0.0_*.exe
            desktop/nexus-product/dist/NEXUS_Personal_Pro_Portable_4.0.0_*.exe
            desktop/nexus-product/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
