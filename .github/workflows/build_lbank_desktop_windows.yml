name: Build NEXUS Desktop Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - "product_runtime.py"
      - "product_research_runtime.py"
      - "product_control_runtime.py"
      - "product_web_server.py"
      - "product_offline_runtime.py"
      - "product_offline_web_server.py"
      - "product_mission_runtime.py"
      - "product_build_runtime.py"
      - "product_ui/**"
      - "desktop/nexus-product/**"
      - "config/nexus-agent-manager.json"
      - "docs/architecture/market-data-source-registry.yaml"
      - "requirements-product-build.lock"
      - "scripts/export_mission_control_snapshot.py"
      - "tests/test_product_*.py"
      - "tests/test_windows_delivery_surface.py"
      - ".github/workflows/build_lbank_desktop_windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install product test and build dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install -r requirements-product-build.lock

      - name: Run final Mission Control product integration tests
        run: >-
          python -m pytest -q
          tests/test_product_runtime.py
          tests/test_product_web_server.py
          tests/test_product_research_runtime.py
          tests/test_product_offline_runtime.py
          tests/test_product_mission_runtime.py
          tests/test_windows_delivery_surface.py

      - name: Build final Mission Control Python sidecar
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onedir
          --name nexus-product-server
          --add-data "product_ui;product_ui"
          --add-data ".nexus/phase6-checkpoint.json;.nexus"
          --add-data "docs/project_memory/STATE.json;docs/project_memory"
          product_offline_web_server.py

      - name: Create exact-source build evidence
        run: |
          New-Item -ItemType Directory -Path "desktop/nexus-product/sidecar" -Force | Out-Null
          $evidence = [ordered]@{
            contract_version = "nexus.product-build-evidence.v1"
            source_sha = $env:GITHUB_SHA
            workflow = "Build NEXUS Desktop Windows"
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            ref = $env:GITHUB_REF
            builder = "github-actions/windows-latest"
            generated_at = (Get-Date).ToUniversalTime().ToString("o")
            paper_only = $true
            live_trading_authority = $false
          }
          $evidence | ConvertTo-Json -Depth 4 -Compress | Set-Content -LiteralPath "desktop/nexus-product/sidecar/build-evidence.json" -Encoding utf8

      - name: Smoke-test final Mission Control sidecar
        env:
          NEXUS_SOURCE_SHA: ${{ github.sha }}
          NEXUS_MARKET_REGISTRY_PATH: ${{ github.workspace }}\docs\architecture\market-data-source-registry.yaml
          NEXUS_AGENT_MANAGER_CONFIG: ${{ github.workspace }}\config\nexus-agent-manager.json
          NEXUS_BUILD_EVIDENCE_PATH: ${{ github.workspace }}\desktop\nexus-product\sidecar\build-evidence.json
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP "nexus-product-runtime"
          $market = Join-Path $runtime "market"
          New-Item -ItemType Directory -Path $market -Force | Out-Null
          $server = Start-Process -FilePath "dist/nexus-product-server/nexus-product-server.exe" -ArgumentList @("--host","127.0.0.1","--port","18765","--data-root",$market) -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 100; $i++) {
              if ($server.HasExited) { throw "NEXUS Mission Control sidecar exited with code $($server.ExitCode)" }
              try {
                $payload = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/product/overview" -TimeoutSec 2
                if ($payload.paper.active -eq $true -and $payload.live.enabled -eq $false) { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 300 }
            }
            if (-not $ready) { throw "NEXUS Mission Control sidecar did not become ready" }
            $paper = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/product/paper" -TimeoutSec 3
            if ($paper.paper_only -ne $true) { throw "Paper authority contract missing" }
            $live = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/product/live" -TimeoutSec 3
            if ($live.orders_allowed -ne $false -or $live.live_trading_authority -ne $false) { throw "Live authority widened" }
            $offline = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/product/offline" -TimeoutSec 3
            if ($offline.mode -ne "offline_first" -or $offline.internet_required_for_startup -ne $false -or $offline.live_trading_authority -ne $false) { throw "Offline-first contract missing or widened" }
            if ($offline.dataset_count -ne 0) { throw "Clean package fabricated offline market data" }
            $mission = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/product/mission/full" -TimeoutSec 3
            if ($mission.paper_only -ne $true -or $mission.live_trading_authority -ne $false) { throw "Mission authority widened" }
            if ($mission.source -ne "definition_only") { throw "Clean package fabricated Agent Manager runtime state" }
            if ($mission.workers.Count -lt 1 -or $mission.tasks.Count -lt 1) { throw "Real Agent Manager definition not surfaced" }
            if ($mission.owner_action_required -ne $false) { throw "Pending L4 definition was incorrectly presented as active owner blocker" }
            $build = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/product/build-evidence" -TimeoutSec 3
            if ($build.status -ne "verified" -or $build.source_sha -ne $env:GITHUB_SHA -or $build.exact_source -ne $true) { throw "Exact-source build evidence missing" }
            $strategies = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/product/strategies/evidence" -TimeoutSec 3
            if ($strategies.profitability_claim -ne $false -or $strategies.paper_only -ne $true) { throw "Strategy Center authority/claim boundary failed" }
            $missionJs = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:18765/ui/product-mission.js" -TimeoutSec 3
            if ($missionJs.StatusCode -ne 200 -or $missionJs.Content -notmatch "OWNER ACTION") { throw "Mission Control UI asset missing" }
            $index = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:18765/" -TimeoutSec 3
            if ($index.Content -notmatch "product-mission.js" -or $index.Content -notmatch "product-offline.js") { throw "Mission/Offline UI injection missing" }
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }

      - name: Stage source-bound resources for Electron
        run: |
          Remove-Item "desktop/nexus-product/sidecar/nexus-product-server" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "desktop/nexus-product/sidecar" -Force | Out-Null
          Copy-Item "dist/nexus-product-server" "desktop/nexus-product/sidecar/nexus-product-server" -Recurse -Force
          Set-Content -LiteralPath "desktop/nexus-product/sidecar/source-sha.txt" -Value $env:GITHUB_SHA -NoNewline -Encoding ascii
          Copy-Item "docs/architecture/market-data-source-registry.yaml" "desktop/nexus-product/sidecar/market-data-source-registry.yaml"
          Copy-Item "config/nexus-agent-manager.json" "desktop/nexus-product/sidecar/nexus-agent-manager.json"

      - name: Validate Electron source and Mission bindings
        run: |
          node --check "desktop/nexus-product/main.js"
          node --check "product_ui/product-offline.js"
          node --check "product_ui/product-mission.js"
          node -e "const p=require('./desktop/nexus-product/package.json'); if(p.version!=='5.0.0') process.exit(1)"
          if ((Get-Content "desktop/nexus-product/sidecar/source-sha.txt" -Raw).Trim() -ne $env:GITHUB_SHA) { throw "Source SHA binding mismatch" }
          foreach ($path in @(
            "desktop/nexus-product/sidecar/nexus-product-server/nexus-product-server.exe",
            "desktop/nexus-product/sidecar/market-data-source-registry.yaml",
            "desktop/nexus-product/sidecar/nexus-agent-manager.json",
            "desktop/nexus-product/sidecar/build-evidence.json"
          )) { if (!(Test-Path $path)) { throw "Mission resource staging failed: $path" } }

      - name: Install Electron packaging dependencies
        working-directory: desktop/nexus-product
        run: npm install --no-audit --no-fund

      - name: Build final Setup and Portable EXE
        working-directory: desktop/nexus-product
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Verify packaged Mission Control resources and source bindings
        run: |
          $root = "desktop/nexus-product/dist/win-unpacked/resources"
          foreach ($path in @(
            "$root/nexus-product-server/nexus-product-server.exe",
            "$root/source-sha.txt",
            "$root/build-evidence.json",
            "$root/docs/architecture/market-data-source-registry.yaml",
            "$root/config/nexus-agent-manager.json"
          )) { if (!(Test-Path $path)) { throw "Packaged Mission Control resource missing: $path" } }
          if ((Get-Item "$root/nexus-product-server/nexus-product-server.exe").Length -lt 1000000) { throw "Packaged sidecar executable is unexpectedly small" }
          if ((Get-Content "$root/source-sha.txt" -Raw).Trim() -ne $env:GITHUB_SHA) { throw "Packaged source SHA mismatch" }
          $build = Get-Content "$root/build-evidence.json" -Raw | ConvertFrom-Json
          if ($build.source_sha -ne $env:GITHUB_SHA -or $build.paper_only -ne $true -or $build.live_trading_authority -ne $false) { throw "Packaged build evidence mismatch" }
          $setup = Get-ChildItem "desktop/nexus-product/dist/NEXUS_Personal_Pro_Setup_5.0.0_*.exe" -ErrorAction SilentlyContinue
          $portable = Get-ChildItem "desktop/nexus-product/dist/NEXUS_Personal_Pro_Portable_5.0.0_*.exe" -ErrorAction SilentlyContinue
          if (!$setup) { throw "NEXUS 5.0.0 Setup EXE missing" }
          if (!$portable) { throw "NEXUS 5.0.0 Portable EXE missing" }

      - name: Generate SHA-256 checksums
        run: |
          $files = Get-ChildItem "desktop/nexus-product/dist/*.exe" | Sort-Object Name
          if (-not $files) { throw "No final Windows product artifacts were produced" }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding ascii "desktop/nexus-product/dist/SHA256SUMS.txt"
          Get-Content "desktop/nexus-product/dist/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS_PERSONAL_PRO_FINAL_MISSION_CONTROL_WINDOWS_5_0_0
          path: |
            desktop/nexus-product/dist/NEXUS_Personal_Pro_Setup_5.0.0_*.exe
            desktop/nexus-product/dist/NEXUS_Personal_Pro_Portable_5.0.0_*.exe
            desktop/nexus-product/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
