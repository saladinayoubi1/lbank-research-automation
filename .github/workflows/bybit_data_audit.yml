name: Audit Bybit public spot data

on:
  pull_request:
    paths:
      - ".github/workflows/bybit_data_audit.yml"
      - "bybit_data_audit.py"
      - "bybit_spot_archive_audit.py"
      - "tests/test_bybit_data_audit.py"
      - "tests/test_bybit_spot_archive_audit.py"
      - "main.py"
      - "requirements.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Check dependency consistency
        run: python -m pip check

      - name: Diagnose REST API access from the hosted runner
        continue-on-error: true
        run: >-
          python bybit_data_audit.py
          --output-root build/bybit_api_access_audit
          --request-pause 0.1
          --clean

      - name: Inspect official Spot archive layout
        run: |
          python - <<'PY'
          import gzip
          import requests

          for symbol in ("BTCUSDT", "ETHUSDT"):
              url = f"https://public.bybit.com/spot/{symbol}/{symbol}_2026-08-01.csv.gz"
              response = requests.get(url, timeout=120)
              response.raise_for_status()
              lines = gzip.decompress(response.content).decode("utf-8", errors="replace").splitlines()
              print(f"ARCHIVE_LAYOUT {symbol} rows={len(lines)}")
              for line in lines[:3]:
                  print(line)
          PY

      - name: Audit fixed official Spot trade archives
        run: >-
          python bybit_spot_archive_audit.py
          --audit-date 2026-08-01
          --cache-root build/bybit_spot_archive_cache
          --output-root build/bybit_spot_archive_audit
          --clean

      - name: Upload Bybit audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bybit-public-data-audit-${{ github.sha }}
          path: |
            build/bybit_api_access_audit
            build/bybit_spot_archive_audit
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: Enforce official archive candidate gate
        run: >-
          python -c "import json, pathlib, sys;
          p=pathlib.Path('build/bybit_spot_archive_audit/_bybit_spot_archive_audit.json');
          r=json.loads(p.read_text());
          sys.exit(0 if r['summary']['candidate_for_full_spot_archive_backfill'] else 1)"
