name: Audit Bybit public spot data

on:
  pull_request:
    paths:
      - ".github/workflows/bybit_data_audit.yml"
      - "bybit_data_audit.py"
      - "bybit_spot_archive_audit.py"
      - "run_bybit_spot_archive_audit.py"
      - "tests/test_bybit_data_audit.py"
      - "tests/test_bybit_spot_archive_audit.py"
      - "main.py"
      - "requirements.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Check dependency consistency
        run: python -m pip check

      - name: Audit fixed official Spot trade archives
        run: >-
          python run_bybit_spot_archive_audit.py
          --audit-date 2026-08-01
          --cache-root build/bybit_spot_archive_cache
          --output-root build/bybit_spot_archive_audit
          --max-attempts 5
          --clean

      - name: Upload Bybit audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bybit-public-data-audit-${{ github.sha }}
          path: build/bybit_spot_archive_audit
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: Enforce official archive candidate gate
        run: >-
          python -c "import json, pathlib, sys;
          p=pathlib.Path('build/bybit_spot_archive_audit/_bybit_spot_archive_audit.json');
          r=json.loads(p.read_text());
          sys.exit(0 if r['summary']['candidate_for_full_spot_archive_backfill'] else 1)"
