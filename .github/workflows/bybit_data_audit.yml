name: Audit Bybit public spot data

on:
  pull_request:
    paths:
      - ".github/workflows/bybit_data_audit.yml"
      - "bybit_data_audit.py"
      - "bybit_spot_archive_audit.py"
      - "run_bybit_spot_archive_audit.py"
      - "nexus_multipair_bybit_archive_probe.py"
      - "nexus_multipair_trusted_surface.py"
      - "config/nexus-demo-strategy-matrix-v2.json"
      - "tests/test_bybit_data_audit.py"
      - "tests/test_bybit_spot_archive_audit.py"
      - "tests/test_nexus_multipair_bybit_archive_probe.py"
      - "main.py"
      - "requirements.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/bybit_data_audit.yml"
      - "bybit_spot_archive_audit.py"
      - "run_bybit_spot_archive_audit.py"
      - "nexus_multipair_bybit_archive_probe.py"
      - "nexus_multipair_trusted_surface.py"
      - "config/nexus-demo-strategy-matrix-v2.json"
      - "requirements.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Check dependency consistency
        run: python -m pip check

      - name: Audit fixed official Spot trade archives
        run: >-
          python run_bybit_spot_archive_audit.py
          --audit-date 2026-08-01
          --cache-root build/bybit_spot_archive_cache
          --output-root build/bybit_spot_archive_audit
          --max-attempts 5
          --clean

      - name: Probe official four-symbol Spot archive transport
        if: github.event_name != 'pull_request'
        run: >-
          python nexus_multipair_bybit_archive_probe.py
          --audit-date 2026-07-01
          --cache-root build/nexus_multipair_archive_probe_cache
          --output-root build/nexus_multipair_archive_probe
          --max-attempts 5

      - name: Remove raw Multi-Pair probe archives before persistence
        if: always() && github.event_name != 'pull_request'
        run: rm -rf build/nexus_multipair_archive_probe_cache

      - name: Upload Bybit audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bybit-public-data-audit-${{ github.sha }}
          path: |
            build/bybit_spot_archive_audit
            build/nexus_multipair_archive_probe
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: Enforce official archive candidate gate
        run: >-
          python -c "import json, pathlib, sys;
          p=pathlib.Path('build/bybit_spot_archive_audit/_bybit_spot_archive_audit.json');
          r=json.loads(p.read_text());
          sys.exit(0 if r['summary']['candidate_for_full_spot_archive_backfill'] else 1)"
