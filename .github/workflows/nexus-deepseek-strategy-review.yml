name: NEXUS DeepSeek Strategy Review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/deepseek_strategy_review.py'
      - 'research/evidence/ema_crossover_evidence_matrix.md'
      - '.github/workflows/nexus-deepseek-strategy-review.yml'

concurrency:
  group: nexus-deepseek-strategy-review
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: Bounded strategy review
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Run bounded EMA strategy review when explicitly authorized
        id: advisory
        shell: bash
        env:
          PAID_ALLOWED: ${{ vars.NEXUS_DEEPSEEK_PAID_ROUTING_ALLOWED }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ "$PAID_ALLOWED" != "1" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p = Path('build/deepseek/strategy-review.json')
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps({
              'schema_version': 1,
              'ok': False,
              'unavailable': True,
              'reason': 'paid_routing_gate_off',
              'authority': 'advisory-research-backtest-paper-only',
              'independent_verification_required': True,
              'blocking': False,
          }, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          PY
            echo 'DEEPSEEK_ADVISORY_SKIPPED: paid-routing gate is not enabled'
            exit 0
          fi
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p = Path('build/deepseek/strategy-review.json')
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps({
              'schema_version': 1,
              'ok': False,
              'unavailable': True,
              'reason': 'secret_unavailable',
              'authority': 'advisory-research-backtest-paper-only',
              'independent_verification_required': True,
              'blocking': False,
          }, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          PY
            echo 'DEEPSEEK_ADVISORY_SKIPPED: secret unavailable to workflow'
            exit 0
          fi
          python scripts/deepseek_strategy_review.py
      - name: Independently validate advisory evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('build/deepseek/strategy-review.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['authority'] == 'advisory-research-backtest-paper-only'
          assert d['independent_verification_required'] is True
          assert d.get('blocking') is False
          if d.get('ok') is True:
              r = d['review']
              required = {'findings','edge_case_tests','execution_realism','oos_robustness','kill_conditions','uncertainties'}
              assert required.issubset(r)
              assert all(isinstance(r[k], list) for k in required)
              assert len(r['findings']) > 0
              assert len(r['edge_case_tests']) > 0
              print('DEEPSEEK_STRATEGY_REVIEW_EVIDENCE_OK')
          else:
              assert d.get('unavailable') is True
              assert isinstance(d.get('reason'), str) and d['reason']
              print('DEEPSEEK_STRATEGY_REVIEW_NONBLOCKING_UNAVAILABLE_OK')
          PY
      - name: Upload durable advisory evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-deepseek-strategy-review-${{ github.run_id }}
          path: |
            build/deepseek/strategy-review.json
            build/deepseek/usage.json
          if-no-files-found: warn
          retention-days: 14
