name: Analyze contiguous research segments

on:
  pull_request:
    paths:
      - ".github/workflows/contiguous_segments.yml"
      - "contiguous_segments.py"
      - "tests/test_contiguous_segments.py"
      - "main.py"
      - "requirements.lock"
      - "data/market/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Analyze maximal timestamp-contiguous blocks
        run: >-
          python contiguous_segments.py
          --input-root data/market
          --output-root build/contiguous_segments
          --minimum-segment-rows 1000
          --clean

      - name: Upload contiguous segment analysis
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lbank-contiguous-segments-${{ github.sha }}
          path: build/contiguous_segments
          if-no-files-found: error
          retention-days: 3
          compression-level: 9
