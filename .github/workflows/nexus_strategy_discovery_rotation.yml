name: NEXUS strategy discovery rotation

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["NEXUS persistent Paper trading loop"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "nexus_strategy_discovery_rotation.py"
      - "nexus_strategy_discovery_health_trigger.py"
      - "nexus_multitimeframe_strategy_discovery.py"
      - "scripts/nexus_strategy_discovery_controller.py"
      - "research/strategy_family_catalog.json"
      - "experiments/nexus_multitimeframe_strategy_discovery_v1.json"
      - ".github/workflows/nexus_multitimeframe_strategy_discovery.yml"
      - ".github/workflows/nexus_strategy_discovery_rotation.yml"
  pull_request:
    paths:
      - "nexus_strategy_discovery_rotation.py"
      - "nexus_strategy_discovery_health_trigger.py"
      - "nexus_persistent_paper_trading_loop.py"
      - "nexus_multitimeframe_strategy_discovery.py"
      - "scripts/nexus_strategy_discovery_controller.py"
      - "research/strategy_family_catalog.json"
      - "experiments/nexus_multitimeframe_strategy_discovery_v1.json"
      - "tests/test_nexus_multitimeframe_strategy_discovery.py"
      - "tests/test_nexus_strategy_discovery_rotation.py"
      - "tests/test_nexus_strategy_discovery_health_trigger.py"
      - "tests/test_nexus_strategy_discovery_rotation_workflow.py"
      - "tests/test_nexus_strategy_discovery_controller.py"
      - ".github/workflows/nexus_multitimeframe_strategy_discovery.yml"
      - ".github/workflows/nexus_strategy_discovery_rotation.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: nexus-strategy-discovery-rotation
  cancel-in-progress: false

jobs:
  contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip check
      - run: >-
          python -m pytest -q
          tests/test_nexus_strategy_discovery_rotation.py
          tests/test_nexus_strategy_discovery_health_trigger.py
          tests/test_nexus_strategy_discovery_rotation_workflow.py
          tests/test_nexus_strategy_discovery_controller.py
          tests/test_nexus_multitimeframe_strategy_discovery.py

  dispatch-one-stage:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name != 'workflow_run' &&
       github.event_name != 'pull_request' &&
       github.ref == 'refs/heads/main')
    needs: contract-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      STATE_ARTIFACT: nexus-strategy-discovery-rotation-state
      PAPER_STATE_ARTIFACT: nexus-persistent-paper-trading-state
      HEALTH_TRIGGER: ${{ github.event_name == 'workflow_run' && 'true' || 'false' }}
      TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies for health verification
        run: python -m pip install -r requirements.lock
      - run: python -m pip check

      - name: Decide daily or health-driven dispatch
        id: health-gate
        run: |
          set -euo pipefail
          if [ "$HEALTH_TRIGGER" != "true" ]; then
            echo "should_dispatch=true" >> "$GITHUB_OUTPUT"
            echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          rm -rf build/health-trigger build/paper-loop-state.zip
          mkdir -p build/health-trigger
          artifact_id="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$TRIGGER_RUN_ID/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name == \"$PAPER_STATE_ARTIFACT\") | .id" \
            | head -n 1)"
          test -n "$artifact_id"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            > build/paper-loop-state.zip
          unzip -q build/paper-loop-state.zip -d build/health-trigger/paper-state
          snapshot="$(find build/health-trigger/paper-state -type f \
            -path '*/demo/persistent-paper-trading-loop.json' -print -quit)"
          test -n "$snapshot"
          python nexus_strategy_discovery_health_trigger.py \
            --loop-snapshot "$snapshot" \
            --output build/health-trigger/health-trigger.json
          should_dispatch="$(python -c 'import json; print(str(json.load(open("build/health-trigger/health-trigger.json"))["should_dispatch"]).lower())')"
          echo "should_dispatch=$should_dispatch" >> "$GITHUB_OUTPUT"
          echo "source_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Restore rotation state
        if: steps.health-gate.outputs.should_dispatch == 'true'
        run: |
          set -euo pipefail
          mkdir -p build/discovery
          artifact_id="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$STATE_ARTIFACT&per_page=1" \
            --jq '.artifacts[0].id // empty')"
          if [ -n "$artifact_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > build/discovery-state.zip
            unzip -q build/discovery-state.zip -d build/discovery
          fi

      - name: Verify discovery surface and select one stage
        if: steps.health-gate.outputs.should_dispatch == 'true'
        run: |
          set -euo pipefail
          python scripts/nexus_strategy_discovery_controller.py \
            --root . --output build/discovery/controller-status.json
          python nexus_strategy_discovery_rotation.py plan \
            --controller-status build/discovery/controller-status.json \
            --state build/discovery/rotation-state.json \
            --output build/discovery/dispatch-plan.json

      - name: Dispatch reviewed Research workflow
        if: steps.health-gate.outputs.should_dispatch == 'true'
        run: |
          set -euo pipefail
          workflow="$(python -c 'import json; print(json.load(open("build/discovery/dispatch-plan.json"))["workflow"])')"
          gh workflow run "$workflow" --ref main

      - name: Commit rotation cursor only after accepted dispatch
        if: steps.health-gate.outputs.should_dispatch == 'true'
        run: |
          set -euo pipefail
          python nexus_strategy_discovery_rotation.py commit \
            --state build/discovery/rotation-state.json \
            --plan build/discovery/dispatch-plan.json \
            --source-sha "${{ steps.health-gate.outputs.source_sha }}" \
            --run-id "$GITHUB_RUN_ID" \
            --output build/discovery/rotation-state.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.health-gate.outputs.should_dispatch == 'true'
        with:
          name: nexus-strategy-discovery-rotation-state
          path: build/discovery
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
