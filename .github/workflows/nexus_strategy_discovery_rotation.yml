name: NEXUS strategy discovery rotation

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "NEXUS persistent Paper trading loop"
      - "NEXUS Demo regime lifecycle bridge"
    types: [completed]
  push:
    branches: [main]
    paths:
      - "nexus_strategy_discovery_rotation.py"
      - "nexus_strategy_discovery_feedback.py"
      - "nexus_strategy_discovery_health_trigger.py"
      - "nexus_demo_strategy_discovery_health_trigger.py"
      - "nexus_multitimeframe_strategy_discovery.py"
      - "scripts/nexus_strategy_discovery_controller.py"
      - "research/strategy_family_catalog.json"
      - "experiments/nexus_multitimeframe_strategy_discovery_v1.json"
      - ".github/workflows/nexus_multitimeframe_strategy_discovery.yml"
      - ".github/workflows/nexus_strategy_discovery_rotation.yml"
  pull_request:
    paths:
      - "nexus_strategy_discovery_rotation.py"
      - "nexus_strategy_discovery_health_trigger.py"
      - "nexus_demo_strategy_discovery_health_trigger.py"
      - "nexus_persistent_paper_trading_loop.py"
      - "nexus_demo_regime_cycle.py"
      - "nexus_demo_regime_lifecycle_bridge.py"
      - "nexus_multitimeframe_strategy_discovery.py"
      - "scripts/nexus_strategy_discovery_controller.py"
      - "research/strategy_family_catalog.json"
      - "experiments/nexus_multitimeframe_strategy_discovery_v1.json"
      - "tests/test_nexus_multitimeframe_strategy_discovery.py"
      - "tests/test_nexus_strategy_discovery_rotation.py"
      - "tests/test_nexus_strategy_discovery_feedback.py"
      - "tests/test_nexus_strategy_discovery_health_trigger.py"
      - "tests/test_nexus_demo_strategy_discovery_health_trigger.py"
      - "tests/test_nexus_strategy_discovery_rotation_workflow.py"
      - "tests/test_nexus_strategy_discovery_controller.py"
      - ".github/workflows/nexus_multitimeframe_strategy_discovery.yml"
      - ".github/workflows/nexus_strategy_discovery_rotation.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: nexus-strategy-discovery-rotation
  cancel-in-progress: false

jobs:
  contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip check
      - run: >-
          python -m pytest -q
          tests/test_nexus_strategy_discovery_rotation.py
          tests/test_nexus_strategy_discovery_feedback.py
          tests/test_nexus_strategy_discovery_health_trigger.py
          tests/test_nexus_demo_strategy_discovery_health_trigger.py
          tests/test_nexus_strategy_discovery_rotation_workflow.py
          tests/test_nexus_strategy_discovery_controller.py
          tests/test_nexus_multitimeframe_strategy_discovery.py

  dispatch-one-stage:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name != 'workflow_run' &&
       github.event_name != 'pull_request' &&
       github.ref == 'refs/heads/main')
    needs: contract-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      STATE_ARTIFACT: nexus-strategy-discovery-rotation-state
      PAPER_STATE_ARTIFACT: nexus-persistent-paper-trading-state
      DEMO_STATE_ARTIFACT: nexus-demo-strategy-matrix-state
      HEALTH_TRIGGER: ${{ github.event_name == 'workflow_run' && 'true' || 'false' }}
      TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name }}
      TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies for health verification
        run: python -m pip install -r requirements.lock
      - run: python -m pip check

      - name: Decide daily or health-driven dispatch
        id: health-gate
        run: |
          set -euo pipefail
          if [ "$HEALTH_TRIGGER" != "true" ]; then
            echo "should_dispatch=true" >> "$GITHUB_OUTPUT"
            echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          rm -rf build/health-trigger build/trigger-state.zip
          mkdir -p build/health-trigger

          if [ "$TRIGGER_WORKFLOW" = "NEXUS persistent Paper trading loop" ]; then
            artifact_name="$PAPER_STATE_ARTIFACT"
          elif [ "$TRIGGER_WORKFLOW" = "NEXUS Demo regime lifecycle bridge" ]; then
            artifact_name="$DEMO_STATE_ARTIFACT"
          else
            echo "unsupported triggering workflow: $TRIGGER_WORKFLOW" >&2
            exit 1
          fi

          artifact_id="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$TRIGGER_RUN_ID/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name == \"$artifact_name\") | .id" \
            | head -n 1)"
          if [ -z "$artifact_id" ]; then
            echo "No exact triggering-run $artifact_name artifact; health dispatch remains fail-closed."
            echo "should_dispatch=false" >> "$GITHUB_OUTPUT"
            echo "source_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            > build/trigger-state.zip
          unzip -q build/trigger-state.zip -d build/health-trigger/state

          if [ "$TRIGGER_WORKFLOW" = "NEXUS persistent Paper trading loop" ]; then
            snapshot="$(find build/health-trigger/state -type f \
              -path '*/demo/persistent-paper-trading-loop.json' -print -quit)"
            test -n "$snapshot"
            python nexus_strategy_discovery_health_trigger.py \
              --loop-snapshot "$snapshot" \
              --output build/health-trigger/health-trigger.json
          else
            regime="$(find build/health-trigger/state -type f \
              -path '*/demo/regime-cycle.json' -print -quit)"
            lifecycle="$(find build/health-trigger/state -type f \
              -path '*/demo/regime-lifecycle-bridge.json' -print -quit)"
            test -n "$regime"
            test -n "$lifecycle"
            python nexus_demo_strategy_discovery_health_trigger.py \
              --regime-snapshot "$regime" \
              --lifecycle-snapshot "$lifecycle" \
              --output build/health-trigger/health-trigger.json
          fi

          should_dispatch="$(python -c 'import json; print(str(json.load(open("build/health-trigger/health-trigger.json"))["should_dispatch"]).lower())')"
          echo "should_dispatch=$should_dispatch" >> "$GITHUB_OUTPUT"
          echo "source_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Restore rotation state
        if: steps.health-gate.outputs.should_dispatch == 'true'
        run: |
          set -euo pipefail
          mkdir -p build/discovery
          artifact_id="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$STATE_ARTIFACT&per_page=1" \
            --jq '.artifacts[0].id // empty')"
          if [ -n "$artifact_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > build/discovery-state.zip
            unzip -q build/discovery-state.zip -d build/discovery
          fi

      - name: Reconcile previously dispatched Research outcome
        id: outcome
        if: steps.health-gate.outputs.should_dispatch == 'true'
        run: |
          set -euo pipefail
          echo "ready=true" >> "$GITHUB_OUTPUT"
          receipt="build/discovery/last-research-run.json"
          if [ ! -f "$receipt" ]; then
            exit 0
          fi
          run_id="$(python -c 'import json; print(json.load(open("build/discovery/last-research-run.json"))["research_run_id"])')"
          stage="$(python -c 'import json; print(json.load(open("build/discovery/last-research-run.json"))["stage"])')"
          experiment_sha256="$(python -c 'import json; print(json.load(open("build/discovery/last-research-run.json"))["experiment_sha256"])')"
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY"             --json databaseId,status,conclusion,headSha,workflowName             > build/discovery/research-run-status.json
          status="$(python -c 'import json; print(json.load(open("build/discovery/research-run-status.json"))["status"])')"
          if [ "$status" != "completed" ]; then
            echo "Previous Research run $run_id is still $status; do not overlap autonomous searches."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -rf build/discovery/research-outcome-artifacts
          mkdir -p build/discovery/research-outcome-artifacts
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY"             --dir build/discovery/research-outcome-artifacts || true
          python nexus_strategy_discovery_feedback.py             --state build/discovery/feedback-state.json             --run-json build/discovery/research-run-status.json             --artifact-root build/discovery/research-outcome-artifacts             --stage "$stage"             --experiment-sha256 "$experiment_sha256"             --output build/discovery/feedback-state.json
          rm -f "$receipt"

      - name: Verify discovery surface and select one stage
        if: steps.health-gate.outputs.should_dispatch == 'true' && steps.outcome.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python scripts/nexus_strategy_discovery_controller.py             --root . --output build/discovery/controller-status.json
          python nexus_strategy_discovery_rotation.py plan             --controller-status build/discovery/controller-status.json             --state build/discovery/rotation-state.json             --feedback-state build/discovery/feedback-state.json             --output build/discovery/dispatch-plan.json

      - name: Dispatch reviewed Research workflow
        id: dispatch
        if: steps.health-gate.outputs.should_dispatch == 'true' && steps.outcome.outputs.ready == 'true'
        run: |
          set -euo pipefail
          workflow="$(python -c 'import json; print(json.load(open("build/discovery/dispatch-plan.json"))["workflow"])')"
          stage="$(python -c 'import json; print(json.load(open("build/discovery/dispatch-plan.json"))["stage"])')"
          experiment_sha256="$(python -c 'import json; print(json.load(open("build/discovery/dispatch-plan.json"))["experiment_sha256"])')"
          dispatch_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          gh workflow run "$workflow" --ref main
          research_run_id=""
          for attempt in $(seq 1 15); do
            research_run_id="$(gh run list --repo "$GITHUB_REPOSITORY"               --workflow "$workflow" --branch main --event workflow_dispatch --limit 20               --json databaseId,headSha,createdAt               --jq "[.[] | select(.headSha == \"$dispatch_sha\")] | sort_by(.createdAt) | reverse | .[0].databaseId // empty")"
            if [ -n "$research_run_id" ]; then
              break
            fi
            sleep 2
          done
          test -n "$research_run_id"
          python - "$stage" "$workflow" "$experiment_sha256" "$research_run_id" "$dispatch_sha" <<'PY'
          import json,sys
          stage,workflow,experiment_sha256,run_id,source_sha=sys.argv[1:]
          with open("build/discovery/last-research-run.json","w",encoding="utf-8") as f:
              json.dump({
                  "stage":stage,
                  "workflow":workflow,
                  "experiment_sha256":experiment_sha256,
                  "research_run_id":run_id,
                  "source_sha":source_sha,
                  "research_only":True,
                  "paper_only":True,
                  "automatic_strategy_promotion":False,
                  "live_trading_authority":False,
              },f,indent=2,sort_keys=True)
              f.write("\n")
          PY

      - name: Commit rotation cursor only after accepted dispatch
        if: steps.health-gate.outputs.should_dispatch == 'true' && steps.outcome.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python nexus_strategy_discovery_rotation.py commit             --state build/discovery/rotation-state.json             --plan build/discovery/dispatch-plan.json             --source-sha "${{ steps.health-gate.outputs.source_sha }}"             --run-id "$GITHUB_RUN_ID"             --output build/discovery/rotation-state.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.health-gate.outputs.should_dispatch == 'true'
        with:
          name: nexus-strategy-discovery-rotation-state
          path: build/discovery
          if-no-files-found: error
          retention-days: 90
          compression-level: 9