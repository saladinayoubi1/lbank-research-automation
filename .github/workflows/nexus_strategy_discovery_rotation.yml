      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.health-gate.outputs.should_feedback == 'true' && steps.certified-source.outputs.available == 'true'
        with:
          name: nexus-research-frontier-state
          path: build/research-feedback/output/
          if-no-files-found: error
          retention-days: 90
