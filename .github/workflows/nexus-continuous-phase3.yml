name: NEXUS Continuous Phase 3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/nexus-mission-queue.json'
      - 'scripts/nexus_orchestrator.js'
      - 'scripts/nexus_continuous_worker.py'
      - 'scripts/nexus_phase3_task.py'
      - 'scripts/bootstrap_portable_python.cmd'
      - '.github/workflows/nexus-continuous-phase3.yml'
  schedule:
    - cron: '7 * * * *'

concurrency:
  group: nexus-continuous-phase3
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  local-worker:
    name: Bounded local Phase 3 worker
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (github.actor == github.repository_owner &&
       github.ref_name == github.event.repository.default_branch)
    runs-on: [self-hosted, Windows]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1
      - name: Verify exact trigger SHA
        shell: cmd
        run: |
          for /f %%S in ('git rev-parse HEAD') do set "CHECKED_OUT_SHA=%%S"
          if /I not "%CHECKED_OUT_SHA%"=="%GITHUB_SHA%" exit /b 1
          echo exact_trigger_sha=%CHECKED_OUT_SHA%
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Bootstrap portable Python
        shell: cmd
        run: call scripts\bootstrap_portable_python.cmd
      - name: Show runtime
        shell: cmd
        run: |
          python --version
          node --version
      - name: Run bounded Phase 3 worker
        shell: cmd
        env:
          NEXUS_WORKER_INTERVAL_SECONDS: '15'
          NEXUS_WORKER_MAX_RUNTIME_SECONDS: '240'
          NEXUS_DEEPSEEK_PAID_ROUTING_ALLOWED: '0'
        run: python scripts\nexus_continuous_worker.py
      - name: Upload worker heartbeat
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nexus-phase3-heartbeat-${{ github.run_id }}
          path: .nexus_runtime/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  cloud-watchdog:
    name: Cloud fallback watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify orchestrator and Phase 3 lanes
        run: |
          node scripts/nexus_orchestrator.js
          python scripts/nexus_phase3_task.py evidence
          python scripts/nexus_phase3_task.py strategy
          python scripts/nexus_phase3_task.py gates
      - name: Upload fallback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nexus-phase3-cloud-watchdog-${{ github.run_id }}
          path: .nexus_runtime/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
