name: NEXUS Remote Commander Rescue

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches:
      - codex/nexus-remote-commander-rescue-20260907
    paths:
      - .github/workflows/nexus-remote-commander-rescue.yml

permissions:
  contents: read

concurrency:
  group: nexus-remote-commander-rescue
  cancel-in-progress: false

jobs:
  rescue:
    name: Rescue user-context Remote Commander
    if: github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: [self-hosted, Linux, X64, nexus-bybit-network]
    timeout-minutes: 5
    steps:
      - name: Confirm physical WSL rescue lane
        shell: bash
        run: echo 'dedicated_rescue_lane=nexus-bybit-network'

      - name: Start or confirm Windows user-context recovery task
        shell: bash
        run: |
          WINPS='/mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe'
          test -x "$WINPS"
          "$WINPS" -NoProfile -NonInteractive -Command '$task="NEXUS-Remote-Commander-Recovery"; & schtasks.exe /Query /TN $task /FO LIST /V; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; & schtasks.exe /Run /TN $task; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; Start-Sleep -Seconds 5; & schtasks.exe /Query /TN $task /FO LIST /V; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; Write-Host "remote_commander_rescue_request=PASS"'
