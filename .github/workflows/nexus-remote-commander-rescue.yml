name: NEXUS Remote Commander Rescue

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches:
      - codex/nexus-remote-commander-rescue-20260907
    paths:
      - .github/workflows/nexus-remote-commander-rescue.yml

permissions:
  contents: read

concurrency:
  group: nexus-remote-commander-rescue
  cancel-in-progress: false

jobs:
  rescue:
    name: Rescue user-context Remote Commander
    runs-on: [self-hosted, Windows, X64, nexus-remote-rescue]
    timeout-minutes: 5
    steps:
      - name: Confirm dedicated rescue lane
        shell: cmd
        run: echo dedicated_rescue_label=nexus-remote-rescue

      - name: Start or confirm user-context recovery task
        shell: cmd
        run: |
          schtasks.exe /Query /TN "NEXUS-Remote-Commander-Recovery" /FO LIST /V
          if errorlevel 1 exit /b 1
          schtasks.exe /Run /TN "NEXUS-Remote-Commander-Recovery"
          if errorlevel 1 exit /b 1
          ping 127.0.0.1 -n 6 >nul
          schtasks.exe /Query /TN "NEXUS-Remote-Commander-Recovery" /FO LIST /V
          if errorlevel 1 exit /b 1
          echo remote_commander_rescue_request=PASS
