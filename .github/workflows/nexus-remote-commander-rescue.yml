name: NEXUS Remote Commander Rescue

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches:
      - codex/nexus-remote-commander-rescue-20260907
    paths:
      - .github/workflows/nexus-remote-commander-rescue.yml

permissions:
  contents: read

concurrency:
  group: nexus-remote-commander-rescue
  cancel-in-progress: false

jobs:
  rescue:
    name: Rescue user-context Remote Commander
    runs-on: [self-hosted, Windows, X64, nexus-remote-rescue]
    timeout-minutes: 5
    steps:
      - name: Verify physical host identity
        shell: powershell
        run: |
          $actual = [string]$env:COMPUTERNAME
          Write-Host ("computer_name=" + $actual)
          if ($actual.Trim() -ne 'DESKTOP-1R1081M') {
            throw "Unexpected physical host: $actual"
          }
          Write-Host 'physical_host_identity=PASS'

      - name: Start or confirm user-context recovery task
        shell: powershell
        run: |
          $taskName = 'NEXUS-Remote-Commander-Recovery'
          & schtasks.exe /Query /TN $taskName /FO LIST /V
          if ($LASTEXITCODE -ne 0) {
            throw "Recovery task not available: $taskName"
          }
          & schtasks.exe /Run /TN $taskName
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to request recovery task: $taskName"
          }
          Start-Sleep -Seconds 5
          & schtasks.exe /Query /TN $taskName /FO LIST /V
          if ($LASTEXITCODE -ne 0) {
            throw "Recovery task query failed after start: $taskName"
          }
          Write-Host 'remote_commander_rescue_request=PASS'
