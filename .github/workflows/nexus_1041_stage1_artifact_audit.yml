name: NEXUS 1041 Stage1 Artifact Audit

on:
  push:
    branches:
      - audit/1041-stage1-artifact-20260901

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      ACCEPTANCE_SOURCE_SHA: 896573210b6fd5a87a62562927898445f97f43ed
      ACCEPTANCE_RUN_ID: "33460976830"
      ACCEPTANCE_ARTIFACT_ID: "9796178437"
      ACCEPTANCE_ARTIFACT_NAME: nexus-persistent-paper-trading-state
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install verifier runtime dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r requirements.txt
          python3 -m pip check
      - name: Bind exact acceptance artifact metadata
        run: |
          set -euo pipefail
          meta="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/artifacts/$ACCEPTANCE_ARTIFACT_ID")"
          ARTIFACT_META="$meta" python3 - <<'PY'
          import json, os
          value = json.loads(os.environ["ARTIFACT_META"])
          assert str(value["id"]) == os.environ["ACCEPTANCE_ARTIFACT_ID"]
          assert value["name"] == os.environ["ACCEPTANCE_ARTIFACT_NAME"]
          assert value["expired"] is False
          workflow_run = value.get("workflow_run") or {}
          assert str(workflow_run.get("id")) == os.environ["ACCEPTANCE_RUN_ID"]
          assert workflow_run.get("head_sha") == os.environ["ACCEPTANCE_SOURCE_SHA"]
          print(json.dumps({
              "artifact_id": value["id"],
              "artifact_name": value["name"],
              "artifact_digest": value.get("digest"),
              "run_id": workflow_run.get("id"),
              "source_sha": workflow_run.get("head_sha"),
          }, sort_keys=True))
          PY
      - name: Restore exact artifact with path-safety checks
        run: |
          set -euo pipefail
          rm -rf build/nexus-1041-stage1-audit
          mkdir -p build/nexus-1041-stage1-audit/state
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ACCEPTANCE_ARTIFACT_ID/zip" \
            > build/nexus-1041-stage1-audit/state.zip
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile
          archive_path = Path("build/nexus-1041-stage1-audit/state.zip")
          root = Path("build/nexus-1041-stage1-audit/state").resolve()
          with zipfile.ZipFile(archive_path) as archive:
              for member in archive.infolist():
                  pure = PurePosixPath(member.filename)
                  if pure.is_absolute() or ".." in pure.parts:
                      raise SystemExit(f"unsafe artifact path: {member.filename}")
                  target = (root / member.filename).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f"unsafe artifact target: {member.filename}")
              archive.extractall(root)
          print(f"artifact_file_count={sum(1 for p in root.rglob('*') if p.is_file())}")
          PY
      - name: Run strict Stage1 acceptance verifier
        run: |
          set -euo pipefail
          python3 scripts/nexus_paper_acceptance_stage1.py \
            --state-root build/nexus-1041-stage1-audit/state \
            --manifest config/nexus-demo-strategy-matrix-v1.json \
            --source-sha "$ACCEPTANCE_SOURCE_SHA" \
            | tee build/nexus-1041-stage1-audit/result.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path("build/nexus-1041-stage1-audit/result.json").read_text())
          assert value["decision"] == "pass"
          assert value["source_sha"] == "896573210b6fd5a87a62562927898445f97f43ed"
          assert value["run_id"] == "33460976830"
          assert value["verified_cell_count"] == 6
          assert value["verified_lane_count"] == 18
          assert value["health_trigger_requested"] is True
          assert value["paper_only"] is True
          assert value["live_trading_authority"] is False
          assert value["stage1_only"] is True
          print("nexus_1041_stage1_artifact_audit=PASS")
          PY
