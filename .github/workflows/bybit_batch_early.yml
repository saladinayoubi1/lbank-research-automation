name: Bybit history early batch

on:
  pull_request:
    paths:
      - ".github/workflows/bybit_batch_early.yml"
      - "bybit_spot_backfill.py"
      - "bybit_spot_archive_audit.py"
      - "bybit_spot_archive_collector.py"
      - "requirements.lock"

permissions:
  contents: read

jobs:
  chunk:
    name: chunk-${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { id: "27", start: "2023-02-01", end: "2023-02-28" }
          - { id: "28", start: "2023-03-01", end: "2023-03-31" }
          - { id: "29", start: "2023-04-01", end: "2023-04-30" }
          - { id: "30", start: "2023-05-01", end: "2023-05-31" }
          - { id: "31", start: "2023-06-01", end: "2023-06-30" }
          - { id: "32", start: "2023-07-01", end: "2023-07-31" }
          - { id: "33", start: "2023-08-01", end: "2023-08-31" }
          - { id: "34", start: "2023-09-01", end: "2023-09-30" }
          - { id: "35", start: "2023-10-01", end: "2023-10-31" }
          - { id: "36", start: "2023-11-01", end: "2023-11-30" }
          - { id: "37", start: "2023-12-01", end: "2023-12-31" }
          - { id: "38", start: "2024-01-01", end: "2024-01-31" }
          - { id: "39", start: "2024-02-01", end: "2024-02-29" }
          - { id: "40", start: "2024-03-01", end: "2024-03-31" }
          - { id: "41", start: "2024-04-01", end: "2024-04-30" }
          - { id: "42", start: "2024-05-01", end: "2024-05-31" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - name: Build verified month
        run: |
          success=false
          state_root="build/chunk-${{ matrix.id }}"
          for attempt in 1 2 3; do
            rm -rf "$state_root"
            if python bybit_spot_backfill.py --start-date "${{ matrix.start }}" --end-date "${{ matrix.end }}" --state-root "$state_root" --cache-root "build/cache-${{ matrix.id }}" --max-archives-per-run 2 --clean; then
              success=true
              break
            fi
            if [ -f "$state_root/_backfill_report.json" ]; then
              echo "::group::Backfill report for chunk-${{ matrix.id }}, attempt $attempt"
              python -m json.tool "$state_root/_backfill_report.json" || cat "$state_root/_backfill_report.json"
              echo "::endgroup::"
            fi
            sleep $((attempt * 15))
          done
          [ "$success" = "true" ] || exit 1
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads((Path(f"build/chunk-{os.environ['CHUNK_ID']}")/'_backfill_report.json').read_text())
          s=report['summary']
          ok=s['backfill_complete'] and s['completed_units']==1 and s['remaining_units']==0 and s['run_failures']==0 and s['current_dataset_integrity_ok'] and len(report['statuses'])==6 and all(x['integrity_ok'] for x in report['statuses'])
          raise SystemExit(0 if ok else 1)
          PY
        env:
          CHUNK_ID: ${{ matrix.id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bybit-chunk-${{ matrix.id }}-attempt-${{ github.run_attempt }}
          path: build/chunk-${{ matrix.id }}
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
