name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Create isolated test environment
        shell: python
        run: |
          import os
          import venv
          from pathlib import Path

          environment = Path(os.environ["RUNNER_TEMP"]) / "nexus-test-venv"
          venv.EnvBuilder(with_pip=True).create(environment)
          scripts = environment / ("Scripts" if os.name == "nt" else "bin")
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as github_path:
              github_path.write(str(scripts) + "\n")

      - name: Install locked test dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Check dependency consistency
        run: |
          python -c "import sys; assert sys.prefix != sys.base_prefix, 'test environment must be isolated'"
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Validate NEXUS architecture contracts
        run: python nexus_architecture_validator.py docs/architecture/module-contract-registry.yaml

      - name: Bind Project Memory validation to PR base SHA
        if: github.event_name == 'pull_request'
        run: python project_memory_ci_gate.py --base-sha ${{ github.event.pull_request.base.sha }} --head-sha ${{ github.event.pull_request.head.sha }}

      - name: Run tests
        run: python -m pytest -q
