name: NEXUS Bybit WSL Local Visibility Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/nexus-bybit-wsl-local-visibility-probe.yml

permissions:
  contents: read

concurrency:
  group: nexus-bybit-wsl-local-visibility-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, nexus-local]
    timeout-minutes: 2
    steps:
      - name: Probe exact existing Bybit WSL registration without mutation
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version 2.0

          $expectedWindowsRunnerName = 'NEXUS-LOCAL-RUNNER'
          $distribution = 'Ubuntu'
          $wslRunnerRoot = '/opt/nexus-bybit-runner'
          $expectedWslRunnerName = 'NEXUS-BYBIT-WSL'
          $wsl = Join-Path $env:SystemRoot 'System32\wsl.exe'

          Write-Host "probe_runner=$env:RUNNER_NAME"
          Write-Host 'probe_mutation=false'
          Write-Host 'runner_registration_mutated=false'
          Write-Host 'runner_credentials_mutated=false'
          Write-Host 'windows_task_acl_modified=false'
          Write-Host 'live_trading_authority_changed=false'

          if ($env:RUNNER_NAME -ne $expectedWindowsRunnerName) {
            throw "Unexpected local runner: $env:RUNNER_NAME"
          }
          if (-not (Test-Path -LiteralPath $wsl -PathType Leaf)) {
            throw 'wsl.exe is not present on the local runner host.'
          }

          $command = "test -x '$wslRunnerRoot/run.sh' && test -f '$wslRunnerRoot/.runner' && grep -Fq '$expectedWslRunnerName' '$wslRunnerRoot/.runner' && printf 'registration_check=pass\\n'"
          $escaped = $command.Replace('"', '\"')

          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $wsl
          $psi.Arguments = "-d $distribution -u root -- bash -lc `"$escaped`""
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true

          $process = New-Object System.Diagnostics.Process
          $process.StartInfo = $psi
          if (-not $process.Start()) {
            throw 'Failed to start bounded WSL visibility probe.'
          }

          try {
            if (-not $process.WaitForExit(15000)) {
              try { $process.Kill() } catch {}
              throw 'Local WSL visibility probe timed out after 15 seconds.'
            }
            $stdout = $process.StandardOutput.ReadToEnd().Trim()
            $stderr = $process.StandardError.ReadToEnd().Trim()
            if ($stdout) { Write-Host $stdout }
            if ($stderr) { Write-Host "wsl_stderr=$stderr" }
            if ($process.ExitCode -ne 0) {
              throw "Local runner cannot verify the canonical Bybit WSL registration (exit=$($process.ExitCode))."
            }
            if ($stdout -notmatch '(?m)^registration_check=pass$') {
              throw 'Canonical Bybit WSL registration marker was not observed.'
            }
            Write-Host 'local_wsl_visibility=PASS'
          }
          finally {
            $process.Dispose()
          }
