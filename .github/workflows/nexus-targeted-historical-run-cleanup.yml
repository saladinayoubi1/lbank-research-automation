name: NEXUS Targeted Historical Run Cleanup

on:
  push:
    branches:
      - maintenance/cancel-stale-runs-20260910
    paths:
      - .github/workflows/nexus-targeted-historical-run-cleanup.yml

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Delete exact obsolete queued runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate and delete exact historical queued runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          main_sha="$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq '.object.sha')"
          echo "current_main=${main_sha}"

          ids=(32214132372 31126604518 31126604519)
          refs=(agent/local-runner-install-status agent/issue-94-contract-validator agent/issue-94-contract-validator)
          shas=(40b12010816df06cae5fe114fd3bbaf6f9045a31 1cef86d87d0b82d5624bc48f5ea81a9ee4891745 1cef86d87d0b82d5624bc48f5ea81a9ee4891745)

          for i in "${!ids[@]}"; do
            id="${ids[$i]}"
            expected_ref="${refs[$i]}"
            expected_sha="${shas[$i]}"
            api="repos/${GH_REPO}/actions/runs/${id}"

            if ! run_json="$(gh api "${api}" 2>/dev/null)"; then
              echo "run=${id} already absent; no action"
              continue
            fi

            status="$(jq -r '.status' <<<"${run_json}")"
            head_ref="$(jq -r '.head_branch' <<<"${run_json}")"
            head_sha="$(jq -r '.head_sha' <<<"${run_json}")"
            created_at="$(jq -r '.created_at' <<<"${run_json}")"
            event="$(jq -r '.event' <<<"${run_json}")"

            echo "run=${id} status=${status} event=${event} ref=${head_ref} sha=${head_sha} created_at=${created_at}"

            if [[ "${head_ref}" != "${expected_ref}" || "${head_sha}" != "${expected_sha}" ]]; then
              echo "Refusing to delete run ${id}: identity mismatch" >&2
              exit 1
            fi
            if [[ "${head_sha}" == "${main_sha}" ]]; then
              echo "Refusing to delete run ${id}: points at current main" >&2
              exit 1
            fi
            if [[ "${event}" != "pull_request" ]]; then
              echo "Refusing to delete run ${id}: event is not pull_request" >&2
              exit 1
            fi
            if [[ "${created_at}" > "2026-08-20T00:00:00Z" ]]; then
              echo "Refusing to delete run ${id}: not old enough" >&2
              exit 1
            fi
            if [[ "${status}" != "queued" ]]; then
              echo "Refusing to delete run ${id}: expected frozen queued status, got ${status}" >&2
              exit 1
            fi

            echo "deleting exact frozen historical run=${id}"
            gh api --method DELETE "${api}" >/dev/null

            if gh api "${api}" >/dev/null 2>&1; then
              echo "Run ${id} still exists after deletion" >&2
              exit 1
            fi
            echo "run=${id} deleted=true"
          done
