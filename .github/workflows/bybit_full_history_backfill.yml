name: Extend Bybit Spot history

on:
  pull_request:
    paths:
      - ".github/workflows/bybit_full_history_backfill.yml"
      - "bybit_spot_backfill.py"
      - "bybit_spot_archive_audit.py"
      - "bybit_spot_archive_collector.py"
      - "requirements.lock"
  workflow_dispatch:
    inputs:
      source_run_id:
        required: true
        default: "30790162024"
      source_artifact_name:
        required: true
        default: "bybit-resumable-backfill-2022-12-to-2024-01-e4cf6861398589e29ee7a53445efd489bee669d6"
      start_date:
        required: true
        default: "2022-12-01"
      end_date:
        required: true
        default: "2025-01-31"
      source_completed_units:
        required: true
        default: "14"
      final_completed_units:
        required: true
        default: "26"
      max_archives_per_stage:
        required: true
        default: "12"
      max_stages:
        required: true
        default: "2"

permissions:
  contents: read
  actions: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id || '30790162024' }}
      SOURCE_ARTIFACT_NAME: ${{ github.event.inputs.source_artifact_name || 'bybit-resumable-backfill-2022-12-to-2024-01-e4cf6861398589e29ee7a53445efd489bee669d6' }}
      START_DATE: ${{ github.event.inputs.start_date || '2022-12-01' }}
      END_DATE: ${{ github.event.inputs.end_date || '2025-01-31' }}
      SOURCE_COMPLETED_UNITS: ${{ github.event.inputs.source_completed_units || '14' }}
      FINAL_COMPLETED_UNITS: ${{ github.event.inputs.final_completed_units || '26' }}
      MAX_ARCHIVES_PER_STAGE: ${{ github.event.inputs.max_archives_per_stage || '12' }}
      MAX_STAGES: ${{ github.event.inputs.max_stages || '2' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check

      - name: Restore verified resumable state
        run: |
          mkdir -p build/bybit_backfill_state
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_ARTIFACT_NAME" --dir build/bybit_backfill_state
          python - <<'PY'
          import json, os
          from pathlib import Path
          checkpoint = json.loads(Path("build/bybit_backfill_state/_checkpoint.json").read_text())
          completed = checkpoint["completed_units"]
          ids = [item["unit_id"] for item in completed]
          expected = int(os.environ["SOURCE_COMPLETED_UNITS"])
          if len(completed) != expected or len(ids) != len(set(ids)):
              raise SystemExit(f"Unexpected restored checkpoint: {len(completed)} units")
          PY

      - name: Run bounded continuation stages
        run: |
          mkdir -p build/bybit_backfill_cache
          completed=false
          for stage in $(seq 1 "$MAX_STAGES"); do
            python bybit_spot_backfill.py \
              --start-date "$START_DATE" \
              --end-date "$END_DATE" \
              --state-root build/bybit_backfill_state \
              --cache-root build/bybit_backfill_cache \
              --max-archives-per-run "$MAX_ARCHIVES_PER_STAGE"
            completed=$(python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path("build/bybit_backfill_state/_backfill_report.json").read_text())["summary"]
          if not summary["current_dataset_integrity_ok"] or summary["run_failures"]:
              raise SystemExit(2)
          print("true" if summary["backfill_complete"] else "false")
          PY
            )
            rm -f build/bybit_backfill_cache/*.csv.gz
            [ "$completed" = "true" ] && break
          done
          [ "$completed" = "true" ] || exit 1

      - name: Enforce final range integrity
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import pandas as pd

          root = Path("build/bybit_backfill_state")
          report = json.loads((root / "_backfill_report.json").read_text())
          checkpoint = json.loads((root / "_checkpoint.json").read_text())
          sources = json.loads((root / "_source_manifest.json").read_text())
          summary = report["summary"]
          start = pd.Timestamp(os.environ["START_DATE"])
          end = pd.Timestamp(os.environ["END_DATE"])
          days = int((end - start).days) + 1
          expected_rows = {"minute15": days * 96, "hour1": days * 24, "hour4": days * 6}
          statuses = report["statuses"]
          completed_ids = [item["unit_id"] for item in checkpoint["completed_units"]]
          source_units = [item["unit_id"] for item in sources]
          ok = (
              summary["backfill_complete"]
              and summary["completed_units"] == int(os.environ["FINAL_COMPLETED_UNITS"])
              and summary["remaining_units"] == 0
              and summary["current_dataset_integrity_ok"]
              and summary["run_failures"] == 0
              and len(statuses) == 6
              and len(completed_ids) == len(set(completed_ids))
              and all(source_units.count(unit_id) == 2 for unit_id in completed_ids)
              and all(item["integrity_ok"] for item in statuses)
              and all(item["rows"] == expected_rows[item["timeframe"]] for item in statuses)
              and all(item["expected_rows"] == expected_rows[item["timeframe"]] for item in statuses)
              and all(item["missing_candles"] == 0 for item in statuses)
              and all(item["gap_count"] == 0 for item in statuses)
              and all(item["duplicate_count"] == 0 for item in statuses)
              and all(item["off_grid_count"] == 0 for item in statuses)
          )
          if not ok:
              raise SystemExit("Final range integrity gate failed")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: bybit-resumable-backfill-2022-12-to-2025-01-${{ github.sha }}
          path: build/bybit_backfill_state
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
