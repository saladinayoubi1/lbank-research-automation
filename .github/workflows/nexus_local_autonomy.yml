name: NEXUS Local Autonomy

on:
  workflow_dispatch:
  schedule:
    # Keep scheduled watchdog cadence above the observed physical source/bootstrap
    # overhead plus the bounded 240s worker window so scheduled runs do not self-queue.
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - '.nexus/autonomous-queue.json'
      - 'config/nexus-mission-queue.json'
      - 'scripts/nexus_local_worker.py'
      - 'scripts/nexus_orchestrator.js'
      - 'scripts/nexus_ai_council.js'
      - 'scripts/nexus_brain_core.js'
      - 'scripts/deepseek_smoke.py'
      - 'scripts/bootstrap_portable_python.cmd'
      - '.github/workflows/nexus_local_autonomy.yml'

permissions:
  contents: read

concurrency:
  group: nexus-local-autonomy
  cancel-in-progress: false

jobs:
  local-worker:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (github.actor == github.repository_owner &&
       github.ref_name == github.event.repository.default_branch)
    runs-on: [self-hosted, Windows, X64, nexus-local]
    timeout-minutes: 30
    env:
      NEXUS_WORKER_MAX_SECONDS: '240'
      NEXUS_WORKER_IDLE_SLEEP: '15'
      NEXUS_DEEPSEEK_PAID_ROUTING_ALLOWED: '0'
    steps:
      - name: Prepare exact source with local fast-path and bounded HTTP/1.1 fetch
        timeout-minutes: 10
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version 2.0

          $targetSha = [string]$env:GITHUB_SHA
          $repoUrl = "https://github.com/${env:GITHUB_REPOSITORY}.git"
          if (-not $targetSha) { throw 'GITHUB_SHA is required.' }

          if (Test-Path '.git' -PathType Container) {
            $remotes = @(& git remote)
            if ($remotes -contains 'origin') {
              & git remote set-url origin $repoUrl
              if ($LASTEXITCODE -ne 0) { throw 'Failed to bind existing workspace to anonymous repository URL.' }
            }
            else {
              & git remote add origin $repoUrl
              if ($LASTEXITCODE -ne 0) { throw 'Failed to add anonymous repository remote.' }
            }
          }
          else {
            Get-ChildItem -Force | Remove-Item -Recurse -Force
            & git init .
            if ($LASTEXITCODE -ne 0) { throw 'Failed to initialize physical workspace.' }
            & git remote add origin $repoUrl
            if ($LASTEXITCODE -ne 0) { throw 'Failed to add anonymous repository remote.' }
          }

          & git config --local --unset-all 'http.https://github.com/.extraheader' 2>$null
          $currentSha = ''
          try { $currentSha = ((& git rev-parse HEAD 2>$null) | Select-Object -First 1).Trim() } catch { $currentSha = '' }

          if ($currentSha -eq $targetSha) {
            & git reset --hard $targetSha
            if ($LASTEXITCODE -ne 0) { throw 'Failed to reset exact local source.' }
            & git clean -ffdx
            if ($LASTEXITCODE -ne 0) { throw 'Failed to clean exact local source.' }
            Write-Host 'exact_source_mode=local-hit'
          }
          else {
            $fetchOk = $false
            $fetchMaxAttempts = 4
            for ($fetchAttempt = 1; $fetchAttempt -le $fetchMaxAttempts; $fetchAttempt++) {
              & git -c 'http.version=HTTP/1.1' fetch --no-tags --prune --no-recurse-submodules --depth=1 origin $targetSha
              if ($LASTEXITCODE -eq 0) {
                $fetchOk = $true
                break
              }
              Write-Warning "Exact repository fetch attempt $fetchAttempt/$fetchMaxAttempts failed."
              if ($fetchAttempt -lt $fetchMaxAttempts) {
                Start-Sleep -Seconds ($fetchAttempt * 5)
              }
            }
            if (-not $fetchOk) {
              throw "Exact repository fetch failed after $fetchMaxAttempts bounded attempts."
            }

            & git checkout --detach --force FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Exact repository checkout failed.' }
            & git clean -ffdx
            if ($LASTEXITCODE -ne 0) { throw 'Post-checkout workspace clean failed.' }
            Write-Host 'exact_source_mode=bounded-http11-fetch'
          }

          $checkedOutSha = ((& git rev-parse HEAD) | Select-Object -First 1).Trim()
          if ($LASTEXITCODE -ne 0 -or $checkedOutSha -ne $targetSha) {
            throw "Exact trigger SHA mismatch: expected=$targetSha actual=$checkedOutSha"
          }
          Write-Host "exact_trigger_sha=$checkedOutSha"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
      - name: Bootstrap portable Python
        timeout-minutes: 15
        shell: cmd
        run: call scripts\bootstrap_portable_python.cmd

      - name: Initialize durable state path
        shell: cmd
        run: echo NEXUS_STATE_DIR=%RUNNER_WORKSPACE%\nexus-phase3-state>>%GITHUB_ENV%

      - name: Runner identity
        shell: cmd
        run: |
          if not exist build\autonomy mkdir build\autonomy
          python -c "import json,os,time,pathlib; pathlib.Path('build/autonomy').mkdir(parents=True,exist_ok=True); p={'runner':os.getenv('RUNNER_NAME'),'os':os.getenv('RUNNER_OS'),'arch':os.getenv('RUNNER_ARCH'),'state_dir':os.getenv('NEXUS_STATE_DIR'),'timestamp':int(time.time())}; pathlib.Path('build/autonomy/runner-identity.json').write_text(json.dumps(p,indent=2),encoding='utf-8'); print(json.dumps(p))"

      - name: Validate orchestrator and agent policy
        shell: cmd
        run: |
          python nexus_autonomous_orchestrator.py > build\autonomy\autonomous-orchestrator-state.txt
          type build\autonomy\autonomous-orchestrator-state.txt
          node scripts\nexus_orchestrator.js > build\autonomy\orchestrator-state.json
          type build\autonomy\orchestrator-state.json
          node scripts\nexus_ai_council.js
          node scripts\nexus_brain_core.js

      - name: Run bounded autonomous queue
        shell: cmd
        run: python scripts\nexus_local_worker.py

      - name: Show final worker evidence
        if: always()
        shell: cmd
        run: |
          if exist "%NEXUS_STATE_DIR%\worker-heartbeat.json" type "%NEXUS_STATE_DIR%\worker-heartbeat.json"
          if exist "%NEXUS_STATE_DIR%\autonomous-queue.json" type "%NEXUS_STATE_DIR%\autonomous-queue.json"

      - name: Copy durable state evidence into artifact staging
        if: always()
        shell: cmd
        run: |
          if not exist build\autonomy\durable-state mkdir build\autonomy\durable-state
          if exist "%NEXUS_STATE_DIR%\worker-heartbeat.json" copy /Y "%NEXUS_STATE_DIR%\worker-heartbeat.json" build\autonomy\durable-state\worker-heartbeat.json
          if exist "%NEXUS_STATE_DIR%\autonomous-queue.json" copy /Y "%NEXUS_STATE_DIR%\autonomous-queue.json" build\autonomy\durable-state\autonomous-queue.json
          if exist "%NEXUS_STATE_DIR%\state.json" copy /Y "%NEXUS_STATE_DIR%\state.json" build\autonomy\durable-state\state.json

      - name: Upload autonomy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-local-autonomy-${{ github.run_id }}
          path: build/autonomy/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
