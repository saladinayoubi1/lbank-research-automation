name: NEXUS Local Autonomy

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.nexus/autonomous-queue.json'
      - 'config/nexus-mission-queue.json'
      - 'scripts/nexus_local_worker.py'
      - 'scripts/nexus_orchestrator.js'
      - 'scripts/nexus_ai_council.js'
      - 'scripts/nexus_brain_core.js'
      - 'scripts/deepseek_smoke.py'
      - 'scripts/bootstrap_portable_python.cmd'
      - '.github/workflows/nexus_local_autonomy.yml'

permissions:
  contents: read

concurrency:
  group: nexus-local-autonomy
  cancel-in-progress: false

jobs:
  local-worker:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    env:
      NEXUS_WORKER_MAX_SECONDS: '240'
      NEXUS_WORKER_IDLE_SLEEP: '15'
      NEXUS_STATE_DIR: ${{ runner.workspace }}/nexus-phase3-state
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      NEXUS_DEEPSEEK_PAID_ROUTING_ALLOWED: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bootstrap portable Python
        shell: cmd
        run: call scripts\bootstrap_portable_python.cmd

      - name: Runner identity
        shell: cmd
        run: |
          if not exist build\autonomy mkdir build\autonomy
          python -c "import json,os,time,pathlib; pathlib.Path('build/autonomy').mkdir(parents=True,exist_ok=True); p={'runner':os.getenv('RUNNER_NAME'),'os':os.getenv('RUNNER_OS'),'arch':os.getenv('RUNNER_ARCH'),'state_dir':os.getenv('NEXUS_STATE_DIR'),'timestamp':int(time.time())}; pathlib.Path('build/autonomy/runner-identity.json').write_text(json.dumps(p,indent=2),encoding='utf-8'); print(json.dumps(p))"

      - name: Validate orchestrator and agent policy
        shell: cmd
        run: |
          python nexus_autonomous_orchestrator.py > build\autonomy\autonomous-orchestrator-state.txt
          type build\autonomy\autonomous-orchestrator-state.txt
          node scripts\nexus_orchestrator.js > build\autonomy\orchestrator-state.json
          type build\autonomy\orchestrator-state.json
          node scripts\nexus_ai_council.js
          node scripts\nexus_brain_core.js

      - name: Run bounded autonomous queue
        shell: cmd
        run: python scripts\nexus_local_worker.py

      - name: Show final worker evidence
        if: always()
        shell: cmd
        run: |
          if exist "%NEXUS_STATE_DIR%\worker-heartbeat.json" type "%NEXUS_STATE_DIR%\worker-heartbeat.json"
          if exist "%NEXUS_STATE_DIR%\autonomous-queue.json" type "%NEXUS_STATE_DIR%\autonomous-queue.json"

      - name: Copy durable state evidence into artifact staging
        if: always()
        shell: cmd
        run: |
          if not exist build\autonomy\durable-state mkdir build\autonomy\durable-state
          if exist "%NEXUS_STATE_DIR%\worker-heartbeat.json" copy /Y "%NEXUS_STATE_DIR%\worker-heartbeat.json" build\autonomy\durable-state\worker-heartbeat.json
          if exist "%NEXUS_STATE_DIR%\autonomous-queue.json" copy /Y "%NEXUS_STATE_DIR%\autonomous-queue.json" build\autonomy\durable-state\autonomous-queue.json
          if exist "%NEXUS_STATE_DIR%\state.json" copy /Y "%NEXUS_STATE_DIR%\state.json" build\autonomy\durable-state\state.json

      - name: Upload autonomy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-local-autonomy-${{ github.run_id }}
          path: build/autonomy/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
