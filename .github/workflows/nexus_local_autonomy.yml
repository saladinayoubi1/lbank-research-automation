name: NEXUS Local Autonomy

on:
  workflow_dispatch:
  schedule:
    # Keep scheduled watchdog cadence above the bounded worker window so runs do not self-queue.
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - '.nexus/autonomous-queue.json'
      - 'config/nexus-mission-queue.json'
      - 'scripts/nexus_local_worker.py'
      - 'scripts/nexus_orchestrator.js'
      - 'scripts/nexus_ai_council.js'
      - 'scripts/nexus_brain_core.js'
      - 'scripts/deepseek_smoke.py'
      - 'scripts/bootstrap_portable_python.cmd'
      - 'tests/test_nexus_local_autonomy_workflow.py'
      - '.github/workflows/nexus_local_autonomy.yml'
  pull_request:
    branches: [main]
    paths:
      - '.nexus/autonomous-queue.json'
      - 'config/nexus-mission-queue.json'
      - 'scripts/nexus_local_worker.py'
      - 'scripts/nexus_orchestrator.js'
      - 'scripts/nexus_ai_council.js'
      - 'scripts/nexus_brain_core.js'
      - 'scripts/deepseek_smoke.py'
      - 'scripts/bootstrap_portable_python.cmd'
      - 'tests/test_nexus_local_autonomy_workflow.py'
      - '.github/workflows/nexus_local_autonomy.yml'

permissions:
  contents: read

concurrency:
  group: nexus-local-autonomy-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify Local Autonomy source transport contract
        run: python tests/test_nexus_local_autonomy_workflow.py

  source-prep:
    needs: contract-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      archive_sha256: ${{ steps.pack.outputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pack exact commit source without repository history
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/local-autonomy-source
          archive='build/local-autonomy-source/nexus-local-autonomy-source.zip'
          commit_file='build/local-autonomy-source/nexus-local-autonomy-source.commit-sha'
          git archive --format=zip --output "$archive" "$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" > "$commit_file"
          archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          test -n "$archive_sha256"
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"
          echo "local_autonomy_exact_source_pack=PASS sha=$GITHUB_SHA digest=$archive_sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-local-autonomy-source-${{ github.run_id }}
          path: build/local-autonomy-source/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  local-worker:
    needs: [contract-test, source-prep]
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' ||
       (github.actor == github.repository_owner &&
        github.ref_name == github.event.repository.default_branch))
    runs-on: [self-hosted, Windows, X64, nexus-local]
    timeout-minutes: 30
    env:
      NEXUS_WORKER_MAX_SECONDS: '240'
      NEXUS_WORKER_IDLE_SLEEP: '15'
      NEXUS_DEEPSEEK_PAID_ROUTING_ALLOWED: '0'
      EXPECTED_SOURCE_ARCHIVE_SHA256: ${{ needs.source-prep.outputs.archive_sha256 }}
    steps:
      - name: Download exact current-run source transport
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nexus-local-autonomy-source-${{ github.run_id }}
          path: ${{ runner.temp }}/nexus-local-autonomy-source

      - name: Verify and restore exact source artifact
        timeout-minutes: 5
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version 2.0

          $transportRoot = Join-Path $env:RUNNER_TEMP 'nexus-local-autonomy-source'
          $archive = Join-Path $transportRoot 'nexus-local-autonomy-source.zip'
          $commitFile = Join-Path $transportRoot 'nexus-local-autonomy-source.commit-sha'
          $expectedSha = [string]$env:GITHUB_SHA
          $expectedDigest = ([string]$env:EXPECTED_SOURCE_ARCHIVE_SHA256).ToLowerInvariant()

          if (-not $expectedSha) { throw 'GITHUB_SHA is required.' }
          if (-not $expectedDigest) { throw 'Expected source archive SHA256 is required.' }
          if (-not (Test-Path $archive -PathType Leaf)) { throw 'Exact source archive is missing.' }
          if (-not (Test-Path $commitFile -PathType Leaf)) { throw 'Exact source commit binding is missing.' }

          $transportSha = (Get-Content -LiteralPath $commitFile -Raw).Trim()
          if ($transportSha -ne $expectedSha) {
            throw "Exact source commit mismatch: expected=$expectedSha actual=$transportSha"
          }

          $actualDigest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualDigest -ne $expectedDigest) {
            throw "Exact source archive digest mismatch: expected=$expectedDigest actual=$actualDigest"
          }

          Get-ChildItem -Force -LiteralPath $env:GITHUB_WORKSPACE | Remove-Item -Recurse -Force
          Expand-Archive -LiteralPath $archive -DestinationPath $env:GITHUB_WORKSPACE -Force
          Set-Location $env:GITHUB_WORKSPACE

          if (-not (Test-Path 'scripts/nexus_local_worker.py' -PathType Leaf)) {
            throw 'Restored exact source is incomplete.'
          }
          if (-not (Test-Path 'nexus_autonomous_orchestrator.py' -PathType Leaf)) {
            throw 'Restored exact source is missing the autonomy orchestrator.'
          }
          Write-Host "exact_source_mode=digest-pinned-current-run-artifact"
          Write-Host "exact_trigger_sha=$transportSha"
          Write-Host "exact_source_archive_sha256=$actualDigest"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
      - name: Bootstrap portable Python
        timeout-minutes: 15
        shell: cmd
        run: call scripts\bootstrap_portable_python.cmd

      - name: Initialize durable state path
        shell: cmd
        run: echo NEXUS_STATE_DIR=%RUNNER_WORKSPACE%\nexus-phase3-state>>%GITHUB_ENV%

      - name: Runner identity
        shell: cmd
        run: |
          if not exist build\autonomy mkdir build\autonomy
          python -c "import json,os,time,pathlib; pathlib.Path('build/autonomy').mkdir(parents=True,exist_ok=True); p={'runner':os.getenv('RUNNER_NAME'),'os':os.getenv('RUNNER_OS'),'arch':os.getenv('RUNNER_ARCH'),'state_dir':os.getenv('NEXUS_STATE_DIR'),'timestamp':int(time.time())}; pathlib.Path('build/autonomy/runner-identity.json').write_text(json.dumps(p,indent=2),encoding='utf-8'); print(json.dumps(p))"

      - name: Validate orchestrator and agent policy
        shell: cmd
        run: |
          python nexus_autonomous_orchestrator.py > build\autonomy\autonomous-orchestrator-state.txt
          type build\autonomy\autonomous-orchestrator-state.txt
          node scripts\nexus_orchestrator.js > build\autonomy\orchestrator-state.json
          type build\autonomy\orchestrator-state.json
          node scripts\nexus_ai_council.js
          node scripts\nexus_brain_core.js

      - name: Run bounded autonomous queue
        shell: cmd
        run: python scripts\nexus_local_worker.py

      - name: Show final worker evidence
        if: always()
        shell: cmd
        run: |
          if exist "%NEXUS_STATE_DIR%\worker-heartbeat.json" type "%NEXUS_STATE_DIR%\worker-heartbeat.json"
          if exist "%NEXUS_STATE_DIR%\autonomous-queue.json" type "%NEXUS_STATE_DIR%\autonomous-queue.json"

      - name: Copy durable state evidence into artifact staging
        if: always()
        shell: cmd
        run: |
          if not exist build\autonomy\durable-state mkdir build\autonomy\durable-state
          if exist "%NEXUS_STATE_DIR%\worker-heartbeat.json" copy /Y "%NEXUS_STATE_DIR%\worker-heartbeat.json" build\autonomy\durable-state\worker-heartbeat.json
          if exist "%NEXUS_STATE_DIR%\autonomous-queue.json" copy /Y "%NEXUS_STATE_DIR%\autonomous-queue.json" build\autonomy\durable-state\autonomous-queue.json
          if exist "%NEXUS_STATE_DIR%\state.json" copy /Y "%NEXUS_STATE_DIR%\state.json" build\autonomy\durable-state\state.json

      - name: Upload autonomy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-local-autonomy-${{ github.run_id }}
          path: build/autonomy/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
