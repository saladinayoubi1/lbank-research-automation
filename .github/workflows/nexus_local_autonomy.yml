name: NEXUS Local Autonomy

on:
  workflow_dispatch:
  schedule:
    # Keep scheduled watchdog cadence above the bounded worker window so runs do not self-queue.
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - '.nexus/autonomous-queue.json'
      - 'config/nexus-mission-queue.json'
      - 'scripts/nexus_local_worker.py'
      - 'scripts/nexus_orchestrator.js'
      - 'scripts/nexus_ai_council.js'
      - 'scripts/nexus_brain_core.js'
      - 'scripts/deepseek_smoke.py'
      - 'scripts/bootstrap_portable_python.cmd'
      - 'tests/test_nexus_local_autonomy_workflow.py'
      - '.github/workflows/nexus_local_autonomy.yml'
  pull_request:
    branches: [main]
    paths:
      - '.nexus/autonomous-queue.json'
      - 'config/nexus-mission-queue.json'
      - 'scripts/nexus_local_worker.py'
      - 'scripts/nexus_orchestrator.js'
      - 'scripts/nexus_ai_council.js'
      - 'scripts/nexus_brain_core.js'
      - 'scripts/deepseek_smoke.py'
      - 'scripts/bootstrap_portable_python.cmd'
      - 'tests/test_nexus_local_autonomy_workflow.py'
      - '.github/workflows/nexus_local_autonomy.yml'

permissions:
  contents: read

concurrency:
  group: nexus-local-autonomy-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify Local Autonomy source transport contract
        run: python tests/test_nexus_local_autonomy_workflow.py

  source-prep:
    needs: contract-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact hosted source binding
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "hosted_source_binding=PASS sha=$actual"

  local-worker:
    needs: [contract-test, source-prep]
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' ||
       (github.actor == github.repository_owner &&
        github.ref_name == github.event.repository.default_branch))
    runs-on: [self-hosted, Windows, X64, nexus-local]
    timeout-minutes: 30
    env:
      NEXUS_WORKER_MAX_SECONDS: '240'
      NEXUS_WORKER_IDLE_SLEEP: '15'
      NEXUS_DEEPSEEK_PAID_ROUTING_ALLOWED: '0'
    steps:
      - name: Prepare anonymous exact source with bounded HTTP/1.1 retries
        timeout-minutes: 5
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version 2.0

          $repoUrl = "https://github.com/$env:GITHUB_REPOSITORY.git"
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          Get-ChildItem -Force -LiteralPath $workspace -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force
          & git -C $workspace init .
          if ($LASTEXITCODE -ne 0) { throw 'Failed to initialize exact autonomy source workspace.' }
          & git -C $workspace remote add origin $repoUrl
          if ($LASTEXITCODE -ne 0) { throw 'Failed to add anonymous autonomy source remote.' }
          & git -C $workspace config --local --unset-all http.https://github.com/.extraheader

          $fetchOk = $false
          $fetchMaxAttempts = 3
          for ($fetchAttempt = 1; $fetchAttempt -le $fetchMaxAttempts; $fetchAttempt++) {
            & git -C $workspace -c 'http.version=HTTP/1.1' fetch --no-tags --prune --depth=1 origin $env:GITHUB_SHA
            if ($LASTEXITCODE -eq 0) { $fetchOk = $true; break }
            Write-Warning "Exact autonomy source fetch attempt $fetchAttempt/$fetchMaxAttempts failed."
            if ($fetchAttempt -lt $fetchMaxAttempts) { Start-Sleep -Seconds ($fetchAttempt * 5) }
          }
          if (-not $fetchOk) { throw "Exact autonomy source fetch failed after $fetchMaxAttempts bounded attempts." }

          & git -C $workspace checkout --detach --force FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Exact autonomy source checkout failed.' }
          $actualSha = (& git -C $workspace rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualSha -ne $env:GITHUB_SHA) {
            throw "Exact trigger SHA mismatch: expected=$env:GITHUB_SHA actual=$actualSha"
          }
          if (-not (Test-Path (Join-Path $workspace 'scripts\nexus_local_worker.py') -PathType Leaf)) {
            throw 'Restored exact source is incomplete.'
          }
          if (-not (Test-Path (Join-Path $workspace 'nexus_autonomous_orchestrator.py') -PathType Leaf)) {
            throw 'Restored exact source is missing the autonomy orchestrator.'
          }
          Write-Host 'exact_source_mode=anonymous-exact-sha-http11'
          Write-Host "exact_trigger_sha=$actualSha"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
      - name: Bootstrap portable Python
        timeout-minutes: 15
        shell: cmd
        run: call scripts\bootstrap_portable_python.cmd

      - name: Initialize durable state path
        shell: cmd
        run: echo NEXUS_STATE_DIR=%RUNNER_WORKSPACE%\nexus-phase3-state>>%GITHUB_ENV%

      - name: Runner identity
        shell: cmd
        run: |
          if not exist build\autonomy mkdir build\autonomy
          python -c "import json,os,time,pathlib; pathlib.Path('build/autonomy').mkdir(parents=True,exist_ok=True); p={'runner':os.getenv('RUNNER_NAME'),'os':os.getenv('RUNNER_OS'),'arch':os.getenv('RUNNER_ARCH'),'state_dir':os.getenv('NEXUS_STATE_DIR'),'timestamp':int(time.time())}; pathlib.Path('build/autonomy/runner-identity.json').write_text(json.dumps(p,indent=2),encoding='utf-8'); print(json.dumps(p))"

      - name: Validate orchestrator and agent policy
        shell: cmd
        run: |
          python nexus_autonomous_orchestrator.py > build\autonomy\autonomous-orchestrator-state.txt
          type build\autonomy\autonomous-orchestrator-state.txt
          node scripts\nexus_orchestrator.js > build\autonomy\orchestrator-state.json
          type build\autonomy\orchestrator-state.json
          node scripts\nexus_ai_council.js
          node scripts\nexus_brain_core.js

      - name: Run bounded autonomous queue
        shell: cmd
        run: python scripts\nexus_local_worker.py

      - name: Show final worker evidence
        if: always()
        shell: cmd
        run: |
          if exist "%NEXUS_STATE_DIR%\worker-heartbeat.json" type "%NEXUS_STATE_DIR%\worker-heartbeat.json"
          if exist "%NEXUS_STATE_DIR%\autonomous-queue.json" type "%NEXUS_STATE_DIR%\autonomous-queue.json"

      - name: Copy durable state evidence into artifact staging
        if: always()
        shell: cmd
        run: |
          if not exist build\autonomy\durable-state mkdir build\autonomy\durable-state
          if exist "%NEXUS_STATE_DIR%\worker-heartbeat.json" copy /Y "%NEXUS_STATE_DIR%\worker-heartbeat.json" build\autonomy\durable-state\worker-heartbeat.json
          if exist "%NEXUS_STATE_DIR%\autonomous-queue.json" copy /Y "%NEXUS_STATE_DIR%\autonomous-queue.json" build\autonomy\durable-state\autonomous-queue.json
          if exist "%NEXUS_STATE_DIR%\state.json" copy /Y "%NEXUS_STATE_DIR%\state.json" build\autonomy\durable-state\state.json

      - name: Upload autonomy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-local-autonomy-${{ github.run_id }}
          path: build/autonomy/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
