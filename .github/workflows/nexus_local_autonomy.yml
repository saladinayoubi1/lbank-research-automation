name: NEXUS Local Autonomy

on:
  workflow_dispatch:
  schedule:
    # Keep scheduled watchdog cadence above the bounded worker window so runs do not self-queue.
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - '.nexus/autonomous-queue.json'
      - 'config/nexus-mission-queue.json'
      - 'scripts/nexus_local_worker.py'
      - 'scripts/nexus_orchestrator.js'
      - 'scripts/nexus_ai_council.js'
      - 'scripts/nexus_brain_core.js'
      - 'scripts/deepseek_smoke.py'
      - 'scripts/bootstrap_portable_python.cmd'
      - 'tests/test_nexus_local_autonomy_workflow.py'
      - '.github/workflows/nexus_local_autonomy.yml'
  pull_request:
    branches: [main]
    paths:
      - '.nexus/autonomous-queue.json'
      - 'config/nexus-mission-queue.json'
      - 'scripts/nexus_local_worker.py'
      - 'scripts/nexus_orchestrator.js'
      - 'scripts/nexus_ai_council.js'
      - 'scripts/nexus_brain_core.js'
      - 'scripts/deepseek_smoke.py'
      - 'scripts/bootstrap_portable_python.cmd'
      - 'tests/test_nexus_local_autonomy_workflow.py'
      - '.github/workflows/nexus_local_autonomy.yml'

permissions:
  contents: read

concurrency:
  group: nexus-local-autonomy-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify Local Autonomy source transport contract
        run: python tests/test_nexus_local_autonomy_workflow.py

  source-prep:
    needs: contract-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact hosted source binding
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "hosted_source_binding=PASS sha=$actual"

  local-worker:
    needs: [contract-test, source-prep]
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' ||
       (github.actor == github.repository_owner &&
        github.ref_name == github.event.repository.default_branch))
    runs-on: [self-hosted, Windows, X64, nexus-local]
    timeout-minutes: 30
    env:
      NEXUS_WORKER_MAX_SECONDS: '240'
      NEXUS_WORKER_IDLE_SLEEP: '15'
      NEXUS_DEEPSEEK_PAID_ROUTING_ALLOWED: '0'
    steps:
      - name: Fetch exact autonomy source from codeload
        timeout-minutes: 5
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version 2.0

          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\')
          $runnerWorkspace = [IO.Path]::GetFullPath($env:RUNNER_WORKSPACE).TrimEnd('\')
          $repoName = ($env:GITHUB_REPOSITORY -split '/')[-1]
          if ((Split-Path -Parent $workspace) -ine $runnerWorkspace -or
              (Split-Path -Leaf $workspace) -ine $repoName) {
            throw 'Local Autonomy workspace boundary mismatch.'
          }

          $archive = Join-Path $env:RUNNER_TEMP "nexus-autonomy-source-$env:GITHUB_SHA.zip"
          $extract = Join-Path $env:RUNNER_TEMP "nexus-autonomy-source-$env:GITHUB_SHA"
          $sourceUrl = "https://codeload.github.com/$env:GITHUB_REPOSITORY/zip/$env:GITHUB_SHA"

          Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $extract -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $workspace | Out-Null
          Get-ChildItem -Force -LiteralPath $workspace -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force

          $downloadOk = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            & curl.exe --fail --silent --show-error --http1.1 --connect-timeout 10 --max-time 60 --speed-time 20 --speed-limit 1024 --output $archive $sourceUrl
            if ($LASTEXITCODE -eq 0 -and
                (Test-Path -LiteralPath $archive -PathType Leaf) -and
                (Get-Item -LiteralPath $archive).Length -gt 0) {
              $downloadOk = $true
              break
            }
            Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
            if ($attempt -lt 3) { Start-Sleep -Seconds (3 * $attempt) }
          }
          if (-not $downloadOk) { throw "Exact autonomy codeload source download failed for $env:GITHUB_SHA." }

          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          & tar.exe -xf $archive -C $extract
          if ($LASTEXITCODE -ne 0) { throw 'Exact autonomy codeload archive extraction failed.' }
          $root = Get-ChildItem -LiteralPath $extract -Directory | Select-Object -First 1
          if ($null -eq $root) { throw 'Exact autonomy codeload archive did not contain a source root.' }
          Get-ChildItem -Force -LiteralPath $root.FullName | ForEach-Object {
            Move-Item -LiteralPath $_.FullName -Destination $workspace -Force
          }

          $binding = "$env:GITHUB_REPOSITORY@$env:GITHUB_SHA"
          $bindingPath = Join-Path $workspace '.nexus-trigger-source'
          Set-Content -LiteralPath $bindingPath -Value $binding -Encoding ASCII
          $actualBinding = ([string](Get-Content -LiteralPath $bindingPath -Raw)).Trim()
          if ($actualBinding -ne $binding) {
            throw "Exact autonomy trigger binding mismatch: expected=$binding actual=$actualBinding"
          }

          if (-not (Test-Path (Join-Path $workspace 'scripts\nexus_local_worker.py') -PathType Leaf)) {
            throw 'Restored exact source is incomplete.'
          }
          if (-not (Test-Path (Join-Path $workspace 'nexus_autonomous_orchestrator.py') -PathType Leaf)) {
            throw 'Restored exact source is missing the autonomy orchestrator.'
          }

          Remove-Item -LiteralPath $archive -Force
          Remove-Item -LiteralPath $extract -Recurse -Force
          Write-Host 'exact_source_mode=codeload-exact-sha-http11'
          Write-Host "exact_trigger_sha=$env:GITHUB_SHA"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
      - name: Bootstrap portable Python
        timeout-minutes: 15
        shell: cmd
        run: call scripts\bootstrap_portable_python.cmd

      - name: Initialize durable state path
        shell: cmd
        run: echo NEXUS_STATE_DIR=%RUNNER_WORKSPACE%\nexus-phase3-state>>%GITHUB_ENV%

      - name: Runner identity
        shell: cmd
        run: |
          if not exist build\autonomy mkdir build\autonomy
          python -c "import json,os,time,pathlib; pathlib.Path('build/autonomy').mkdir(parents=True,exist_ok=True); p={'runner':os.getenv('RUNNER_NAME'),'os':os.getenv('RUNNER_OS'),'arch':os.getenv('RUNNER_ARCH'),'state_dir':os.getenv('NEXUS_STATE_DIR'),'timestamp':int(time.time())}; pathlib.Path('build/autonomy/runner-identity.json').write_text(json.dumps(p,indent=2),encoding='utf-8'); print(json.dumps(p))"

      - name: Validate orchestrator and agent policy
        shell: cmd
        run: |
          python nexus_autonomous_orchestrator.py > build\autonomy\autonomous-orchestrator-state.txt
          type build\autonomy\autonomous-orchestrator-state.txt
          node scripts\nexus_orchestrator.js > build\autonomy\orchestrator-state.json
          type build\autonomy\orchestrator-state.json
          node scripts\nexus_ai_council.js
          node scripts\nexus_brain_core.js

      - name: Run bounded autonomous queue
        shell: cmd
        run: python scripts\nexus_local_worker.py

      - name: Show final worker evidence
        if: always()
        shell: cmd
        run: |
          if exist "%NEXUS_STATE_DIR%\worker-heartbeat.json" type "%NEXUS_STATE_DIR%\worker-heartbeat.json"
          if exist "%NEXUS_STATE_DIR%\autonomous-queue.json" type "%NEXUS_STATE_DIR%\autonomous-queue.json"

      - name: Copy durable state evidence into artifact staging
        if: always()
        shell: cmd
        run: |
          if not exist build\autonomy\durable-state mkdir build\autonomy\durable-state
          if exist "%NEXUS_STATE_DIR%\worker-heartbeat.json" copy /Y "%NEXUS_STATE_DIR%\worker-heartbeat.json" build\autonomy\durable-state\worker-heartbeat.json
          if exist "%NEXUS_STATE_DIR%\autonomous-queue.json" copy /Y "%NEXUS_STATE_DIR%\autonomous-queue.json" build\autonomy\durable-state\autonomous-queue.json
          if exist "%NEXUS_STATE_DIR%\state.json" copy /Y "%NEXUS_STATE_DIR%\state.json" build\autonomy\durable-state\state.json

      - name: Upload autonomy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexus-local-autonomy-${{ github.run_id }}
          path: build/autonomy/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
