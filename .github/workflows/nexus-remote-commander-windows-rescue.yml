name: NEXUS Remote Commander Windows Rescue

on:
  workflow_dispatch:
  schedule:
    - cron: '4,19,34,49 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/nexus-remote-commander-windows-rescue.yml

permissions:
  contents: read

concurrency:
  group: nexus-remote-commander-windows-rescue
  cancel-in-progress: true

jobs:
  rescue-remote-commander:
    if: github.ref == 'refs/heads/main'
    runs-on: nexus-remote-rescue
    timeout-minutes: 5
    steps:
      - name: Verify exact existing Windows runner and request user-context recovery
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version 2.0

          $runnerRoot = 'C:\actions-runner\actions-runner'
          $runnerConfig = Join-Path $runnerRoot '.runner'
          $expectedRunnerName = 'NEXUS-WINDOWS-DR'
          $expectedGitHubUrl = 'https://github.com/saladinayoubi1/lbank-research-automation'
          $task = 'NEXUS-Remote-Commander-Recovery'

          if (-not (Test-Path -LiteralPath $runnerConfig -PathType Leaf)) {
            throw "exact Windows runner config missing: $runnerConfig"
          }

          $config = Get-Content -LiteralPath $runnerConfig -Raw | ConvertFrom-Json
          if ([string]$config.agentName -ne $expectedRunnerName) {
            throw 'exact Windows runner name mismatch'
          }
          if ([string]$config.gitHubUrl -ne $expectedGitHubUrl) {
            throw 'exact Windows runner repository binding mismatch'
          }

          & schtasks.exe /Query /TN $task /FO LIST /V
          if ($LASTEXITCODE -ne 0) { throw 'existing Remote Commander recovery task missing' }

          & schtasks.exe /Run /TN $task
          if ($LASTEXITCODE -ne 0) { throw 'Remote Commander recovery task request failed' }
          Start-Sleep -Seconds 5

          & schtasks.exe /Query /TN $task /FO LIST /V
          if ($LASTEXITCODE -ne 0) { throw 'Remote Commander recovery task post-query failed' }

          Write-Host 'remote_commander_windows_rescue=PASS'
          Write-Host 'remote_commander_task_mutated=false'
          Write-Host 'runner_registration_mutated=false'
          Write-Host 'runner_credentials_mutated=false'
          Write-Host 'windows_acl_modified=false'
          Write-Host 'windows_service_modified=false'
          Write-Host 'live_trading_authority_changed=false'
