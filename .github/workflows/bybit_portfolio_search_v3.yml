name: Bybit portfolio search v3

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      DATASET_FILE: NEXUS_BYBIT_replay_v2_2022-12-01_to_2026-07-31.zip
      DATASET_DELIVERY: NEXUS_BYBIT_replay_v2_delivery.json
      DATASET_ARTIFACT_PREFIX: bybit-full-history-final-
      DATASET_SHA256: "2455a725886d81adaec9d3478e8f3b2daaba6c0c9645a691e71737eb64f67422"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip check
      - run: python -m pytest -q
      - name: Restore verified immutable Bybit replay-v2 dataset
        run: |
          set -euo pipefail
          rm -rf build/replay_delivery build/bybit_dataset
          mkdir -p build/replay_delivery build/bybit_dataset
          python scripts/select_nexus_bybit_replay_artifact.py \
            --repository "$GITHUB_REPOSITORY" \
            --output-dir build/replay_delivery \
            --expected-file-name "$DATASET_FILE" \
            --expected-semantic-sha256 "$DATASET_SHA256" \
            --delivery-name "$DATASET_DELIVERY" \
            --artifact-prefix "$DATASET_ARTIFACT_PREFIX"
          archive="build/replay_delivery/$DATASET_FILE"
          test -s "$archive"
          unzip -q "$archive" -d build/bybit_dataset
      - name: Reproduce v3 result
        run: |
          python bybit_portfolio_search_v3_scheduled.py \
            --manifest experiments/bybit_portfolio_search_v3.json \
            --output build/bybit_portfolio_search_v3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bybit-portfolio-search-v3-${{ github.run_attempt }}
          path: build/bybit_portfolio_search_v3
          if-no-files-found: error
          retention-days: 30
          compression-level: 9