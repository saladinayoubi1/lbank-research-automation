name: Bybit portfolio search v3

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: "Final immutable Bybit delivery artifact"
        required: false
        default: "8867026863"

permissions:
  contents: read
  actions: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_ARTIFACT_ID: "8867026863"
      EXPECTED_SHA256: "5f1173467c2296201940c3b7786b7cc3e5442244e07289769ab4867ace41d668"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip check
      - run: python -m pytest -q
      - name: Download immutable Bybit dataset
        env:
          DISPATCH_ARTIFACT_ID: ${{ github.event.inputs.artifact_id }}
        run: |
          set -euo pipefail
          artifact_id="$DISPATCH_ARTIFACT_ID"
          if [ -z "$artifact_id" ]; then artifact_id="$DEFAULT_ARTIFACT_ID"; fi
          rm -rf build/final_delivery build/bybit_dataset
          mkdir -p build/final_delivery build/bybit_dataset
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > build/final_delivery.zip
          unzip -q build/final_delivery.zip -d build/final_delivery
          archive="build/final_delivery/BYBIT_full_history_2022-12-01_to_2026-07-31.zip"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -q "$archive" -d build/bybit_dataset
      - name: Reproduce v3 result
        run: |
          python bybit_portfolio_search_v3_scheduled.py \
            --manifest experiments/bybit_portfolio_search_v3.json \
            --output build/bybit_portfolio_search_v3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bybit-portfolio-search-v3-${{ github.run_attempt }}
          path: build/bybit_portfolio_search_v3
          if-no-files-found: error
          retention-days: 30
          compression-level: 9