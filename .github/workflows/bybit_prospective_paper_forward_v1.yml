name: Bybit prospective Paper forward v1

on:
  schedule:
    # Poll twice per completed 4h boundary. GitHub may delay or drop scheduled
    # events; the digest-linked state advances only previously unseen closed bars.
    - cron: "17 */2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bybit_prospective_paper_forward_v1.yml"
      - "bybit_prospective_paper_forward_v1.py"
      - "nexus_paper_terminal_rebind.py"
      - "nexus_paper_terminal_legacy_archive.py"
      - "nexus_paper_runtime_attestation.py"
      - "requirements.lock"
      - "experiments/bybit_prospective_paper_forward_v1.json"
      - "experiments/bybit_frozen_regime_strategy_v1.json"
  pull_request:
    paths:
      - ".github/workflows/bybit_prospective_paper_forward_v1.yml"
      - "bybit_prospective_paper_forward_v1.py"
      - "nexus_paper_terminal_rebind.py"
      - "nexus_paper_runtime_attestation.py"
      - "requirements.lock"
      - "experiments/bybit_prospective_paper_forward_v1.json"
      - "experiments/bybit_frozen_regime_strategy_v1.json"
      - "tests/test_bybit_prospective_paper_forward_v1.py"
      - "tests/test_nexus_paper_terminal_rebind.py"
      - "tests/test_nexus_paper_terminal_legacy_archive.py"
      - "tests/test_nexus_paper_runtime_attestation.py"
      - "docs/BYBIT_PROSPECTIVE_PAPER_FORWARD_V1.md"

permissions:
  contents: read
  actions: read

concurrency:
  group: bybit-prospective-paper-forward-v1
  cancel-in-progress: false

jobs:
  contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip check
      - run: >-
          python -m pytest -q
          tests/test_bybit_prospective_paper_forward_v1.py
          tests/test_nexus_paper_terminal_rebind.py
          tests/test_nexus_paper_terminal_legacy_archive.py
          tests/test_nexus_paper_runtime_attestation.py

  paper-forward:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: contract-test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      STATE_ARTIFACT: bybit-prospective-paper-forward-v1-state
      STATE_FILE: bybit_prospective_paper_forward_v1.json
      ATTESTATION_FILE: runtime_attestation.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - name: Restore latest digest-protected Paper state
        run: |
          set -euo pipefail
          mkdir -p build/prior build/bybit_prospective_paper_forward_v1
          artifact_id="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$STATE_ARTIFACT&per_page=1" \
            --jq '.artifacts[0].id // empty')"
          if [ -n "$artifact_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > build/prior.zip
            unzip -q build/prior.zip -d build/prior
            test -f "build/prior/$STATE_FILE"
            cp "build/prior/$STATE_FILE" "build/bybit_prospective_paper_forward_v1/$STATE_FILE"
          fi
      - name: Detect terminal Paper evidence
        id: terminal
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          path = Path("build/prior/bybit_prospective_paper_forward_v1.json")
          terminal = False
          legacy_archive = False
          if path.is_file():
              state = json.loads(path.read_text(encoding="utf-8"))
              terminal = state.get("status") in {"COMPLETE_REVIEW_REQUIRED", "QUARANTINED"}
              from nexus_paper_terminal_legacy_archive import OLD_ENGINE_SHA256, OLD_STATE_DIGEST
              legacy_archive = (
                  terminal and state.get("status") == "QUARANTINED"
                  and state.get("engine_sha256") == OLD_ENGINE_SHA256
                  and state.get("state_digest") == OLD_STATE_DIGEST
              )
          print(f"terminal={str(terminal).lower()}")
          print(f"legacy_archive={str(legacy_archive).lower()}")
          PY
      - name: Advance prospective Paper evidence
        if: steps.terminal.outputs.terminal != 'true'
        run: |
          set -euo pipefail
          python bybit_prospective_paper_forward_v1.py \
            --manifest experiments/bybit_prospective_paper_forward_v1.json \
            --state "build/prior/$STATE_FILE" \
            --output "build/bybit_prospective_paper_forward_v1/$STATE_FILE" \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID"
      - name: Rebind terminal snapshot without market collection
        if: steps.terminal.outputs.terminal == 'true' && steps.terminal.outputs.legacy_archive != 'true'
        run: |
          set -euo pipefail
          python nexus_paper_terminal_rebind.py \
            --manifest experiments/bybit_prospective_paper_forward_v1.json \
            --state "build/prior/$STATE_FILE" \
            --output "build/bybit_prospective_paper_forward_v1/$STATE_FILE" \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID"
          echo "terminal_evidence_frozen=true" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve exact historical quarantined state with old-source proof only
        id: legacy-archive
        if: steps.terminal.outputs.legacy_archive == 'true'
        run: |
          set -euo pipefail
          old_source=961fc206bb9475666152f15c729e00dd2e1bd184
          mkdir -p build/legacy-terminal
          git fetch --no-tags --depth=1 origin "$old_source"
          test "$(git rev-parse FETCH_HEAD)" = "$old_source"
          git show FETCH_HEAD:bybit_prospective_paper_forward_v1.py > build/legacy-terminal/historical-engine.py
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/runs/36255472645" \
            > build/legacy-terminal/original-run.json
          python nexus_paper_terminal_legacy_archive.py archive \
            --manifest experiments/bybit_prospective_paper_forward_v1.json \
            --state "build/prior/$STATE_FILE" \
            --old-engine build/legacy-terminal/historical-engine.py \
            --old-run build/legacy-terminal/original-run.json \
            --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --receipt build/bybit_prospective_paper_forward_v1/terminal_archive_receipt.json
          python nexus_paper_terminal_legacy_archive.py verify \
            --manifest experiments/bybit_prospective_paper_forward_v1.json \
            --state "build/bybit_prospective_paper_forward_v1/$STATE_FILE" \
            --old-engine build/legacy-terminal/historical-engine.py \
            --old-run build/legacy-terminal/original-run.json \
            --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --receipt build/bybit_prospective_paper_forward_v1/terminal_archive_receipt.json
          echo "terminal_evidence_historical_quarantined_unchanged=true" >> "$GITHUB_STEP_SUMMARY"
          echo "current_engine_historical_requalification=false" >> "$GITHUB_STEP_SUMMARY"
      - name: Bind exact runtime attestation
        if: steps.terminal.outputs.legacy_archive != 'true'
        run: |
          set -euo pipefail
          if [ -f "build/prior/$ATTESTATION_FILE" ]; then
            python nexus_paper_runtime_attestation.py rebind \
              --manifest experiments/bybit_prospective_paper_forward_v1.json \
              --previous-state "build/prior/$STATE_FILE" \
              --state "build/bybit_prospective_paper_forward_v1/$STATE_FILE" \
              --attestation "build/prior/$ATTESTATION_FILE" \
              --lock requirements.lock \
              --output "build/bybit_prospective_paper_forward_v1/$ATTESTATION_FILE"
          else
            python nexus_paper_runtime_attestation.py requalify \
              --manifest experiments/bybit_prospective_paper_forward_v1.json \
              --state "build/bybit_prospective_paper_forward_v1/$STATE_FILE" \
              --lock requirements.lock \
              --output "build/bybit_prospective_paper_forward_v1/$ATTESTATION_FILE"
          fi
          python nexus_paper_runtime_attestation.py verify \
            --manifest experiments/bybit_prospective_paper_forward_v1.json \
            --state "build/bybit_prospective_paper_forward_v1/$STATE_FILE" \
            --attestation "build/bybit_prospective_paper_forward_v1/$ATTESTATION_FILE" \
            --lock requirements.lock \
            --check-installed
      - name: Enforce Paper-only authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("build/bybit_prospective_paper_forward_v1/bybit_prospective_paper_forward_v1.json")
          state = json.loads(path.read_text(encoding="utf-8"))
          assert state["paper_only"] is True
          assert state["live_trading_enabled"] is False
          assert state["private_credentials_used"] is False
          assert state["automatic_live_promotion"] is False
          print(json.dumps({
              "status": state["status"],
              "decision": state["decision"],
              "completed_bar_count": state["completed_bar_count"],
              "last_execution_utc": state["last_execution_utc"],
              "state_digest": state["state_digest"],
          }, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: bybit-prospective-paper-forward-v1-state
          path: |
            build/bybit_prospective_paper_forward_v1/bybit_prospective_paper_forward_v1.json
            build/bybit_prospective_paper_forward_v1/runtime_attestation.json
            build/bybit_prospective_paper_forward_v1/terminal_archive_receipt.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 9
