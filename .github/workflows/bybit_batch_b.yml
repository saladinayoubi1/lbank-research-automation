name: Bybit history batch B

on:
  pull_request:
    paths:
      - ".github/workflows/bybit_batch_b.yml"
      - "bybit_spot_backfill.py"
      - "bybit_spot_archive_audit.py"
      - "bybit_spot_archive_collector.py"
      - "requirements.lock"

permissions:
  contents: read

jobs:
  chunk:
    name: chunk-${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { id: "10", start: "2025-03-01", end: "2025-03-31" }
          - { id: "11", start: "2025-04-01", end: "2025-04-30" }
          - { id: "12", start: "2025-05-01", end: "2025-05-31" }
          - { id: "13", start: "2025-06-01", end: "2025-06-30" }
          - { id: "14", start: "2025-07-01", end: "2025-07-31" }
          - { id: "15", start: "2025-08-01", end: "2025-08-31" }
          - { id: "16", start: "2025-09-01", end: "2025-09-30" }
          - { id: "17", start: "2025-10-01", end: "2025-10-31" }
          - { id: "18", start: "2025-11-01", end: "2025-11-30" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - name: Build verified month
        run: |
          success=false
          state_root="build/chunk-${{ matrix.id }}"
          for attempt in 1 2 3; do
            rm -rf "$state_root"
            if python bybit_spot_backfill.py --start-date "${{ matrix.start }}" --end-date "${{ matrix.end }}" --state-root "$state_root" --cache-root "build/cache-${{ matrix.id }}" --max-archives-per-run 2 --clean; then
              success=true
              break
            fi
            if [ -f "$state_root/_backfill_report.json" ]; then
              echo "::group::Backfill report for chunk-${{ matrix.id }}, attempt $attempt"
              python -m json.tool "$state_root/_backfill_report.json" || cat "$state_root/_backfill_report.json"
              echo "::endgroup::"
            fi
            sleep $((attempt * 15))
          done
          [ "$success" = "true" ] || exit 1
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads((Path(f"build/chunk-{os.environ['CHUNK_ID']}")/'_backfill_report.json').read_text())
          s=report['summary']
          ok=s['backfill_complete'] and s['completed_units']==1 and s['remaining_units']==0 and s['run_failures']==0 and s['current_dataset_integrity_ok'] and len(report['statuses'])==6 and all(x['integrity_ok'] for x in report['statuses'])
          raise SystemExit(0 if ok else 1)
          PY
        env:
          CHUNK_ID: ${{ matrix.id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bybit-chunk-${{ matrix.id }}-attempt-${{ github.run_attempt }}
          path: build/chunk-${{ matrix.id }}
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
