plugins {
    id "com.android.application"
}

def nexusGatewayUrl = providers.gradleProperty("NEXUS_GATEWAY_URL").getOrElse("https://127.0.0.1:8443")
def escapedGatewayUrl = nexusGatewayUrl.replace("\\", "\\\\").replace('"', '\\"')

android {
    namespace "com.saladinayoubi1.lbankmobile"
    compileSdk 35

    defaultConfig {
        applicationId "com.saladinayoubi.lbankmobile"
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName "2.2.0"
        buildConfigField "String", "NEXUS_GATEWAY_URL", "\"${escapedGatewayUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
