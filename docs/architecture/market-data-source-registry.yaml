semantic_binding:
  authority: canonical_machine_readable_registry
  unknown_or_missing_mapping: reject
  unknown_registry_version: reject
  caller_supplied_semantics_authoritative: false
  rejected_candidate_downstream_eligible: false
  required_dimensions:
    - candidate_timeframe
    - manifest_timeframe
    - bybit_category
    - bybit_interval
    - binance_market
    - binance_interval
    - timestamp_grid_ms
    - candle_finality
    - mapping_policy_version
authority:
  primary: Bybit
  secondary: Binance
  tertiary: LBank
  silent_cross_exchange_substitution: prohibited
  live_trading: prohibited
  private_credentials: prohibited
  unknown_mapping: reject
  failed_candidate_replaces_previous_valid: false
